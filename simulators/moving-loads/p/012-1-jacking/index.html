<script>
/* CrewForge 2D physics (CFPhysics) v1, 2026-11-11. Small, deterministic, no dependencies.
 * Source of truth: simulators/_physics/physics.js. Inlined into simulators by tools/inline_physics.py.
 * Read simulators/_physics/README.md first.
 *
 * Units SI: metres, kilograms, seconds, newtons, radians. y points UP (the sim flips it when drawing).
 * Method: XPBD (extended position-based dynamics) with small fixed substeps (default 1 kHz).
 *   Each substep: predict positions under gravity -> solve constraints on positions -> velocities = moved / h
 *   -> velocity pass (bounce, damping). Friction is positional (Coulomb, static then kinetic). A constraint's force is its multiplier lambda / h^2,
 *   so the tension it reports is the force that actually holds the drawing where it is.
 * Ropes, chains and hoses are particle chains solved with a direct tridiagonal solve (one rope at a time), so a
 * light rope holding a heavy load does not stretch. Links, pins, motors and contacts are Gauss-Seidel.
 * Determinism: no Math.random, no wall clock, fixed iteration order, fixed substep. step(ms) runs every whole
 * substep the clock has passed, so the same total time gives identical numbers whatever the frame rate.
 * Not handled (keep sims simple): body-to-body collision (bodies hit static lines, particles also hit sheaves),
 * joint limits, 3D. Bodies never collide with each other.
 */
(function (root) {
'use strict';
const G = 9.80665;
const cr = (ax, ay, bx, by) => ax * by - ay * bx;

/* ---------- shapes: verts relative to the shape's reference point (centre for box/circle) ---------- */
function shapeOf(o) {
  if (o.w != null) {                                      // box w x h, centred
    const w = o.w / 2, h = o.h / 2;
    return { kind: 'box', verts: [[-w, -h], [w, -h], [w, h], [-w, h]], c: [0, 0], k: (o.w * o.w + o.h * o.h) / 12 };
  }
  if (o.verts) {                                          // convex polygon, any winding
    let A = 0, cx = 0, cy = 0, I = 0; const v = o.verts;
    for (let i = 0; i < v.length; i++) {
      const [x1, y1] = v[i], [x2, y2] = v[(i + 1) % v.length], c = cr(x1, y1, x2, y2);
      A += c / 2; cx += (x1 + x2) * c; cy += (y1 + y2) * c;
      I += c * (x1 * x1 + x1 * x2 + x2 * x2 + y1 * y1 + y1 * y2 + y2 * y2);
    }
    cx /= 6 * A; cy /= 6 * A;
    return { kind: 'poly', verts: v.map(p => [p[0], p[1]]), c: [cx, cy], k: I / (12 * A) - cx * cx - cy * cy };
  }
  if (o.r != null && !o.point) return { kind: 'circle', r: o.r, c: [0, 0], k: o.r * o.r / 2 };
  return { kind: 'point', r: o.r || 0, c: [0, 0], k: 0 };  // particle: no rotation
}

/* ---------- Body: rigid body or particle. x,y = CG in world; a = angle (rad, CCW) ---------- */
class Body {
  constructor(W, o) {
    const s = shapeOf(o);
    this.W = W; this.id = W._id++; this.tag = o.tag || '';
    this.type = o.type || 'dynamic';                     // 'dynamic' | 'static' | 'kinematic'
    this.kind = s.kind; this.r = s.r || 0;
    const cg = o.cg || s.c;                              // CG in shape coords (off-centre loads: give cg)
    this.cg = [cg[0], cg[1]];
    this.verts = s.verts ? s.verts.map(p => [p[0] - cg[0], p[1] - cg[1]]) : null;   // CG-relative
    this.m = o.mass || 1;
    const dx = cg[0] - s.c[0], dy = cg[1] - s.c[1];
    this.I = o.I != null ? o.I : this.m * (s.k + dx * dx + dy * dy);
    const dyn = this.type === 'dynamic';
    this.invM = dyn ? 1 / this.m : 0;
    this.invI = dyn && this.I > 0 && !o.noRotate ? 1 / this.I : 0;
    this.a = o.angle || 0;
    const c = Math.cos(this.a), sn = Math.sin(this.a), rx = o.x || 0, ry = o.y || 0;
    this.x = rx + c * cg[0] - sn * cg[1]; this.y = ry + sn * cg[0] + c * cg[1];
    this.vx = o.vx || 0; this.vy = o.vy || 0; this.w = o.w0 || o.omega || 0;
    this.px = this.x; this.py = this.y; this.pa = this.a;
    this.fx = o.fx || 0; this.fy = o.fy || 0; this.torque = 0;   // steady external force/torque (N, N m)
    this.gk = 1;                                         // gravity scale (rope particles with extra solver inertia)
    this.lin = o.linDamp || 0; this.ang = o.angDamp || 0;        // damping, 1/s
    this.mu = o.mu != null ? o.mu : 0.5; this.muK = o.muK != null ? o.muK : this.mu * 0.8; this.e = o.e || 0;
    this.drive = o.drive || null;                        // kinematic: t(s) -> {x, y, a} of the reference point
    this.collide = o.collide !== false;
  }
  /* world position of a point given in shape coords (reference point = 0,0) */
  point(lx = 0, ly = 0) {
    const c = Math.cos(this.a), s = Math.sin(this.a), x = lx - this.cg[0], y = ly - this.cg[1];
    return { x: this.x + c * x - s * y, y: this.y + s * x + c * y };
  }
  pose() { const p = this.point(0, 0); return { x: p.x, y: p.y, a: this.a, deg: this.a * 180 / Math.PI }; }
  cgPos() { return { x: this.x, y: this.y }; }
  vertices() { return this.verts ? this.verts.map(v => this.point(v[0] + this.cg[0], v[1] + this.cg[1])) : []; }
  speed() { return Math.hypot(this.vx, this.vy); }
  /* set the reference point (and angle) directly, e.g. on reset; zeroes velocity */
  place(x, y, a = this.a) {
    this.a = a; const c = Math.cos(a), s = Math.sin(a);
    this.x = x + c * this.cg[0] - s * this.cg[1]; this.y = y + s * this.cg[0] + c * this.cg[1];
    this.px = this.x; this.py = this.y; this.pa = a; this.vx = this.vy = this.w = 0; this.W.wake();
  }
}

/* rotate a CG-relative local vector into the world */
function rot(b, lx, ly) { const c = Math.cos(b.a), s = Math.sin(b.a); return [c * lx - s * ly, s * lx + c * ly]; }

/* Generalised inverse mass of body b for a push along n at world offset r */
const wOf = (b, rx, ry, nx, ny) => { const k = cr(rx, ry, nx, ny); return b.invM + b.invI * k * k; };

/* move body b by impulse-like correction p (world vector) at world offset r */
function push(b, rx, ry, px, py) {
  if (!b.invM && !b.invI) return;
  b.x += px * b.invM; b.y += py * b.invM; b.a += b.invI * cr(rx, ry, px, py);
}

/* One XPBD positional solve along n between A (offset rA) and B (offset rB). C = constraint error (+ = too far).
   n points from B's point to A's point. Returns d-lambda (negative while pulling). */
function solve(A, rAx, rAy, B, rBx, rBy, nx, ny, C, aT, lam) {
  const w = wOf(A, rAx, rAy, nx, ny) + wOf(B, rBx, rBy, nx, ny);
  if (w + aT <= 0) return 0;
  const dl = (-C - aT * lam) / (w + aT);
  push(A, rAx, rAy, nx * dl, ny * dl); push(B, rBx, rBy, -nx * dl, -ny * dl);
  return dl;
}

/* attachment spec -> {b, lx, ly} (CG-relative local). Forms: [x, y] fixed in the world, [body, lx, ly] in shape coords, body */
function att(W, s) {
  if (s instanceof Body) s = [s, 0, 0];
  if (typeof s[0] === 'number') return { b: W.ground, lx: s[0], ly: s[1] };
  return { b: s[0], lx: (s[1] || 0) - s[0].cg[0], ly: (s[2] || 0) - s[0].cg[1] };
}
const wpt = n => { const r = rot(n.b, n.lx, n.ly); return [n.b.x + r[0], n.b.y + r[1], r[0], r[1]]; };

/* ---------- Link: one distance constraint between two attachments (rod, taut cable or pin) ---------- */
class Link {
  constructor(W, a, b, o = {}) {
    this.W = W; this.A = att(W, a); this.B = att(W, b);
    const pa = wpt(this.A), pb = wpt(this.B);
    this.L = o.length != null ? o.length : Math.hypot(pa[0] - pb[0], pa[1] - pb[1]);
    this.rope = !!o.rope;                 // true: can only pull (goes slack); false: rod (push and pull)
    this.compliance = o.compliance || 0;  // m/N (0 = rigid)
    this.breakAt = o.breakAt || Infinity; // N
    this.broken = false; this.lambda = 0; this.force = 0; this.tag = o.tag || '';
  }
  iter(h2) {
    if (this.broken) return;
    const pa = wpt(this.A), pb = wpt(this.B), dx = pa[0] - pb[0], dy = pa[1] - pb[1], d = Math.hypot(dx, dy);
    if (d < 1e-12) return;
    const C = d - this.L;
    if (this.rope && C <= 0) return;                     // slack rope carries nothing
    let dl = solve(this.A.b, pa[2], pa[3], this.B.b, pb[2], pb[3], dx / d, dy / d, C, this.compliance / h2, this.lambda);
    this.lambda += dl;
  }
  /* tension in N (+ pulling). Rods report compression as negative. */
  tension() { return this.force; }
  ends() { const a = wpt(this.A), b = wpt(this.B); return [{ x: a[0], y: a[1] }, { x: b[0], y: b[1] }]; }
  /* angle of the link from horizontal, degrees (sling angle) */
  angle() { const [a, b] = this.ends(); return Math.atan2(Math.abs(a.y - b.y), Math.abs(a.x - b.x)) * 180 / Math.PI; }
  /* force vector the link puts on its B end (pulls B toward A) */
  forceOnB() { const [a, b] = this.ends(), d = Math.hypot(a.x - b.x, a.y - b.y) || 1; return { x: (a.x - b.x) / d * this.force, y: (a.y - b.y) / d * this.force }; }
}

/* ---------- Rope: chain of particles. kind 'rope' | 'chain' | 'hose' (hose/cable: bending stiffness) ---------- */
class Rope {
  constructor(W, a, b, o = {}) {
    this.W = W; this.kind = o.kind || 'rope'; this.tag = o.tag || '';
    const A = att(W, a), B = att(W, b), pa = wpt(A), pb = wpt(B);
    const path = [[pa[0], pa[1]], ...(o.via || []), [pb[0], pb[1]]];     // initial lay (e.g. over a sheave)
    let P = 0; const cum = [0];
    for (let i = 1; i < path.length; i++) cum.push(P += Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]));
    this.length = o.length != null ? o.length : P;
    const n = o.segments || Math.max(1, Math.round(this.length / (o.segLength || 0.1)));
    this.segL = this.length / n;
    const mp = (o.massPerM != null ? o.massPerM : 1) * this.segL;          // particle mass
    this.nodes = [A];
    for (let i = 1; i < n; i++) {                                         // place along the path, evenly
      const s = P * i / n; let k = 1; while (k < cum.length - 1 && cum[k] < s) k++;
      const f = (s - cum[k - 1]) / ((cum[k] - cum[k - 1]) || 1);
      const p = W.add({ point: true, r: o.radius || 0.01, mass: mp, x: path[k - 1][0] + (path[k][0] - path[k - 1][0]) * f,
        y: path[k - 1][1] + (path[k][1] - path[k - 1][1]) * f, mu: o.mu != null ? o.mu : 0.4, linDamp: o.damp || 0, tag: 'rope' });
      this.nodes.push({ b: p, lx: 0, ly: 0 });
    }
    this.nodes.push(B);
    this.segs = []; for (let i = 0; i < n; i++) this.segs.push({ L: this.segL, lambda: 0, force: 0, avg: 0, broken: false, breakAt: o.breakAt || Infinity });
    this.compliance = o.compliance || 0;                                  // per segment, m/N
    this.bend = o.bend != null ? o.bend : (this.kind === 'hose' ? 1e-3 : 0);  // bending compliance (0 = none)
    this.tensionHint = o.tensionHint || 0;                                // N: extra pull expected beyond end weights
    this.Test = null;                                                     // running tension estimate (particle inertia)
    this.mp = mp; this.radius = o.radius || 0.01; this.mu = o.mu != null ? o.mu : 0.4;
  }
  /* direct solve of all segments at once (tridiagonal, Thomas algorithm). Buffers are reused: no garbage per step. */
  iter(h2) {
    const N = this.nodes, S = this.segs, n = S.length;
    if (!this.B || this.B.n < n + 1) { const k = n + 9, F = () => new Float64Array(k); this.B = { n: k, px: F(), py: F(), rx: F(), ry: F(), nx: F(), ny: F(), C: F(), dg: F(), up: F(), rhs: F(), dl: F(), on: new Uint8Array(k) }; }
    const { px, py, rx, ry, nx, ny, C, dg, up, rhs, dl, on } = this.B;
    for (let k = 0; k <= n; k++) {                                         // node positions (+ offsets for the end bodies)
      const nd = N[k], b = nd.b;
      if (!nd.lx && !nd.ly) { px[k] = b.x; py[k] = b.y; rx[k] = ry[k] = 0; }
      else { const r = rot(b, nd.lx, nd.ly); rx[k] = r[0]; ry[k] = r[1]; px[k] = b.x + r[0]; py[k] = b.y + r[1]; }
    }
    for (let j = 0; j < n; j++) {
      const dx = px[j] - px[j + 1], dy = py[j] - py[j + 1], d = Math.hypot(dx, dy);
      if (d > 1e-12) { nx[j] = dx / d; ny[j] = dy / d; } else { nx[j] = ny[j] = 0; }
      // a segment near full length joins the solve; one far shorter is slack and carries nothing
      C[j] = d - S[j].L; on[j] = !S[j].broken && d > 1e-12 && C[j] > -1e-3 * S[j].L ? 1 : 0;
    }
    const wn = (k, j) => wOf(N[k].b, rx[k], ry[k], nx[j], ny[j]);         // node k's inverse mass along segment j
    const aT = this.compliance / h2;
    for (let pass = 0; pass < 4; pass++) {                                 // active set: a rope cannot push
      for (let j = 0; j < n; j++) {
        up[j] = 0;
        if (!on[j]) { dg[j] = 1; rhs[j] = 0; continue; }
        dg[j] = wn(j, j) + wn(j + 1, j) + aT; rhs[j] = -C[j] - aT * S[j].lambda;
        if (j + 1 < n && on[j + 1]) up[j] = -N[j + 1].b.invM * (nx[j] * nx[j + 1] + ny[j] * ny[j + 1]);  // shared particle couples j, j+1
      }
      for (let j = 1; j < n; j++) {                                        // forward elimination (matrix is symmetric)
        if (!up[j - 1]) continue; const m = up[j - 1] / dg[j - 1]; dg[j] -= m * up[j - 1]; rhs[j] -= m * rhs[j - 1];
      }
      for (let j = n - 1; j >= 0; j--) dl[j] = on[j] ? (rhs[j] - (j + 1 < n ? up[j] * dl[j + 1] : 0)) / dg[j] : 0;
      let again = false;
      for (let j = 0; j < n; j++) if (on[j] && S[j].lambda + dl[j] > 0) { on[j] = 0; again = true; }
      if (!again) break;
    }
    for (let j = 0; j < n; j++) if (on[j]) {
      const d = dl[j]; push(N[j].b, rx[j], ry[j], nx[j] * d, ny[j] * d); push(N[j + 1].b, rx[j + 1], ry[j + 1], -nx[j] * d, -ny[j] * d);
      S[j].lambda += d;
    }
    if (this.bend) for (let k = 1; k < n; k++) {                           // bending: keep nodes k-1, k+1 apart

/* S-319N shank hook (Kito Crosby catalogue p.91, code J) in profile; port of lib.py hook_profile */

  s+=`<rect x="${f(x-5.5*k)}" y="${f(y1-2.6*k)}" width="${f(11*k)}" height="${f(2.6*k)}" rx="${f(.8*k)}" fill="#59626a" stroke="#23282c" stroke-width="1.5"/>`;
  return s+'</g>';}
/* simple anchor (embedded plate with an eye) seen in plan or side */
const anchorEye=(x,y,r,id,col='#7b848b')=>`<g id="${id||''}"><rect x="${f(x-r*1.4)}" y="${f(y-r*1.4)}" width="${f(r*2.8)}" height="${f(r*2.8)}" rx="4" fill="#4a525a" stroke="#23282c" stroke-width="1.5"/><circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="none" stroke="${col}" stroke-width="${f(r*.45)}"/>${[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>`<circle cx="${f(x+a*r*1.05)}" cy="${f(y+b*r*1.05)}" r="${f(r*.16)}" fill="#2a2f33"/>`).join('')}</g>`;

<script>
/* JACK scene (side elevation, one scale K px/in): a machine on a fabricated base is jacked at one end; the far end
 * pivots on the floor at its bottom corner. Bottle jack (Enerpac GBJ proportions), toe jack (Enerpac TJH10A) or
 * screw jack under the jacking lug; 4 x 4 cribbing follows the load 1 ft in from the jacking point.
 * Operable: Pump (each stroke raises the ram PUMP_IN), Release valve (lowers), slide a crib layer in, add packing.
 * Visual maths (CLAUDE.md): lever arms from the pivot as dimensions colour-matched to R = W (L - CG) / (L - jx),
 * weight and reaction arrows sized to the load; F = P x A as the ram face in whole square inches, each square

 * thread strip, toe bend: the load comes down about its pivot onto the crib (or the floor). */
const SCENE=(()=>{
const A_=ART, f=A_.f, FL=760, X0=230;
const PUMP_IN=0.25;          // EXAMPLE: ram rise per full pump stroke at the jack (drawing/lesson pace; real pumps vary)
const MH=40, BASE=5;         // machine height and base depth (in), drawn
const COL={w:'#F5F5F4',r:'#59b7ff',far:'#7fd6c2',armJ:'#b48af0',armW:'#ffd166',p:'#ff9ecf',gap:'#ff9ecf'};
let phys=null;
const K=S=>Math.min(10,1150/(S.len*12));
const lugH=S=>S.jtype==='toe'?(S.tpart==='toe'?0.6:13.5):10.5;          // jacking point height at rest (in): toe under the base edge
/* geometry at lift s (in) at the jacking point: rotation about the far bottom corner */
function geo(S,c,theta){
  const k=K(S),Lin=S.len*12,jx=(c.onToe?0:S.jx)*12,arm=Lin-jx;
  const th=theta!=null?theta:Math.asin(Math.min(.5,S.lift/arm));
  const piv=[X0+Lin*k,FL];
  const P=(xl,yl)=>{const dx=xl-Lin,c0=Math.cos(th),s0=Math.sin(th);return [piv[0]+(dx*c0+yl*s0)*k,piv[1]-(-dx*s0+yl*c0)*k];};   // left end rises
  return {k,Lin,jx,th,piv,P};
}
function jackDims(S){const bj=ML.BJ_DRAW[S.jsize];
  if(S.jtype==='toe')return {closed:ML.TJ_DRAW.cap,stroke:ML.TJ_DRAW.stroke,ext:0,bw:6.2,cw:3.4,rw:2.2};
  if(S.jtype==='screw')return {closed:ML.SJ_DRAW.h,stroke:ML.SJ_DRAW.stroke,ext:0,bw:5,cw:3.4,rw:2.1};
  return {closed:bj.h,stroke:ML.BJ_STROKE,ext:bj.ext,bw:[4.3,4.6,5.6,6.6][S.jsize],cw:[2.6,3.0,3.8,4.8][S.jsize],rw:[1.3,1.75,2.6,3.7][S.jsize]};}

function init(A,S){A.pump=0;A.drop=0;A.pumpN=0;A.msg='';A.msgT=0;}
function snap(A,S){phys=null;A.pump=0;A.drop=0;const d=jackDims(S);A.pads=Math.max(0,Math.ceil((lugH(S)+S.lift-(d.closed+d.ext+d.stroke))/3.5-1e-9));}

const reach=(S,A)=>{const d=jackDims(S);return S.jtype==='toe'?d.stroke:d.closed+d.ext+d.stroke+(A.pads||0)*3.5-lugH(S);};
function resetFail(A,S){phys=null;A.drop=0;}
function limits(S){if(S.jtype==='toe'&&S.tpart==='toe')S.jx=0;
  // the load rests on the crib: the jack can't be lower than the crib holds it (lift at the crib = lift x kc)
  const jx=(S.jtype==='toe'&&S.tpart==='toe')?0:S.jx,cx=Math.min(jx+1,S.len-0.5),kc=(S.len-cx)/(S.len-jx);
  if(S.crib>0&&S.lift*kc<S.crib-1e-6&&!(SCENE.ctx&&SCENE.ctx.F().on))S.lift=S.crib/kc;}
const actions={
  pump(ctx){const S=ctx.S,c=ML.calc();if(ctx.F().on)return;
    if(c.hyd&&c.P>=ML.P_MAX&&S.jtype!=='toe'){ctx.tween('lift',S.lift+PUMP_IN,500);ctx.A.pumpN++;return;}   // pushes on: the seal is past its limit
    if(S.jtype==='toe'&&c.relief){ctx.A.msg='The relief valve opens: the jack will not lift past its head rating';ctx.A.msgT=0;return;}
    if(S.lift+PUMP_IN>reach(S,ctx.A)+1e-9){ctx.A.msg='Ram at full stroke: crib, lower the load onto it, then put a pad under the jack';ctx.A.msgT=0;return;}
    ctx.tween('lift',Math.round((S.lift+PUMP_IN)*100)/100,500);ctx.A.pumpN++;},
  release(ctx){const S=ctx.S;if(ctx.F().on)return;const c=ML.calc();
    // lowering stops when the load sits on the crib (the crib takes it)
    const floorLift=Math.max(0,S.crib/c.kc);ctx.tween('lift',Math.max(floorLift<S.lift-1e-6?floorLift:0,S.lift-1),900);},
  layer(ctx){const S=ctx.S,c=ML.calc();if(ctx.F().on)return;
    if(c.gap>=3.5+0.25-1e-9){ctx.tween('crib',S.crib+3.5,700);ctx.A.msg='';}
    else{ctx.A.msg=`Only ${ML.lS(c.gap,2)} of room under the load: a 4 × 4 needs 3.5 in. Pump higher first.`;ctx.A.msgT=0;}},
  repad(ctx){const S=ctx.S,c=ML.calc(),A=ctx.A;if(ctx.F().on)return;
    if(S.crib<=0||S.lift*c.kc>S.crib+0.08){A.msg='Lower the load onto the crib first (release valve), so the jack is free';A.msgT=0;return;}
    A.pads=(A.pads||0)+1;A.msg='';A.repads=(A.repads||0)+1;},
  pack(ctx){const S=ctx.S,c=ML.calc();if(ctx.F().on)return;if(c.gap>0.05)ctx.tween('crib',S.crib+Math.max(0,c.gap-0.06),600);}
};
function step(ms,c,A,S,F,moving){if((S.pads||0)>(A.pads||0))A.pads=S.pads;
  if(moving.includes('lift'))A.pump+=ms/1000*2.2;
  A.msgT+=ms;
  if(phys){phys.W.step(ms);}
  if(F.on&&(F.kind==='blow'||F.kind==='strip'))A.drop=Math.min(1,A.drop+ms/350);

function checkFail(c,A,S){
  if(!c.loaded)return null;
  if(Math.tan(S.tilt*ML.D2R)>ML.MU_CAP+1e-9&&c.R>0)return 'kick';
  if(!c.toe&&c.stress>c.limit+1e-9)return c.hyd?'blow':'strip';
  if(c.onToe&&c.each>c.limit+1e-9)return 'bend';

/* the load (and a kicked jack) come down under CFPhysics: the load is hinged at its far corner and lands on the

function onTrip(kind,A,S,c){
  const g=geo(S,c),IN=0.0254,Lin=g.Lin,H=MH,Wp=CFPhysics.World,W=new Wp({hz:600,iterations:4,sleepAfter:0.6});
  W.floor(0,{mu:.8});
  const cx0=(c.cx*12-9),cx1=(c.cx*12+9);
  if(S.crib>0)W.line(cx0*IN,S.crib*IN,cx1*IN,S.crib*IN,{mu:.8});
  if(kind==='bend'||kind==='blow'||kind==='strip'){} // the jack stays: its ram or toe gives way (drawn)
  // load polygon in its own coords (x from the jacked end, y up from the base bottom), many bottom points so it lands on a crib
  const verts=[];for(let i=0;i<=24;i++)verts.push([Lin*i/24*IN,0]);verts.push([Lin*IN,H*IN],[0,H*IN]);
  const lx=Lin*IN,cgx=(c.armW!=null?(S.cg*12):Lin/2)*IN;
  const body=W.poly({x:0,y:0,verts:verts.reverse().map(p=>[p[0],p[1]]),mass:Math.max(50,S.load*0.4536),cg:[S.cg*12*IN,H*0.45*IN],mu:.8});
  // place: rotate about the pivot (lx, 0) by -th (left end up)
  body.place(lx-Math.cos(g.th)*lx,Math.sin(g.th)*lx,-g.th);
  W.pin([body,lx,0],[lx,0]);

  if(kind==='kick'){const d=jackDims(S),h=(d.closed+Math.max(0,S.lift))*IN,w=d.bw*IN,jxw=(S.jtype==='toe'&&S.tpart==='toe'?-2:g.jx)*IN;
    const a=-S.tilt*ML.D2R,ca=Math.cos(a),sa=Math.sin(a),rc=[jxw+w/2,0];   // leaning right about its right base corner
    const jb=W.box({x:rc[0]+ca*(-w/2)-sa*(h/2),y:rc[1]+sa*(-w/2)+ca*(h/2),w,h,mass:12,angle:a,mu:.4,omega:-5.5,vx:.5});out.jack=jb;out.jh=h;out.jw=w;}
  phys=out;A.drop=0;
}
/* ------------------------------------------------------------------ drawing */
function drawLoad(S,c,g,o={}){
  const P=g.P,k=g.k,L=g.Lin;let s='';
  const poly=pts=>`M${pts.map(p=>{const q=P(p[0],p[1]);return f(q[0])+' '+f(q[1]);}).join(' L')}Z`;
  // base (channel skid) and housing start 3 in behind the jacking lug, so L runs from the jacking point to the far corner
  const onToe=S.jtype==='toe'&&S.tpart==='toe',xs=(g.jx===0&&!onToe)?3:0;
  s+=`<path d="${poly([[xs,0],[L,0],[L,BASE],[xs,BASE]])}" fill="#5d6670" stroke="#23282c" stroke-width="2"/>`;
  s+=`<path d="${poly([[xs,BASE*.78],[L,BASE*.78],[L,BASE],[xs,BASE]])}" fill="#9aa4ad" opacity=".5"/>`;
  s+=`<path d="${poly([[xs,0],[L,0],[L,BASE*.2],[xs,BASE*.2]])}" fill="#3a4148"/>`;
  const hx0=xs+L*.02,hx1=L*.96;
  s+=`<path d="${poly([[hx0,BASE],[hx1,BASE],[hx1,MH-3],[hx1-3,MH],[hx0+3,MH],[hx0,MH-3]])}" fill="url(#gGB)" stroke="#1b232a" stroke-width="2"/>`;
  s+=`<path d="${poly([[hx0+1,MH-1.2],[hx1-1,MH-1.2],[hx1-1,MH-.5],[hx0+1,MH-.5]])}" fill="#9db3c3" opacity=".35"/>`;
  s+=`<path d="${poly([[L*.16,BASE+8],[L*.42,BASE+8],[L*.42,MH-9],[L*.16,MH-9]])}" fill="#40525f" stroke="#1b232a" stroke-width="1.5"/>`;   // access door
  for(const hx of [L*.18,L*.4])s+=`<path d="${poly([[hx,MH-14],[hx+1.2,MH-14],[hx+1.2,MH-17],[hx,MH-17]])}" fill="#2b3740"/>`;     // door hinges
  s+=`<path d="${poly([[L*.6,MH-14],[L*.8,MH-14],[L*.8,MH-8],[L*.6,MH-8]])}" fill="#d9dcdf" stroke="#1b232a"/>`;           // nameplate
  const np=P(L*.7,MH-11.6);s+=`<text x="${f(np[0])}" y="${f(np[1])}" text-anchor="middle" class="tag pcOnly" transform="rotate(${f(-g.th*180/Math.PI)} ${f(np[0])} ${f(np[1])})" style="font-size:${f(Math.max(11,k*1.5))}px">${ML.wt(S.load)}</text>`;

    s+=`<path d="${poly([[x0,lh],[x1,lh],[x1,lh+1],[x0,lh+1]])}" fill="#8a939a" stroke="#23282c" stroke-width="1.6"/></g>`;}
  else{const q=P(0,0);s+=`<circle id="jack-point" cx="${f(q[0])}" cy="${f(q[1])}" r="5" fill="none"/>`;}
  // CG marker
  const cgp=P(S.cg*12,MH*.45);
  s+=`<g id="cg-mark"><circle cx="${f(cgp[0])}" cy="${f(cgp[1])}" r="13" fill="#F5F5F4" stroke="#1F1D1A" stroke-width="2"/><path d="M${f(cgp[0])} ${f(cgp[1]-13)} A13 13 0 0 1 ${f(cgp[0]+13)} ${f(cgp[1])} L${f(cgp[0])} ${f(cgp[1])}Z M${f(cgp[0])} ${f(cgp[1]+13)} A13 13 0 0 1 ${f(cgp[0]-13)} ${f(cgp[1])} L${f(cgp[0])} ${f(cgp[1])}Z" fill="#1F1D1A"/></g>`;

}
function cribDraw(S,c,g){if(S.crib<=0.01)return '<g id="crib-pile"></g>';

    else{s+=A_.timberEnd(cxp-w/2+1,y,t,t,i)+A_.timberEnd(cxp+w/2-t-1,y,t,t,i+3);}}  // runs across: end grain
  if(rem>0.02){const t=rem*k;y-=t;s+=`<rect x="${f(cxp-w/2+4)}" y="${f(y)}" width="${f(w-8)}" height="${f(t)}" fill="#c9a36a" stroke="${'#5e4426'}" stroke-width="1.2"/>`;}
  return `<g id="crib-pile">${s}</g>`;}
function jackDraw(S,c,g,A,F){
  const d=jackDims(S),k=g.k,toe=S.jtype==='toe',onToe=toe&&S.tpart==='toe';
  const xw=X0+(onToe?0:g.jx)*k;
  const lugW=onToe?g.P(0,0):g.P(g.jx,lugH(S));     // underside of the lug / the base edge now
  const pad=0;let s='';
  if(phys&&phys.jack){const b=phys.jack,p=b.point(0,-phys.jh/2),sx=X0+p.x/0.0254*k,sy=FL-p.y/0.0254*k,deg=-b.a*180/Math.PI;
    const j=A_.bottleJack(0,0,k,d.closed,Math.max(0,phys.jh/0.0254-d.closed),{bw:d.bw,cw:d.cw,rw:d.rw,stroke:d.stroke,handle:false,id:'jack-body'});
    return `<g id="jack"><g transform="translate(${f(sx)} ${f(sy)}) rotate(${f(deg)})">${j.svg}</g></g>`;}
  if(toe){

    const bx=onToe?X0-3.1*k:xw,top=lugW[1]/1,yb=FL;const ext=Math.max(0,(onToe?(FL-top)/k-1.22:(FL-top)/k-d.closed));
    const bodyH=d.closed*k,bw=4.2*k;let j='';

    const toeY=yb-1.22*k-(onToe?ext*k:0)*(1-bend*.15);
    j+=`<rect x="${f(bx-bw/2)}" y="${f(yb-bodyH)}" width="${f(bw)}" height="${f(bodyH)}" rx="${f(k*.5)}" fill="url(#gJack)" stroke="#3a120e" stroke-width="1.8"/>`;
    j+=`<rect x="${f(bx-bw/2-k*.6)}" y="${f(yb-k*1.1)}" width="${f(bw+k*1.2)}" height="${f(k*1.1)}" rx="3" fill="#5a1d17" stroke="#2c0d0a"/>`;
    const tl=3.2*k,ta=bend*28;j+=`<g id="toe" transform="rotate(${f(ta)} ${f(bx+bw/2)} ${f(toeY)})"><rect x="${f(bx+bw/2-k*.2)}" y="${f(toeY-k*.1)}" width="${f(tl)}" height="${f(1.1*k)}" rx="2" fill="${bend>0?'#b33':'#a6aeb4'}" stroke="${'#3b4247'}" stroke-width="1.4"/></g>`;
    const rh=onToe?0:ext*k;j+=`<rect x="${f(bx-k*.9)}" y="${f(yb-bodyH-rh)}" width="${f(1.8*k)}" height="${f(rh+2)}" fill="url(#gBarV)" stroke="#2f3438"/>`;
    j+=`<rect x="${f(bx-k*1.2)}" y="${f(yb-bodyH-rh-k*.6)}" width="${f(2.4*k)}" height="${f(k*.6)}" rx="2" fill="#7b848b" stroke="#2f3438"/>`;
    const ph=A.pump%1,ang=-30+Math.abs(ph*2-1)*30,hl=14*k,hx=bx-bw/2,hy=yb-bodyH*.35;
    j+=A_.roundBar([[hx,hy],[hx-Math.cos(ang*Math.PI/180)*hl,hy+Math.sin(ang*Math.PI/180)*hl]],k*.6,'#9aa2a8');
    return `<g id="jack">${j}</g>`;
  }
  // bottle / screw jack under the lug: base on the floor (or on 4 x 4 pads if the lift needs more than it has)
  const need=(FL-lugW[1])/k;                             // lug underside height now (in)
  let padIn=(A.pads||0)*3.5;while(need-padIn>d.closed+d.stroke+d.ext+0.01)padIn+=3.5;
  const yb=FL-padIn*k;let s2='';
  for(let i=0;i<padIn/3.5;i++)s2+=A_.timberSide(xw-6*k,FL-(i+1)*3.5*k,12*k,3.5*k,i);
  const extTot=Math.max(0,need-padIn-d.closed)*(1-(A.drop||0)*0.7);
  if(S.jtype==='screw'){const bw=d.bw*k,cw=d.cw*k,bodyH=d.closed*k*.75;
    s2+=`<g transform="rotate(${f(S.tilt)} ${f(xw+bw/2)} ${f(yb)})"><path d="M${f(xw-bw/2)} ${f(yb)} L${f(xw-cw/2)} ${f(yb-bodyH)} L${f(xw+cw/2)} ${f(yb-bodyH)} L${f(xw+bw/2)} ${f(yb)}Z" fill="url(#gPaint)" stroke="#23282c" stroke-width="1.8"/>`;
    const sh=(d.closed*.25+extTot)*k;s2+=`<rect x="${f(xw-k*.8)}" y="${f(yb-bodyH-sh)}" width="${f(1.6*k)}" height="${f(sh)}" fill="url(#gBarV)" stroke="#2f3438"/>`;
    for(let y=yb-bodyH-sh+4;y<yb-bodyH;y+=5)s2+=`<line x1="${f(xw-k*.8)}" y1="${f(y)}" x2="${f(xw+k*.8)}" y2="${f(y+2.5)}" stroke="#4b5359"/>`;
    s2+=`<rect x="${f(xw-k*1.3)}" y="${f(yb-bodyH-sh-k*.6)}" width="${f(2.6*k)}" height="${f(k*.6)}" fill="#7b848b" stroke="#2f3438"/></g>`;
    return `<g id="jack">${s2}</g>`;}
  const j=A_.bottleJack(xw,yb,k,d.closed,extTot,{bw:d.bw,cw:d.cw,rw:d.rw,stroke:d.stroke,pump:Math.abs((A.pump%1)*2-1),tilt:S.tilt,hl:15,side:-1});
  s2+=j.svg;

    s2+=`<ellipse cx="${f(xw+20)}" cy="${f(yb+3)}" rx="${f(40*Math.min(1,F.t/1200))}" ry="5" fill="#8a6d16" opacity=".7"/>`;}
  return `<g id="jack">${s2}</g>`;
}
function draw(c,A,S,F){
  let th=null;
  if(phys){th=-phys.body.a;}
  else if(F.on&&(F.kind==='blow'||F.kind==='strip'||F.kind==='bend')){th=null;}
  const g=geo(S,c,th),k=g.k,P=g.P,cards=(window.PAGE.cards||['lever']);
  let s=A_.column(70,FL)+A_.column(1520,FL);
  s+=A_.shadow((X0+g.piv[0])/2,FL+4,g.Lin*k*1.05,18,.9);
  s+=cribDraw(S,c,g);
  s+=`<g id="pivot">${(()=>{const p=g.piv;return `<path d="M${f(p[0]-12)} ${FL+1} L${f(p[0])} ${FL-3} L${f(p[0]+12)} ${FL+1}Z" fill="#F08A2B" opacity=".9"/>`;})()}</g>`;
  s+=drawLoad(S,c,g)+jackDraw(S,c,g,A,F);
  let ov='';

  if(!F.on){const cxp=X0+c.cx*12*k,top=FL-S.crib*k,under=P(c.cx*12,0)[1];
    if(top-under>3||true)ov+=`<g id="crib-gap">${A_.dim(cxp+11*k,under,cxp+11*k,top,'',COL.gap)}<text class="lb halo" x="${f(cxp+11*k+14)}" y="${f((under+top)/2+9)}" style="fill:${c.gap>ML.GAP_OK?A_.WARN:COL.gap}">gap ${ML.lS(c.gap,2)}</text></g>`;}
  // forces: weight at the CG, reactions at the jack and the pivot (arrow length ~ force)
  const sc=150/Math.max(1,S.load),cg=P(S.cg*12,MH*.45);
  if(cards.includes('lever')&&!F.on){
    ov+=A_.arrow(cg[0],cg[1]+16,0,1,Math.max(30,S.load*sc),COL.w,ML.wt(S.load),{id:'w-arrow',tx:cg[0]+16,ty:cg[1]+80});
    const jp=c.onToe?P(0,0):P(g.jx,lugH(S));
    if(!F.on)ov+=A_.arrow(jp[0],FL-6,0,-1,Math.max(24,c.R*sc*.95),COL.r,'',{id:'r-arrow'})+`<text id="r-tag" class="lb halo" x="${f(jp[0]-16)}" y="${f(FL-26-Math.max(24,c.R*sc))}" text-anchor="end" style="fill:${COL.r}">${ML.wt(c.R)}</text>`;
    if(S.njacks>1){const jq=P(g.jx,0);ov+=`<text id="two-jacks" class="lm halo" x="${f(jq[0]+40)}" y="${f(FL-150)}">2 jacks side by side: ${ML.wt(c.each)} each</text>`;}
    ov+=A_.arrow(g.piv[0],FL-6,0,-1,Math.max(20,(c.loaded?c.far:S.load/2)*sc*.95),COL.far,'',{id:'far-arrow'})+`<text id="far-tag" class="lb halo" x="${f(g.piv[0]+16)}" y="${f(FL-40)}" style="fill:${COL.far}">${ML.wt(c.loaded?c.far:S.load*(S.cg/S.len))}</text>`;
    // lever arms measured from the pivot, on the floor band
    const jx=X0+g.jx*k;
    ov+=A_.dim(jx,FL+46,g.piv[0],FL+46,`L − jack point = ${ML.lL(c.armJ)}`,COL.armJ,{id:'arm-j',ty:FL+38});
    ov+=A_.dim(X0+S.cg*12*k,FL+96,g.piv[0],FL+96,`L − CG = ${ML.lL(c.armW)}`,COL.armW,{id:'arm-w',ty:FL+88});
  }

  if(c.loaded&&!F.on&&!cards.includes('pa'))ov+=`<g transform="translate(${f(X0-150)} 70)">${A_.gauge(0,0,0,0,1,1,'')}</g>`;
  if(F.on)s+=A_.dust(X0+c.cx*12*k,FL-S.crib*k,180,F.t/1000,3);
  // detail inset (same view, x2.4) on the jack: the part that matters is small at this scale
  let ins='';if(cards.includes('inset')&&!F.on){const jx=X0+(c.onToe?0:g.jx)*k,jy=FL-8*k,m=2.2,r=180,cx=215,cy=225;
    ins=`<g id="inset"><circle cx="${f(jx)}" cy="${f(jy)}" r="${f(r/m)}" fill="none" stroke="#F5F5F4" stroke-width="2" stroke-dasharray="5 4"/>`+
    `<line x1="${f(jx)}" y1="${f(jy-r/m)}" x2="${cx}" y2="${cy+r}" stroke="#F5F5F4" stroke-width="2" stroke-dasharray="5 4"/>`+
    `<clipPath id="insclip"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath><circle cx="${cx}" cy="${cy}" r="${r+5}" fill="#1F1D1A"/>`+
    `<g clip-path="url(#insclip)"><rect x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" fill="#26231f"/><use href="#world" transform="translate(${cx} ${cy}) scale(${m}) translate(${f(-jx)} ${f(-jy)})"/></g>`+
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#F5F5F4" stroke-width="2.5"/><text class="lm halo" x="${cx}" y="${cy-r-12}" text-anchor="middle" style="font-weight:800;letter-spacing:.08em">DETAIL ×${m}</text></g>`;}
  return A_.backdrop(FL)+`<g id="world">${s}</g>`+ov+ins;
}
/* F = P x A: the ram face as whole square inches (in metric, cm²) in the pressure colour, each with its psi */
function paCard(c,S){
  const x=980,y=20,w=600,h=316;let s=A_.card(x,y,w,h,'F = P × A · THE RAM FACE','pa-card');
  const met=S.units==='met',unit=met?6.4516:1,n=c.area*unit,full=Math.floor(n+1e-9),part=n-full,cols=met?Math.ceil(Math.sqrt(n*1.6)):Math.max(2,Math.ceil(Math.sqrt(n*1.6)));
  const nsq=full+(part>0.01?1:0),rows=Math.ceil(nsq/cols),cell=Math.min(84,Math.floor(Math.min(330/cols,170/rows))-4);
  const pcol=c.P>ML.P_MAX?A_.BAD:c.P>ML.P_MAX*.85?A_.WARN:COL.p;
  let gx=x+24,gy=y+56,g='';
  for(let i=0;i<full+(part>0.01?1:0);i++){const r=Math.floor(i/cols),q=i%cols,frac=i<full?1:part;
    g+=`<rect x="${gx+q*(cell+4)}" y="${gy+r*(cell+4)}" width="${f(cell*frac)}" height="${cell}" rx="3" fill="${pcol}" opacity="${c.loaded?.85:.25}"/><rect x="${gx+q*(cell+4)}" y="${gy+r*(cell+4)}" width="${cell}" height="${cell}" rx="3" fill="none" stroke="#1F1D1A" stroke-width="1.5"/>`;
    if(cell>=40&&frac>.6)g+=`<text x="${gx+q*(cell+4)+cell/2}" y="${gy+r*(cell+4)+cell/2+6}" text-anchor="middle" class="pcOnly" style="font:800 ${cell>56?15:12}px ${A_.FONT};fill:#1F1D1A">${met?ML.nf(c.P*ML.BAR/100,1):ML.nf(c.P/1000,1)+'k'}</text>`;}
  s+=`<g id="pa-grid">${g}</g>`;
  s+=`<text id="pa-area" class="cs" x="${x+24}" y="${y+h-58}">A = ${ML.ar(c.area)} · each square is 1 ${met?'cm²':'in²'}</text>`;
  s+=`<text id="pa-p" class="cv" x="${x+24}" y="${y+h-24}" style="fill:${pcol}">P = ${ML.pr(c.P)}</text>`;
  s+=A_.gauge(x+w-110,y+130,82,c.loaded?Math.min(c.P,ML.P_MAX*1.04):0,ML.P_MAX*1.04,ML.P_MAX,met?'bar':'psi');
  s+=`<text id="pa-force" class="cv" x="${x+w-250}" y="${y+h-58}" style="fill:${COL.r}">F = ${ML.wt(c.loaded?c.each:0)}</text>`;
  s+=`<text id="pa-max" class="cs" x="${x+w-250}" y="${y+h-24}">max ${ML.pr(ML.P_MAX)} → ${ML.wt(c.Fmax)}</text>`;
  return s;}
function toeCard(c,S){const x=980,y=24,w=600,h=250;let s=A_.card(x,y,w,h,'TOE OR HEAD: WHICH RATING?','toe-card');
  s+=`<text class="cv" x="${x+24}" y="${y+76}">Toe ${ML.wt(c.toeT*2000)} · Head ${ML.wt(c.headT*2000)}</text>`;
  s+=`<text class="cs" x="${x+24}" y="${y+112}">Lifting on the ${S.tpart==='toe'?'toe':'head'}: the ${S.tpart} rating governs</text>`;
  s+=A_.bar(x+24,y+160,w-48,22,c.each/c.cap,c.each>c.cap?A_.BAD:c.util>.85?A_.WARN:A_.OK,`${ML.wt(c.each)} of ${ML.wt(c.cap)} (${ML.pct(c.util,0)})`);
  return s;}
function readouts(c,S){const p=window.PAGE.ro||'lever';
  if(p==='pa')return [['Load on the jack',ML.wt(c.loaded?c.each:c.each),COL.r],['Ram area',ML.ar(c.area)],['Gauge pressure',c.hyd?ML.pr(c.P):'—',c.P>ML.P_MAX?A_.BAD:COL.p],['Jack at max pressure',ML.wt(c.Fmax)]];
  if(p==='toe')return [['Load on the jack',ML.wt(c.each),COL.r],['Lifting on the',S.tpart==='toe'?'toe':'head'],['Rating that governs',ML.wt(c.cap)],['Of rating',ML.pct(c.util,0),c.util>1?A_.BAD:c.util>.85?A_.WARN:A_.OK]];
  if(p==='crib')return [['Lift at the jack',ML.lS(S.lift,2)],['Cribbing',ML.lS(S.crib,1)],['Gap under the load',ML.lS(c.gap,2),c.gap>ML.GAP_OK?A_.WARN:A_.OK],['Load on the jack',ML.wt(c.loaded?c.each:0),COL.r]];
  return [['Load on the jack',ML.wt(c.R),COL.r],['Far end (pivot)',ML.wt(c.far),COL.far],['Lift at the jack',ML.lS(S.lift,2)],['Of jack rating',ML.pct(c.util,0),c.util>1?A_.BAD:c.util>.85?A_.WARN:A_.OK]];}
function formula(c,S){const sp=(col,t)=>`<span style="color:${col}">${t}</span>`,p=window.PAGE.ro||'lever';
  if(p==='pa')return `${sp(COL.p,'P')} = ${sp(COL.r,'F')} ÷ A = ${sp(COL.r,ML.wt(c.each))} ÷ ${ML.ar(c.area)} = ${sp(COL.p,ML.pr(c.P))}`+(c.hyd?` &nbsp;·&nbsp; limit ${ML.pr(ML.P_MAX)}`:'');
  if(p==='toe')return `Load on the ${S.tpart} = ${sp(COL.r,ML.wt(c.each))} &nbsp;·&nbsp; ${S.tpart} rating ${ML.wt(c.cap)} → ${ML.pct(c.util,0)}`;
  if(p==='crib')return `Lift an inch, crib an inch: keep the ${sp(COL.gap,'gap')} under ${ML.lS(ML.GAP_OK,0)} · now ${sp(COL.gap,ML.lS(c.gap,2))}`;
  return `${sp(COL.r,'R')} = ${sp(COL.w,'W')} × ${sp(COL.armW,'(L − CG)')} ÷ ${sp(COL.armJ,'(L − jack point)')} = ${sp(COL.w,ML.wtn(S.load))} × ${sp(COL.armW,ML.lLn(c.armW,1))} ÷ ${sp(COL.armJ,ML.lLn(c.armJ,1))} = ${sp(COL.r,ML.wt(c.R))}`;}
function info(c,S,F){const ok=(id,b,t)=>`<li id="${id}" class="${b?'ok':'bad'}">${t}</li>`;
  return `<ul class="chk">${ok('check-rating',!c.over,'Jack rated for its share')}${ok('check-plumb',Math.tan(S.tilt*ML.D2R)<=ML.MU_CAP,'Jack plumb, square under the lug')}${ok('check-base',true,'Firm, level base under the jack')}${ok('check-crib',c.gap<=ML.GAP_OK||!c.loaded,'Cribbing follows the load')}${ok('check-press',!c.hyd||c.P<=ML.P_MAX,'Pressure under '+ML.pr(ML.P_MAX))}<li id="never-under" class="ok">Never under a load held only by a jack</li></ul>`;}
const busy=(A,S,F)=>!!(phys&&!phys.W.asleep)||(F.on&&F.t<2500)||A.msgT<4600;
function out(c,A,S,F){return {gap:c.gap,lift:S.lift,crib:S.crib,pads:A.pads||0,onCrib:S.crib>0&&S.lift*c.kc<=S.crib+0.08};}
return {init,snap,resetFail,limits,actions,step,checkFail,onTrip,draw,readouts,formula,info,busy,out,landMs:1400,
  phoneVB:'120 330 1000 560'};
})();

<script>
/* Moving-loads page runtime: the simulator contract (CLAUDE.md, docs/LESSON_READY_SIMS.md) for one page.
 * A page = ONE scene (src/scenes/*.js registers SCENE) + its page spec (window.PAGE: start state, controls, readouts).
 * Video:  ?capture=1  (virtual clock only: advance(ms) drives every tween, the scene's animation and CFPhysics)
 * Lesson: ?lesson=<id> (simulators/_lesson engine inlined by src/build.py) · Free play: no parameter.
 * window.sim = {set, get, callout, clear, advance, isIdle, ready, onChange, lock, unlock, controls, failure, calc, view}

(()=>{
const Q=new URLSearchParams(location.search), CAPTURE=Q.has('capture');

const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const BOOL=new Set(['hold','fail','crack','overlay','catch']);
let tweens=[], callouts=[], listeners=[], T=0, phoneVB=false, idle=false;

document.body.classList.toggle('capture',CAPTURE);

/* ---------- layout ---------- */
const ctlHTML=c=>{
  if(c.type==='slider')return `<div class="ctl" data-key="${c.key}"><label>${c.label} <b id="v-${c.key}"></b></label><input type="range" id="c-${c.key}" min="${c.min}" max="${c.max}" step="${c.step}"></div>`;
  if(c.type==='seg')return `<div class="ctl"><label>${c.label}</label><div class="seg" id="c-${c.key}">${c.options.map(([v,t])=>`<button data-v="${v}">${t}</button>`).join('')}</div></div>`;
  if(c.type==='action')return `<div class="ctl act"><div class="seg" id="${c.id}"><button data-v="1" class="${c.primary?'pri':''}">${c.label}</button></div>${c.note?`<small>${c.note}</small>`:''}</div>`;
  return '';};
document.getElementById('app').innerHTML=`
<div id="left"><div id="svgwrap"><svg id="stage" viewBox="0 0 1600 880" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${P.aria||P.title}">${ART.style()}${ART.defs()}<g id="scene"></g><g id="co"></g></svg></div>
<div id="ro">${(P.readouts||['a','b','c','d']).map((_,i)=>`<div class="ro" id="ro-${'abcd'[i]}-w"><small id="ro-${'abcd'[i]}-l"></small><b id="ro-${'abcd'[i]}"></b></div>`).join('')}</div>
<div id="formula"></div></div>
<div id="panel"><div class="ptitle"><div class="k">CREWFORGE · ${P.kicker||'MOVING LOADS'}</div><div class="t">${P.title}</div></div>
${(P.controls||[]).map(ctlHTML).join('')}
<div class="ctl tools"><div class="seg" id="c-units"><button data-v="imp">lb · ft · in</button><button data-v="met">kg · m · mm</button></div>
<button id="c-reset" class="rst">↺ Reset</button></div>
<div id="info"></div></div>`;
const stage=$('stage'), sceneG=$('scene'), coG=$('co');

/* ---------- state ---------- */
function limits(){ML.limits(); if(SC.limits)SC.limits(S);}
function resetFail(){F=F0();ML.setF(F);if(SC.resetFail)SC.resetFail(A,S);}
function set(p,dur=0){idle=false;
  p={...p};
  if(p.units){S.units=p.units;delete p.units;}
  const snap=p.snap;delete p.snap;
  if(p.method&&p.method!==S.method){S.method=p.method;if(!('mu' in p))S.mu=p.method==='skid'?ML.SURF[S.surf].mu:ML.ROLL[p.method].mu;}
  if(p.surf){S.surf=p.surf;if(!('mu' in p)&&(p.method||S.method)==='skid')S.mu=ML.SURF[p.surf].mu;}
  delete p.method;delete p.surf;
  for(let[k,v]of Object.entries(p)){
    if(ML.KIND[k])v=ML.toInt(k,v);
    if(BOOL.has(k))v=!!v;
    tweens=tweens.filter(t=>t.key!==k);
    if(typeof v==='number'&&typeof S[k]==='number'&&dur>0)tweens.push({key:k,from:S[k],to:v,t:0,dur});
    else S[k]=v;

function rectOf(id){let e=$(id);if(!e)return null;if(e.tagName==='INPUT')e=e.closest('.ctl')||e;const r=e.getBoundingClientRect();if(!r.width&&!r.height)return null;
  let l=r.left,t=r.top,R=r.right,Bm=r.bottom,p=e.parentElement;
  while(p&&p!==document.body){if(/(auto|scroll|hidden)/.test(getComputedStyle(p).overflowY)){const q=p.getBoundingClientRect();
    l=Math.max(l,q.left);t=Math.max(t,q.top);R=Math.min(R,q.right);Bm=Math.min(Bm,q.bottom);}p=p.parentElement;}
  if(R-l<2||Bm-t<2)return null;return {left:l,top:t,right:R,bottom:Bm,width:R-l,height:Bm-t};}
function drawSpot(){
  const rs=spotIds.map(rectOf).filter(Boolean), W=innerWidth,H=innerHeight, pad=6;
  const st=!practice&&STEPS[P.i], working=st&&cur&&(st.type==='do'||st.type==='fail-demo'||(st.type==='predict'&&cur.phase!=='main'));
  const holes=rs.concat(working&&L.stage?[rectOf(L.stage)].filter(Boolean):[]);
  let h='';
  if(rs.length){
    h+=`<defs><mask id="lz-m"><rect width="${W}" height="${H}" fill="#fff"/>${holes.map(r=>`<rect x="${r.left-pad}" y="${r.top-pad}" width="${r.width+2*pad}" height="${r.height+2*pad}" rx="10" fill="#000"/>`).join('')}</mask></defs>
      <rect width="${W}" height="${H}" fill="rgba(10,9,8,${working?.42:.55})" mask="url(#lz-m)"/>`+
      rs.map(r=>`<rect class="ring" x="${r.left-pad}" y="${r.top-pad}" width="${r.width+2*pad}" height="${r.height+2*pad}" rx="10"/>`).join('');
  }
  const ar=arrowFor&&rectOf(arrowFor);
  if(ar){const bob=5*Math.sin(now()/180);
    // arrow and pill sit BELOW the control (never over its label and value), above it only near the bottom edge
    const below=ar.bottom+70<(mode==='bottom'?dock.getBoundingClientRect().top:H), x=ar.left+Math.min(ar.width/2,140);
    const y=below?ar.bottom+pad+4-bob:ar.top-pad-4+bob, s=below?1:-1;
    h+=`<polygon class="arw" points="${x},${y} ${x-13},${y+s*20} ${x+13},${y+s*20}"/>`;
    if(arrowText){const tw=arrowText.length*9.2+24, tx=Math.max(6,Math.min(W-tw-6,x-tw/2)), ty=below?y+20:y-20-32;
      h+=`<rect class="pill" x="${tx}" y="${ty}" width="${tw}" height="32" rx="16"/><text x="${tx+12}" y="${ty+22}">${esc(arrowText)}</text>`;}
  }
  spot.innerHTML=h;
  if(rs.length){const d=dock.getBoundingClientRect();
    const hit=rs.some(r=>r.left<d.right&&r.right>d.left&&r.top<d.bottom&&r.bottom>d.top);
    if(hit&&mode==='right')dock.classList.toggle('lz-left');   // sims without dock hooks: move the dock to the other side
    if(hit)log('dock-overlap',{spot:spotIds.join(',')});}
}
function scrollToTarget(id){
  const e=$(id);if(!e)return;
  let p=e.parentElement;
  while(p&&p!==document.body){const cs=getComputedStyle(p);
    if(/(auto|scroll)/.test(cs.overflowY)&&p.scrollHeight>p.clientHeight+1){const r=e.getBoundingClientRect(),pr=p.getBoundingClientRect();
      if(r.top<pr.top||r.bottom>pr.bottom)p.scrollTop+=r.top-pr.top-(pr.height-r.height)/2;break;}
    p=p.parentElement;}
  document.scrollingElement.scrollTop=0;document.scrollingElement.scrollLeft=0;
}
/* compact screens: keep only this step's controls and spotlit parts visible in the sim panel */
function markKeep(){
  document.querySelectorAll('.lz-keep,.lz-keep-a').forEach(e=>e.classList.remove('lz-keep','lz-keep-a'));
  const st=!practice&&STEPS[P.i];
  document.body.classList.toggle('lesson-focus',!!st);
  if(!st)return;
  const ids=[...(st.type==='do'||st.type==='fail-demo'||(st.type==='predict'&&cur&&cur.phase!=='main')?st.unlock||[]:[]),...spotIds,...(st.keep||[])];
  ids.forEach(id=>{const t0=$(id);if(!t0)return;const t=t0.closest('.ctl')||t0;   // a control keeps its label, value and steppers
    t.classList.add('lz-keep');let e=t.parentElement;while(e&&e!==document.body){e.classList.add('lz-keep-a');e=e.parentElement;}});
}

/* ---------- controls: steppers, tap-to-type, snap on release, one try per gesture ---------- */
function lockAll(except){window.sim.lock('all');if(except&&except.length)window.sim.unlock(except);}
function ctlLabel(id){const e=$(id);if(!e)return id;
  const lab=e.closest('.ctl')&&e.closest('.ctl').querySelector('label')||e.closest('.sec')&&e.closest('.sec').querySelector('h3');
  return lab?(lab.childNodes[0].textContent||lab.textContent).trim():id;}
const keyOf=el=>el.dataset.k||el.id.replace(/^c-/,'');
function setRange(inp,v,gesture){
  const mn=+inp.min,mx=+inp.max,stp=+inp.step||1;
  v=Math.min(mx,Math.max(mn,Math.round((v-mn)/stp)*stp+mn));
  inp.value=v; inp.dispatchEvent(new Event('input',{bubbles:true}));
  if(gesture)inp.dispatchEvent(new Event('change',{bubbles:true}));
}
function addSteppers(){
  window.sim.controls().map($).filter(e=>e&&e.tagName==='INPUT'&&e.type==='range').forEach(inp=>{
    if(inp.parentElement.classList.contains('lz-rng'))return;
    const wrap=document.createElement('div'); wrap.className='lz-rng'; inp.parentElement.insertBefore(wrap,inp); wrap.appendChild(inp);
    const mk=(cls,txt,dir)=>{const b=document.createElement('button');b.type='button';b.className='lz-stp '+cls;b.textContent=txt;
      b.setAttribute('aria-label',(dir<0?'Less ':'More ')+ctlLabel(inp.id));
      let t=null,n=0;const go=()=>{if(inp.disabled)return;setRange(inp,+inp.value+dir*(+inp.step||1)*(n>8?5:1),false);n++;};
      b.addEventListener('pointerdown',e=>{e.preventDefault();n=0;go();t=setTimeout(function rep(){go();t=setTimeout(rep,n>8?60:110);},420);});
      const end=()=>{if(t!=null){clearTimeout(t);t=null;if(!inp.disabled)inp.dispatchEvent(new Event('change',{bubbles:true}));}};
      b.addEventListener('pointerup',end);b.addEventListener('pointerleave',end);b.addEventListener('pointercancel',end);
      b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();n=0;go();inp.dispatchEvent(new Event('change',{bubbles:true}));}});
      return b;};
    wrap.insertBefore(mk('lz-dn','−',-1),inp); wrap.appendChild(mk('lz-up','+',1));
    // tap the value to type it
    const val=inp.closest('.ctl')&&inp.closest('.ctl').querySelector('label b');
    if(val){val.classList.add('lz-val');val.setAttribute('role','button');val.tabIndex=0;val.title='Tap to type a value';
      const open=()=>{if(inp.disabled)return;const r=val.getBoundingClientRect();const box=document.createElement('input');
        box.className='lz-type';box.inputMode='decimal';box.value=String(+inp.value);box.setAttribute('aria-label','Type a value for '+ctlLabel(inp.id));
        Object.assign(box.style,{left:Math.max(4,r.right-130)+'px',top:(r.top-8)+'px'});document.body.appendChild(box);box.focus();box.select();
        let gone=false;const done_=ok=>{if(gone)return;gone=true;const v=parseFloat(box.value.replace(/[^\d.\-]/g,''));box.remove();
          if(ok&&isFinite(v)){setRange(inp,v,true);log('type',{id:inp.id,value:v});}};
        box.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done_(true);}else if(e.key==='Escape')done_(false);};box.onblur=()=>done_(true);};
      val.addEventListener('click',open);val.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();open();}});}
  });
}
/* one try per gesture: a slider drag counts once, on release ('change'); buttons and checkboxes once per click.
   On release, a slider within the snap tolerance of this step's target snaps onto it. */
function onGesture(e){
  if(!cur||practice)return;
  const el=e.target; if(!el||!el.closest)return;
  const ctl=el.closest('input,button'); if(!ctl||!window.sim.controls().some(id=>{const c=$(id);return c&&(c===ctl||c.contains(ctl));}))return;
  if(e.type==='click'&&ctl.tagName==='INPUT')return;     // checkboxes count on 'change'
  if(e.type==='change'&&ctl.type==='range')snap(ctl);
  cur.tries++; cur.lastIn=now(); log('try',{n:cur.tries,state:pick(S(),STEPS[P.i])});
}
document.addEventListener('change',onGesture); document.addEventListener('click',onGesture);
function snap(inp){
  const st=STEPS[P.i], so=solveOf(st)||{}, k=keyOf(inp), g=st.goal&&st.goal[k];
  if(!(k in so)||!(Array.isArray(g)||(g&&'near' in g))||typeof so[k]!=='number')return;
  const range=+inp.max-+inp.min, tol=st.snap??Math.max(2*(+inp.step||1),range*.01), v=+inp.value;
  if(Math.abs(v-so[k])<=tol&&Math.abs(v-so[k])>1e-9){setRange(inp,so[k],false);log('snap',{id:inp.id,from:v,to:so[k]});}
}

/* ---------- state replay (resume, back, jump): lesson start + every earlier step's setup/set/solution ---------- */
function entryState(i){
  const s={...(L.start||{})};
  for(let j=0;j<=i;j++){const st=STEPS[j];Object.assign(s,st.setup||{});
    if(j<i){Object.assign(s,st.set||{});if(st.type==='do'||(st.type==='predict'&&st.goal)){const so=solveOf(st);if(so)Object.assign(s,so);}
      if(st.type==='check'&&st.show)Object.assign(s,st.show);}}
  return s;
}

/* check steps on a retry round use a variant (other numbers) and a shuffled choice order */
function eff(st){
  if(st.type!=='check'||!(P.rt===1&&P.rv>0))return st;
  const vs=st.variants||[], v=vs.length?{...st,...vs[(P.rv-1)%vs.length]}:{...st};
  if(v.choices){const ord=shuffled(v.choices.length,P.rv*31+STEPS.indexOf(st));v.choices=ord.map(k=>v.choices[k]);v.answer=ord.indexOf(v.answer);}
  return v;
}

/* ---------- step machine ---------- */
let cur=null, practice=false, pollT=0, atFinish=false;
function enter(i,how){
  window.sim.clear&&window.sim.clear(); atFinish=false;
  const prev=cur&&STEPS[P.i];
  P.i=Math.max(0,Math.min(STEPS.length-1,i));
  const st=STEPS[P.i];
  cur={id:st.id,phase:'main',t0:now(),tries:0,hints:0,lastIn:0,choice:null,answered:false,demo:false,helped:false};
  if(how==='jump')window.sim.set({...entryState(P.i),snap:true},0);
  else{
    if(how==='next'&&prev&&(prev.type==='do'||(prev.type==='predict'&&prev.goal))&&!test(prev.goal,S())){const so=solveOf(prev);if(so)window.sim.set(so,500);}
    if(st.setup)window.sim.set({...st.setup,snap:true},0);
  }
  if(st.set)window.sim.set(st.set,st.dur||0);
  lockAll(st.type==='do'||st.type==='fail-demo'?st.unlock:[]);
  spotIds=spotFor(st); arrowFor=null; arrowText='';
  if(st.callout)setTimeout(()=>window.sim.callout(st.callout.id,st.callout.text||'',{pos:st.callout.pos}),(st.callout.delay||0)+(st.dur||0));
  markKeep(); layout();
  if(spotIds[0])scrollToTarget(spotIds[0]);
  log('enter',{type:st.type,how});
  save(); render();
}
function spotFor(st){
  if(st.spot===false)return [];
  if(st.spot)return [].concat(st.spot);
  if((st.type==='do'||st.type==='fail-demo')&&st.unlock)return [...st.unlock];
  return [];
}
const done=st=>!!P.d[st.id];
function markDone(st,helped){if(!P.d[st.id])P.d[st.id]=helped?2:1;save();}

const LOCK='<svg class="lz-lock" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="8" rx="1.5"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke-width="2"/></svg>';
function head(){
  const st=STEPS[P.i], sec=(L.sections[st._sec]||{}).title||'';
  $('lz-kick').textContent=(L.kicker||'Lesson')+' · '+(L.title||'');
  $('lz-sec').textContent=practice?'Practice':P.rt?(P.rt===2?'Test out: the checks':'Retry: the checks'):sec;
  const n=STEPS.length, list=P.rt?retryList():null, k=list?list.indexOf(P.i)+1:P.i+1;
  $('lz-bar').style.width=(100*(practice||P.fin&&!P.rt?1:list?(k-1)/Math.max(1,list.length-1):P.i/(Math.max(1,n-1))))+'%';
  const passed=(P.best??0)>=PASS;
  $('lz-count').textContent=practice?(P.fin?(passed?'Lesson passed':'Not passed yet'):'Practice'):list?`Check ${k} of ${list.length}`:`Step ${k} of ${n}`;
  const ans=CHECKS.filter(s=>P.a[s.id]).length;
  $('lz-sc').textContent=!CHECKS.length?'':ans?`${CHECKS.filter(s=>credit(s)>0).length} of ${ans} checks right · ${CHECKS.length} in all`:`${CHECKS.length} checks ahead`;
  // bottom sheet: one header row (progress beside the buttons) leaves more room for the step text
  if(mode==='bottom')$('lz-kick').textContent=$('lz-count').textContent+' · '+($('lz-sc').textContent.replace(' · '+CHECKS.length+' in all','')||'');
}
const TAG={teach:['LEARN',''],do:['YOUR TURN','do'],predict:['PREDICT','do'],check:['CHECK','chk'],'fail-demo':['FAILURE','fail'],summary:['SUMMARY','']};
function picture(st){
  let h='';
  if(st.formula)h+=`<div class="lz-pic"><div class="f">${esc(tpl(st.formula)).replace(/\n/g,'<br>')}</div>${st.terms?'<ul>'+st.terms.map(t=>`<li>${esc(tpl(t))}</li>`).join('')+'</ul>':''}</div>`;
  if(st.table)h+=`<div class="lz-pic"><table><tr>${st.table.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${st.table.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
  if(st.svg)h+=`<div class="lz-pic">${st.svg}</div>`;
  if(st.points)h+=`<div class="lz-pic"><ul>${st.points.map(t=>`<li>${inline(tpl(t))}</li>`).join('')}</ul></div>`;
  return h;
}
function render(){
  if(practice)return renderPractice();
  head();
  const st0=STEPS[P.i], st=eff(st0), tg=TAG[st.type]||TAG.teach;
  let h=`<span class="lz-tag ${tg[1]}">${tg[0]}</span><h2>${esc(tpl(st.title||''))}</h2>`;
  if(st.type==='fail-demo')h+=`<div class="lz-never">SIMULATION ONLY · NEVER DO THIS ON THE JOB</div>`;
  h+=rich(st.text)+picture(st);
  if(st.type==='do'||st.type==='fail-demo'||(st.type==='predict'&&cur.phase==='reveal'))h+=`<div class="lz-live" id="lz-live"></div><div id="lz-wrong"></div>`;
  if(st.type==='predict'||st.type==='check')h+=choicesHTML(st);
  h+=`<div id="lz-fb"></div>`;
  if(P.i===0&&!P.rt&&L.testOut!==false&&CHECKS.length)h+=`<div class="lz-row"><button id="lz-testout">I've rigged before: go to the checks</button></div>`;
  B.innerHTML=h; B.scrollTop=0;
  B.querySelectorAll('.lz-ch button').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  const ni=$('lz-numin'); if(ni)ni.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();primary();}};
  const to=$('lz-testout'); if(to)to.onclick=testOut;
  feedback(); buttons(); poll(); fitDock();
}
function choicesHTML(st){
  if(st.numeric){const a=P.a[st.id];
    return `<div class="lz-num"><input id="lz-numin" inputmode="decimal" autocomplete="off" aria-label="Your answer" value="${a?esc(a[0]):''}" ${cur.answered||a?'disabled':''}><span>${esc(tpl(st.numeric.unit||''))}</span></div>`;}
  const a=st.type==='check'?P.a[st.id]:null, show=cur.answered||!!a, pk=a?a[0]:cur.choice;
  if(st.type==='predict'&&cur.phase!=='main'&&cur.choice==null&&P.a[st.id])cur.choice=P.a[st.id][0];
  return `<div class="lz-ch" role="group">`+st.choices.map((c,k)=>{
    const t=typeof c==='string'?c:c.text; let cl='';
    if(st.type==='check'&&show){if(k===st.answer)cl='ok';else if(k===pk)cl='no';}
    else if(k===cur.choice)cl='sel';
    if(cur.gone&&cur.gone.includes(k)&&!show)cl+=' gone';
    const dis=(st.type==='check'&&show)||(st.type==='predict'&&cur.phase!=='main')||(cur.gone&&cur.gone.includes(k));
    return `<button data-i="${k}" class="${cl}" ${dis?'disabled':''}><b>${String.fromCharCode(65+k)}.</b> ${esc(tpl(t))}</button>`;}).join('')+`</div>`;
}
/* feedback box; new feedback scrolls into view inside the dialog */
function fb(cls,html,scroll){const e=$('lz-fb');if(!e)return;e.innerHTML=html?`<div class="lz-fb ${cls}">${html}</div>`:'';fitDock();
  if(html&&scroll)requestAnimationFrame(()=>{const r=e.getBoundingClientRect(),br=B.getBoundingClientRect();
    if(r.bottom>br.bottom||r.top<br.top)B.scrollTop+=Math.min(r.top-br.top-8,r.bottom-br.bottom+8);});}
function feedback(){
  const st=eff(STEPS[P.i]);
  if(st.type==='check'){const a=P.a[st.id];if(!a&&!cur.answered){if(cur.hintHTML)fb('hint',cur.hintHTML,true);return;}
    const ok=a&&a[1]>0, c=st.choices&&st.choices[a?a[0]:cur.choice], why=c&&typeof c==='object'&&c.why;
    const lead=a&&a[2]?'<p><b>Here is the answer.</b> No marks for this one.</p>':ok?(a[1]<1?'<p><b>Correct</b>, with a hint: half marks.</p>':'<p><b>Correct.</b></p>')
      :`<p><b>Not quite.</b>${why?' '+inline(tpl(why)):''}</p>`;
    fb(ok?'ok':a&&a[2]?'hint':'no',lead+rich(st.explain),true);return;}
  if(st.type==='predict'&&cur.phase==='done'){const right=st.answer==null||cur.choice===st.answer;
    fb(right?'ok':'warn',`<p><b>${right?'Good call.':'Not what you predicted.'}</b></p>`+rich(st.after),true);return;}
  if(st.type==='predict'&&cur.phase==='reveal'){fb('hint',rich(st.doText||'Now do it in the simulator.'),true);return;}
  if((st.type==='do'||st.type==='fail-demo')&&done(st)&&cur.okHTML){fb(st.type==='fail-demo'?'fail':st.okTone||'ok',cur.okHTML,true);return;}
  if(cur.hintHTML)fb('hint',cur.hintHTML,true);
}
function buttons(){
  const st=STEPS[P.i], last=P.i===STEPS.length-1;
  BACK.disabled=P.i===0||!!P.rt;
  let label='Next', wait=false, dis=false;
  if(st.type==='do'||st.type==='fail-demo'){wait=!done(st);label=wait?'Waiting for you…':'Next';dis=wait;}
  else if(st.type==='predict'){if(cur.phase==='main'){label='Lock in my answer';dis=cur.choice==null;}
    else if(cur.phase==='reveal'){label='Waiting for you…';dis=wait=true;}}
  else if(st.type==='check'&&!P.a[st.id]){label='Check answer';dis=st.numeric?false:cur.choice==null;}
  if(!dis&&label==='Next'&&(last||(P.rt&&retryList().indexOf(P.i)===retryList().length-1)))label='Finish';
  GO.textContent=label; GO.disabled=dis; GO.classList.toggle('wait',wait);
  const hintable=st.type==='do'||st.type==='fail-demo'||(st.type==='predict'&&cur.phase!=='done')||(st.type==='check'&&!P.a[st.id]);
  HINT.style.display=hintable?'':'none';
  HINT.textContent=st.type==='predict'&&cur.phase==='main'?'Hint':st.type==='check'?(cur.hints===0?'Hint':cur.hints===1?'Hint (half marks)':'Show the answer (no marks)')
    :cur.hints>=3?'Skip this step':cur.hints===2?'Show me':'Hint';
  HINT.disabled=cur.demo||!!cur.skipping;
}
function primary(){
  const st=STEPS[P.i]; if(GO.disabled)return;
  if(st.type==='predict'&&cur.phase==='main')return commitPredict();
  if(st.type==='check'&&!P.a[st.id])return submitCheck();
  log('next');
  if(P.rt){const list=retryList(), k=list.indexOf(P.i);if(k<list.length-1)return enter(list[k+1],'jump');return finish();}
  if(P.i<STEPS.length-1){markDone(st);enter(P.i+1,'next');}else{markDone(st);finish();}
}
GO.onclick=primary;
BACK.onclick=()=>{if(P.i>0){log('back');enter(P.i-1,'jump');}};
HINT.onclick=()=>hint();

function choose(k){
  const st=STEPS[P.i];
  if(st.type==='check'&&(P.a[st.id]||cur.answered))return;
  if(st.type==='predict'&&cur.phase!=='main')return;
  cur.choice=k; log('choose',{choice:k}); render();
}
function commitPredict(){
  const st=STEPS[P.i]; P.a[st.id]=[cur.choice,st.answer==null||cur.choice===st.answer?1:0]; log('predict',{choice:cur.choice});
  if(st.goal){cur.phase='reveal';cur.t0=now();cur.hints=0;cur.tries=0;cur.hintHTML='';lockAll(st.unlock);spotIds=spotFor({...st,type:'do'});markKeep();layout();if(spotIds[0])scrollToTarget(spotIds[0]);}
  else{cur.phase='done';if(st.reveal)window.sim.set(st.reveal.set||st.reveal,st.reveal.dur||1500);markDone(st);}
  save(); render();
}
function submitCheck(shown){
  const st=eff(STEPS[P.i]); let val, ok;
  if(st.numeric){const raw=($('lz-numin')||{}).value||''; val=parseFloat(raw.replace(/[, ]/g,''));
    if(!shown&&!isFinite(val)){fb('warn','<p>Type a number first.</p>',true);return;}
    const ans=typeof st.numeric.answer==='string'?pathGet(S(),st.numeric.answer):st.numeric.answer, tol=st.numeric.tol||{};
    const t=Math.max(tol.abs||0,(tol.pct||0)/100*Math.abs(ans));
    ok=isFinite(val)&&Math.abs(val-ans)<=t+1e-9; if(shown)val=fmtVal(ans);}
  else{val=shown?st.answer:cur.choice; ok=val===st.answer;}
  const cr=shown||!ok?0:cur.hints>=2?.5:1;      // hint 1 is free; hint 2 (working shown) = half marks; Show the answer = 0
  P.a[st.id]=[val,cr,shown?1:0]; cur.answered=true;
  log('answer',{value:val,correct:ok,credit:cr,hints:cur.hints,attempt:++cur.tries});
  if(st.show){window.sim.set(st.show,st.showDur??1200);}
  if(st.showCallout)setTimeout(()=>window.sim.callout(st.showCallout.id,st.showCallout.text||'',{pos:st.showCallout.pos}),(st.showDur??1200)+100);
  markDone(STEPS[P.i]); reportScore(false); render(); GO.classList.add('pulse'); GO.focus();
}

/* hint chain: 1 words · 2 spotlight + arrow + target · 3 show me (demo, then hand back) · then skip */
function hint(){
  const st=eff(STEPS[P.i]); if(cur.demo||cur.skipping)return;
  const doLike=st.type==='do'||st.type==='fail-demo'||(st.type==='predict'&&cur.phase==='reveal');
  if(cur.hints>=3&&doLike){log('skip');cur.helped=true;cur.skipping=true;HINT.disabled=true;const so=solveOf(st);if(so)window.sim.set(so,800);
    setTimeout(()=>{markDone(st,true);cur.okHTML=rich(st.ok||'Done.')+'<p><i>Step skipped. Try it in practice later.</i></p>';
      if(st.type==='predict'){cur.phase='done';}render();},st.type==='fail-demo'?1600:900);return;}
  cur.hints++; log('hint',{level:cur.hints});
  if(st.type==='predict'&&cur.phase==='main'){
    cur.hintHTML=cur.hints===1?rich(st.hint||'There is no wrong guess here. Pick the answer you think is most likely.')
      :'<p>Any answer is fine. This one is not marked. Pick one and lock it in.</p>';
    if(cur.hints>=2&&cur.choice==null){cur.choice=st.answer??0;}
    cur.hints=Math.min(cur.hints,2); render(); return;}
  if(st.type==='check'){
    if(cur.hints===1)cur.hintHTML=rich(st.hint||'Read the question again. Which numbers does it give you?')+'<p class="lz-note">This hint is free. The next one gives half marks.</p>';
    else if(cur.hints===2){cur.hintHTML=rich(st.hint2||st.hint||'Work it one step at a time.')+'<p class="lz-note">Half marks for this check now.</p>';
      if(st.hintSpot){spotIds=[].concat(st.hintSpot);}
      if(st.choices){const wrong=st.choices.map((c,k)=>k).filter(k=>k!==st.answer&&k!==cur.choice);cur.gone=[wrong[0]];}}
    else{log('showme');submitCheck(true);return;}
    render();return;}
  const so=solveOf(st)||{};
  if(cur.hints===1)cur.hintHTML=rich(st.hint||'Look at the control with the orange ring.');
  else if(cur.hints===2){
    const id=(st.unlock||[])[0], key=Object.keys(so)[0], v=so[key], cv=S()[key];
    const dir=typeof v==='number'&&typeof cv==='number'?(v>cv?' · higher':v<cv?' · lower':''):'';
    const lb=id&&$(id)&&$(id).closest('.ctl')&&$(id).closest('.ctl').querySelector('label b'), u=lb?lb.textContent.replace(/^[\d.,\s−-]+/,''):'';
    const unit=u?(/^[A-Za-z]/.test(u)?' '+u:u):'';
    arrowFor=id||null; arrowText=st.arrow?tpl(st.arrow):(key!=null?`${typeof v==='number'?'Set to '+fmtVal(v)+unit:typeof v==='boolean'?(v?'Tick it':'Untick it'):'Pick '+v}${dir}`:'');
    if(id){spotIds=[...new Set([id,...spotIds])];markKeep();scrollToTarget(id);}
    const tip=$(id)&&$(id).type==='range'?' Use **−** and **+**, or tap the value to type it.':'';
    cur.hintHTML=rich(st.hint2||`Use **${ctlLabel(id)}**. ${arrowText}.${tip}`);}
  else{showMe(st,so);return;}
  render();
}
function showMe(st,so){
  log('showme'); cur.demo=true; cur.hintHTML='<p><b>Watch.</b> The simulator does it once. Then it is your turn.</p>';
  const keep=strip(S()), back={}; Object.keys(so).forEach(k=>back[k]=keep[k]);
  lockAll([]); render();
  const dur=st.type==='fail-demo'?2500:1800;
  window.sim.set(so,dur);
  setTimeout(()=>{window.sim.set(st.type==='fail-demo'?{...(st.setup||back),snap:true}:back,st.type==='fail-demo'?0:900);
    setTimeout(()=>{cur.demo=false;lockAll(st.unlock);cur.hintHTML=rich(st.after_demo||'Your turn. Do what the simulator just did.')+'<p>Still stuck? Press <b>Skip this step</b>.</p>';render();},950);},
    dur+(st.type==='fail-demo'?1800:900));
}

/* poll: goals, live line, wrong-way messages (tweens and the lift run on the sim's own clock) */
function poll(){
  clearTimeout(pollT); if(practice)return;
  const st=STEPS[P.i], s=S();
  const live=$('lz-live'); if(live){live.textContent=tpl(st.live||'',null)||'';live.style.display=st.live?'':'none';}
  const doLike=st.type==='do'||st.type==='fail-demo'||(st.type==='predict'&&cur.phase==='reveal');
  if(doLike&&!cur.demo){
    const g=st.goal||(st.type==='fail-demo'?{'out.failure.parted':true}:null);
    const met=test(g,s), wEl=$('lz-wrong');
    if(met&&(st.type==='fail-demo'||now()-cur.lastIn>450)){
      if(!done(st)||(st.type==='predict'&&cur.phase==='reveal')){
        log('goal',{ms:now()-cur.t0,tries:cur.tries,hints:cur.hints});
        if(st.type==='fail-demo')cur.failCap=pathGet(s,'out.failure.caption')||'';
        cur.okHTML=rich(st.ok||'Done.')+(cur.failCap?`<p><b>${esc(cur.failCap)}</b></p>`:'');
        if(wEl)wEl.innerHTML='';
        if(st.type==='predict'){cur.phase='done';markDone(st);render();}
        else{markDone(st,cur.helped);arrowFor=null;render();GO.classList.add('pulse');}
      }
    } else if(!done(st)){
      // authored "wrong way" messages always show (above any hint) while they apply
      const w=st.wrong&&st.wrong.find(x=>test(x.when,s));
      if(wEl){const html=w?`<div class="lz-fb warn">${rich(w.say)}</div>`:'';if(wEl.innerHTML!==html){wEl.innerHTML=html;fitDock();}}
      // automatic first hint: after hintTries gestures (default 4) or hintAfter seconds (default 30), never over a wrong-way message
      if(!w&&cur.hints===0&&(now()-cur.t0>(st.hintAfter||30)*1000||cur.tries>=(st.hintTries||4))){hint();return;}
    }
  }
  pollT=setTimeout(poll,200);
}
function onSim(){if(cur&&!practice)cur.lastIn=now();}
function pick(s,st){const o={};Object.keys((st&&st.goal)||{}).forEach(k=>o[k]=pathGet(s,k));return o;}

/* ---------- finish, retry, test-out, practice ---------- */
const retryList=()=>STEPS.map((s,i)=>s.type==='check'?i:-1).filter(i=>i>=0);
function checksPath(kind){GO.onclick=primary;P.rt=kind;if(kind===1)P.rv=(P.rv||0)+1;retryList().forEach(i=>delete P.a[STEPS[i].id]);
  log(kind===1?'retry':'testout',{round:P.rv});practice=false;restoreHidden();enter(retryList()[0],'jump');}
function testOut(){checksPath(2);}
function finish(){
  const sc=score(); P.best=Math.max(P.best??0,sc); P.fin=1; P.rt=0; save(); reportScore(true); log('finish',{score:sc});
  practice=false; renderFinish();
}
function renderFinish(){
  head(); atFinish=true; const sc=score(), best=Math.max(P.best??0,sc), pass=best>=PASS;
  $('lz-count').textContent=pass?'Lesson passed':'Not passed yet'; $('lz-bar').style.width='100%';
  spotIds=[]; arrowFor=null; markKeep(); window.sim.unlock('all');
  B.innerHTML=`<span class="lz-tag ${pass?'':'fail'}">${pass?'PASSED':'NOT PASSED YET'}</span><h2>${esc(L.title||'Lesson')}</h2>
    <div class="lz-score ${pass?'lz-pass':'lz-failc'}">${best}%</div>
    <p>${pass?`You passed. The pass mark is ${PASS}%.`:`The pass mark is ${PASS}%. Retry the checks: you get new numbers each time, and your best score counts.`}</p>
    <p>Practice is unlocked. Every control is free, and there are challenge questions. Practice does not count toward your grade.</p>
    <div class="lz-row">${pass?'<button class="p" id="lz-prac">Start practice</button>':'<button class="p" id="lz-retry">Retry the checks</button><button id="lz-prac">Practice first</button>'}<button id="lz-review">Review the lesson</button></div>
    ${L.sources?`<p class="lz-src">Sources: ${L.sources.map(esc).join(' · ')}</p>`:''}`;
  GO.textContent=pass?'Start practice':'Retry the checks'; GO.disabled=false; GO.classList.remove('wait');
  GO.onclick=pass?startPractice:()=>checksPath(1); HINT.style.display='none'; BACK.disabled=true;
  $('lz-prac').onclick=startPractice; $('lz-review').onclick=()=>{GO.onclick=primary;P.rt=0;restoreHidden();enter(0,'jump');};
  const r=$('lz-retry'); if(r)r.onclick=()=>checksPath(1);
  layout(); GO.focus();
}
let ch=null;
const restoreHidden=()=>(L.hide||[]).forEach(id=>{const e=$(id);e&&e.classList.add('lz-hidden');});
function startPractice(){
  practice=true; atFinish=false; P.fin=P.fin||(PRAC_ONLY?0:1); log('practice'); spotIds=[]; arrowFor=null; markKeep();
  window.sim.clear&&window.sim.clear(); window.sim.unlock('all');
  (L.hide||[]).forEach(id=>{const e=$(id);if(e&&!(L.practiceShow||[]).includes(id))e.classList.add('lz-hidden');});
  newChallenge(); save(); layout();
}
function rnd(spec){if(spec.choices)return spec.choices[Math.floor(Math.random()*spec.choices.length)];
  const n=Math.round((spec.max-spec.min)/(spec.step||1));return +(spec.min+Math.floor(Math.random()*(n+1))*(spec.step||1)).toFixed(6);}
function newChallenge(){
  const list=(L.practice&&L.practice.challenges)||[];
  if(!list.length){ch=null;return renderPractice();}
  const c=list[(P.p.k||0)%list.length]; P.p.k=(P.p.k||0)+1; const vars={};
  Object.entries(c.vars||{}).forEach(([k,sp])=>vars[k]=rnd(sp));
  Object.entries(c.derive||{}).forEach(([k,ex])=>vars[k]=evalExpr(ex,vars));
  const scen={}; Object.entries(c.setup||{}).forEach(([k,v])=>scen[k]=typeof v==='string'&&v[0]==='='?evalExpr(v.slice(1),vars):v);
  // compute the answer on the simulator, then put the learner's rig back before anything paints
  const keep=strip(S()); window.sim.set({...scen,snap:true},0);
  const out=S(); const ans=pathGet(out,c.answer); const extra={}; (c.keep||[]).forEach(p=>extra[p]=pathGet(out,p));
  window.sim.set({...keep,snap:true},0);
  ch={c,vars:{...vars,...extra,answer:ans},scen,ans,done:false};
  save(); log('challenge',{id:c.id,vars}); renderPractice();
}
function renderPractice(){
  head(); const pp=P.p;
  let h=`<span class="lz-tag do">PRACTICE</span><h2>${esc(L.practice&&L.practice.title||'Practice')}</h2>${rich(L.practice&&L.practice.intro||'Every control is free. Try anything.')}`;
  if(ch){const c=ch.c;
    h+=`<div class="lz-pic"><p><b>Challenge:</b> ${esc(tpl(c.text,ch.vars))}</p></div>
      <div class="lz-num"><input id="lz-numin" inputmode="decimal" autocomplete="off" aria-label="Your answer" ${ch.done?'disabled':''}><span>${esc(tpl(c.unit||'',ch.vars))}</span></div><div id="lz-fb"></div>
      <div class="lz-row"><button class="p" id="lz-pchk" ${ch.done?'disabled':''}>Check</button>${ch.done?'<button id="lz-pshow">Show it on the simulator</button>':''}<button id="lz-pnew">New challenge</button></div>`;}
  h+=`<p class="lz-note">Practice: ${pp.ok} right out of ${pp.n}. Not counted toward your grade.</p>`;
  if(!PRAC_ONLY&&STEPS.length)h+=`<div class="lz-row"><button id="lz-relesson">Back to the lesson</button>${(P.best??0)<PASS&&P.fin?'<button id="lz-retry2">Retry the checks</button>':''}</div>`;
  B.innerHTML=h; setTimeout(fitDock,0);
  GO.textContent='New challenge'; GO.disabled=!ch; GO.classList.remove('wait'); GO.onclick=newChallenge; HINT.style.display='none'; BACK.disabled=true;
  if(ch){$('lz-pchk').onclick=checkChallenge; $('lz-pnew').onclick=newChallenge;
    const ps=$('lz-pshow'); if(ps)ps.onclick=()=>{window.sim.set({...ch.scen,snap:true},0);log('pshow');};
    $('lz-numin').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();checkChallenge();}};}
  const rl=$('lz-relesson'); if(rl)rl.onclick=()=>{practice=false;GO.onclick=primary;restoreHidden();P.fin?renderFinish():enter(P.i,'jump');};
  const r2=$('lz-retry2'); if(r2)r2.onclick=()=>checksPath(1);
}
function checkChallenge(){
  if(!ch||ch.done)return; const raw=$('lz-numin').value, v=parseFloat(raw.replace(/[, ]/g,''));
  if(!isFinite(v)){fb('warn','<p>Type a number first.</p>',true);return;}
  const tol=ch.c.tol||{pct:1}, t=Math.max(tol.abs||0,(tol.pct||0)/100*Math.abs(ch.ans)), ok=Math.abs(v-ch.ans)<=t+1e-9;
  ch.done=true; P.p.n++; if(ok)P.p.ok++; save(); log('pcheck',{id:ch.c.id,value:v,answer:ch.ans,correct:ok});
  const ans=`<p>Answer: <b>${fmtVal(ch.ans,ch.c.dp??0)} ${esc(tpl(ch.c.unit||'',ch.vars))}</b></p>`+rich(ch.c.solution,ch.vars);
  renderPractice(); $('lz-numin').value=raw; fb(ok?'ok':'no',`<p><b>${ok?'Correct.':'Not quite.'}</b></p>`+ans,true);
  window.sim.set({...ch.scen,snap:true},0);
}

/* ---------- keyboard: Enter = main button (also right after a slider), 1–6 = choices, Esc = hide the sheet ---------- */
addEventListener('keydown',e=>{
  const t=e.target||{};
  if(t.classList&&t.classList.contains('lz-type'))return;
  if(e.key==='Enter'&&t.type==='range'){if(!GO.disabled){e.preventDefault();GO.click();}return;}
  if(t.type==='range')return;
  if(e.key==='Enter'&&t.tagName!=='BUTTON'&&t.id!=='lz-numin'&&!(t.classList&&t.classList.contains('lz-val'))){e.preventDefault();GO.click();}
  else if(/^[1-6]$/.test(e.key)&&t.tagName!=='INPUT'&&!practice){const b=B.querySelectorAll('.lz-ch button')[+e.key-1];b&&!b.disabled&&b.click();}
  else if(e.key==='Escape'&&mode==='bottom')toggleMin();
});

/* ---------- sections menu: locked sections say why ---------- */
$('lz-secbtn').onclick=()=>{
  if(B.querySelector('.lz-secs')){practice?renderPractice():atFinish?renderFinish():render();GO.focus();return;}
  const firstOf=si=>STEPS.findIndex(s=>s._sec===si), reach=Math.max(P.i,...Object.keys(P.d).map(id=>STEPS.findIndex(s=>s.id===id)));
  B.innerHTML=`<h2>Sections</h2><ul class="lz-secs">`+L.sections.map((s,si)=>{const f=firstOf(si),open=P.fin||f<=reach+1;
    const all=STEPS.filter(x=>x._sec===si).every(done);
    return `<li class="${!practice&&STEPS[P.i]._sec===si?'cur':''}"><button data-s="${f}" ${open?'':'disabled'}><i>${all?'✓':open?'':LOCK}</i>${esc(s.title)}</button></li>`;}).join('')+`</ul>
    <p class="lz-note">${LOCK} Finish the section before to open the next one.${CHECKS.length?' Already rig for a living? Test out: answer the checks now. Your score counts.':''}</p>
    <div class="lz-row">${CHECKS.length?'<button id="lz-testout2">Test out: go to the checks</button>':''}<button id="lz-secclose" class="p">Back</button></div>`;
  B.querySelectorAll('.lz-secs button').forEach(b=>b.onclick=()=>{log('jump',{to:+b.dataset.s});practice=false;GO.onclick=primary;P.rt=0;restoreHidden();enter(+b.dataset.s,'jump');});
  const t2=$('lz-testout2'); if(t2)t2.onclick=testOut;
  $('lz-secclose').onclick=()=>$('lz-secbtn').click();
};

/* ---------- public driver for tests and run-through agents ---------- */
window.lesson={
  log:LOG, lesson:L, steps:STEPS,
  state:()=>{const st=STEPS[P.i];return {id:L.id,index:P.i,count:STEPS.length,step:practice?'practice':st&&st.id,type:st&&st.type,
    phase:cur&&cur.phase,attempts:cur?cur.tries:0,hints:cur?cur.hints:0,timeOnStep:cur?now()-cur.t0:0,done:st?done(st):false,
    answered:st?!!P.a[st.id]:false,score:score(),best:P.best,finished:!!P.fin,practice,retry:P.rt,round:P.rv,
    challenge:ch&&{id:ch.c.id,vars:ch.vars,answer:ch.ans,rotation:P.p.k},dock:mode,compact:document.body.classList.contains('lesson-compact'),
    spot:[...spotIds],arrow:arrowFor,scorm:SC.on,check:st&&st.type==='check'?(()=>{const e=eff(st);return {text:e.text,choices:(e.choices||[]).map(c=>c.text||c),answer:e.answer,numeric:e.numeric};})():null};},
  next:()=>GO.click(), back:()=>BACK.click(), hint:()=>HINT.click(), choose, goto:i=>enter(i,'jump'), testOut,
  answer:v=>{const st=STEPS[P.i];if(st.numeric){$('lz-numin').value=v;}else choose(v);GO.click();},
  practice:startPractice, progress:()=>JSON.parse(JSON.stringify(P)), reset:()=>{try{localStorage.removeItem(KEY);}catch(e){}}
};

/* ---------- start ---------- */
function start(){
  SC.init(); loadProgress();
  if(window.sim.onChange)window.sim.onChange(onSim);
  restoreHidden(); addSteppers();
  layout();
  addEventListener('beforeunload',()=>{save();if(SC.on){SC.commit();SC.finish();}});
  (function loop(){drawSpot();requestAnimationFrame(loop);})();
  if(PRAC_ONLY||(!STEPS.length)){window.sim.set({...(L.start||{}),snap:true},0);return startPractice();}
  if(P.fin&&!P.rt){window.sim.set({...entryState(STEPS.length-1),snap:true},0);return renderFinish();}
  enter(P.i||0,'jump');
}
(function wait(){if(window.sim&&window.sim.ready)start();else setTimeout(wait,30);})();
})();
</script>
