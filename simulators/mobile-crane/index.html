<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile Crane Simulator: Load Charts, Signals, Lift Plans · CrewForge</title>
<!--
  CrewForge: Mobile Crane Simulator (hydraulic truck crane). Level 1, RSOS tasks B-9 and B-10.
  Brand: charcoal #1F1D1A, off-white #F5F5F4, orange #F08A2B (accents only, never a warning).
  THE LOAD CHART IS AN EXAMPLE FOR TRAINING. It is generated from a simple stability + boom-strength model of a
  made-up 40-ton-class crane (NOTES.md). It is NOT any real crane's chart. Never lift from it.
  PIPELINE CONTRACT:
    window.sim.set(partialState, durationMs)   tween numeric values, set others instantly
    window.sim.callout(targetId, text, {pos})   highlight an element with a label
    window.sim.clear()                          remove all callouts
    window.sim.advance(ms)                      advance the virtual clock (ALL motion runs off this)
    window.sim.isIdle()                         always false: the signaller, wind and hoist lines move continuously
    window.sim.ready                            true once loaded
  Extras: sim.calc(), sim.get(), sim.failure(), sim.chart(units,outr,area) (the example chart table), sim.view
  ?capture=1 → no requestAnimationFrame; the pipeline drives time through advance().

  STATE (sim.set keys)
    mode      'chart' (read the load chart) | 'signals' (hand signals, crane responds) | 'plan' (lift plan / critical lift)
    units     'imp' (ft, lb, mph) | 'met' (m, kg, km/h). Switching converts every length, weight and wind value.
    outr      'full' (outrigger beams fully extended) | 'ret' (beams retracted, floats down)
    area      'side' (360° / over the side) | 'front' (over the front)
    boom      boom length L, 32 … 96 ft (9.75 … 29.26 m)
    radius    radius BEFORE loading (boom angle θ = acos(radius ÷ L)), kept between θ 10° and 78°
    angle     convenience: sets radius = L × cos(angle)
    load      net load (lb | kg)    hook  hook block weight    rigging  slings + shackles + spreader weight
    ball      true → overhaul ball on the whip line (deduct)   jib  'none' | 'stowed' | 'erected' (deduct, example values)
    lift      height of the load above the ground (ft | m); 0 = set down. Clamped below two-blocking.
    signal    'none' | 'hoist' | 'lower' | 'main' | 'whip' | 'boomUp' | 'boomDown' | 'slow' | 'boomUpLowerLoad' |
              'boomDownRaiseLoad' | 'swingL' | 'swingR' | 'stop' | 'estop' | 'dog' | 'extend' | 'retract'
    quiz      true → the signal card hides the name ("What signal is this?"); reveal with quiz:false
    slew      swing angle (deg, plan view)        line  'main' | 'whip' (set by the main / whip signals)
    tandem    true → two cranes share one load (lift plan)   boomB, radiusB  crane B   span  pick-to-pick distance
    cgA       load CG distance from crane A's pick   wind  wind speed (mph | km/h)
    personnel true → people in a suspended work platform   power  true → load over / between energized conductors
    snap      true → motion settles at once (use in scene setups)
  FAILURE MODES (NOTES.md "Failure modes"):
    fail      true → armed (default: true interactive, false in ?capture=1). With the load clear of the ground:
              gross > tipping load at the loaded radius → the crane tips over the load-side outrigger (kind 'tip');
              gross > 1.5 × the boom-strength rating (example value) first → the boom buckles (kind 'boom').
              false, snap:true or a mode change restores the crane. sim.failure() → {on, kind, crane, t, caption, pct}
-->
<style>
:root{--bg:#1F1D1A;--panel:#2A2723;--panel2:#34302B;--line:#45403A;--text:#F5F5F4;--muted:#A39B90;
--accent:#F08A2B;--ok:#3ddc84;--warn:#F2C230;--bad:#ff4d4d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{display:grid;grid-template-columns:1fr 600px;height:100vh}
#stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border-right:1px solid var(--line);
background:radial-gradient(ellipse at 40% 35%,#26231f 0%,#1F1D1A 55%,#141210 100%)}
.brandbar{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line)}
.brandbar .logo{height:44px;width:auto;display:block}
.brandbar .t1{font-size:13px;letter-spacing:.18em;color:var(--muted);font-weight:600}
.brandbar .t2{font-size:26px;font-weight:700}
#svgwrap{flex:1;min-height:0;position:relative}
#svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px)}
#vm2wrap{display:none;position:relative}
#svg2{position:absolute;inset:0;width:100%;height:100%}
#formula{margin:0 22px 16px;padding:10px 20px;background:linear-gradient(180deg,#2e2a26,#272420);border:1px solid var(--line);
border-left:5px solid var(--accent);border-radius:8px;font-size:21px;font-variant-numeric:tabular-nums;line-height:1.45;
font-family:"SF Mono",Menlo,Consolas,monospace}
#formula div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel{background:linear-gradient(180deg,#2c2925,#262320);padding:12px 22px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.sec h3{margin:0 0 5px;font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:44px;padding:6px 6px;border-radius:7px;border:1px solid var(--line);
background:linear-gradient(180deg,#3a3530,#302c28);color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
.seg button.on{background:linear-gradient(180deg,#f59a45,#e07c1f);color:#141414;border-color:var(--accent)}
.sig button{flex:0 0 calc(25% - 5px);font-size:13px;padding:6px 3px}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ctl{margin-top:4px}
.ctl label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:0}
.ctl label b{color:var(--text);font-variant-numeric:tabular-nums}
.row2{display:flex;gap:10px}.row2>*{flex:1}
input[type=range]{width:100%;accent-color:var(--accent);margin:1px 0}
.hide{display:none!important}
.ro{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ro div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;min-width:0}
.ro span{display:block;font-size:11px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro b{font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ro .big b{font-size:27px}
#status{padding:9px;border-radius:8px;font-weight:800;font-size:17px;text-align:center;letter-spacing:.03em;border:1px solid var(--line)}
#co{position:fixed;inset:0;pointer-events:none;z-index:10}
.ring{position:absolute;border:4px solid var(--accent);border-radius:10px}
.clabel{position:absolute;max-width:440px;background:var(--accent);color:#141414;font-weight:700;font-size:25px;
line-height:1.25;padding:12px 16px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.55)}
@media (max-width:1000px){
  #app{grid-template-columns:1fr;height:auto}
  #stage{border-right:0}
  #svgwrap{height:106vw;min-height:300px}
  #app.sigmode #svgwrap{height:72vw}
  #vm2wrap{display:block;height:calc((100vw - 8px)*1.96);margin:0 4px 8px}
  #app.sigmode #vm2wrap{display:none}
  #formula{font-size:12px;margin:0 8px 10px;padding:8px 10px}
  #formula div{white-space:normal}
  #panel{overflow:visible;padding:12px}
  .brandbar{padding:10px 12px}.brandbar .t2{font-size:18px}.brandbar .logo{height:34px}
  .ro{grid-template-columns:1fr 1fr}
  .ro b{font-size:16px}.ro .big b{font-size:22px}
  .seg button{font-size:13px;padding:7px 3px;min-width:36px}
  .sig button{flex:0 0 calc(33% - 5px)}
  .clabel{font-size:15px;max-width:240px;padding:8px 10px}
}
</style>
</head>

        <div class="big" id="ro-cap-box"><span id="ro-cap-lbl">Chart capacity</span><b id="ro-cap"></b></div>

        <div id="ro-ang-box"><span>Boom angle</span><b id="ro-ang"></b></div>
        <div id="ro-defl-box"><span>Boom deflection</span><b id="ro-defl"></b></div>
        <div id="ro-cell-box"><span>Chart cell (row · column)</span><b id="ro-cell"></b></div>
        <div id="ro-tip-box"><span id="ro-tip-lbl">Tipping load</span><b id="ro-tip"></b></div>

<script>
(()=>{
const CAPTURE=new URLSearchParams(location.search).has('capture');
const OK='#3ddc84',WARN='#F2C230',BAD='#ff4d4d',ACC='#F08A2B',MUTED='#A39B90',STEEL='#9fb0bc',TEXT='#F5F5F4';
// Visual-maths colours: one colour per symbol, the same in the drawing, the cards and the formula bar
const COL={L:'#59b7ff',R:'#7fd6c2',th:ACC,W:'#d9d3c7',hook:'#b48af0',rig:'#ff9ecf',ball:'#8fb3c9',jib:'#d6a86b',
  gross:'#ffffff',cap:'#59b7ff',defl:'#ffc89a',mom:'#ff9ecf'};
const LB=0.45359237, FT=0.3048, KMH=1.609344;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const D2R=Math.PI/180;
const rnd=(i,sd=0)=>{const x=Math.sin(i*12.9898+sd*78.233)*43758.5453;return x-Math.floor(x);};

/* =====================================================================
   EXAMPLE CRANE (made up for training; NOTES.md "Example crane"). Model units: ft and lb.
   Carrier 36,000 lb (CG over the centre of rotation side to side; 2 ft toward the front over the front).
   Upperstructure without boom 24,000 lb, CG 5 ft behind the centre of rotation (counterweight side).
   Boom (telescopic, 32 → 96 ft): weight 11,000 + 90 × (L − 32) lb, CG at 0.45 L. Boom foot pin over the centre
   of rotation, 9 ft up, so the radius before loading is R = L × cos θ.
   Tipping fulcrum f (from the centre of rotation, on the load side): over the side = half the outrigger spread
   (11 ft fully extended, 4 ft retracted); over the front = the front outrigger jack, 7 ft ahead.
   TIPPING LOAD  Wtip = [Wc (f + dc) + Wu (f + 5) − Wb (0.45 R − f)] ÷ (R − f)       (moments about the fulcrum)
   STABILITY RATING  = 85 % of Wtip   (rated loads on outriggers ≤ 85 % of tipping: SAE J765 as quoted on maker charts)
   BOOM-STRENGTH RATING  Cs = 80,000 × (32 ÷ L)^1.2 ÷ (1 + 0.02 × (R − 10))  (made-up structural curve)
   CHART VALUE = the smaller of the two (max 80,000 lb), rounded DOWN to 100 lb (metric chart: 50 kg).
   Cells where Cs governs are structural: marked * and shaded. Blank cells: boom angle outside 10° … 78° or < 1,000 lb.
   ===================================================================== */
const M={Wc:36000,Wu:24000,xu:5,hf:9,cmax:80000,K3EI:1.43e9,SF:1.5};
const Wb=L=>11000+90*(L-32);
const fulc=(outr,area)=>area==='front'?{f:7,dc:-2}:{f:outr==='ret'?4:11,dc:0};
function wtipLb(Rft,Lft,outr,area){
  const {f,dc}=fulc(outr,area); if(Rft<=f)return Infinity;
  const Ms=M.Wc*(f+dc)+M.Wu*(f+M.xu);
  return (Ms-Wb(Lft)*(0.45*Rft-f))/(Rft-f);
}
const csLb=(Lft,Rft)=>M.cmax*Math.pow(32/Lft,1.2)/(1+0.02*Math.max(0,Rft-10));
const ANG_MIN=10, ANG_MAX=78, RMIN=Math.cos(ANG_MAX*D2R), RMAX=Math.cos(ANG_MIN*D2R);
const CH={imp:{booms:[32,48,64,80,96],radii:[10,12,15,20,25,30,35,40,50,60,70,80],step:100,min:1000,toFt:1},
          met:{booms:[9.75,14.63,19.51,24.38,29.26],radii:[3,3.5,4.5,6,7.5,9,10.5,12,15,18,21,24],step:50,min:450,toFt:1/FT}};
// Example deductions (made-up chart notes). Terex RT555 note 6: hook block, slings and lifting devices are part of the load.
const DED={imp:{ball:350,jib:{none:0,stowed:1200,erected:3800}},met:{ball:160,jib:{none:0,stowed:545,erected:1725}}};
const WIND_LIMIT={imp:20,met:32};            // example chart note: derate above 20 mph (Terex RT555 note 9 uses 20 mph)
const chartArea=(outr,area)=>outr==='ret'?'side':area;   // retracted beams: one 360° chart
const TBL={};
function table(units,outr,area){
  area=chartArea(outr,area); const key=units+outr+area; if(TBL[key])return TBL[key];
  const C=CH[units], cap=[], sh=[];
  C.radii.forEach((r,i)=>{cap[i]=[];sh[i]=[];
    C.booms.forEach((b,j)=>{
      const Rft=r*C.toFt, Lft=b*C.toFt, q=r/b;
      if(q<RMIN-1e-9||q>RMAX+1e-9){cap[i][j]=null;sh[i][j]=false;return;}
      const st=.85*wtipLb(Rft,Lft,outr,area), s=csLb(Lft,Rft);
      let v=Math.min(st,s,M.cmax); if(units==='met')v*=LB;
      v=Math.floor(v/C.step+1e-9)*C.step;
      cap[i][j]=v<C.min?null:v; sh[i][j]=s<st;});});
  return TBL[key]={booms:C.booms,radii:C.radii,cap,sh,area,outr};
}
/* Between listed values use the SMALLER rating (Terex RT555 operation note 2): on this chart that is the next longer
   boom and the next greater radius. Off the chart (blank or past the last row) = no capacity: do not lift. */
function lookup(units,outr,area,L,R){
  const t=table(units,outr,area);
  const bi=t.booms.findIndex(b=>b>=L-1e-6); if(bi<0)return {off:'boom',t};
  const ri=t.radii.findIndex(r=>r>=R-1e-6); if(ri<0)return {off:'radius',bi,t};
  const cap=t.cap[ri][bi]; if(cap==null)return {off:'blank',bi,ri,t};
  return {bi,ri,cap,shaded:t.sh[ri][bi],t};
}
function maxRadius(units,outr,area,bi){const t=table(units,outr,area);let m=0;t.radii.forEach((r,i)=>{if(t.cap[i][bi]!=null)m=r;});return m;}

/* ---------- signals (wording paraphrased from OSHA 1926 Subpart CC Appendix A). Canadian charts differ on some signals:
   IHSA (Ontario) and WorkSafeBC TG 07-29 show ONE stop (one arm, palm down, hand moved back and forth) and no separate
   emergency stop; CCOHS shows stop = one arm held still, emergency stop = one arm, hand moved rapidly side to side.
   Dog everything (hands clasped in front) is the same in all four. ---------- */
const SIG={
  none:{n:'Ready',d:'Signaller in clear view of the operator, arms at the sides.',r:'Crane waits.'},
  hoist:{n:'Hoist',d:'Forearm vertical, index finger pointing up, small horizontal circles.',r:'Hoist line up: the load rises.'},
  lower:{n:'Lower',d:'Arm extended down, index finger pointing down, small horizontal circles.',r:'Hoist line down: the load lowers.'},
  main:{n:'Use main hoist',d:'Tap a fist on top of the head, then give the regular signals.',r:'Operator selects the main hoist line.'},
  whip:{n:'Use whipline (auxiliary hoist)',d:'Tap the elbow with the other hand, then give the regular signals.',r:'Operator selects the whipline (ball).'},
  boomUp:{n:'Raise boom',d:'Arm extended, fingers closed, thumb pointing up.',r:'Boom angle up: the radius gets shorter.'},
  boomDown:{n:'Lower boom',d:'Arm extended, fingers closed, thumb pointing down.',r:'Boom angle down: the radius gets longer.'},
  slow:{n:'Move slowly',d:'One hand gives the motion signal; the other hand is held still in front of it.',r:'Hoist, slowly.'},
  boomUpLowerLoad:{n:'Raise the boom and lower the load',d:'Arm extended, thumb up, fingers open and close while the load moves.',r:'Boom up, line down: the load comes in at the same height.'},
  boomDownRaiseLoad:{n:'Lower the boom and raise the load',d:'Arm extended, thumb down, fingers open and close while the load moves.',r:'Boom down, line up: the load goes out at the same height.'},
  swingL:{n:'Swing',d:'Arm extended, index finger pointing the way the boom is to swing.',r:'The house swings toward the pointed side.'},
  swingR:{n:'Swing',d:'Arm extended, index finger pointing the way the boom is to swing.',r:'The house swings toward the pointed side.'},
  stop:{n:'Stop',d:'Arm extended, palm down, arm swung back and forth level.',r:'Every motion stops.'},
  estop:{n:'Emergency stop',d:'Both arms extended, palms down, swung back and forth level.',r:'Every motion stops at once.'},
  dog:{n:'Dog everything',d:'Hands clasped in front of the body at the waist.',r:'All motions stopped and the brakes set.'},
  extend:{n:'Extend boom (telescoping)',d:'Both fists in front of the body, thumbs pointing outward.',r:'Boom telescopes out: longer boom, longer radius.'},
  retract:{n:'Retract boom (telescoping)',d:'Both fists in front of the body, thumbs pointing toward each other.',r:'Boom telescopes in: shorter boom, shorter radius.'}};
// target speeds per signal: hook (ft/s), boom angle (deg/s), swing (deg/s), telescope (ft/s)
const RATE={hook:1.5,ang:3,slew:8,tel:1.5};

const S={mode:'chart',units:'imp',outr:'full',area:'side',boom:64,radius:30,load:8000,hook:650,rigging:150,ball:true,jib:'stowed',
  lift:0,signal:'none',quiz:false,slew:0,line:'main',tandem:false,boomB:64,radiusB:25,span:30,cgA:15,wind:8,personnel:false,power:false};
S.fail=!CAPTURE;
const NUMERIC=['boom','radius','load','hook','rigging','lift','slew','boomB','radiusB','span','cgA','wind'];
const LENS=['boom','radius','lift','boomB','radiusB','span','cgA'], WTS=['load','hook','rigging'];
const toFt=v=>S.units==='imp'?v:v/FT, toLb=v=>S.units==='imp'?v:v/LB;
const fromFt=v=>S.units==='imp'?v:v*FT;

/* =====================================================================
   PHYSICS: every number on screen comes from calc().
     Gross load = net load + hook block + rigging + whip ball + jib deduction.
     Boom deflection (made-up stiffness): with the load clear of the ground the tip moves out by
        Δ = gross × cos θ × sin θ × L³ ÷ 3EI   (3EI = 1.43 × 10⁹ lb·ft²) → loaded radius = R + Δ.
     Chart capacity at the LOADED radius (Terex RT555 definition 1: radius is measured with the load applied).
     % of chart = gross ÷ chart capacity.  Tipping load and boom strength from the model above (at the loaded radius).
   LIFT PLAN (WorkSafeBC OHS Regulation s.14.1 "critical lift"; Alberta OHS Code s.68.1):
     single crane: over 90 % of the chart AND loaded radius more than half the chart's maximum radius → critical
     tandem: either crane over 75 % of its chart → critical. Work platform with people, or over/between energized
     conductors → critical. Over 75 % → Alberta wants a written lift calculation. Over 100 %, off chart, or wind past
     the chart's limit → do not lift.
   ===================================================================== */
function geomFt(st,Lu,Ru){            // boom length and radius (current units) → ft, angle
  const L=toFt(Lu), R=toFt(Ru), th=Math.acos(clamp(R/L,-1,1));
  return {L,R,th};
}
function crane1(st,Lu,Ru,share,susp,useDefl){
  const imp=st.units==='imp', g=geomFt(st,Lu,Ru);
  const ded=DED[st.units], parts={load:share,hook:st.hook,rig:st.rigging,ball:st.ball?ded.ball:0,jib:ded.jib[st.jib]};
  const gross=parts.load+parts.hook+parts.rig+parts.ball+parts.jib, grossLb=toLb(gross);
  const deflFt=useDefl?susp*grossLb*Math.cos(g.th)*Math.sin(g.th)*Math.pow(g.L,3)/M.K3EI:0;
  const R1ft=g.R+deflFt, R1=fromFt(R1ft);
  const tipHft=M.hf+Math.sqrt(Math.max(0,g.L*g.L-R1ft*R1ft));
  const th1=Math.atan2(tipHft-M.hf,R1ft);
  const lk=lookup(st.units,st.outr,st.area,Lu,R1);
  const cap=lk.off?0:lk.cap, pct=cap>0?gross/cap:Infinity;
  const wtipU=wtipLb(R1ft,g.L,st.outr,st.area)*(imp?1:LB), csU=csLb(g.L,R1ft)*(imp?1:LB), brk=csU*M.SF;
  const cfgA=chartArea(st.outr,st.area);
  const mr=lk.bi!=null?maxRadius(st.units,st.outr,cfgA,lk.bi):0;
  let failKind=null;
  if(susp>=1){const a=gross/wtipU, b=gross/brk; if(wtipU<=0||a>1||b>1)failKind=(wtipU<=0||a>=b)?'tip':'boom';}
  return {Lu,R0:Ru,th0:g.th/D2R,Lft:g.L,R0ft:g.R,parts,gross,deflFt,defl:fromFt(deflFt),R1,R1ft,tipHft,th1:th1/D2R,lk,cap,pct,
    wtip:wtipU,cs:csU,brk,tipPct:wtipU>0?gross/wtipU:Infinity,failKind,maxRad:mr,f:fulc(st.outr,st.area).f};
}
function calc(st=S){
  const imp=st.units==='imp';
  const susp=clamp(st.lift/(imp?.5:.15),0,1);
  const c={imp,units:st.units,mode:st.mode,susp,lift:st.lift};
  if(st.mode==='plan'&&st.tandem){
    const a=st.span>0?clamp(st.cgA,0,st.span):0, sA=st.span>0?st.load*(st.span-a)/st.span:st.load/2, sB=st.load-sA;
    c.tandem=true; c.a=a; c.b=st.span-a; c.shareA=sA; c.shareB=sB;
    c.A=crane1(st,st.boom,st.radius,sA,susp,false); c.B=crane1(st,st.boomB,st.radiusB,sB,susp,false);
    Object.assign(c,{gross:c.A.gross+c.B.gross,pct:Math.max(c.A.pct,c.B.pct)});
    c.main=c.A.pct>=c.B.pct?c.A:c.B;
  } else {
    c.tandem=false; c.A=crane1(st,st.boom,st.radius,st.load,susp,true); c.main=c.A;
    Object.assign(c,{gross:c.A.gross,pct:c.A.pct});
  }
  const m=c.main;
  c.off=!!(c.A.lk.off||(c.B&&c.B.lk.off));
  c.level=c.off||c.pct>1?'bad':c.pct>=.9?'warn':'ok';
  // two-block limit (ft): block top 2 ft under the head sheave; block 3 ft, hook 1.2 ft, slings 5 ft, load 4 ft
  c.maxLiftFt=Math.max(0,c.A.tipHft-15.2-(c.B?0:0)); if(c.B)c.maxLiftFt=Math.min(c.maxLiftFt,c.B.tipHft-15.2);
  // lift plan criteria
  const P={};
  P.windLimit=WIND_LIMIT[st.units]; P.windOver=st.wind>P.windLimit+1e-9;
  P.over75=c.A.pct>.75||(c.B&&c.B.pct>.75);
  P.crit90=!c.tandem&&m.pct>.9&&m.R1>.5*m.maxRad;
  P.critTandem=c.tandem&&(c.A.pct>.75||c.B.pct>.75);
  P.critical=P.crit90||P.critTandem||st.personnel||st.power;
  P.stop=c.off||c.pct>1||P.windOver;
  P.verdict=P.stop?'stop':P.critical?'critical':'routine';
  c.plan=P;
  // in the lift plan the readout and formula colours follow the verdict: red do not lift, yellow critical (never orange)
  if(st.mode==='plan'&&c.level!=='bad')c.level=P.verdict==='stop'?'bad':P.verdict==='critical'?'warn':c.level;
  c.failKind=null; c.failCrane=null;
  {
    if(c.A.failKind){c.failKind=c.A.failKind;c.failCrane='A';}
    else if(c.B&&c.B.failKind){c.failKind=c.B.failKind;c.failCrane='B';}
  }
  return c;
}

/* ---------- formatting ---------- */
const nf=(v,d=0)=>(+v).toLocaleString('en-CA',{minimumFractionDigits:d,maximumFractionDigits:d});
const wu=()=>S.units==='imp'?'lb':'kg', lu=()=>S.units==='imp'?'ft':'m';
const wt=v=>isFinite(v)?nf(Math.round(v))+' '+wu():'—';
const len=(v,d)=>nf(v,d==null?(S.units==='imp'?1:2):d)+' '+lu();
const lenC=v=>S.units==='imp'?nf(v,0)+' ft':nf(v,v<10&&v%1?2:1).replace(/\.0$/,'')+' m';     // chart headings
// lengths inside shown arithmetic: as many decimals as the value has (max 2), so the printed sum is the one computed
const mlen=v=>{const r=Math.round(v*100)/100, d=Math.abs(r-Math.round(r))<1e-6?0:Math.abs(r*10-Math.round(r*10))<1e-6?1:2; return nf(r,d);};
const pct=v=>isFinite(v)?nf(v*100,1)+' %':'—';
const wind=v=>nf(v,0)+(S.units==='imp'?' mph':' km/h');
const sp=(col,t)=>`<span style="color:${col}">${t}</span>`;
const tsp=(col,t)=>`<tspan fill="${col}">${t}</tspan>`;
const levelCol=l=>l==='bad'?BAD:l==='warn'?WARN:OK;

/* ---------- animation state (virtual clock only) ---------- */
let T=0,tweens=[],callouts=[];
const A={vHook:0,vAng:0,vSlew:0,vTel:0,ballDrop:14,dogged:false,sway:0,swayV:0,windX:0,lastSig:'none',sigT:0,flow:0};
let F={on:false,t:0};

/* ---------- drawing helpers ---------- */
function arrow(id,x1,y1,x2,y2,col,w=6){
  const a=Math.atan2(y2-y1,x2-x1),h=16;
  return `<g id="${id}"><line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${(x2-Math.cos(a)*h*.6).toFixed(1)}" y2="${(y2-Math.sin(a)*h*.6).toFixed(1)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>
  <polygon points="${x2.toFixed(1)},${y2.toFixed(1)} ${(x2-h*Math.cos(a-.42)).toFixed(1)},${(y2-h*Math.sin(a-.42)).toFixed(1)} ${(x2-h*Math.cos(a+.42)).toFixed(1)},${(y2-h*Math.sin(a+.42)).toFixed(1)}" fill="${col}"/></g>`;
}
function pill(id,x,y,text,col,fs=18,anchor='middle'){
  const w=text.length*fs*.58+20, x0=anchor==='start'?x:anchor==='end'?x-w:x-w/2;
  return `<g id="${id}"><rect x="${x0.toFixed(1)}" y="${(y-fs*.9).toFixed(1)}" width="${w.toFixed(1)}" height="${fs*1.8}" rx="${fs*.9}" fill="#1F1D1A" stroke="${col}" stroke-width="2.5"/>
  <text x="${(x0+w/2).toFixed(1)}" y="${(y+fs*.36).toFixed(1)}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${col}">${text}</text></g>`;
}
function card(id,x,y,w,h,title,sub){
  return `<g id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#26231F" stroke="#45403A" stroke-width="2"/>
  <text x="${x+16}" y="${y+26}" font-size="15" font-weight="800" fill="${MUTED}" letter-spacing="1.2">${title}</text>${sub?`<text x="${x+16}" y="${y+48}" font-size="15" font-weight="700" fill="${TEXT}">${sub}</text>`:''}`;
}
const poly=(pts)=>pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');

/* ---------- the crane (side view). World ft: x toward the load (dir), y up. ---------- */
function craneSVG(o){
  // o: {cx,gy,s,dir,outr,area,L,R1,tipH,R0,ghost,jib,ball,ballDrop,lift(ft),loadLabel,p (id prefix),tilt(deg),buckle(0..1),loadDrop(ft),slack,showFul}
  const X=x=>o.cx+o.dir*x*o.s, Y=y=>o.gy-y*o.s, s=o.s, p=o.p||'';
  const {f}=fulc(o.outr,o.area);
  let body='';
  // ---- carrier
  const up=.35;                                   // tyres lifted on outriggers
  if(o.area==='side'){
    const fs=o.outr==='ret'?4:11;
    body+=`<rect x="${Math.min(X(-4),X(4))}" y="${Y(6.4)}" width="${8*s}" height="${2.8*s}" fill="#3A3631" stroke="#5a534b" stroke-width="2"/>`;
    [-3.1,3.1].forEach(x=>body+=`<rect x="${Math.min(X(x-1.1),X(x+1.1))}" y="${Y(3.6+up)}" width="${2.2*s}" height="${3.6*s}" rx="${.5*s}" fill="#151311" stroke="#3a3631" stroke-width="2"/>`);
    // outrigger beams + jacks + floats + mats; load-side float = fulcrum
    body+=`<rect x="${Math.min(X(-fs),X(fs))}" y="${Y(5.2)}" width="${2*fs*s}" height="${1*s}" fill="#C05A00" stroke="#7a3a00" stroke-width="1.5"/>`;
    [-fs,fs].forEach((x,i)=>{body+=`<g id="${p}${i?'fulcrum':'outrigger-far'}"><rect x="${X(x)-.45*s}" y="${Y(5.2)}" width="${.9*s}" height="${4.6*s}" fill="#7a7068"/>
      <rect x="${X(x)-1.1*s}" y="${Y(.75)}" width="${2.2*s}" height="${.45*s}" fill="#9a9086"/><rect x="${X(x)-2.1*s}" y="${Y(.3)}" width="${4.2*s}" height="${.3*s}" fill="#6b4f2f"/></g>`;});
  } else {
    body+=`<rect x="${Math.min(X(-22),X(12))}" y="${Y(6.2)}" width="${34*s}" height="${2.6*s}" fill="#3A3631" stroke="#5a534b" stroke-width="2"/>
      <path d="M${X(8)} ${Y(6.2)} L${X(8)} ${Y(10)} L${X(11.8)} ${Y(10)} L${X(13)} ${Y(7)} L${X(13)} ${Y(6.2)} Z" fill="#C05A00" stroke="#7a3a00" stroke-width="2"/>
      <rect x="${Math.min(X(9),X(11.4))}" y="${Y(9.5)}" width="${2.4*s}" height="${1.8*s}" fill="#2b4a5a"/>`;
    [-16,-12.2,10].forEach(x=>body+=`<circle cx="${X(x)}" cy="${Y(1.9+up)}" r="${1.9*s}" fill="#151311" stroke="#3a3631" stroke-width="3"/><circle cx="${X(x)}" cy="${Y(1.9+up)}" r="${.8*s}" fill="#5d5750"/>`);
    [-18,7].forEach((x,i)=>{body+=`<g id="${p}${i?'fulcrum':'outrigger-far'}"><rect x="${X(x)-.8*s}" y="${Y(6.4)}" width="${1.6*s}" height="${1.4*s}" fill="#C05A00"/><rect x="${X(x)-.45*s}" y="${Y(5.2)}" width="${.9*s}" height="${4.6*s}" fill="#7a7068"/>
      <rect x="${X(x)-1.1*s}" y="${Y(.75)}" width="${2.2*s}" height="${.45*s}" fill="#9a9086"/><rect x="${X(x)-2.1*s}" y="${Y(.3)}" width="${4.2*s}" height="${.3*s}" fill="#6b4f2f"/></g>`;});
  }
  // ---- upperstructure: house, counterweight (behind), operator cab
  body+=`<g id="${p}house"><rect x="${Math.min(X(-6),X(3.5))}" y="${Y(11.4)}" width="${9.5*s}" height="${3.2*s}" fill="#C05A00" stroke="#7a3a00" stroke-width="2"/>
    <rect x="${Math.min(X(-8.6),X(-5.2))}" y="${Y(11)}" width="${3.4*s}" height="${4*s}" rx="${.4*s}" fill="#4D4842" stroke="#2f2b27" stroke-width="2"/>

    if(d<=kink||!beta){return [X(d*Math.cos(phi)-off*Math.sin(phi)),Y(M.hf+d*Math.sin(phi)+off*Math.cos(phi))];}
    const kx=kink*Math.cos(phi), ky=M.hf+kink*Math.sin(phi), a2=phi-beta, e=d-kink;
    return [X(kx+e*Math.cos(a2)-off*Math.sin(a2)),Y(ky+e*Math.sin(a2)+off*Math.cos(a2))];

  }

  body+=`<line x1="${X(1.8)}" y1="${Y(7.4)}" x2="${cyl[0].toFixed(1)}" y2="${cyl[1].toFixed(1)}" stroke="#d9d3c7" stroke-width="${.7*s}" stroke-linecap="round"/>`;
  // sections: base 32 ft then three equal fly sections
  const secs=[[0,32,1.35],[32-3,32+(o.L-32)/3,1.15],[32+(o.L-32)/3-3,32+2*(o.L-32)/3,.98],[32+2*(o.L-32)/3-3,o.L,.82]];
  let boom='';
  const lenScale=Lv/o.L;
  secs.forEach(([a,b,hw],i)=>{
    a*=lenScale;b*=lenScale; if(b-a<.5)return;
    const segs=[];
    if(beta&&a<kink&&b>kink){segs.push([a,kink]);segs.push([kink,b]);} else segs.push([a,b]);
    segs.forEach(([u,v])=>{const pts=[along(u,hw),along(v,hw),along(v,-hw),along(u,-hw)];
      boom+=`<polygon points="${poly(pts)}" fill="${i?'#d9822b':'#C05A00'}" stroke="#7a3a00" stroke-width="2"/>`;});
  });
  const tip=along(Lv);
  boom+=`<circle cx="${along(0)[0]}" cy="${along(0)[1]}" r="${.9*s}" fill="#2f2b27" stroke="${STEEL}" stroke-width="2"/>`;
  boom+=`<circle id="${p}head-sheave" cx="${tip[0].toFixed(1)}" cy="${tip[1].toFixed(1)}" r="${1.25*s}" fill="#2F2B27" stroke="${STEEL}" stroke-width="2.5"/>`;
  let jib='';
  if(o.jib==='stowed'){const a=along(5*lenScale,-1.9), b=along(29*lenScale,-1.9), a2=along(5*lenScale,-2.9), b2=along(29*lenScale,-2.9);
    jib=`<g id="${p}jib"><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${COL.jib}" stroke-width="3"/><line x1="${a2[0]}" y1="${a2[1]}" x2="${b2[0]}" y2="${b2[1]}" stroke="${COL.jib}" stroke-width="3"/>`;
    for(let k=0;k<8;k++){const u=along((5+k*3)*lenScale,-1.9), v=along((6.5+k*3)*lenScale,-2.9);jib+=`<line x1="${u[0].toFixed(1)}" y1="${u[1].toFixed(1)}" x2="${v[0].toFixed(1)}" y2="${v[1].toFixed(1)}" stroke="${COL.jib}" stroke-width="2"/>`;}
    jib+=`</g>`;}
  if(o.jib==='erected'&&!o.buckle){const ja=phi-15*D2R, jl=28, tx=Math.cos(phi)*Lv, ty=M.hf+Math.sin(phi)*Lv;
    const P=(d,off)=>[X(tx+d*Math.cos(ja)-off*Math.sin(ja)),Y(ty+d*Math.sin(ja)+off*Math.cos(ja))];
    jib=`<g id="${p}jib"><polygon points="${poly([P(0,.6),P(jl,.25),P(jl,-.25),P(0,-.6)])}" fill="none" stroke="${COL.jib}" stroke-width="3"/>`;
    for(let k=0;k<9;k++){const u=P(k*3,.5),v=P(k*3+1.5,-.5);jib+=`<line x1="${u[0].toFixed(1)}" y1="${u[1].toFixed(1)}" x2="${v[0].toFixed(1)}" y2="${v[1].toFixed(1)}" stroke="${COL.jib}" stroke-width="2"/>`;}
    jib+=`</g>`;}
  body+=`<g id="${p}boom">${boom}</g>${jib}`;
  // ---- wrap the machine in the tipping rotation
  const fpx=X(f), tilt=(o.tilt||0)*o.dir;
  let out=`<g id="${p}crane" transform="rotate(${tilt.toFixed(2)} ${fpx.toFixed(1)} ${o.gy})">${body}</g>`;
  // rotated tip position (screen)
  const rot=(x,y)=>{const a=tilt*D2R,dx=x-fpx,dy=y-o.gy;return [fpx+dx*Math.cos(a)-dy*Math.sin(a),o.gy+dx*Math.sin(a)+dy*Math.cos(a)];};
  const tp=rot(tip[0],tip[1]);

  const bTop=Y(blkT), bBot=Y(blkB);
  let hang='';
  const ropeTo=o.slack?`M${tp[0].toFixed(1)} ${tp[1].toFixed(1)} Q${((tp[0]+lx)/2+20).toFixed(1)} ${(Math.max(tp[1],bTop)+40).toFixed(1)} ${lx.toFixed(1)} ${bTop.toFixed(1)}`
                     :`M${tp[0].toFixed(1)} ${tp[1].toFixed(1)} L${lx.toFixed(1)} ${bTop.toFixed(1)}`;
  const nParts=3;
  for(let k=0;k<nParts;k++){const dx=(k-1)*.45*s;
    hang+=`<path d="${ropeTo.replace(/L([\d.]+) /,(m,x)=>'L'+(+x+dx).toFixed(1)+' ')}" stroke="#9aa7b1" stroke-width="2.2" fill="none"/>`;
    hang+=`<path d="${ropeTo.replace(/L([\d.]+) /,(m,x)=>'L'+(+x+dx).toFixed(1)+' ')}" stroke="#d6dde2" stroke-width="1" fill="none" stroke-dasharray="5 5" stroke-dashoffset="${(A.flow*(k%2?1:-1)).toFixed(1)}"/>`;}
  hang+=`<g id="${p}hook-block"><rect x="${(lx-1.4*s).toFixed(1)}" y="${bTop.toFixed(1)}" width="${2.8*s}" height="${3*s}" rx="${.5*s}" fill="#3A3631" stroke="${COL.hook}" stroke-width="2.5"/>
    <circle cx="${lx.toFixed(1)}" cy="${(bTop+1.2*s).toFixed(1)}" r="${.8*s}" fill="none" stroke="${STEEL}" stroke-width="2"/>
    <path d="M${lx.toFixed(1)} ${bBot.toFixed(1)} l0 ${(.5*s).toFixed(1)} c0 ${(.8*s).toFixed(1)} ${(.9*s).toFixed(1)} ${(.8*s).toFixed(1)} ${(.8*s).toFixed(1)} ${(.2*s).toFixed(1)}" stroke="${STEEL}" stroke-width="${Math.max(3,.35*s)}" fill="none"/></g>`;
  const ly0=Y(loadTop), lyB=Y(liftFt), hk=Y(hookY);
  hang+=`<g id="${p}slings"><line x1="${lx}" y1="${hk}" x2="${lx-3.6*s}" y2="${ly0}" stroke="${COL.rig}" stroke-width="3"/><line x1="${lx}" y1="${hk}" x2="${lx+3.6*s}" y2="${ly0}" stroke="${COL.rig}" stroke-width="3"/></g>`;
  hang+=`<ellipse cx="${lx}" cy="${o.gy+3}" rx="${(4.5-Math.min(3,liftFt*.12))*s}" ry="4" fill="#000" opacity="${clamp(.45-liftFt*.02,.1,.45)}"/>`;
  hang+=`<g id="${p}load"><rect x="${(lx-4*s).toFixed(1)}" y="${ly0.toFixed(1)}" width="${8*s}" height="${4*s}" rx="3" fill="#4D4842" stroke="#7A7268" stroke-width="2"/>
    <rect x="${(lx-4*s).toFixed(1)}" y="${ly0.toFixed(1)}" width="${8*s}" height="${.5*s}" fill="#5d5750"/>
    ${o.loadLabel?`<text x="${lx}" y="${(lyB-1.4*s).toFixed(1)}" text-anchor="middle" font-size="${clamp(1.45*s,11,22)}" font-weight="800" fill="${COL.W}">${o.loadLabel}</text>`:''}</g>`;
  if(o.ball){const bt=rot(along(Lv+.9)[0],along(Lv+.9)[1]), bd=o.ballDrop||12, by=Math.min(tp[1]+bd*s,o.gy-1*s);
    hang+=`<g id="${p}ball"><line x1="${bt[0].toFixed(1)}" y1="${bt[1].toFixed(1)}" x2="${(bt[0]+2*s+sway*s).toFixed(1)}" y2="${by.toFixed(1)}" stroke="#9aa7b1" stroke-width="2"/>
      <circle cx="${(bt[0]+2*s+sway*s).toFixed(1)}" cy="${(by+.9*s).toFixed(1)}" r="${.9*s}" fill="${COL.ball}" stroke="#1F1D1A" stroke-width="2"/></g>`;}
  out+=hang;
  return {svg:out,tip:tp,lx,X,Y,fpx,phi,Lv,loadY:ly0,hookY:hk};
}

function updateFail(c,ms){

// deterministic offsets for this frame (pure functions of F.t)
function failAnim(o){                       // o: crane geometry {R1,tipH,f}
  if(!F.on)return {tilt:0,buckle:0,drop:0,slack:false,land:-1,crash:-1};
  const t=F.t/1000;
  const drop=Math.min(F.lift,.5*32.2*Math.max(0,t-.25)**2), land=F.lift>0?(t-.25-Math.sqrt(2*F.lift/32.2)):t-.25;
  if(F.kind==='tip'){
    const phiHit=Math.atan2(o.tipH,o.R1-o.f)/D2R, pmax=Math.min(phiHit,62), T1=1.9;
    const tilt=t<T1?pmax*(t/T1)**2:pmax-Math.exp(-(t-T1)/.12)*1.6*Math.abs(Math.sin((t-T1)*22));
    return {tilt:Math.max(0,tilt),buckle:0,drop,slack:true,land,crash:t-T1};
  }
  const T1=1.2, u=t<T1?(t/T1)**2:1-Math.exp(-(t-T1)/.1)*.05*Math.abs(Math.sin((t-T1)*25));
  return {tilt:0,buckle:t<.15?0:clamp(u,0,1),drop,slack:t>.15,land,crash:t-T1};
}

    const x0=x+(r1-.5)*span, vx=(x0-x)/Math.max(1,span/2)*220+(r2-.5)*140, vy=-(50+r3*200), f=(1-Math.exp(-u/.45))*.45;
    const px=x0+vx*f, py=y-4+vy*f+50*u*u, rr=5+u*(12+20*r2), op=.5*(1-u/1.8);

// two-link arm by inverse kinematics: shoulder S, wrist target W, bend side +1/-1

  let dx=wx-sx,dy=wy-sy,d=Math.hypot(dx,dy); const dm=l1+l2-.5; if(d>dm){wx=sx+dx/d*dm;wy=sy+dy/d*dm;dx=wx-sx;dy=wy-sy;d=dm;}

function hand(x,y,dir,kind,id,t){

  const k=matchMedia('(max-width:1000px)').matches?2.2:1.5;

  s+=`<circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="${13*k}" fill="${G}" stroke="${E}" stroke-width="${2*k}"/>`;
  const dig=(ang,l,w)=>{l*=k;w*=k;const x2=(hx+Math.cos(ang)*l).toFixed(1), y2=(hy+Math.sin(ang)*l).toFixed(1);
    return `<line x1="${hx.toFixed(1)}" y1="${hy.toFixed(1)}" x2="${x2}" y2="${y2}" stroke="${E}" stroke-width="${w+2*k}" stroke-linecap="round"/><line x1="${hx.toFixed(1)}" y1="${hy.toFixed(1)}" x2="${x2}" y2="${y2}" stroke="${G}" stroke-width="${w}" stroke-linecap="round"/>`;};
  if(kind==='point')s+=dig(dir,30,8);

      const pos=co.pos||(r.left>vw*0.55?'left':'right'); let x,y;
      const inPanel=$('panel').contains(el)&&innerWidth>1000, edge=inPanel?$('panel').getBoundingClientRect().left:r.left;
      if(pos==='left'){x=edge-pad-lw-18-slide;y=r.top+r.height/2-lh/2}
      else if(pos==='right'){x=r.right+pad+18+slide;y=r.top+r.height/2-lh/2}
      else if(pos==='top'){x=r.left+r.width/2-lw/2;y=r.top-pad-lh-18-slide}
      else {x=r.left+r.width/2-lw/2;y=r.bottom+pad+18+slide}
      lb.style.left=clamp(x,12,vw-lw-12)+'px'; lb.style.top=clamp(y,12,vh-lh-12)+'px';}
  });
}

/* ---------- limits ---------- */
function limits(){
  S.boom=clamp(S.boom,RANGES[S.units].boom[0],RANGES[S.units].boom[1]); S.boomB=clamp(S.boomB,RANGES[S.units].boom[0],RANGES[S.units].boom[1]);
  S.radius=clamp(S.radius,S.boom*RMIN,S.boom*RMAX); S.radiusB=clamp(S.radiusB,S.boomB*RMIN,S.boomB*RMAX);
  ['load','hook','rigging','wind'].forEach(k=>S[k]=Math.max(0,S[k])); S.span=Math.max(RANGES[S.units].span[0]*.5,S.span); S.cgA=clamp(S.cgA,0,S.span);
  const c=calc(); S.lift=clamp(S.lift,0,fromFt(c.maxLiftFt));
}

/* ---------- virtual clock: ALL motion advances here ---------- */
function signalStep(ms){
  const dt=ms/1000, sig=S.signal; A.sigT+=ms;
  if(sig!==A.lastSig){A.lastSig=sig; if(sig==='main')S.line='main'; if(sig==='whip')S.line='whip'; A.dogged=sig==='dog';}
  let tH=0,tA=0,tS=0,tT=0;
  const k={hoist:1,lower:-1,slow:.3}[sig]; if(k)tH=k*RATE.hook;
  if(sig==='boomUp'||sig==='boomUpLowerLoad')tA=RATE.ang; if(sig==='boomDown'||sig==='boomDownRaiseLoad')tA=-RATE.ang;
  if(sig==='swingL')tS=RATE.slew; if(sig==='swingR')tS=-RATE.slew; if(sig==='extend')tT=RATE.tel; if(sig==='retract')tT=-RATE.tel;
  if(F.on){tH=tA=tS=tT=0;}
  const tau=F.on||sig==='estop'||sig==='dog'?.06:sig==='stop'?.45:.35, kf=1-Math.exp(-dt/tau);
  A.vHook+=(tH-A.vHook)*kf; A.vAng+=(tA-A.vAng)*kf; A.vSlew+=(tS-A.vSlew)*kf; A.vTel+=(tT-A.vTel)*kf;
  // apply (lengths in ft internally)
  const L=toFt(S.boom); let th=Math.acos(clamp(toFt(S.radius)/L,-1,1));
  const tipH0=M.hf+L*Math.sin(th);
  th=clamp(th+A.vAng*D2R*dt,ANG_MIN*D2R,ANG_MAX*D2R);
  let L2=clamp(L+A.vTel*dt,toFt(RANGES[S.units].boom[0]),toFt(RANGES[S.units].boom[1]));
  S.boom=fromFt(L2); S.radius=fromFt(L2*Math.cos(th));
  const tipH1=M.hf+L2*Math.sin(th);
  let dh=A.vHook*dt;
  if(sig==='boomUpLowerLoad'||sig==='boomDownRaiseLoad')dh=-(tipH1-tipH0)*Math.min(1,Math.abs(A.vAng)/RATE.ang);  // load holds its height
  if(S.line==='whip'&&sig!=='boomUpLowerLoad'&&sig!=='boomDownRaiseLoad')A.ballDrop=clamp(A.ballDrop-dh,4,40);
  else S.lift=S.lift+fromFt(dh);
  S.slew=S.slew+A.vSlew*dt;
}
function step(ms){
  const dt=ms/1000; T+=ms;
  tweens.forEach(t=>{t.t=Math.min(t.dur,t.t+ms);S[t.key]=t.from+(t.to-t.from)*ease(t.t/t.dur);});
  tweens=tweens.filter(t=>t.t<t.dur);
  if(S.mode==='signals')signalStep(ms); else {A.vHook=A.vAng=A.vSlew=A.vTel=0;}
  limits();
  const c=calc();
  updateFail(c,ms);
  A.flow+=dt*30*(1+Math.abs(A.vHook)*3); A.windX+=ms/1000*60;
  // load sway (pendulum) driven by the wind in plan mode
  const mph=S.mode==='plan'?(S.units==='imp'?S.wind:S.wind/KMH):0, target=.0035*mph*mph;
  if(ms>0&&ms<200){const sub=Math.ceil(ms/8),h=dt/sub;for(let i=0;i<sub;i++){const gust=target*(1+.25*Math.sin(T/700+i*.01));const acc=2.2*(gust-A.sway)-0.5*A.swayV;A.swayV+=acc*h;A.sway+=A.swayV*h;}}
  else if(ms>=200){A.sway=target;A.swayV=0;}
  return c;
}
function frame(ms){
  const c=step(ms);
  draw(c); panel(c);
  const f=formula(c); $('f1').innerHTML=f[0]; $('f2').innerHTML=f[1];
  callouts.forEach(co=>co.age+=ms);
  renderCallouts();
}
function set(p,dur=0){
  p={...p};
  if(p.units&&p.units!==S.units){
    const toMet=p.units==='met', fw=toMet?LB:1/LB, fl=toMet?FT:1/FT, fv=toMet?KMH:1/KMH;
    tweens=tweens.filter(t=>![...LENS,...WTS,'wind'].includes(t.key));
    LENS.forEach(k=>{if(!(k in p))S[k]*=fl;}); WTS.forEach(k=>{if(!(k in p))S[k]*=fw;}); if(!('wind' in p))S.wind*=fv;
    S.units=p.units; delete p.units;
  }
  const snap=p.snap; delete p.snap;
  if('angle' in p){const L=('boom' in p)?p.boom:S.boom; p.radius=L*Math.cos(p.angle*D2R); delete p.angle;}
  if('mode' in p&&p.mode!==S.mode){A.vHook=A.vAng=A.vSlew=A.vTel=0;A.dogged=false;}
  for(const [k,v] of Object.entries(p)){
    tweens=tweens.filter(t=>t.key!==k);
    if(NUMERIC.includes(k)&&dur>0)tweens.push({key:k,from:S[k],to:v,t:0,dur});
    else S[k]=v;
  }
  if('signal' in p){A.sigT=0;}
  if(snap){A.vHook=A.vAng=A.vSlew=A.vTel=0;A.ballDrop=14;A.sway=0;A.swayV=0;A.lastSig=S.signal;A.dogged=S.signal==='dog';S.line=S.signal==='whip'?'whip':'main';}
  if(snap||'mode' in p||p.fail===false)F={on:false,t:0};
  if(!dur)limits();
  if(!CAPTURE)frame(0);
}
function callout(target,text,opts={}){callouts=callouts.filter(c=>c.target!==target);callouts.push({target,text,pos:opts&&opts.pos,age:0});if(!CAPTURE)frame(0);}
function clear(){callouts=[];if(!CAPTURE)frame(0);}

/* ---------- user controls ---------- */
document.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const v=b.dataset.v;
  ({'c-mode':()=>set({mode:v,lift:v==='signals'?fromFt(4):S.lift}),'c-units':()=>set({units:v}),'c-outr':()=>set({outr:v}),'c-area':()=>set({area:v}),
    'c-ball':()=>set({ball:v==='1'}),'c-jib':()=>set({jib:v}),'c-tandem':()=>set({tandem:v==='1'}),
    'c-flags':()=>set({[v]:!S[v]}),'c-signal':()=>set({signal:v}),'c-quiz':()=>set({quiz:v==='1'}),
    'c-lift':()=>{const to=v==='up'?fromFt(4):0;set({lift:to},2500);}})[seg.id]?.();
}));
['boom','radius','load','hook','rigging','boomB','radiusB','span','cgA','wind'].forEach(k=>$('c-'+k).addEventListener('input',e=>set({[k]:+e.target.value})));
addEventListener('resize',()=>{if(!CAPTURE)frame(0)});

frame(0);
if(!CAPTURE){let last=performance.now();const loop=ts=>{frame(Math.min(100,ts-last));last=ts;requestAnimationFrame(loop)};requestAnimationFrame(loop);}
window.sim={set,callout,clear,advance:frame,isIdle:()=>false,calc:()=>JSON.parse(JSON.stringify(calc(),(k,v)=>k==='t'?undefined:(v===Infinity?1e99:v))),
  get:()=>({...S}),get view(){return {...A}},failure:failInfo,chart:(u,o,a)=>{const t=table(u||S.units,o||S.outr,a||S.area);return {booms:t.booms,radii:t.radii,cap:t.cap,sh:t.sh};},ready:true};
})();
</script>
</body>
