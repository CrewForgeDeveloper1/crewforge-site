<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sling Angle Simulator · CrewForge</title>
<!--
  CrewForge: Sling Angle Simulator (v2, fully animated). Brand: CrewForge charcoal #1F1D1A, orange #F08A2B / #C05A00.
  PIPELINE CONTRACT:
    window.sim.set(partialState, durationMs)   tween numeric values, set others instantly
    window.sim.callout(targetId, text, {pos})   highlight an element with a label
    window.sim.clear()                          remove all callouts
    window.sim.advance(ms)                      advance the virtual clock (all motion runs off this)
    window.sim.isIdle()                         always false: the rig sways and the load path flows continuously
    window.sim.ready                            true once loaded
  ?capture=1 → no requestAnimationFrame; the pipeline drives time through advance().

  STATE (sim.set keys)
    hitch      'vertical' | 'choker' | 'basket' | 'bridle'
    legs       2 | 3 | 4                (bridle only)
    angle      sling angle from HORIZONTAL, degrees (basket/bridle)
    load       load weight, in current units
    wll        vertical WLL of ONE sling leg, in current units
    sling      sling leg length L, ft or m (for the L ÷ H readout)
    units      'lb' | 'kg'  (lengths follow: ft | m). Changing units alone converts load/wll/sling.
    slingType  'wire' | 'chain' | 'synthetic'
    choke      angle of choke, degrees (choker only)
    twoLeg     true → 3- and 4-leg bridles planned as if only 2 legs carry
    snap       true → overlays, needle and sway jump to rest (use in scene setups)
    lift       0 = load on the floor, slings slack · 0.3 = slack taken up · 1 = load lifted clear
    vectors    show the force triangle (vertical / horizontal / sling tension)
    angles     show angle-from-vertical and included-angle arcs
    dims       show L and H dimension lines
-->
<style>
:root{--bg:#1F1D1A;--panel:#2A2723;--panel2:#34302B;--line:#45403A;--text:#F5F5F4;--muted:#A39B90;
--accent:#F08A2B;--ok:#3ddc84;--warn:#F2C230;--bad:#ff4d4d;--steel:#9fb0bc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{display:grid;grid-template-columns:1fr 600px;height:100vh}
#stage{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border-right:1px solid var(--line)}
.brandbar{display:flex;align-items:center;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line)}
.brandbar .logo{height:44px;width:auto;display:block}
.brandbar .t1{font-size:13px;letter-spacing:.18em;color:var(--muted);font-weight:600}
.brandbar .t2{font-size:26px;font-weight:700}
#svgwrap{flex:1;min-height:0;position:relative}
#svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px)}
#formula{margin:0 22px 16px;padding:14px 20px;background:var(--panel);border:1px solid var(--line);
border-left:5px solid var(--accent);border-radius:8px;font-size:25px;font-variant-numeric:tabular-nums;
font-family:"SF Mono",Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel{background:var(--panel);padding:14px 22px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.sec h3{margin:0 0 7px;font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;padding:7px 6px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);
color:var(--text);font-size:15px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:#141414;border-color:var(--accent)}
.ctl{margin-top:6px}
.ctl label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:2px}
.ctl label b{color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
.ctl.off{opacity:.3;pointer-events:none}
.row{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.ro{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ro div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.ro span{display:block;font-size:11px;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.ro b{font-size:21px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ro .big{grid-column:span 2}
.ro .big b{font-size:30px}
.ro div.na b{color:var(--muted)}
#meter{display:grid;grid-template-columns:250px 1fr;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
#gauge{width:250px;height:150px;display:block}
#status{padding:10px;border-radius:8px;font-weight:800;font-size:19px;text-align:center;letter-spacing:.03em}
#utilrow{font-size:14px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
#utilrow b{font-size:24px;color:var(--text);font-variant-numeric:tabular-nums}
#co{position:fixed;inset:0;pointer-events:none;z-index:10}
.ring{position:absolute;border:4px solid var(--accent);border-radius:10px}
.clabel{position:absolute;max-width:440px;background:var(--accent);color:#141414;font-weight:700;font-size:25px;
line-height:1.25;padding:12px 16px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.55)}
@media (max-width:1000px){
  #app{grid-template-columns:1fr;height:auto}
  #stage{border-right:0}
  #svgwrap{height:62vw;min-height:300px}
  #formula{font-size:13px;white-space:normal;margin:0 10px 10px}
  #panel{overflow:visible;padding:12px}
  .brandbar .t2{font-size:20px}
  .ro{grid-template-columns:1fr 1fr}
  .ro b{font-size:17px}.ro .big b{font-size:24px}
  #meter{grid-template-columns:1fr}#gauge{margin:0 auto}
  .clabel{font-size:15px;max-width:240px;padding:8px 10px}
}
</style>
</head>

<script>
(()=>{
const CAPTURE=new URLSearchParams(location.search).has('capture');
const OK='#3ddc84',WARN='#F2C230',BAD='#ff4d4d',ACC='#F08A2B',MUTED='#A39B90',STEEL='#9fb0bc',TEXT='#F5F5F4';
const LB_TO_KG=0.45359237, FT_TO_M=0.3048;
const S={hitch:'bridle',legs:2,angle:60,load:10000,wll:8000,sling:10,units:'lb',slingType:'wire',choke:135,
         twoLeg:true,lift:1,vectors:false,angles:false,dims:false};
const NUMERIC=['angle','load','wll','sling','choke','lift'];
const $=id=>document.getElementById(id);
const rad=d=>d*Math.PI/180, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};

/* =====================================================================
   PHYSICS: every number on screen comes from calc().
   Load angle factor (LAF) = 1 ÷ sin θ, θ measured from HORIZONTAL.
   LAF is rounded to 3 decimals, exactly as read off a factor table, so the
   on-screen arithmetic (W ÷ n × LAF) checks by hand to the pound.
   Tension per leg   T = (W ÷ n) × LAF       n = legs assumed to carry
   L ÷ H             = LAF (same triangle: H = L sin θ)
   Bridle capacity   = n × WLL ÷ LAF
   Basket            : two legs, capacity = 2 × WLL ÷ LAF (2 × WLL only when legs are vertical)
   Choker            : rating = WLL × choker efficiency × angle-of-choke reduction
                       efficiency ≈ wire rope 0.75, alloy chain 0.80, synthetic 0.80 (typical tag values)
                       reduction (wire rope / synthetic): ≥120° 1.00 · 90–119° 0.87 · 60–89° 0.74 · 30–59° 0.62 · <30° 0.49
                       alloy chain: use the chain manufacturer's chart (not modelled; reduction = 1)
   Utilization       = T ÷ rating per leg.  Over 80% → caution, over 100% → overloaded.
   ===================================================================== */
const CHOKER_EFF={wire:.75,chain:.80,synthetic:.80};
const CHOKE_ROWS=[[120,180,1.00,'120°–180°'],[90,119,.87,'90°–119°'],[60,89,.74,'60°–89°'],[30,59,.62,'30°–59°'],[0,29,.49,'0°–29°']];
function chokeRow(a){a=Math.round(a);return CHOKE_ROWS.findIndex(r=>a>=r[0])}
function calc(){
  const W=S.load, angled=S.hitch==='basket'||S.hitch==='bridle';
  const th=angled?S.angle:90;
  const f=Math.round(1000/Math.sin(rad(th)))/1000;
  const c={W,th,f,angled,carry:1,rating:S.wll,eff:1,red:1,row:-1};
  if(S.hitch==='vertical'){c.T=W;c.capacity=S.wll;}
  else if(S.hitch==='choker'){
    c.eff=CHOKER_EFF[S.slingType]; c.row=chokeRow(S.choke);
    c.red=S.slingType==='chain'?1:CHOKE_ROWS[c.row][2];
    c.rating=S.wll*c.eff*c.red; c.T=W; c.capacity=c.rating;}
  else if(S.hitch==='basket'){c.carry=2;c.T=W/2*f;c.capacity=2*S.wll/f;}
  else {c.carry=(S.twoLeg&&S.legs>=3)?2:S.legs;c.T=W/c.carry*f;c.capacity=c.carry*S.wll/f;}
  c.L=S.sling; c.H=S.sling*Math.sin(rad(th)); c.hl=c.L/c.H;
  c.V=W/c.carry; c.Hf=c.V/Math.tan(rad(th));   // force triangle: vertical part (always W ÷ n) and horizontal part of T
  c.util=c.T/c.rating;
  c.angleBad=angled&&th<30;
  c.level=c.angleBad||c.util>1?'bad':c.util>.8?'warn':'ok';
  return c;
}

/* ---------- formatting ---------- */
const nf=(v,d=0)=>v.toLocaleString('en-CA',{minimumFractionDigits:d,maximumFractionDigits:d});
const wt=v=>nf(Math.round(v))+' '+S.units;
const len=v=>nf(v,2)+(S.units==='kg'?' m':' ft');
const deg=v=>Math.round(v)+'°';
const levelCol=l=>l==='bad'?BAD:l==='warn'?WARN:OK;

/* ---------- animation state (virtual clock only) ---------- */
let T=0, tweens=[], callouts=[];
const A={flow:0, needle:0, needleV:0, sway:0, swayV:0, bounce:0, bounceV:0, lastLift:S.lift,
         vec:0, ang:0, dim:0, rowY:0, hookTravel:0, lastHook:null};

/* ---------- drawing helpers ---------- */
function arrow(id,x1,y1,x2,y2,col,w=5){
  const a=Math.atan2(y2-y1,x2-x1),h=16;
  return `<g id="${id}"><line x1="${x1}" y1="${y1}" x2="${x2-Math.cos(a)*h*.6}" y2="${y2-Math.sin(a)*h*.6}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>
  <polygon points="${x2},${y2} ${x2-h*Math.cos(a-.42)},${y2-h*Math.sin(a-.42)} ${x2-h*Math.cos(a+.42)},${y2-h*Math.sin(a+.42)}" fill="${col}"/></g>`;
}
function pill(id,x,y,text,col,op=1){const w=text.length*13.5+28;
  return `<g id="${id}" opacity="${op}"><rect x="${x-w/2}" y="${y-21}" width="${w}" height="42" rx="21" fill="#1F1D1A" stroke="${col}" stroke-width="3"/>
  <text x="${x}" y="${y+8}" text-anchor="middle" font-size="23" font-weight="700" fill="${col}">${text}</text></g>`;}

/* Sling leg from the hook (x1,y1) to an attach point (x2,y2). sag 0 = taut.
   Base = the sling itself (look depends on type); overlay = the load path, dashes flowing
   from the load UP into the hook, speed ∝ how hard the leg is working, colour by utilization. */
function leg(id,x1,y1,x2,y2,sag,col,work,shake){
  const mx=(x1+x2)/2+sag*.35, my=(y1+y2)/2+sag;
  const j=shake?Math.sin(T/18+x2)*1.6:0;
  const d=`M${x1+j} ${y1} Q${mx+j} ${my} ${x2} ${y2}`;
  let base;
  if(S.slingType==='chain') base=`<path d="${d}" stroke="#7f8f9b" stroke-width="13" fill="none" stroke-dasharray="16 5" stroke-linecap="butt"/>
     <path d="${d}" stroke="#c3ced6" stroke-width="5" fill="none" stroke-dasharray="16 5"/>`;
  else if(S.slingType==='synthetic') base=`<path d="${d}" stroke="#8c5bd6" stroke-width="15" fill="none" stroke-linecap="round"/>
     <path d="${d}" stroke="#b48af0" stroke-width="3" fill="none" stroke-dasharray="2 9"/>`;
  else base=`<path d="${d}" stroke="#7f8f9b" stroke-width="11" fill="none" stroke-linecap="round"/>
     <path d="${d}" stroke="#c3ced6" stroke-width="3" fill="none" stroke-dasharray="7 5" stroke-dashoffset="${(A.flow*.15)%12}"/>`;
  const glow=shake?`<path d="${d}" stroke="${BAD}" stroke-width="${22+6*Math.sin(T/90)}" fill="none" opacity=".25" stroke-linecap="round"/>`:'';
  const flow=work>0.02?`<path d="${d}" stroke="${col}" stroke-width="6" fill="none" stroke-dasharray="20 26" stroke-dashoffset="${A.flow}" opacity="${.35+.6*Math.min(1,work)}" stroke-linecap="round"/>`:'';
  return `<g id="${id}">${glow}${base}${flow}</g>`;
}

/* Crane hook block. Sheaves turn as the hook travels; falls run up to the trolley. */
function hookBlock(x,y){
  const rot=A.hookTravel/22, by=y-150;
  const sheave=(cx,cy,r)=>{let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#2F2B27" stroke="${STEEL}" stroke-width="3"/>`;
    for(let k=0;k<4;k++){const a=rot+k*Math.PI/4;s+=`<line x1="${cx-r*.85*Math.cos(a)}" y1="${cy-r*.85*Math.sin(a)}" x2="${cx+r*.85*Math.cos(a)}" y2="${cy+r*.85*Math.sin(a)}" stroke="${STEEL}" stroke-width="2"/>`;}
    return s+`<circle cx="${cx}" cy="${cy}" r="5" fill="${ACC}"/>`;};
  let s=`<g id="hookblock">`;
  s+=`<rect x="${x-150}" y="0" width="300" height="26" fill="#3A3631"/><rect x="${x-150}" y="22" width="300" height="5" fill="${ACC}" opacity=".8"/>`;
  s+=sheave(x-24,46,18)+sheave(x+24,46,18);
  const dash=`stroke-dasharray="10 8" stroke-dashoffset="${A.hookTravel}"`;
  s+=`<line x1="${x-42}" y1="46" x2="${x-42}" y2="${by+30}" stroke="${STEEL}" stroke-width="4" ${dash}/>
      <line x1="${x+42}" y1="46" x2="${x+42}" y2="${by+30}" stroke="${STEEL}" stroke-width="4" ${dash}/>`;
  s+=`<rect x="${x-58}" y="${by}" width="116" height="78" rx="14" fill="#3A3631" stroke="${STEEL}" stroke-width="3"/>`;
  s+=sheave(x,by+32,26);
  s+=`<rect x="${x-58}" y="${by+56}" width="116" height="10" fill="${ACC}" opacity=".85"/>`;
  // master link first, then the hook over it: the hook's bowl is centred on the link's top so the link visibly
  // hangs IN the hook (the shank is offset left like a real hook). Bowl bottom (t=.5) = (x, y-19.25) = link top.
  s+=`<ellipse id="hook" cx="${x}" cy="${y}" rx="13" ry="19" fill="none" stroke="${ACC}" stroke-width="7"/>`;
  s+=`<path d="M${x-16} ${by+78} L${x-16} ${y-44} C${x-16} ${y-12} ${x+16} ${y-12} ${x+16} ${y-38}" stroke="${STEEL}" stroke-width="10" fill="none" stroke-linecap="round"/></g>`;
  return s;
}

/* 1 ÷ sin θ curve with a live dot. Teaches the shape: flat near 90°, a wall below 30°. */
function curveInset(c,op){
  if(op<=0)return '';
  const x0=1010,x1=1280,y0=40,y1=280, X=a=>x0+(a-10)/80*(x1-x0), Y=f=>y1-(Math.min(f,4)-1)/3*(y1-y0);
  let p='';for(let a=14.5;a<=90;a+=.5)p+=(p?'L':'M')+X(a).toFixed(1)+' '+Y(1/Math.sin(rad(a))).toFixed(1);
  const dx=X(c.th), dy=Y(c.f);
  let s=`<g id="curve" opacity="${op}"><rect x="${x0-14}" y="${y0-34}" width="${x1-x0+28}" height="${y1-y0+80}" rx="10" fill="#24211E" stroke="#45403A"/>
  <text x="${x0}" y="${y0-12}" font-size="17" font-weight="700" fill="${MUTED}" letter-spacing="1.5">FACTOR = 1 ÷ sin θ</text>
  <rect x="${X(10)}" y="${y0}" width="${X(30)-X(10)}" height="${y1-y0}" fill="${BAD}" opacity=".13"/>
  <text x="${X(20)}" y="${y0+22}" text-anchor="middle" font-size="15" font-weight="700" fill="${BAD}">&lt;30°</text>`;
  [1,2,3,4].forEach(f=>{s+=`<line x1="${x0}" y1="${Y(f)}" x2="${x1}" y2="${Y(f)}" stroke="#3A3530"/><text x="${x0-6}" y="${Y(f)+5}" text-anchor="end" font-size="14" fill="${MUTED}">${f}</text>`;});
  [30,45,60,90].forEach(a=>{s+=`<text x="${X(a)}" y="${y1+20}" text-anchor="middle" font-size="14" fill="${MUTED}">${a}°</text>`;});
  s+=`<path d="${p}" fill="none" stroke="${ACC}" stroke-width="3"/>
  <line x1="${dx}" y1="${y1}" x2="${dx}" y2="${dy}" stroke="${TEXT}" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle id="curve-dot" cx="${dx}" cy="${dy}" r="${9+2*Math.sin(T/160)}" fill="${levelCol(c.level)}" stroke="#1F1D1A" stroke-width="3"/>
  <text x="${clamp(dx+14,x0+10,x1-70)}" y="${Math.max(y0+44,dy-14)}" font-size="20" font-weight="800" fill="${TEXT}">×${c.f.toFixed(3)}</text></g>`;
  return s;
}

/* Force triangle for one leg: vertical part stays W ÷ n at every angle, the horizontal part
   grows as the sling flattens, and T is their sum along the sling. Vectors draw on when switched on. */
function triangleInset(c,op){
  if(op<=0||!c.angled)return '';
  const px=1215,py=610,V=150*op,Hraw=150/Math.tan(rad(c.th)),Hc=Math.min(Hraw,200)*op;
  const cut=Hraw>200, lx=Math.max(px-Hc/2,1100);
  let s=`<g id="vec-group" opacity="${Math.min(1,op*1.4)}"><rect x="990" y="326" width="304" height="324" rx="10" fill="#24211E" stroke="#45403A"/>
  <text x="1004" y="352" font-size="17" font-weight="700" fill="${MUTED}" letter-spacing="1.5">FORCES ON ONE LEG</text>`;
  s+=arrow('vec-v',px,py,px,py-V,'#59b7ff',6);
  s+=arrow('vec-h',px,py-V,px-Hc,py-V,'#ff8a3d',6);
  s+=arrow('vec-t',px,py,px-Hc,py-V,levelCol(c.level),7);
  if(cut)s+=`<text x="${px-Hc-6}" y="${py-V+8}" text-anchor="end" font-size="26" font-weight="800" fill="#ff8a3d">≫</text>`;
  s+=`<text x="${px+12}" y="${py-V/2-6}" font-size="20" font-weight="800" fill="#59b7ff">up</text>
  <text x="${px+12}" y="${py-V/2+18}" font-size="20" font-weight="800" fill="#59b7ff">${nf(Math.round(c.V))}</text>
  <text x="${lx}" y="${py-V-50}" text-anchor="middle" font-size="20" font-weight="800" fill="#ff8a3d">sideways</text>
  <text x="${lx}" y="${py-V-26}" text-anchor="middle" font-size="20" font-weight="800" fill="#ff8a3d">${nf(Math.round(c.Hf))}</text>
  <text x="1004" y="384" font-size="24" font-weight="800" fill="${levelCol(c.level)}">T = ${wt(c.T)}</text></g>`;
  return s;
}

/* Choke derating table; the highlight bar slides to the active row. */
function chokeInset(c,op){
  if(op<=0)return '';
  const x0=990,y0=60,rh=46;
  let s=`<g id="choke-table" opacity="${op}"><rect x="${x0-10}" y="${y0-44}" width="310" height="${rh*5+110}" rx="10" fill="#24211E" stroke="#45403A"/>
  <text x="${x0+4}" y="${y0-16}" font-size="17" font-weight="700" fill="${MUTED}" letter-spacing="1.5">ANGLE OF CHOKE → % RATING</text>`;
  if(S.slingType!=='chain')s+=`<rect x="${x0}" y="${y0+A.rowY*rh}" width="290" height="${rh-4}" rx="6" fill="${ACC}" opacity=".9"/>`;
  CHOKE_ROWS.forEach((r,i)=>{const on=i===c.row&&S.slingType!=='chain';
    s+=`<g id="choke-row-${i}"><text x="${x0+14}" y="${y0+i*rh+30}" font-size="22" font-weight="700" fill="${on?'#141414':TEXT}">${r[3]}</text>
    <text x="${x0+276}" y="${y0+i*rh+30}" text-anchor="end" font-size="22" font-weight="800" fill="${on?'#141414':ACC}">${Math.round(r[2]*100)}%</text></g>`;});
  s+=`<text x="${x0+4}" y="${y0+5*rh+26}" font-size="15" fill="${MUTED}">${S.slingType==='chain'?'Alloy chain: use the maker’s chart':'Wire rope / synthetic. Brackets vary'}</text>
  <text x="${x0+4}" y="${y0+5*rh+48}" font-size="15" fill="${MUTED}">${S.slingType==='chain'?'':'by maker: check the tag.'}</text></g>`;
  return s;
}

function draw(c){
  const cx=470, ground=820, Lpx=380;
  const k=smooth(0,.3,S.lift);                 // slack taken up (0 → 1)
  const rise=smooth(.3,1,S.lift)*120;           // load height off the floor
  const work=k*c.util;                          // how hard the legs are working right now
  const col=levelCol(c.level), shake=k>.9&&(c.util>1||c.angleBad);
  let s='';
  for(let gx=0;gx<=1300;gx+=50)s+=`<line x1="${gx}" y1="0" x2="${gx}" y2="900" stroke="#26231F"/>`;
  for(let gy=0;gy<=900;gy+=50)s+=`<line x1="0" y1="${gy}" x2="1300" y2="${gy}" stroke="#26231F"/>`;
  s+=`<rect x="0" y="${ground}" width="1300" height="80" fill="#191714"/><line x1="0" y1="${ground}" x2="1300" y2="${ground}" stroke="#45403A" stroke-width="3"/>`;
  for(let hx=-40;hx<1300;hx+=36)s+=`<line x1="${hx}" y1="${ground+80}" x2="${hx+40}" y2="${ground}" stroke="#24211D" stroke-width="3"/>`;
  // shadow on the floor shrinks as the load rises
  s+=`<ellipse cx="${cx}" cy="${ground+6}" rx="${200-rise*.6}" ry="${10-rise*.04}" fill="#000" opacity="${.45-rise*.002}"/>`;
  // the rig hangs from the trolley and swings as one body
  const swayDeg=A.sway;
  let r=`<g transform="rotate(${swayDeg.toFixed(3)} ${cx} 0) translate(0 ${A.bounce.toFixed(2)})">`;
  const label=wt(c.W);

  if(S.hitch==='vertical'||S.hitch==='choker'){
    if(S.hitch==='vertical'){
      const bh=170,top=ground-bh-rise, hy=top-330+(1-k)*60;
      r+=`<rect id="load-box" x="${cx-170}" y="${top}" width="340" height="${bh}" fill="#4D4842" stroke="#7A7268" stroke-width="2"/>
        <text x="${cx}" y="${top+bh/2+14}" text-anchor="middle" font-size="40" font-weight="800" fill="${TEXT}">${label}</text>
        <rect x="${cx-16}" y="${top-26}" width="32" height="28" rx="6" fill="#7A7268"/>`;
      r+=hookBlock(cx,hy)+leg('leg-0',cx,hy+18,cx,top-14,(1-k)*60,col,work,shake);
      r+=pill('leg-label-0',cx+150,(hy+top)/2,wt(c.T*k),col);
      A.curHook=hy;
    } else {
      const R=115, ccy=ground-R-rise, a=clamp(180-S.choke,25,89);
      const d=R/Math.sin(rad(a)), Cy=ccy-d, b=Math.acos(R/d), tx=R*Math.sin(b), ty=ccy-R*Math.cos(b), hy=Cy-250+(1-k)*60;
      r+=`<g id="load-box"><circle cx="${cx}" cy="${ccy}" r="${R}" fill="#4D4842" stroke="#7A7268" stroke-width="4"/>`;
      // round bundle: inner pipes rotate slightly with sway so the bundle reads as round stock
      for(let i=0;i<6;i++){const q=i*Math.PI/3+A.sway*.05;r+=`<circle cx="${cx+62*Math.cos(q)}" cy="${ccy+62*Math.sin(q)}" r="30" fill="#3C3833" stroke="#7A7268" stroke-width="2"/>`;}
      r+=`<circle cx="${cx}" cy="${ccy}" r="30" fill="#3C3833" stroke="#7A7268" stroke-width="2"/></g>
        <text x="${cx}" y="${ccy+R+42}" text-anchor="middle" font-size="30" font-weight="800" fill="${TEXT}">${label}</text>`;
      // sling body wraps the bundle and runs back up through the choking eye; dashes show it sliding through
      const body=`M${cx} ${Cy} L${cx-tx} ${ty} A${R} ${R} 0 1 0 ${cx+tx} ${ty} Z`;
      const bc=S.slingType==='synthetic'?'#8c5bd6':'#7f8f9b';
      r+=`<path d="${body}" fill="none" stroke="${bc}" stroke-width="${S.slingType==='synthetic'?15:11}" stroke-linejoin="round"/>
        <path d="${body}" fill="none" stroke="${col}" stroke-width="5" stroke-dasharray="18 24" stroke-dashoffset="${-A.chokeSlide||0}" opacity=".85"/>`;
      r+=hookBlock(cx,hy)+leg('leg-0',cx,hy+18,cx,Cy,(1-k)*60,col,work,shake);
      r+=`<circle cx="${cx}" cy="${Cy}" r="15" fill="#1F1D1A" stroke="${ACC}" stroke-width="5"/>`;
      const Ra=58;
      r+=`<g id="choke-arc"><path d="M${cx} ${Cy-Ra} A${Ra} ${Ra} 0 0 1 ${cx+Ra*Math.sin(rad(a))} ${Cy+Ra*Math.cos(rad(a))}" fill="none" stroke="${ACC}" stroke-width="5"/>
        <text x="${cx+74}" y="${Cy-22}" font-size="28" font-weight="800" fill="${ACC}">Choke ${deg(S.choke)}</text></g>`;
      r+=pill('leg-label-0',cx-150,(hy+Cy)/2,wt(c.T*k),col);
      A.curHook=hy;
    }
  } else {
    const th=rad(c.th), half=Math.max(40,Lpx*Math.cos(th)), riseH=Lpx*Math.sin(th);
    const depth=S.hitch==='bridle'&&S.legs>=3, dx=depth?80:0, dy=depth?-46:0, bh=150;
    const isB=S.hitch==='basket', HKY=300, cB=Math.cos(th);    // basket: hook held at screen height HKY
    const rsB=isB?Math.min(300,Math.max(44,(ground-rise-6-HKY)*cB/(1+cB))):0, rB=rsB-7; // sling / drum radius
    const cyB=isB?ground-rise-rsB-6:0, DB=cyB-HKY;
    const top=isB?cyB-rsB*Math.cos(th):ground-bh-rise, w=Math.max(260,2*half+80), x0=cx-w/2;
    const hy=isB?cyB-DB-18+(1-k)*60:top-riseH-18+(1-k)*60, hx=cx;
    // attach points (front-left, front-right, back-right, back-left / back-centre); basket: tangent points
    let pts=isB?[[cx-rsB*Math.sin(th),top],[cx+rsB*Math.sin(th),top]]:[[cx-half,top],[cx+half,top]];
    if(depth)pts=S.legs===4?[[cx-half,top],[cx+half,top],[cx+half+dx,top+dy],[cx-half+dx,top+dy]]:[[cx-half,top],[cx+half,top],[cx+dx,top+dy]];
    // Two-leg rule: the load rocks onto one pair of legs, then another. Slack legs sag; their corners dip.
    const slack=pts.map(()=>0);
    if(depth&&S.twoLeg){
      const sets=S.legs===4?[[0,2],[1,3]]:[[0,1],[1,2],[2,0]], per=3200, ph=(T/per)%sets.length, i=Math.floor(ph), fr=ph-i;
      const bl=smooth(.75,1,fr), cur=sets[i], nxt=sets[(i+1)%sets.length];
      pts.forEach((_,j)=>{slack[j]=(cur.includes(j)?0:1)*(1-bl)+(nxt.includes(j)?0:1)*bl;});
    }
    const dip=slack.map(v=>v*22*k);
    if(isB){ // round load (drum / roll / pipe bundle end-on); sling legs leave its sides
      const rs=rsB, lbl=rB>=96;
      r+=`<defs><radialGradient id="drumG" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#6B645B"/><stop offset="1" stop-color="#3A3631"/></radialGradient></defs>
        <ellipse cx="${cx}" cy="${ground-rise+2}" rx="${rB*.9}" ry="8" fill="#000" opacity=".25"/>
        <circle id="load-box" cx="${cx}" cy="${cyB}" r="${rB}" fill="url(#drumG)" stroke="#7A7268" stroke-width="2"/>
        <circle cx="${cx}" cy="${cyB}" r="${rB*.28}" fill="#2E2A26" stroke="#7A7268" stroke-width="2"/>`;
      r+=lbl?`<text x="${cx}" y="${cyB+rB*.62}" text-anchor="middle" font-size="34" font-weight="800" fill="${TEXT}">${label}</text>`
            :`<text x="${cx+rs+28}" y="${cyB+12}" text-anchor="start" font-size="34" font-weight="800" fill="${TEXT}">${label}</text>`;
      const bc=S.slingType==='synthetic'?'#8c5bd6':'#7f8f9b';
      const tx=rs*Math.sin(th), ty=cyB-rs*Math.cos(th);             // tangent points
      const ub=`M${cx-tx} ${ty} A${rs} ${rs} 0 1 0 ${cx+tx} ${ty}`;    // wraps under the load, tangent to tangent
      r+=`<path d="${ub}" fill="none" stroke="${bc}" stroke-width="11" stroke-linecap="round"/>
        <path d="${ub}" fill="none" stroke="${col}" stroke-width="5" stroke-dasharray="20 26" stroke-dashoffset="${-A.flow}" opacity="${work>.02?.8:0}"/>`;
    } else {
    // load box (corners follow the dips so the tilt shows)
    const cDip=(xx,isBack)=>{let best=0,bd=1e9;pts.forEach((p,j)=>{const back=p[1]<top-1;if(back!==isBack&&depth)return;const dd=Math.abs(p[0]-xx);if(dd<bd){bd=dd;best=dip[j]}});return best;};
    const fl=[x0,top+cDip(x0,false)], fR=[x0+w,top+cDip(x0+w,false)];
    if(depth){const br=[x0+w+dx,top+dy+cDip(x0+w+dx,true)], bL=[x0+dx,top+dy+cDip(x0+dx,true)];
      r+=`<polygon points="${fl} ${bL} ${br} ${fR}" fill="#5D5750"/><polygon points="${fR} ${br} ${br[0]},${br[1]+bh} ${fR[0]},${fR[1]+bh}" fill="#3C3833"/>`;}
    r+=`<polygon id="load-box" points="${fl} ${fR} ${fR[0]},${fR[1]+bh} ${fl[0]},${fl[1]+bh}" fill="#4D4842" stroke="#7A7268" stroke-width="2"/>
      <text x="${cx}" y="${top+bh/2+16}" text-anchor="middle" font-size="40" font-weight="800" fill="${TEXT}">${label}</text>`;
    } // end box
    r+=hookBlock(hx,hy);
    const order=depth?pts.map((p,j)=>j).sort((a,b)=>pts[a][1]-pts[b][1]):[0,1];   // back legs first
    order.forEach(j=>{const p=pts[j], sl=slack[j];
      const back=depth&&p[1]<top-1;
      const lc=sl>.5?MUTED:col;
      r+=`<g opacity="${back?.75:1}">`+leg('leg-'+j,hx,hy+18,p[0],p[1]+dip[j],(1-k)*60+sl*38,lc,work*(1-sl),shake&&sl<.5)+`</g>`;
      r+=`<circle cx="${p[0]}" cy="${p[1]+dip[j]}" r="11" fill="${sl>.5?MUTED:ACC}"/>`;});
    // angle from horizontal, at the left attach point
    const R=84, ax=pts[0][0], ay=top+dip[0];
    r+=`<g id="angle-arc"><line x1="${ax}" y1="${ay}" x2="${ax+R+46}" y2="${ay}" stroke="${ACC}" stroke-width="2" stroke-dasharray="6 6"/>
      <path d="M${ax+R} ${ay} A${R} ${R} 0 0 0 ${ax+R*Math.cos(th)} ${ay-R*Math.sin(th)}" fill="none" stroke="${ACC}" stroke-width="5"/>
      <text x="${ax+(R+38)*Math.cos(th/2)-14}" y="${ay-(R+38)*Math.sin(th/2)+10}" font-size="30" font-weight="800" fill="${ACC}">${deg(c.th)}</text></g>`;
    // angle from vertical + included angle at the hook (draw on)
    if(A.ang>0){const o=A.ang, r2=70, hy2=hy+18;
      r+=`<g id="incl-arc" opacity="${o}"><path d="M${hx-r2*Math.cos(th)} ${hy2+r2*Math.sin(th)} A${r2} ${r2} 0 0 0 ${hx+r2*Math.cos(th)} ${hy2+r2*Math.sin(th)}" fill="none" stroke="#59b7ff" stroke-width="4"/>
        <text x="${hx-26}" y="${hy2+r2+30}" text-anchor="end" font-size="26" font-weight="800" fill="#59b7ff">${deg(180-2*c.th)}</text></g>
        <g id="vert-arc" opacity="${o}"><line x1="${hx}" y1="${hy2}" x2="${hx}" y2="${hy2+r2+110}" stroke="#ff8a3d" stroke-width="2" stroke-dasharray="6 6"/>
        <path d="M${hx} ${hy2+r2+70} A${r2+70} ${r2+70} 0 0 1 ${hx+(r2+70)*Math.cos(th)} ${hy2+(r2+70)*Math.sin(th)}" fill="none" stroke="#ff8a3d" stroke-width="4"/>
        <text x="${hx+(r2+100)*Math.cos(th/2+Math.PI/4)}" y="${hy2+(r2+100)*Math.sin(th/2+Math.PI/4)+9}" text-anchor="middle" font-size="26" font-weight="800" fill="#ff8a3d">${deg(90-c.th)}</text></g>`;}
    // L and H dimensions (draw on)
    if(A.dim>0){const o=A.dim, rx=pts[1][0], dimx=Math.max(rx,x0+w)+(depth?dx:0)+46, Hlen=(top-(hy+18))*o;
      r+=`<g id="hl-dim" opacity="${o}"><line x1="${dimx}" y1="${top}" x2="${dimx}" y2="${top-Hlen}" stroke="${TEXT}" stroke-width="3"/>
        <line x1="${dimx-14}" y1="${hy+18}" x2="${dimx+14}" y2="${hy+18}" stroke="${TEXT}" stroke-width="3"/><line x1="${dimx-14}" y1="${top}" x2="${dimx+14}" y2="${top}" stroke="${TEXT}" stroke-width="3"/>
        <line x1="${hx}" y1="${hy+18}" x2="${dimx}" y2="${hy+18}" stroke="${TEXT}" stroke-width="1.5" stroke-dasharray="5 6"/>
        <text x="${dimx+16}" y="${(hy+18+top)/2-6}" font-size="28" font-weight="800" fill="${TEXT}">H =</text><text x="${dimx+16}" y="${(hy+18+top)/2+26}" font-size="28" font-weight="800" fill="${TEXT}">${len(c.H)}</text>
        <text x="${(hx+rx)/2+28}" y="${(hy+top)/2-24}" font-size="28" font-weight="800" fill="${TEXT}">L = ${len(c.L)}</text></g>`;}
    const lab=j=>slack[j]>.5?'slack':wt(c.T*k);
    r+=pill('leg-label-0',(hx+pts[0][0])/2-78,(hy+top)/2+6,lab(0),slack[0]>.5?MUTED:col);
    r+=pill('leg-label-1',(hx+pts[1][0])/2+88,(hy+top)/2+52,lab(1),slack[1]>.5?MUTED:col);
    A.curHook=hy;
  }
  r+=`</g>`;
  s+=r;
  // insets
  s+=S.hitch==='choker'?chokeInset(c,1):curveInset(c,1);
  s+=triangleInset(c,A.vec);
  if(c.angleBad){const fl=.75+.25*Math.sin(T/140);
    s+=`<g id="warn-banner" opacity="${fl}"><rect x="200" y="40" width="640" height="68" rx="10" fill="${BAD}"/><text x="520" y="86" text-anchor="middle" font-size="31" font-weight="800" fill="#fff">BELOW 30° · DO NOT LIFT</text></g>`;}
  if(S.lift<.3&&k<.98)s+=`<text x="${cx}" y="${ground+52}" text-anchor="middle" font-size="24" font-weight="700" fill="${MUTED}">${S.lift<.02?'LOAD ON THE FLOOR · SLINGS SLACK':'TAKING UP SLACK'}</text>`;
  $('svg').innerHTML=s;
}

/* Load cell dial: needle has spring-damper motion toward the live leg tension. */
function drawGauge(c){
  const max=Math.max(c.rating*1.5,c.T*1.05), cx=125,cy=128,R=100;
  const ang=v=>Math.PI*(1-clamp(v/max,0,1));
  const arc=(v0,v1,colr)=>{const a0=ang(v0),a1=ang(v1);return `<path d="M${cx+R*Math.cos(a0)} ${cy-R*Math.sin(a0)} A${R} ${R} 0 0 1 ${cx+R*Math.cos(a1)} ${cy-R*Math.sin(a1)}" stroke="${colr}" stroke-width="14" fill="none"/>`};
  let s=arc(0,c.rating*.8,'#1f5c3d')+arc(c.rating*.8,c.rating,'#7a5a12')+arc(c.rating,max,'#6e2222');
  for(let i=0;i<=10;i++){const a=Math.PI*(1-i/10);s+=`<line x1="${cx+(R-20)*Math.cos(a)}" y1="${cy-(R-20)*Math.sin(a)}" x2="${cx+(R-9)*Math.cos(a)}" y2="${cy-(R-9)*Math.sin(a)}" stroke="${MUTED}" stroke-width="2"/>`;}
  const ar=ang(c.rating);s+=`<line x1="${cx+(R-24)*Math.cos(ar)}" y1="${cy-(R-24)*Math.sin(ar)}" x2="${cx+(R+8)*Math.cos(ar)}" y2="${cy-(R+8)*Math.sin(ar)}" stroke="#fff" stroke-width="3"/>
    <text x="${cx+(R+4)*Math.cos(ar)}" y="${cy-(R+12)*Math.sin(ar)}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">RATING</text>`;
  const an=ang(A.needle);
  s+=`<line x1="${cx}" y1="${cy}" x2="${cx+(R-14)*Math.cos(an)}" y2="${cy-(R-14)*Math.sin(an)}" stroke="${ACC}" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="9" fill="${ACC}"/>
    <text x="${cx}" y="${cy-34}" text-anchor="middle" font-size="22" font-weight="800" fill="${TEXT}">${wt(c.T*smooth(0,.3,S.lift))}</text>
    <text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="12" letter-spacing="1.5" font-weight="700" fill="${MUTED}">LOAD CELL · ONE LEG</text>`;
  $('gauge').innerHTML=s;
}

function formula(c){
  if(S.hitch==='vertical')return `T = W = ${wt(c.W)}   ·   rating = WLL = ${wt(c.rating)}   ·   ${Math.round(c.util*100)}% of rating`;
  if(S.hitch==='choker'){const red=S.slingType==='chain'?'':` × ${c.red.toFixed(2)}`;
    return `Choker rating = ${wt(S.wll)} × ${c.eff.toFixed(2)}${red} = ${wt(c.rating)}   ·   T = W = ${wt(c.W)}`;}
  const star=(S.hitch==='bridle'&&S.twoLeg&&S.legs>=3)?` (2 of ${S.legs})`:'';
  return `T = (W ÷ n) × LAF = (${wt(c.W)} ÷ ${c.carry}${star}) × ${c.f.toFixed(3)} = ${wt(c.T)}`;
}

const RANGES={lb:{load:[500,40000,100],wll:[1000,20000,100],sling:[2,30,.5]},kg:{load:[250,20000,50],wll:[500,10000,50],sling:[.5,10,.1]}};
function panel(c){
  const set=(id,v,na)=>{$(id).textContent=v;$(id).parentElement.classList.toggle('na',!!na)};
  set('ro-tension',wt(c.T)); set('ro-factor',c.f.toFixed(3));
  set('ro-carry',S.hitch==='bridle'&&S.legs>=3?`${c.carry} of ${S.legs}`:String(c.carry));
  set('ro-angle',c.angled?deg(c.th):'n/a',!c.angled); set('ro-vert',c.angled?deg(90-c.th):'n/a',!c.angled);
  set('ro-incl',c.angled?deg(180-2*c.th):'n/a',!c.angled);
  set('ro-l',c.angled?len(c.L):'n/a',!c.angled); set('ro-h',c.angled?len(c.H):'n/a',!c.angled); set('ro-hl',c.angled?c.hl.toFixed(3):'n/a',!c.angled);
  set('ro-rating',wt(c.rating)); set('ro-capacity',wt(c.capacity));
  $('ro-util').textContent=Math.round(c.util*100)+'%';
  const col=levelCol(c.level), st=$('status');
  st.style.background=col; st.style.color=c.level==='ok'?'#0b2416':c.level==='warn'?'#2a2203':'#fff';
  st.textContent=c.angleBad?'BELOW 30°: DO NOT LIFT':c.util>1?'OVERLOADED: DO NOT LIFT':c.util>.8?'CAUTION: OVER 80% OF RATING':'WITHIN RATING';
  $('l-load').textContent=wt(S.load); $('l-wll').textContent=wt(S.wll); $('l-angle').textContent=deg(S.angle);
  $('l-choke').textContent=deg(S.choke); $('l-sling').textContent=len(S.sling);
  const ang=S.hitch==='basket'||S.hitch==='bridle';
  $('w-angle').classList.toggle('off',!ang); $('w-sling').classList.toggle('off',!ang);
  $('w-choke').classList.toggle('off',S.hitch!=='choker'); $('w-legs').classList.toggle('off',S.hitch!=='bridle');
  $('w-twoleg').classList.toggle('off',!(S.hitch==='bridle'&&S.legs>=3));
  segSync('c-hitch',S.hitch);segSync('c-legs',String(S.legs));segSync('c-type',S.slingType);segSync('c-units',S.units);segSync('c-lift',S.lift>=.5?'1':'0');
  const R=RANGES[S.units];
  ['load','wll','sling'].forEach(k=>{const e=$('c-'+k);[e.min,e.max,e.step]=R[k];e.value=S[k];});
  $('c-angle').value=S.angle; $('c-choke').value=S.choke; $('c-twoleg').checked=S.twoLeg;
}
function segSync(id,v){document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}

/* ---------- callouts (pulse + fade on the virtual clock) ---------- */
function renderCallouts(){
  const host=$('co'); host.innerHTML='';
  callouts.forEach(co=>{
    const el=$(co.target); if(!el)return;
    const r=el.getBoundingClientRect(), pad=10, op=Math.min(1,co.age/300);
    const pulse=co.age<1800?1+0.04*Math.sin(co.age/110):1;
    const w=(r.width+2*pad)*pulse,h=(r.height+2*pad)*pulse;
    const ring=document.createElement('div'); ring.className='ring';
    Object.assign(ring.style,{left:(r.left+r.width/2-w/2)+'px',top:(r.top+r.height/2-h/2)+'px',width:w+'px',height:h+'px',opacity:op});
    host.appendChild(ring);
    if(co.text){const lb=document.createElement('div');lb.className='clabel';lb.textContent=co.text;lb.style.opacity=op;host.appendChild(lb);
      const lw=lb.offsetWidth,lh=lb.offsetHeight,vw=innerWidth,vh=innerHeight, slide=(1-op)*14;
      const pos=co.pos||(r.left>vw*0.55?'left':'right'); let x,y;
      const inPanel=$('panel').contains(el)&&innerWidth>1000, edge=inPanel?$('panel').getBoundingClientRect().left:r.left;
      if(pos==='left'){x=edge-pad-lw-18-slide;y=r.top+r.height/2-lh/2}
      else if(pos==='right'){x=r.right+pad+18+slide;y=r.top+r.height/2-lh/2}
      else if(pos==='top'){x=r.left+r.width/2-lw/2;y=r.top-pad-lh-18-slide}
      else {x=r.left+r.width/2-lw/2;y=r.bottom+pad+18+slide}
      lb.style.left=clamp(x,12,vw-lw-12)+'px'; lb.style.top=clamp(y,12,vh-lh-12)+'px';}
  });
}

/* ---------- virtual clock: ALL motion advances here ---------- */
function step(ms){
  const dt=ms/1000;
  T+=ms;
  tweens.forEach(t=>{t.t=Math.min(t.dur,t.t+ms);S[t.key]=t.from+(t.to-t.from)*ease(t.t/t.dur);});
  tweens=tweens.filter(t=>t.t<t.dur);
  const c=calc(), k=smooth(0,.3,S.lift);
  // load path flow speed ∝ utilization
  A.flow-=dt*(30+190*Math.min(1.6,c.util))*k;
  A.chokeSlide=(A.chokeSlide||0)+dt*(S.hitch==='choker'?18+40*Math.min(1.6,c.util):0)*k;
  // needle: spring-damper toward the live tension (ω≈7 rad/s, ζ≈0.35 → a visible overshoot that settles in ~1.5 s)
  const target=c.T*k, wn=7, z=.35;
  if(ms>0&&ms<200){const sub=Math.max(1,Math.ceil(ms/8)),h=dt/sub;for(let i=0;i<sub;i++){const acc=wn*wn*(target-A.needle)-2*z*wn*A.needleV;A.needleV+=acc*h;A.needle+=A.needleV*h;}}
  else if(ms>=200||ms===0&&A.needle===0){A.needle=target;A.needleV=0;}
  // sway: pendulum, kicked by changes in lift and angle, plus a slow breathing drift
  const dl=S.lift-A.lastLift; A.lastLift=S.lift;
  if(ms>0&&ms<200){
    A.swayV+=dl*22; A.bounceV+=dl*-400*(S.lift>.3?1:0);
    const sw=2.2, sz=.12;
    for(let i=0;i<Math.max(1,Math.ceil(ms/8));i++){const h=dt/Math.max(1,Math.ceil(ms/8));
      A.swayV+=(-sw*sw*A.sway-2*sz*sw*A.swayV)*h; A.sway+=A.swayV*h;
      A.bounceV+=(-140*A.bounce-6*A.bounceV)*h; A.bounce+=A.bounceV*h;}
  }
  A.sway=clamp(A.sway,-4,4);
  const drift=k*.35*Math.sin(T/1700)*smooth(.3,1,S.lift);
  A.swayShown=A.sway+drift;
  // overlays draw on / fade
  const toward=(v,goal,rate)=>v+clamp(goal-v,-rate*dt,rate*dt);
  A.vec=toward(A.vec,S.vectors?1:0,1.4); A.ang=toward(A.ang,S.angles?1:0,1.8); A.dim=toward(A.dim,S.dims?1:0,1.6);
  if(c.row>=0)A.rowY+=(c.row-A.rowY)*Math.min(1,dt*6);
  // sheave rotation follows hook travel
  if(A.curHook!=null){if(A.lastHook!=null)A.hookTravel+=(A.lastHook-A.curHook);A.lastHook=A.curHook;}
  return c;
}
function frame(ms){
  const c=step(ms);
  const sv=A.sway; A.sway=A.swayShown??A.sway; draw(c); A.sway=sv;
  drawGauge(c); panel(c);
  $('formula').textContent=formula(c);
  callouts.forEach(co=>co.age+=ms);
  renderCallouts();
}
function set(p,dur=0){
  p={...p};
  // switching units on its own converts the current values so the physical rig stays the same
  if(p.units&&p.units!==S.units){
    const toKg=p.units==='kg', fw=toKg?LB_TO_KG:1/LB_TO_KG, fl=toKg?FT_TO_M:1/FT_TO_M;
    tweens=tweens.filter(t=>!['load','wll','sling'].includes(t.key));
    if(!('load' in p))S.load=S.load*fw;
    if(!('wll' in p))S.wll=S.wll*fw;
    if(!('sling' in p))S.sling=S.sling*fl;
    S.units=p.units; delete p.units;
  }
  const snap=p.snap; delete p.snap;
  for(const [k,v] of Object.entries(p)){
    tweens=tweens.filter(t=>t.key!==k);
    if(NUMERIC.includes(k)&&dur>0)tweens.push({key:k,from:S[k],to:v,t:0,dur});
    else S[k]=v;
  }
  if(snap){const c=calc();A.vec=S.vectors?1:0;A.ang=S.angles?1:0;A.dim=S.dims?1:0;A.needle=c.T*smooth(0,.3,S.lift);A.needleV=0;
    A.sway=A.swayV=A.bounce=A.bounceV=0;A.lastLift=S.lift;if(c.row>=0)A.rowY=c.row;A.lastHook=null;}
  if(!CAPTURE)frame(0);
}
function callout(target,text,opts={}){callouts=callouts.filter(c=>c.target!==target);callouts.push({target,text,pos:opts&&opts.pos,age:0});if(!CAPTURE)frame(0);}
function clear(){callouts=[];if(!CAPTURE)frame(0);}

/* ---------- user controls ---------- */
document.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const v=b.dataset.v;
  ({'c-hitch':()=>set({hitch:v}),'c-legs':()=>set({legs:+v}),'c-type':()=>set({slingType:v}),'c-units':()=>set({units:v}),
    'c-lift':()=>set({lift:+v},2500)})[seg.id]?.();
}));
['load','wll','angle','sling','choke'].forEach(k=>$('c-'+k).addEventListener('input',e=>set({[k]:+e.target.value})));
$('c-twoleg').addEventListener('change',e=>set({twoLeg:e.target.checked}));
addEventListener('resize',()=>{if(!CAPTURE)frame(0)});

frame(0);
if(!CAPTURE){let last=performance.now();const loop=ts=>{frame(Math.min(100,ts-last));last=ts;requestAnimationFrame(loop)};requestAnimationFrame(loop);}
window.sim={set,callout,clear,advance:frame,isIdle:()=>false,calc,get:()=>({...S}),ready:true};
})();
</script>
</body>
</html>
