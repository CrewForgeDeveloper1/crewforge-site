<script>/* Lesson code (text, steps and questions: hardness.json): Hardness testing (episode 069). RSOS A-4 performs trade tasks.
 * Numbers: Rockwell HR = N − h ÷ 0.002 mm (N 100 C, 130 B; Wikipedia / ASTM E18 by number); Brinell
 * HB = 2F ÷ (π D (D − √(D² − d²))) (ASTM E10 / ISO 6506-1 by number); HRC ↔ HB ↔ tensile from the Gordon England
 * equivalence table (MDH.CONV, approximate). Every answer is computed from MDH or the scenes' calc();
 * simulators/metals-lube/test/test_hardness.py repeats them.
 */
(function () {
const K = window.CFK, C = K.C, MD = window.MD, H = window.MDH;
const pick = (rng, a) => a[Math.floor(rng() * a.length)];
const ch = (t, why) => (why ? { t, why } : { t });
const shuffle = (rng, choices, answer) => { const idx = choices.map((c, i) => i).sort(() => rng() - .5); return { choices: idx.map(i => choices[i]), answer: idx.indexOf(answer) }; };
const mm = (v, S, d = 3) => S && S.units === 'imp' ? (v / 25.4).toFixed(d + 2) + ' in' : v.toFixed(d) + ' mm';
const HC = '#5fc3ff';

/* Rockwell pages: shared readouts */
const RR = (S, o) => [['Scale', S.sc === 'C' ? 'C · cone · 150 kgf' : 'B · ball · 100 kgf'], ['Load on the piece', MD.n0(S.load) + ' kgf', S.load > 10.5 ? C.warn : C.text],
  [S.read ? 'Depth h (minor load)' : 'Depth now', mm(S.read ? S.fin : S.pen, S), HC],
  ['Reading', S.read ? (o.valid ? MD.n1(o.HR) + (S.sc === 'C' ? ' HRC' : ' HRB') : 'not valid') : '—', S.read ? (o.valid ? C.acc : C.bad) : C.muted]];
const hrOk = (S, o) => `The needle stopped at **${o.valid ? MD.n1(o.HR) + (S.sc === 'C' ? ' HRC' : ' HRB') : 'a number that is not valid'}**. Depth h = ${mm(S.fin, S)} = ${MD.n0(S.fin / H.DIV)} points of 0.002 mm.`;
/* a Rockwell depth question */
const rockQ = (rng) => {
  const sc = rng() < .6 ? 'C' : 'B', N = H.SCALE[sc].N, HR = sc === 'C' ? pick(rng, [25, 30, 35, 40, 45, 50, 55, 58, 60]) : pick(rng, [60, 65, 70, 75, 80, 85, 90]);
  const h = (N - HR) * H.DIV, wrong = [[N - h * 1000, 'Divide by 0.002, not 0.001: each point is 0.002 mm.'], [h / H.DIV, 'That is the depth in points. Take it away from ' + N + '.'], [(sc === 'C' ? 130 : 100) - h / H.DIV, `Wrong N: the ${sc} scale uses ${N}.`]];
  const sh = shuffle(rng, [ch(HR + ' HR' + sc)].concat(wrong.map(([v, w]) => ch(MD.n0(v) + ' HR' + sc, w))), 0);
  return { q: `Rockwell ${sc} (${sc === 'C' ? 'cone, 150 kgf' : 'ball, 100 kgf'}). The permanent depth is **${h.toFixed(3)} mm**. What is the reading? (HR${sc} = ${N} − h ÷ 0.002)`, choices: sh.choices, answer: sh.answer,
    explain: `${N} − ${h.toFixed(3)} ÷ 0.002 = ${N} − ${MD.n0(h / H.DIV)} = **${HR} HR${sc}**.` };
};

window.LESSON_CODE = window.LESSON_CODE || {};
window.LESSON_CODE['hardness'] = {
  /* ---------------- page 1: test files */
  1: {
    readouts: (S, o) => [['File in hand', S.file + ' HRC'], ['This file', o.current || 'not tried', o.current === 'bites' ? C.ok : o.current === 'skates' ? C.warn : C.muted], ['Files tried', String(o.tried.length)], ['Bracket', o.bracket, o.closed ? C.acc : C.text]],
    challenge: (rng) => {
      const lo = pick(rng, [40, 45, 50, 55, 60]), hi = lo + 5;
      const right = `Between ${lo} and ${hi} HRC`;
      const all = [right, `Exactly ${lo} HRC`, `Exactly ${hi} HRC`, `Under ${lo} HRC`];
      const why = { [`Exactly ${lo} HRC`]: 'A file test cannot give an exact number: it only brackets it.', [`Exactly ${hi} HRC`]: 'The file that bites is harder than the piece, so the piece is under it.', [`Under ${lo} HRC`]: `The ${lo} file skated: the piece is at least ${lo}.` };
      const sh = shuffle(rng, all.map(t => t === right ? ch(t) : ch(t, why[t])), 0);
      return { q: `The **${lo}** HRC file skates on a part and the **${hi}** HRC file bites. Report?`, choices: sh.choices, answer: sh.answer, explain: `Skates at ${lo}, bites at ${hi}: **between ${lo} and ${hi} HRC**, by file.` };
    },
    fns: {
      p1_40: S => (S.tried & 1) === 1,
      p1_40_ok: (S, o) => o.bites ? 'It **bites**: the 40 file cuts it. The piece is softer than 40 HRC.' : 'It **skates**: the 40 file slides and cuts nothing. The piece is at least 40 HRC.',
      p1_closed: (S, o) => o.closed,
      p1_closed_ok: (S, o) => `**${o.bracket}.** The last file that skated and the first file that bit, five points apart.`,
      p1_live: (S, o) => `File ${S.file} HRC · ${o.current || 'not tried yet'} · ${o.bracket}`
    }
  },
  /* ---------------- page 2: Rockwell C */
  2: {
    readouts: RR,
    challenge: rng => rockQ(rng),
    fns: { hr_ok: hrOk, minor_live: (S, o) => S.lift < .9 ? 'The anvil is coming up: no load yet.' : o.minorOver ? '**Past SET.** Back off and pick a new spot.' : `Minor load **${MD.n1(o.minor)} kgf** · small pointer ${o.minorOK ? 'on the dot' : 'not there yet'}`,
      settle_live: (S, o) => `Load **${MD.n0(S.load)} kgf** · needle ${MD.n0(S.pen / H.DIV)} points down${o.settled ? ' · stopped' : ''}` }
  },
  /* ---------------- page 3: Rockwell B and choosing the scale */
  3: {
    readouts: RR,
    challenge: (rng) => {
      const pool = [['Hardened dowel pin, about 58 HRC', 'C'], ['Brass bushing', 'B'], ['Mild steel plate', 'B'], ['Quenched and tempered 4140 shaft', 'C'], ['Aluminium bracket', 'B'], ['Hardened wear strip', 'C']];
      const [n, sc] = pick(rng, pool);
      const sh = shuffle(rng, [ch(sc === 'C' ? 'C scale: diamond cone, 150 kgf' : 'B scale: 1/16 in ball, 100 kgf'), ch(sc === 'C' ? 'B scale: 1/16 in ball, 100 kgf' : 'C scale: diamond cone, 150 kgf', sc === 'C' ? 'Over HRB 100 the ball reading is not valid, and a steel ball can flatten.' : 'Soft metal on C reads under 20: not valid.')], 0);
      return { q: `Which Rockwell scale for a **${n.toLowerCase()}**?`, choices: sh.choices, answer: sh.answer, explain: sc === 'C' ? 'Hardened steel: C (cone, 150 kgf).' : 'Soft metal: B (ball, 100 kgf).' };
    },
    fns: { hr_ok: hrOk, b_done: (S, o) => S.read && S.sc === 'B', ball: (S, o) => o.ball && S.load > 30 }
  },
  /* ---------------- page 4: Brinell */
  4: {
    readouts: (S, o) => [['Force', MD.n0(S.F) + ' kgf'], ['Load now', MD.n0(S.load) + ' kgf', S.load >= S.F - .5 ? C.warn : C.text], ['Held', MD.n0(Math.floor(S.held)) + ' s', S.held >= 10 && S.held <= 15 ? C.ok : C.text],
      ['d (average)', o.result ? mm(o.dAvg, S, 2) : '—', '#5fc3ff'], ['Brinell', o.result ? (o.ok ? MD.n0(o.HB) + ' HB' : 'not valid') : '—', o.result ? (o.ok ? C.acc : C.bad) : C.muted]],
    challenge: (rng) => {
      const F = pick(rng, [3000, 3000, 500, 1000]), d = F === 3000 ? pick(rng, [3.2, 3.6, 4.0, 4.4, 4.8]) : pick(rng, [2.6, 3.0, 3.4]);
      const HB = H.hbOf(F, d), r = v => MD.n0(v) + ' HB';
      const sh = shuffle(rng, [ch(r(HB)), ch(r(2 * F / (Math.PI * 10 * d)), 'Use the cap: D − √(D² − d²), not d.'), ch(r(H.hbOf(F / 2, d)), 'The formula is 2F on top.'), ch(r(H.hbOf(F, d * 2)), 'Use the diameter d, not twice it.')], 0);
      return { q: `Brinell, 10 mm ball, **${MD.n0(F)} kgf**, average impression **d = ${d.toFixed(2)} mm**. HB? (HB = 2F ÷ (π D (D − √(D² − d²))))`, choices: sh.choices, answer: sh.answer,
        explain: `√(100 − ${(d * d).toFixed(2)}) = ${Math.sqrt(100 - d * d).toFixed(3)}; 2 × ${MD.n0(F)} ÷ (π × 10 × ${(10 - Math.sqrt(100 - d * d)).toFixed(3)}) = **${r(HB)}**.` };
    },
    fns: {
      held_ok: S => S.valve === 'open' && S.made && S.held >= 10 && S.held <= 15.5,
      held_live: (S, o) => S.valve === 'open' ? (S.made ? `Released after **${MD.n0(Math.floor(S.held))} s**` : 'Close the valve and pump first.') : `Holding **${MD.n0(S.load)} kgf** for **${MD.n0(Math.floor(S.held))} s**`,
      read_ok: (S, o) => `d1 ${o.d1.toFixed(2)} mm, d2 ${o.d2.toFixed(2)} mm, average **${o.dAvg.toFixed(2)} mm** → **${MD.n0(o.HB)} HB**.`,
      alu_ok: (S, o) => S.part === 'alu' && S.F === 500 && o.result && o.ok,
      alu_live: (S, o) => `${MD.n0(S.F)} kgf · ${o.result ? 'd = ' + o.dAvg.toFixed(2) + ' mm, ' + (o.ok ? 'valid' : 'not valid') : 'run the test'}`
    }
  },
  /* ---------------- page 5: valid tests and conversions */
  5: {
    readouts: (S, o) => [['Test', S.test === 'HB' ? 'HB' : 'HR' + S.test], ['Thick', o.thickOK ? 'OK' : 'thin', o.thickOK ? C.ok : C.bad], ['Edge', o.edgeOK ? 'OK' : 'close', o.edgeOK ? C.ok : C.bad], ['≈ HB', MD.n0(o.hb), C.acc]],
    challenge: (rng) => {
      const hrc = pick(rng, [25, 30, 35, 40, 45, 50, 55]), h = (100 - hrc) * H.DIV, minT = 10 * h;
      const sh = shuffle(rng, [ch(minT.toFixed(2) + ' mm'), ch(h.toFixed(2) + ' mm', 'That is the depth. The piece must be 10 × that.'), ch((minT / 2).toFixed(2) + ' mm', 'Ten times the depth, not five.'), ch((minT * 10).toFixed(1) + ' mm', 'One factor of 10 only.')], 0);
      return { q: `A Rockwell C test reads **${hrc} HRC**: depth ${h.toFixed(3)} mm. About how thick must the piece be, at least?`, choices: sh.choices, answer: sh.answer, explain: `10 × ${h.toFixed(3)} = **${minT.toFixed(2)} mm**.` };
    },
    fns: { ok_all: (S, o) => o.ok, thick_ok: (S, o) => o.thickOK, edge_ok: (S, o) => o.edgeOK && o.thickOK,
      rules_live: (S, o) => `t ${S.thick.toFixed(1)} mm (needs ${o.minT.toFixed(1)}) · edge ${S.edge.toFixed(1)} mm (needs ${o.minE.toFixed(1)})` }
  },
  /* ---------------- page 6: putting it together */
  6: {
    readouts: RR,
    challenge: (rng) => {
      const lo = pick(rng, [24, 28, 32, 36]), hi = lo + 4, HR = pick(rng, [lo - 3, lo + 1, lo + 2, hi + 2]), h = (100 - HR) * H.DIV, ok = HR >= lo && HR <= hi;
      const sh = shuffle(rng, [ch('Accept: it is in the spec'), ch('Reject: it is outside the spec')], ok ? 0 : 1);
      sh.choices.forEach(c => { if (!c.why && !(c.t.startsWith('Accept') === ok)) c.why = `${HR} HRC is ${ok ? 'inside' : 'outside'} ${lo} to ${hi}.`; });
      return { q: `Spec **${lo} to ${hi} HRC**. The C-scale depth is **${h.toFixed(3)} mm**. Accept or reject?`, choices: sh.choices, answer: sh.answer, explain: `100 − ${h.toFixed(3)} ÷ 0.002 = **${HR} HRC**: ${ok ? 'inside the spec, accept' : 'outside the spec, reject'}.` };
    },
    fns: { hr_ok: hrOk, job_done: (S, o) => S.read && S.sc === 'C' && S.part === 'spec' }
  }
};
})();

<script>/* CrewForge simulator-lesson page shell (instructor 2026-11-13, docs/LESSON_DESIGN.md). One page = one idea.
   Runs a page scene (CFShell.start(content, scene)) inside the approved layout:
   top bar (Back, lesson + page n of N, progress dots, voice mute + speed, Next: nothing locks) -> "What you're looking
   at" (fixed per page) -> simulator + readouts -> step box (fixed per step: instruction, Hint, Show me) -> control tray
   (only this step's controls). Steps: teach -> do -> predict -> fail -> question; then free play (everything unlocked,
   Reset, "Give me a challenge"). Questions are practice: a wrong pick gets a red outline and the explanation of that
   mistake, then "Try a new question" serves a different variant until one is right. Moodle "done" = the learner reached
   the last page (the SCORM host page, tools/lesson_pages.py, records it).

   Scene interface (one per page):
     defaults {}, controls {key: {type:'slider'|'chips'|'hold'|'custom', label, ...}} (below),
     mount(svg, api), apply(state, prev, initial), advance(ms, state), calc(state) -> out,
     readouts(state, out) -> [{label, short, value, cls:'ok'|'warn'|'bad', color, id}],
     caption(state, out) -> null | {kind:'fail'|'warn', title, text}, spot(id) -> [x, y, r] (svg units),
     drag (optional, wired by the scene; it calls api.input(partial)), challenge(rng, n) -> question, busy() -> bool,
     phoneViewBox, viewBox, reset().
     Optional generic hooks (added 2026-11-13 for the hoisting and block-and-tackle ports):
       instant: [keys]            never tweened by sim.set(partial, ms) (e.g. a hoist size that rebuilds the rig)
       onSet(state, keys)         after every sim.set / learner input (not on tween frames): rebuild what those keys need
       normalize(state)           after any change, before calc()
       callout(id, text, o) / clear()   the scene draws video callouts itself (return false to fall back to spot())
       fns {name: (state, out) => any}  step fields given as "fn:name": goal, live, ok
   api passed to mount: input(partial) (learner change: onSet + tries), get() (state + out), redraw(),
     step() -> {idx, type, step, free} (e.g. which drawing parts may be dragged now).

   Controls (the tray shows only the step's `controls`; free play shows content `freeControls` or all of them):
     slider  {min, max, step, unit, fmt(v)}: - / + steppers (hold to repeat), range, tap the value to type it
     chips   {options:[{v, t}]}: one choice
     hold    {key, on = 1, label, hotkey}: PRESS-AND-HOLD TO RUN. state[key] = on while the button is held (pointer,
             Space / Enter on the focused button, or the optional hotkey anywhere on the page), 0 on release, lost
             pointer capture, blur or leaving the page. The scene moves on its own clock (advance), so in ?capture=1
             a script does the same with sim.set({key: 1}) ... sim.set({key: 0}) on the virtual clock. 52 px tall.
             Dragging the part itself in the drawing is the scene's job (drag + api.input).
     custom  {html(state)}: scene-made markup (e.g. a crane pendant); any element in it with data-hk="key" is a
             hold-to-run button for state[key] (same rules as hold) and has class "on" while state[key] is truthy.
   Content (content.json page): what, steps, free, freeControls, capture: 'stage' (video layout: ?capture=1 shows only
     the stage and readouts and never applies lesson steps; without it capture keeps the full page as before).
   Step extras: callout [{id, text, pos}] (shown while the step is on), live (a line under the instruction, refreshed
     every frame: "fn:name" or a template "{key:1}" / "{out.x:0}" / "{out.util:%}"), wrong [{when: goal, say}] (shown
     while it matches), points [..] (teach: a short list), hint2 on question variants.
   Goal matchers per key (state key or out.* path): value · [min, max] · {in} · {gte|lte|gt|lt} · {near, tol} · {not};
     or "fn:name" for the whole goal.
   Video contract (?capture=1): window.sim.set / callout / clear / advance / isIdle / ready / get / onChange.
     sim.set({snap: true, ...}) resets to the page defaults first (no tweens), then applies the rest. */
(function () {
'use strict';
const Q = new URLSearchParams(location.search), CAPTURE = Q.has('capture');
const $ = (s, r = document) => r.querySelector(s), el = (t, a = {}, h = '') => { const e = document.createElement(t); for (const k in a) e.setAttribute(k, a[k]); if (h) e.innerHTML = h; return e; };
const md = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n\n/g, '<br><br>');
const NS = 'http://www.w3.org/2000/svg';

window.CFShell = { start };

function start(C, S) {
  const log = [], T0 = performance.now(), L = (type, d = {}) => log.push({ t: Math.round(performance.now() - T0), type, ...d });
  let state = Object.assign({}, S.defaults), out = S.calc(state), tweens = [], listeners = [], dirty = true;
  let idx = 0, phase = 'step', hintLvl = 0, done = new Set(), helped = new Set(), qv = {}, qState = null, goalSince = null;
  let free = false, challenge = null, chalN = 0, finished = false;
  const N = C.lesson.pages.length, PN = C.n, steps = C.steps;
  const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
  const KEY = 'cf-lp:' + C.lesson.id;
  const prefs = (() => { try { return JSON.parse(store && store.getItem('cf-voice') || '{}'); } catch (e) { return {}; } })();
  let muted = !!prefs.muted, rate = prefs.rate || 1;

  /* ---------------------------------------------------------------- layout */
  document.body.innerHTML = '';
  const STAGE_ONLY = CAPTURE && C.capture === 'stage';
  if (STAGE_ONLY) document.body.classList.add('capture');
  const app = el('div', { class: 'app' });
  const dots = C.lesson.pages.map((p, i) => `<i class="${i + 1 < PN ? 'done' : i + 1 === PN ? 'on' : ''}" title="${p.title}"></i>`).join('');
  app.innerHTML = `<header class="bar">
    <button class="btn" id="b-back" aria-label="Back">&#9664; Back</button>
    <div class="title"><div class="kick">${C.lesson.title.toUpperCase()} · PAGE ${PN} OF ${N}</div><div class="h">${C.title}</div></div>
    <div class="dots" aria-label="page ${PN} of ${N}">${dots}</div>
    <div class="voice"><button class="btn" id="b-mute" aria-label="Voice on or off"></button><button class="btn" id="b-rate" aria-label="Voice speed"></button></div>
    <button class="btn pri" id="b-next" aria-label="Next page">${PN === N ? 'Finish' : 'Next'} &#9654;</button></header>
  <section class="what" id="what"><button class="wt" id="b-what" aria-expanded="false">WHAT YOU'RE LOOKING AT <span class="chev">&#9662;</span></button><div class="wx">${md(C.what)}</div></section>
  <div class="main"><div class="stage" id="stage"><svg id="sv" xmlns="${NS}" viewBox="${S.viewBox || '0 0 1600 880'}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${C.title} simulator"></svg>
    <div class="caption" id="caption" role="status"></div><div class="read" id="read"></div></div>
    <aside class="side"><div class="card step" id="stepcard" aria-live="polite"></div><div class="card ctrlcard" id="tray"></div></aside></div>`;
  document.body.appendChild(app);
  const svg = $('#sv'), card = $('#stepcard'), tray = $('#tray'), read = $('#read'), cap = $('#caption');
  if (S.captionAt) cap.dataset.at = S.captionAt;   // optional: a scene with cards at the top puts the caption at the bottom
  let spotG, calloutG;

  /* phone: the scene crops its drawing to the subject at the stage's own aspect, so labels stay >= 11 px */
  let lastVB = '';
  function fit() {
    const phone = innerWidth < 700 && innerHeight > innerWidth;
    document.body.classList.toggle('phone', phone);
    const asp = Math.max(0.6, Math.min(3, (svg.clientWidth || 1) / (svg.clientHeight || 1)));
    const vb = phone && S.phoneViewBox ? (typeof S.phoneViewBox === 'function' ? S.phoneViewBox(state, asp) : S.phoneViewBox) : (S.viewBox || '0 0 1600 880');
    if (vb !== lastVB) { svg.setAttribute('viewBox', vb); lastVB = vb; }
  }
  addEventListener('resize', fit); fit();
  $('#b-what').onclick = () => { const w = $('#what'); w.classList.toggle('open'); $('#b-what').setAttribute('aria-expanded', w.classList.contains('open')); };

  /* ---------------------------------------------------------------- host / progress (SCORM wrapper or localStorage) */
  const host = (() => { try { return window.parent !== window && window.parent.CFHost ? window.parent.CFHost : null; } catch (e) { return null; } })();
  function progress() {
    if (host) host.page(PN, N, C.file);
    else if (store) { try { const p = JSON.parse(store.getItem(KEY) || '{}'); p.seen = Array.from(new Set((p.seen || []).concat([PN]))); p.last = PN; if (PN === N) p.complete = true; store.setItem(KEY, JSON.stringify(p)); } catch (e) {} }
  }
  const firstVisit = !(store && store.getItem(KEY));
  progress();
  const go = d => {
    stopVoice();
    const target = PN + d;
    if (target < 1) return;
    if (target > N) { finish(); return; }
    L('page', { to: target });
    if (host && host.go) host.go(target); else location.href = C.lesson.pages[target - 1].file + (CAPTURE ? '?capture=1' : '');
  };
  $('#b-back').onclick = () => go(-1); $('#b-next').onclick = () => go(1);
  if (PN === 1) $('#b-back').disabled = true;

  /* ---------------------------------------------------------------- voice (Kokoro af_heart clips beside the page) */
  const audio = new Audio(); audio.preload = 'auto';
  let voiceOK = false, queue = [];
  function setVoiceUI() {
    $('#b-mute').innerHTML = muted ? '&#128263;<span class="vt"> Off</span>' : '&#128266;<span class="vt"> On</span>'; $('#b-mute').classList.toggle('off', muted);
    $('#b-rate').textContent = rate === 1 ? '1×' : '0.8×';
    try { store && store.setItem('cf-voice', JSON.stringify({ muted, rate })); } catch (e) {}
  }
  setVoiceUI();
  $('#b-mute').onclick = () => { muted = !muted; setVoiceUI(); if (muted) stopVoice(); else speak(curKey()); L('voice', { muted }); };
  $('#b-rate').onclick = () => { rate = rate === 1 ? 0.8 : 1; audio.playbackRate = rate; setVoiceUI(); };
  function stopVoice() { queue = []; try { audio.pause(); } catch (e) {} }
  function speak(...keys) {
    queue = keys.filter(k => k && C.audio && C.audio[k]);
    try { audio.pause(); } catch (e) {}
    playNext();
  }
  function playNext() {
    if (muted || !voiceOK || CAPTURE || !queue.length) return;
    const k = queue.shift();
    audio.src = (C.audioBase || 'audio/') + C.audio[k]; audio.playbackRate = rate;
    if ('preservesPitch' in audio) audio.preservesPitch = true;
    audio.play().catch(() => { showStart(); });
  }
  audio.addEventListener('ended', () => setTimeout(playNext, 250));
  function curKey() { if (free) return challenge ? null : 'free'; const st = steps[idx]; if (!st) return null; if (st.type === 'question') return `s${idx}v${(qv[idx] || 0) % st.variants.length}`; return 's' + idx; }
  function showStart() {
    if (CAPTURE || $('#start')) return;
    const first = PN === 1 && firstVisit;
    const o = el('div', { id: 'start' }, `<div class="box"><h2>${first ? C.lesson.title : C.title}</h2><p>${first ? 'The narrator reads each step aloud. You can mute it or slow it down at the top right.' : 'Tap to hear this page read aloud.'}</p>
      <button class="btn pri" id="b-start">&#9654; ${first ? 'Start lesson' : 'Start page'}</button> <button class="btn" id="b-quiet">Read it myself</button></div>`);
    document.body.appendChild(o);
    $('#b-start').onclick = () => { o.remove(); voiceOK = true; muted = false; setVoiceUI(); speak('what', curKey()); L('start'); };
    $('#b-quiet').onclick = () => { o.remove(); voiceOK = true; muted = true; setVoiceUI(); L('start', { quiet: true }); };
  }

    if (i === v.answer) { qState = 'right'; done.add(idx); if (v.show) set(v.show, 1200); }
    else qState = 'wrong';
    renderStep();
  }
  function newQuestion() {
    if (challenge) { return nextChallenge(); }
    const st = steps[idx]; qv[idx] = (qv[idx] || 0) + 1; qState = null; qPick = null; hintLvl = 0;
    const v = st.variants[qv[idx] % st.variants.length]; if (v.setup) set(v.setup, 0);
    L('newq', { step: idx, v: qv[idx] % st.variants.length }); renderStep(); speak(curKey());
  }
  function hint() {
    if (challenge) { hintLvl++; renderFree(); return; }
    const st = steps[idx]; hintLvl = Math.min(2, hintLvl + 1); L('hint', { step: idx, lvl: hintLvl });
    renderStep();
    if (hintLvl >= 2) spot(st.hintSpot ? [].concat(st.hintSpot) : (st.spot ? [].concat(st.spot) : []), st.controls || []);
  }
  function showMe() {
    if (challenge) { challenge.shown = true; renderFree(); return; }
    const st = steps[idx]; L('showme', { step: idx }); helped.add(idx);
    if (st.type === 'question') { qState = 'shown'; renderStep(); return; }
    if (st.solve) { set(fn(st.solve) ? fn(st.solve)(state, out) : st.solve, st.solveDur || 1600); renderTray(); }
    renderStep(); spot(st.spot ? [].concat(st.spot) : [], st.controls || []);
  }

  /* ---------------------------------------------------------------- free play */
  const allKeys = (C.freeControls || Object.keys(S.controls)).filter(k => S.controls[k] && !(S.controls[k].lessonOnly));
  function enterFree() { stopVoice(); free = true; challenge = null; spot([], []); releaseAll(); window.sim.clear(); L('free'); renderFree(); speak('free'); }
  function renderFree() {
    card.className = 'card step free';
    let h = stepHead('FREE PLAY · EVERYTHING UNLOCKED');
    if (!challenge) {
      h += `<p>${md(C.free)}</p><div class="row">${S.challenge ? '<button class="btn pri" id="b-chal">&#127919; Give me a challenge</button>' : ''}<button class="btn" id="b-reset">&#8634; Reset</button>${PN < N ? `<button class="btn" id="b-np">Next page &#9654;</button>` : ''}</div>`;
    } else if (challenge.game) {      // a job to do on the simulator: goal(state, out, seconds) -> {live, done, ok, msg}
      const c = challenge;
      h += `<h3 style="font-size:17px;margin:4px 0 8px">${md(c.q)}</h3><div class="note" id="glive">${md(c.live || '')}</div>`;
      if (c.result) h += `<div class="${c.result.ok ? 'good' : 'bad'}"><b>${c.result.ok ? 'Done.' : 'Not this time.'}</b> ${md(c.result.msg)}</div>`;
      h += `<div class="row">${c.result ? '<button class="btn pri" id="b-newq">Try another &#9654;</button>' : ''}<button class="btn" id="b-reset">&#8634; Reset</button></div>`;
    } else {
      const c = challenge;
      h += `<h3 style="font-size:17px;margin:4px 0 8px">${md(c.q)}</h3>`;
      const ord = c.ord || (c.ord = perm(c.choices.length, chalN * 13 + 5));
      if (c.state === 'wrong') h += opts(c.choices, ord, i => i === c.pick ? 'wrong' : '') + `<div class="bad"><b>Not quite.</b> ${md(c.choices[c.pick].why)}</div>`;
      else if (c.state === 'right' || c.shown) h += opts(c.choices, ord, i => i === c.answer ? 'right' : '') + `<div class="good"><b>${c.state === 'right' ? 'Right.' : 'Here is how.'}</b> ${md(c.explain)}</div>`;
      else h += opts(c.choices, ord, () => '', true) + (hintLvl ? `<div class="hint">${md(c.hint)}</div>` : '');
      h += `<div class="row">${c.state === 'wrong' || c.state === 'right' || c.shown ? '<button class="btn pri" id="b-newq">Try a new question &#9654;</button>' : '<button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; Show me</button>'}<button class="btn" id="b-reset">&#8634; Reset</button></div>`;
    }
    card.innerHTML = h; wireHead();
    renderTray(challenge ? (challenge.game ? (challenge.controls || allKeys) : []) : allKeys);
    const ch = $('#b-chal'); if (ch) ch.onclick = () => nextChallenge();
    const rs = $('#b-reset'); if (rs) rs.onclick = () => reset();
    const np = $('#b-np'); if (np) np.onclick = () => go(1);
    const nq = $('#b-newq'); if (nq) nq.onclick = () => nextChallenge();
    const hb = $('#b-hint'); if (hb) hb.onclick = () => hint();
    const sb = $('#b-show'); if (sb) sb.onclick = () => showMe();
    card.querySelectorAll('.opt[data-i]').forEach(b => b.onclick = () => { const c = challenge; c.pick = +b.dataset.i; c.state = c.pick === c.answer ? 'right' : 'wrong'; L('challenge', { right: c.state === 'right' }); renderFree(); });
  }
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function nextChallenge() {
    chalN++; hintLvl = 0;
    const c = S.challenge(rng(PN * 1000 + chalN * 7919 + (Q.get('seed') | 0)), chalN);
    if (c.setup) set(c.setup, 0);
    challenge = Object.assign({ state: null, pick: null }, c); free = true; L('challenge', { n: chalN }); renderFree();
  }
  function reset() { tweens = []; held.clear(); S.reset && S.reset(); state = Object.assign({}, S.defaults); out = S.calc(state); S.apply(state, null, true); dirty = true; challenge = null; L('reset'); renderFree(); }

  function finish() {
    finished = true; stopVoice(); L('finish'); if (host && host.finish) host.finish();
    card.className = 'card step free';
    card.innerHTML = `<div class="sh"><b>LESSON COMPLETE</b></div><p>${md(C.lesson.done)}</p><div class="row">${C.lesson.sheet ? `<a class="btn pri" href="${C.lesson.sheet}" target="_blank" rel="noopener">&#128196; Summary sheet (PDF)</a>` : ''}<button class="btn" id="b-again">Back to free play</button></div>`;
    tray.innerHTML = ''; $('#b-again').onclick = () => enterFree();
    speak('done');
  }

  /* ---------------------------------------------------------------- loop */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    if (!CAPTURE) advance(dt);
    requestAnimationFrame(frame);
  }
  S.apply(state, null, true); render();
  enter(0, { quiet: true, noSetup: STAGE_ONLY });     // a video page starts from the page defaults: the script sets it up
  if (!CAPTURE) {
    requestAnimationFrame(frame);
    if ((PN === 1 && firstVisit) || host && host.fresh) showStart();
    else { voiceOK = true; speak('what', curKey()); }      // later pages: autoplay; if the browser refuses, play() shows the Start tap
  }
  if (CAPTURE) { voiceOK = false; }
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight' && e.altKey) go(1); if (e.key === 'ArrowLeft' && e.altKey) go(-1); });
  window.sim.ready = true;

  /* test / run-through API */
  window.lessonPage = {
    log, state: () => ({ page: PN, pages: N, idx, type: steps[idx] && steps[idx].type, steps: steps.length, done: Array.from(done), helped: Array.from(helped), free, challenge: challenge ? { state: challenge.state, answer: challenge.answer, game: !!challenge.game, result: challenge.result || null } : null,
      qState, variant: qv[idx] || 0, answer: steps[idx] && steps[idx].type === 'question' ? steps[idx].variants[(qv[idx] || 0) % steps[idx].variants.length].answer : steps[idx] && steps[idx].answer, finished, voiceOK, muted, rate, sim: full() }),
    defaults: () => Object.assign({}, S.defaults), enter, nextStep, hint, showMe, choose, newQuestion, enterFree, reset, nextChallenge, finish, startVoice: () => { const b = $('#b-quiet'); if (b) b.click(); },
  };
}
})();

<script>(function(){const C={"n":4,"file":"04-brinell.html","title":"Brinell: a big ball and a microscope","scene":"hd-brin","capture":"stage","what":"A bench **hydraulic Brinell tester**. A **10 mm** tungsten-carbide **ball** is pressed into the piece by the **pump**; the **load gauge** reads kilograms force and the relief holds the set load. After the load is released you measure the **diameter** of the round dent with a **measuring microscope** (0.1 mm marks), twice, at 90°.","start":{"part":"shaft","F":3000},"steps":[{"type":"teach","text":"Brinell measures the **width** of a big dent. The 10 mm ball and 3,000 kgf cover a lot of metal, so it reads well on **castings, forgings and coarse-grained metal**. Soft metals get a lower force: 500 or 1,000 kgf.","points":["Steel and cast iron: 3,000 kgf","Aluminium, brass: 500 or 1,000 kgf","Hold the load 10 to 15 s"]},{"type":"do","text":"Hold **Hold to pump** until the gauge reaches **3,000 kgf**.","controls":["pump"],"goal":{"made":1},"solve":{"load":3000,"made":1},"hint":"Press and hold the pump button.","ok":"At 3,000 kgf the relief floats: the load holds by itself."},{"type":"do","text":"Count it: keep the load on for **10 to 15 seconds**, then **open the release valve**.","controls":["valve"],"goal":"fn:held_ok","solve":{"held":12,"valve":"open"},"hold":300,"live":"fn:held_live","wrong":[{"when":{"valve":"open","held":{"lt":10}},"say":"Released too soon: under 10 s. Close the valve, pump again on a new spot."}],"hint":"Watch the Held timer, open the valve between 10 and 15 s.","ok":"Load off. The ball lifts out of a round dent."},{"type":"do","text":"Read **d1** across, then turn the eyepiece **90°** and read **d2**.","controls":["eye"],"goal":{"seen":3},"solve":{"eye":90,"seen":3},"hint":"Tap 90° (d2).","ok":"fn:read_ok","say":"Read d one across, then turn the eyepiece ninety degrees and read d two."},{"type":"teach","text":"Average the two: d = (d1 + d2) ÷ 2. Then **HB = 2F ÷ (π D (D − √(D² − d²)))**: the force over the dent's curved area. Most shops read HB off the table that comes with the microscope.","points":["d = 3.59 mm at 3,000 kgf → 286 HB","Valid d: 2.40 to 6.00 mm (0.24 D to 0.6 D)","Write the force: HBW 10/3000"],"spot":["c-maths"],"say":"Average the two: d equals d one plus d two, divided by two. Then Brinell equals two F, divided by pi D times D minus the square root of D squared minus d squared: the force over the dent's curved area. Most shops read Brinell off the table that comes with the microscope."},{"type":"do","setup":{"part":"alu","F":3000,"made":1,"held":12,"valve":"open","seen":3,"load":0},"text":"An **aluminium** bracket was tested at **3,000 kgf**: d is over 6.00 mm, **not valid**. Retest it at **500 kgf**: force, pump, hold, release, read both ways.","controls":["F","pump","valve","eye"],"goal":"fn:alu_ok","solve":{"F":500,"made":1,"held":12,"valve":"open","seen":3,"load":0},"live":"fn:alu_live","hold":300,"hint":"Pick 500 kgf, close the valve, pump, hold 10 s, open, read d1 and d2.","ok":"At 500 kgf, d = 2.64 mm: valid. About 90 HB."},{"type":"question","variants":[{"q":"Brinell, 10 mm ball, **3,000 kgf**, d = **3.59 mm**. HB?","choices":[{"t":"286 HB"},{"t":"532 HB","why":"That uses d instead of the cap: use D − √(D² − d²)."},{"t":"143 HB","why":"The formula has 2F on top."},{"t":"60 HB","why":"Put the dent diameter d in the formula, not twice d."}],"answer":0,"explain":"√(100 − 12.89) = 9.333; 2 × 3,000 ÷ (π × 10 × 0.667) = **286 HB**."},{"q":"Brinell, **3,000 kgf**, d = **4.27 mm**. HB?","choices":[{"t":"200 HB"},{"t":"447 HB","why":"Use the cap D − √(D² − d²), not d."},{"t":"100 HB","why":"The formula has 2F on top: you halved the answer."},{"t":"35 HB","why":"Put the dent diameter d in the formula, not twice d."}],"answer":0,"explain":"√(100 − 18.23) = 9.043; 6,000 ÷ (π × 10 × 0.957) = **200 HB** (grey cast iron)."},{"q":"Brinell, **500 kgf**, d = **2.64 mm**. HB?","choices":[{"t":"90 HB"},{"t":"121 HB","why":"Use the cap D − √(D² − d²)."},{"t":"45 HB","why":"The formula has 2F on top: you halved the answer."},{"t":"541 HB","why":"That is the 3,000 kgf answer: use F = 500."}],"answer":0,"explain":"√(100 − 6.97) = 9.645; 1,000 ÷ (π × 10 × 0.355) = **90 HB**."},{"q":"Brinell, **3,000 kgf**, d = **4.00 mm**. HB?","choices":[{"t":"229 HB"},{"t":"477 HB","why":"Use the cap D − √(D² − d²) under the line, not d."},{"t":"114 HB","why":"The formula has 2F on top: you halved the answer."},{"t":"48 HB","why":"Put the dent diameter d in the formula, not twice d."}],"answer":0,"explain":"√(100 − 16) = 9.165; 6,000 ÷ (π × 10 × 0.835) = **229 HB**."}]},{"type":"question","variants":[{"q":"At 3,000 kgf a soft part gives **d = 6.2 mm**. What now?","choices":[{"t":"Not valid (over 0.6 D): retest at a lower force"},{"t":"Report it: big dent = soft","why":"Over 6.00 mm the test is out of range."},{"t":"Retest at a higher force","why":"That makes the dent bigger."},{"t":"Use a smaller microscope","why":"The dent is too big for the test, not the scope."}],"answer":0,"explain":"Valid d is **2.40 to 6.00 mm**. Too big: lower force (500 or 1,000 kgf)."},{"q":"Why read the dent **twice, at 90°**?","choices":[{"t":"Dents are rarely perfectly round: average the two"},{"t":"To check the microscope","why":"It is about the dent's shape."},{"t":"The standard wants two dents","why":"Two readings of one dent."},{"t":"To get d1 + d2 for the formula","why":"Use the average, not the sum."}],"answer":0,"explain":"d = (d1 + d2) ÷ 2."},{"q":"How long is the load held in a standard steel Brinell test?","choices":[{"t":"10 to 15 seconds"},{"t":"1 to 2 seconds","why":"Too short: the ball is still sinking."},{"t":"1 minute","why":"Longer than standard; it must be reported."},{"t":"Until the gauge reads zero","why":"The load holds at the set force."}],"answer":0,"explain":"**10 to 15 s** (HBW 10/3000)."}]}],"free":"Test each piece at each force. Watch which ones land inside 2.40 to 6.00 mm. Tap **Give me a challenge** for an HB sum.","freeControls":["part","F","pump","valve","eye","units"],"lesson":{"id":"hardness","title":"Hardness testing","episode":"069-hardness-testing","done":"You finished **Hardness testing**. Print the summary sheet to keep the formulas and the rules. On the job, follow the tester maker's manual, the drawing or spec, and your work plan.","sheet":"hardness-summary.pdf","summary":{"title":"Hardness testing","pic":{"page":2,"state":{"placed":1,"lift":1,"zero":1,"lever":"trip"}},"rules":["Hardness = how well a metal resists being dented. Harder steel wears less but is more brittle; heat treatment changes it. Check parts against the drawing or spec.","Test files (40 to 65 HRC): a file that bites is harder than the piece; one that skates is not. The answer is a bracket (\"between 55 and 60 HRC\"), a check, not a measurement.","Rockwell: minor load 10 kgf sets zero, the major load pushes the indenter in, release back to the minor load and read the depth that stayed. HR = N − h ÷ 0.002 mm (one point = 0.002 mm).","C scale: diamond cone, 150 kgf total, N = 100, black numbers: hardened steel. B scale: 1/16 in ball, 100 kgf total, N = 130, red numbers: soft steel, brass, aluminium.","Under HRC 20 or over HRB 100 the reading is not valid: change scales. Never put the ball on hardened steel: the reading is wrong and a steel ball can flatten.","Brinell: 10 mm ball, 3,000 kgf for steel and cast iron (500 or 1,000 kgf for soft metals), hold 10 to 15 s, read d twice at 90°. HB = 2F ÷ (π D (D − √(D² − d²))). Valid d: 2.40 to 6.00 mm.","Valid test: piece at least 10 × the indent depth thick, centre at least 2.5 d from an edge, indents at least 3 d apart, flat, clean surface square to the indenter.","HRC ↔ HB ↔ tensile tables (ASTM E140) are approximate and for steel only: report the scale you tested on (e.g. 30 HRC ≈ 286 HB ≈ 965 MPa / 140 ksi)."]},"footer":"Exam prep, not a procedure: on the job, follow the tester maker's manual, the drawing or spec, and your site procedures. ASTM E18 (Rockwell), ASTM E10 / ISO 6506-1 (Brinell) and ASTM E140 (conversions) are cited by number.","pages":[{"file":"01-file-test.html","title":"Hardness and the file test"},{"file":"02-rockwell-c.html","title":"Rockwell C, step by step"},{"file":"03-rockwell-b.html","title":"Rockwell B and picking the scale"},{"file":"04-brinell.html","title":"Brinell: a big ball and a microscope"},{"file":"05-valid-test.html","title":"Valid tests and conversions"},{"file":"06-putting-it-together.html","title":"Putting it together: check a shaft"}]},"audio":{"what":"p4-what-2034104e.mp3","s0":"p4-s0-6c229ed9.mp3","s1":"p4-s1-cf5c6165.mp3","s2":"p4-s2-846c7a50.mp3","s3":"p4-s3-ea0a077a.mp3","s4":"p4-s4-95e9f532.mp3","s5":"p4-s5-c680d9f2.mp3","s6v0":"p4-s6v0-ecc66a87.mp3","s6v1":"p4-s6v1-be28e483.mp3","s6v2":"p4-s6v2-75bbc86a.mp3","s6v3":"p4-s6v3-d3329b36.mp3","s7v0":"p4-s7v0-286c940f.mp3","s7v1":"p4-s7v1-65996349.mp3","s7v2":"p4-s7v2-d5250997.mp3","free":"p4-free-181a67ac.mp3"},"audioBase":"audio/"};CFShell.start(C, MetAdapter(C, window.LESSON_CODE["hardness"][C.n]));})();</script>
