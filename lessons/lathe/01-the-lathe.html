 * Numbers: U of T MIE Module 3 (turning speeds Table 1.3.1, feeds Table 1.3.2, depth takes twice off the diameter),
 * MD (RPM formulas), Open WA Intro to Machining 10.8 / 10.13, Grizzly G0746 (3 × D), CCOHS lathes. Every answer is
 * computed here from the same LK / MD functions the scenes use; simulators/machining/test/test_lathe.py repeats them.
 */
(function () {
const K = window.CFK, C = K.C, LK = window.LK, MD = window.MD;
const pick = (rng, a) => a[Math.floor(rng() * a.length)];
const ch = (t, why) => (why ? { t, why } : { t });
const shuffle = (rng, choices, answer) => { const idx = choices.map((c, i) => i).sort(() => rng() - .5); return { choices: idx.map(i => choices[i]), answer: idx.indexOf(answer) }; };
const n0 = K.n0, in3 = v => v.toFixed(3) + ' in';
const PARTS = { head: 'Headstock', chuck: 'Chuck', carr: 'Carriage', cross: 'Cross-slide', comp: 'Compound rest', tail: 'Tailstock', lead: 'Lead screw and feed rod', bed: 'Bed and ways' };

/* the job card on page 7: [text, done] */
window.LATHE_JOB = (S, o) => [
  ['Speed: 320 RPM (or the step below)', S.spd === 5],
  ['Dial 0.125 in → 1.250 in OD', Math.abs(o.Dafter - 1.25) < 1e-6],
  ['Finishing feed, last pass', S.feedc === 'fin'],

  const i = Math.floor(rng() * 6), D = met ? LK.DMM[i] : LK.DIN[i], sp = LK.speed(mat, tool, D, met), m = LK.MAT[mat];

  const wrong = met ? [[cs * 1000 / D, 'You left out π.'], [cs * Math.PI * D / 1000, 'That is the surface speed formula turned around.'], [sp.calc * 3, 'That is about the carbide figure.']]
    : [[cs * D / 4, 'Upside down: RPM = CS × 4 ÷ D.'], [cs * 4 * D, 'Divide by D; don\'t multiply.'], [cs / D, 'You left out the 4 (12 ÷ π).']];

    choices: sh.choices, answer: sh.answer, explain: met ? `RPM = 1000 × ${cs} ÷ (π × ${D}) = ${right}. Set the lathe at that speed or the step below.` : `RPM = ${cs} × 4 ÷ ${D} = ${right}. Set the lathe at that speed or the step below.` };

function depthQ(rng) {
  const D = pick(rng, [1, 1.25, 1.5, 2, 2.5]), d = Math.round(pick(rng, [.010, .020, .025, .030, .050, .060, .075]) * 1000) / 1000, rad = rng() < .8;
  const after = rad ? D - 2 * d : D - d;
  const sh = shuffle(rng, [ch(in3(after)), ch(in3(rad ? D - d : D - 2 * d), rad ? 'The tool cuts both sides of the turning work: 2 × the dial.' : 'This dial already reads the diameter.'), ch(in3(D - d / 2), 'Half is wrong both ways.'), ch(in3(D - 4 * d), 'Twice, not four times.')], 0);
  return { q: `${D.toFixed(3)} in bar. You feed the cross-slide in **${d.toFixed(3)} in** on a dial that reads ${rad ? '**tool movement** (radius)' : 'the **diameter**'}. What diameter after the pass?`,
    choices: sh.choices, answer: sh.answer, explain: rad ? `${D.toFixed(3)} − 2 × ${d.toFixed(3)} = ${in3(after)}.` : `A diameter dial: ${D.toFixed(3)} − ${d.toFixed(3)} = ${in3(after)}.` };

    challenge: (rng) => {

      const [q, a] = pick(rng, qs), keys = ['head', 'cross', 'comp', 'tail', 'carr', 'lead'];

      return { setup: { jaws: '4', off, run: 0, key: 'out' }, q: `Four-jaw chuck: the stock sits **${off.toFixed(3)} in** off the spindle axis. What total reading (TIR) does the dial indicator swing through in one turn?`,
        choices: sh.choices, answer: sh.answer, explain: `TIR = 2 × ${off.toFixed(3)} = ${in3(2 * off)}. Move the stock half the reading toward the low side.` };

  },
  5: {

      ['Overhang', K.n1(o.overX) + ' × shank', o.chat ? C.bad : C.ok], ['Pass', Math.round(S.pass * 100) + ' %']],

    challenge: (rng) => {

    challenge: (rng) => {

<script>/* CrewForge simulator-lesson page shell (instructor 2026-11-13, docs/LESSON_DESIGN.md). One page = one idea.
   Runs a page scene (CFShell.start(content, scene)) inside the approved layout:
   top bar (Back, lesson + page n of N, progress dots, voice mute + speed, Next: nothing locks) -> "What you're looking
   at" (fixed per page) -> simulator + readouts -> step box (fixed per step: instruction, Hint, Show me) -> control tray
   (only this step's controls). Steps: teach -> do -> predict -> fail -> question; then free play (everything unlocked,
   Reset, "Give me a challenge"). Questions are practice: a wrong pick gets a red outline and the explanation of that
   mistake, then "Try a new question" serves a different variant until one is right. In Moodle the SCORM host page
   (tools/lesson_pages.py) scores the question steps: CFHost.answer(page, step, right) on the first pick or Show me
   (the host keeps the first result; pass 80 %); free-play challenges never count.

   Scene interface (one per page):
     defaults {}, controls {key: {type:'slider'|'chips'|'hold'|'custom', label, ...}} (below),
     mount(svg, api), apply(state, prev, initial), advance(ms, state), calc(state) -> out,
     readouts(state, out) -> [{label, short, value, cls:'ok'|'warn'|'bad', color, id}],
     caption(state, out) -> null | {kind:'fail'|'warn', title, text}, spot(id) -> [x, y, r] (svg units),
     drag (optional, wired by the scene; it calls api.input(partial)), challenge(rng, n) -> question, busy() -> bool,
     phoneViewBox, viewBox, reset().
     Optional generic hooks (added 2026-11-13 for the hoisting and block-and-tackle ports):
       instant: [keys]            never tweened by sim.set(partial, ms) (e.g. a hoist size that rebuilds the rig)
       onSet(state, keys)         after every sim.set / learner input (not on tween frames): rebuild what those keys need
       normalize(state)           after any change, before calc()
       callout(id, text, o) / clear()   the scene draws video callouts itself (return false to fall back to spot())
       fns {name: (state, out) => any}  step fields given as "fn:name": goal, live, ok
   api passed to mount: input(partial) (learner change: onSet + tries), get() (state + out), redraw(),
     step() -> {idx, type, step, free} (e.g. which drawing parts may be dragged now).

   Controls (the tray shows only the step's `controls`; free play shows content `freeControls` or all of them):
     slider  {min, max, step, unit, fmt(v)}: - / + steppers (hold to repeat), range, tap the value to type it
     chips   {options:[{v, t}]}: one choice
     hold    {key, on = 1, label, hotkey}: PRESS-AND-HOLD TO RUN. state[key] = on while the button is held (pointer,
             Space / Enter on the focused button, or the optional hotkey anywhere on the page), 0 on release, lost
             pointer capture, blur or leaving the page. The scene moves on its own clock (advance), so in ?capture=1
             a script does the same with sim.set({key: 1}) ... sim.set({key: 0}) on the virtual clock. 52 px tall.
             Dragging the part itself in the drawing is the scene's job (drag + api.input).
     custom  {html(state)}: scene-made markup (e.g. a crane pendant); any element in it with data-hk="key" is a
             hold-to-run button for state[key] (same rules as hold) and has class "on" while state[key] is truthy.
   Content (content.json page): what, steps, free, freeControls, capture: 'stage' (video layout: ?capture=1 shows only
     the stage and readouts and never applies lesson steps; without it capture keeps the full page as before).
   Mentor pattern (instructor 2026-11-15, docs/LESSON_DESIGN.md "Mentor pattern"): tag "On the job" / "Now you know" on a
     step shows as a label before "STEP n OF m"; ok (do / fail / predict-with-goal) and after (predict) are voiced when
     they appear (clips s<i>ok, s<i>after; a page without them stays silent there); a predict with a goal ("ask, then
     find out") takes thinkHint (the hint before the pick), live / wrong while the learner works, ok when it is done.
   Step extras: callout [{id, text, pos}] (shown while the step is on), live (a line under the instruction, refreshed
     every frame: "fn:name" or a template "{key:1}" / "{out.x:0}" / "{out.util:%}"), wrong [{when: goal, say}] (shown
     while it matches), points [..] (teach: a short list), hint2 on question variants.
   Goal matchers per key (state key or out.* path): value · [min, max] · {in} · {gte|lte|gt|lt} · {near, tol} · {not};
     or "fn:name" for the whole goal.
   Video contract (?capture=1): window.sim.set / callout / clear / advance / isIdle / ready / get / onChange.
     sim.set({snap: true, ...}) resets to the page defaults first (no tweens), then applies the rest. */
(function () {
'use strict';
const Q = new URLSearchParams(location.search), CAPTURE = Q.has('capture');

    <button class="btn pri" id="b-next" aria-label="Next page">${PN === N ? 'Finish' : 'Next'} &#9654;</button></header>
  <section class="what" id="what"><button class="wt" id="b-what" aria-expanded="false">WHAT YOU'RE LOOKING AT <span class="chev">&#9662;</span></button><div class="wx">${md(C.what)}</div></section>
  <div class="main"><div class="stage" id="stage"><svg id="sv" xmlns="${NS}" viewBox="${S.viewBox || '0 0 1600 880'}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${C.title} simulator"></svg>

      else {
        // answered: keep only the right choice and the learner's pick, so the explanation and the tray stay on screen
        h += st.choices.map((c, i) => i !== st.answer && i !== predPick ? '' : `<button class="opt ${i === st.answer ? 'right' : 'wrong'}" disabled>${String.fromCharCode(65 + i)}. ${md(c)}</button>`).join('');
        h += `<div class="${predPick === st.answer ? 'good' : 'bad'}"><b>${predPick === st.answer ? 'Right.' : 'Watch.'}</b> ${md(st.after)}</div>`;
        if (st.goal && !isDone) h += `<p style="font-size:16px">${md(st.doText)}</p>` + (st.live || st.wrong ? '<div class="note" id="live"></div>' : '') + hintBlock(st) + hintButtons(st);
        else h += (st.goal && st.ok ? `<div class="good"><b>Done.</b> ${md(fn(st.ok) ? tpl(st.ok) : st.ok)}</div>` : '') + `<div class="row"><button class="btn pri" id="b-ok">Next step &#9654;</button></div>`;
      }
    } else if (st.type === 'question') {
      const vi = (qv[idx] || 0) % st.variants.length, v = st.variants[vi], ord = perm(v.choices.length, PN * 1000 + idx * 37 + vi * 7 + 3);
      h += `<h3>${md(v.q)}</h3>` + refHtml(v.ref || st.ref);
      if (!qState) h += opts(v.choices, ord, () => '', true) + hintBlock({ hint: v.hint || st.hint, hint2: v.hint2 }) +
        `<div class="row"><button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; Show me</button></div>`;
      else if (qState === 'wrong') h += opts(v.choices, ord, i => i === qPick ? 'wrong' : '') +
        `<div class="bad"><b>Not quite.</b> ${md(v.choices[qPick].why)}</div><div class="row"><button class="btn pri" id="b-newq">Try a new question &#9654;</button></div>`;
      else h += opts(v.choices, ord, i => i === v.answer ? (qState === 'right' ? 'right' : 'ans') : '') +
        `<div class="good"><b>${qState === 'right' ? 'Right.' : 'Here is how.'}</b> ${md(v.explain)}</div><div class="row">${qState === 'shown' ? '<button class="btn" id="b-newq">Try a new question</button>' : ''}<button class="btn pri" id="b-ok">${idx === steps.length - 1 ? 'Free play' : 'Next step'} &#9654;</button></div>`;
    }
    card.innerHTML = h; wireHead();
    renderTray(st.type === 'question' ? (st.controls || []) : ctrls);
    const ok = $('#b-ok'); if (ok) ok.onclick = () => { if (st.type === 'teach') { done.add(idx); L('done', { step: idx, how: 'read' }); } nextStep(); };
    const hb = $('#b-hint'); if (hb) hb.onclick = () => hint();
    const sb = $('#b-show'); if (sb) sb.onclick = () => showMe();
    const kb = $('#b-skip'); if (kb) kb.onclick = () => { L('skip', { step: idx }); helped.add(idx); nextStep(); };
    const nq = $('#b-newq'); if (nq) nq.onclick = () => newQuestion();
    card.querySelectorAll('.opt[data-i]').forEach(b => b.onclick = () => choose(+b.dataset.i));
    if (st.spot && !free) spot(Array.isArray(st.spot) ? st.spot : [st.spot], []);
    lastLive = ''; liveLine();
    // phone: the step box scrolls inside itself; bring the newest explanation (the mentor's "that's because") into view
    if (card.querySelector('.good, .bad') && card.scrollHeight > card.clientHeight) card.scrollTop = card.scrollHeight;
  }
  let predPick = null, qPick = null;
  function perm(n, seed) { const r = rng(seed), a = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function opts(ch, ord, cls, live) { return ord.map((j, p) => `<button class="opt ${cls(j)}" ${live ? `data-i="${j}"` : 'disabled'}>${String.fromCharCode(65 + p)}. ${md(ch[j].t)}</button>`).join(''); }
  function choose(i) {
    const st = steps[idx]; L('choose', { step: idx, i });
    if (st.type === 'predict') {
      if (qState) return; predPick = i; qState = 'answered';
      if (st.reveal) set(st.reveal.set, st.reveal.dur || 1500);
      if (!st.goal) done.add(idx);
      renderStep(); speak('s' + idx + 'after'); return;
    }
    if (st.type !== 'question' || qState) return;
    const v = st.variants[(qv[idx] || 0) % st.variants.length]; qPick = i;
    if (i === v.answer) { qState = 'right'; done.add(idx); if (v.show) set(v.show, 1200); }
    else qState = 'wrong';
    if (host && host.answer) host.answer(PN, idx, qState === 'right');    // Moodle score: the host keeps the first result
    renderStep();
  }
  function newQuestion() {
    if (challenge) { return nextChallenge(); }
    const st = steps[idx]; qv[idx] = (qv[idx] || 0) + 1; qState = null; qPick = null; hintLvl = 0;
    const v = st.variants[qv[idx] % st.variants.length]; if (v.setup) set(v.setup, 0);
    L('newq', { step: idx, v: qv[idx] % st.variants.length }); renderStep(); speak(curKey());
  }
  function hint() {
    if (challenge) { hintLvl++; renderFree(); return; }
    const st = steps[idx]; hintLvl = Math.min(2, hintLvl + 1); L('hint', { step: idx, lvl: hintLvl });
    renderStep();
    if (hintLvl >= 2) spot(st.hintSpot ? [].concat(st.hintSpot) : (st.spot ? [].concat(st.spot) : []), st.controls || []);
  }
  function showMe() {
    if (challenge) { challenge.shown = true; renderFree(); return; }
    const st = steps[idx]; L('showme', { step: idx }); helped.add(idx);
    if (st.type === 'question') { qState = 'shown'; if (host && host.answer) host.answer(PN, idx, false); renderStep(); return; }
    if (st.solve) { set(fn(st.solve) ? fn(st.solve)(state, out) : st.solve, st.solveDur || 1600); renderTray(); }
    renderStep(); spot(st.spot ? [].concat(st.spot) : [], st.controls || []);
  }

  /* ---------------------------------------------------------------- free play */
  const allKeys = (C.freeControls || Object.keys(S.controls)).filter(k => S.controls[k] && !(S.controls[k].lessonOnly));
  function enterFree() { stopVoice(); free = true; challenge = null; spot([], []); releaseAll(); window.sim.clear(); L('free'); renderFree(); speak('free'); }
  function renderFree() {
    card.className = 'card step free';
    let h = stepHead('FREE PLAY · EVERYTHING UNLOCKED');
    if (!challenge) {
      h += `<p>${md(C.free)}</p><div class="row">${S.challenge ? '<button class="btn pri" id="b-chal">&#127919; Give me a challenge</button>' : ''}<button class="btn" id="b-reset">&#8634; Reset</button>${PN < N ? `<button class="btn" id="b-np">Next page &#9654;</button>` : ''}</div>`;
    } else if (challenge.game) {      // a job to do on the simulator: goal(state, out, seconds) -> {live, done, ok, msg}
      const c = challenge;
      h += `<h3 style="font-size:17px;margin:4px 0 8px">${md(c.q)}</h3>` + refHtml(c.ref) + `<div class="note" id="glive">${md(c.live || '')}</div>`;
      if (c.result) h += `<div class="${c.result.ok ? 'good' : 'bad'}"><b>${c.result.ok ? 'Done.' : 'Not this time.'}</b> ${md(c.result.msg)}</div>`;
      h += `<div class="row">${c.result ? '<button class="btn pri" id="b-newq">Try another &#9654;</button>' : ''}<button class="btn" id="b-reset">&#8634; Reset</button></div>`;
    } else {
      const c = challenge;
      h += `<h3 style="font-size:17px;margin:4px 0 8px">${md(c.q)}</h3>` + refHtml(c.ref);
      const ord = c.ord || (c.ord = perm(c.choices.length, chalN * 13 + 5));
      if (c.state === 'wrong') h += opts(c.choices, ord, i => i === c.pick ? 'wrong' : '') + `<div class="bad"><b>Not quite.</b> ${md(c.choices[c.pick].why)}</div>`;
      else if (c.state === 'right' || c.shown) h += opts(c.choices, ord, i => i === c.answer ? 'right' : '') + `<div class="good"><b>${c.state === 'right' ? 'Right.' : 'Here is how.'}</b> ${md(c.explain)}</div>`;
      else h += opts(c.choices, ord, () => '', true) + (hintLvl ? `<div class="hint">${md(c.hint)}</div>` : '');
      h += `<div class="row">${c.state === 'wrong' || c.state === 'right' || c.shown ? '<button class="btn pri" id="b-newq">Try a new question &#9654;</button>' : '<button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; Show me</button>'}<button class="btn" id="b-reset">&#8634; Reset</button></div>`;
    }
    card.innerHTML = h; wireHead();
    renderTray(challenge ? (challenge.game ? (challenge.controls || allKeys) : []) : allKeys);
    const ch = $('#b-chal'); if (ch) ch.onclick = () => nextChallenge();
    const rs = $('#b-reset'); if (rs) rs.onclick = () => reset();
    const np = $('#b-np'); if (np) np.onclick = () => go(1);
    const nq = $('#b-newq'); if (nq) nq.onclick = () => nextChallenge();
    const hb = $('#b-hint'); if (hb) hb.onclick = () => hint();
    const sb = $('#b-show'); if (sb) sb.onclick = () => showMe();
    card.querySelectorAll('.opt[data-i]').forEach(b => b.onclick = () => { const c = challenge; c.pick = +b.dataset.i; c.state = c.pick === c.answer ? 'right' : 'wrong'; L('challenge', { right: c.state === 'right' }); renderFree(); });
  }
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function nextChallenge() {
    chalN++; hintLvl = 0;
    const c = S.challenge(rng(PN * 1000 + chalN * 7919 + (Q.get('seed') | 0)), chalN);
    if (c.setup) set(c.setup, 0);
    challenge = Object.assign({ state: null, pick: null }, c); free = true; L('challenge', { n: chalN }); renderFree();
  }
  function reset() { tweens = []; held.clear(); S.reset && S.reset(); state = Object.assign({}, S.defaults); out = S.calc(state); S.apply(state, null, true); dirty = true; challenge = null; L('reset'); renderFree(); }

  function finish() {
    finished = true; stopVoice(); L('finish'); if (host && host.finish) host.finish();
    card.className = 'card step free';
    card.innerHTML = `<div class="sh"><b>LESSON COMPLETE</b></div><p>${md(C.lesson.done)}</p><div class="row">${C.lesson.sheet ? `<a class="btn pri" href="${C.lesson.sheet}" target="_blank" rel="noopener">&#128196; Summary sheet (PDF)</a>` : ''}<button class="btn" id="b-again">Back to free play</button></div>`;
    tray.innerHTML = ''; $('#b-again').onclick = () => enterFree();
    speak('done');
  }

  /* ---------------------------------------------------------------- loop */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    if (!CAPTURE) advance(dt);
    requestAnimationFrame(frame);
  }
  S.apply(state, null, true); render();
  enter(0, { quiet: true, noSetup: STAGE_ONLY });     // a video page starts from the page defaults: the script sets it up
  if (!CAPTURE) {
    requestAnimationFrame(frame);
    if ((PN === 1 && firstVisit) || host && host.fresh) showStart();
    else { voiceOK = true; speak('what', curKey()); }      // later pages: autoplay; if the browser refuses, play() shows the Start tap
  }
  if (CAPTURE) { voiceOK = false; }
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight' && e.altKey) go(1); if (e.key === 'ArrowLeft' && e.altKey) go(-1); });
  window.sim.ready = true;

  /* test / run-through API */
  window.lessonPage = {
    log, state: () => ({ page: PN, pages: N, idx, type: steps[idx] && steps[idx].type, steps: steps.length, done: Array.from(done), helped: Array.from(helped), free, challenge: challenge ? { state: challenge.state, answer: challenge.answer, game: !!challenge.game, result: challenge.result || null } : null,
      qState, variant: qv[idx] || 0, answer: steps[idx] && steps[idx].type === 'question' ? steps[idx].variants[(qv[idx] || 0) % steps[idx].variants.length].answer : steps[idx] && steps[idx].answer, finished, voiceOK, muted, rate, sim: full() }),
    defaults: () => Object.assign({}, S.defaults), enter, nextStep, hint, showMe, choose, newQuestion, enterFree, reset, nextChallenge, finish, startVoice: () => { const b = $('#b-quiet'); if (b) b.click(); },
  };
}
})();

<script>(function(){const C={"n":1,"file":"01-the-lathe.html","title":"The lathe and its parts","scene":"la-lathe","capture":"stage","what":"An **engine lathe** on the shop floor, seen from the front where you stand. The **work** turns in the chuck and the **tool** moves along it. Every lathe has the same main parts, from a small toolroom lathe to a big plant lathe.","steps":[{"type":"teach","tag":"On the job","text":"Sooner or later a job needs a round part: a bushing, a spacer, a shaft end that's worn. That's lathe work. Every lever on a lathe moves something heavy, and the work spins at hundreds of RPM. So before you touch a lever, know what each part does. Let's walk round the machine.","spot":["head","chuck","tail","carr"]},{"type":"teach","text":"The lathe turns the **work**, not the tool. The **headstock** on the left holds the spindle and its speed gears. The **chuck** grips the work. The **carriage** carries the tool along the **bed**. And on the right, the **tailstock**.","spot":["head","chuck","tail","carr"]},{"type":"predict","controls":["sel"],"text":"Say a long shaft sticks way out of the chuck and whips when you cut it. Which part would you bring up to hold the far end?","choices":["The tailstock","The carriage","The compound rest"],"answer":0,"thinkHint":"Which part sits at the far end of the bed, facing the chuck?","after":"Let's find out.","doText":"Tap **Tailstock** in the Show part row. Read what it does in the box on the drawing.","goal":{"sel":"tail"},"solve":{"sel":"tail"},"hint":"Tap the Tailstock chip.","ok":"That's because the tailstock slides on the same ways as the carriage, so it can meet the work wherever it ends. Its **quill** holds a centre for long work, or a drill chuck for drilling."},{"type":"do","setup":{"sel":"carr"},"text":"Now the carriage. Hold the **carriage** button and run the tool up to about **2 in** from the chuck jaws. Watch the handwheel on the apron turn as it goes.","controls":["cl","cr"],"goal":"fn:near","solve":{"carr":2},"hint":"Press and hold \"Carriage toward the chuck\".","hint2":"Stop when the readout shows about 2 in.","live":"fn:near_live","ok":"The whole carriage moved, tool and all. That's because the handwheel drives a gear on a rack under the bed. By hand you use that wheel. Under power the **feed rod** drives it, and for threads the **lead screw** and half-nuts do."},{"type":"predict","setup":{"sel":"chuck"},"text":"You stand at the front of the lathe. When the spindle runs forward, which way does the **top** of the chuck move?","choices":["Toward you","Away from you","It depends on the material"],"answer":0,"after":"Toward you. That's because the work turns down onto the tool's top face. The cut pushes the tool down onto its holder, which is solid, instead of lifting it. Hold Run and watch."},{"type":"do","text":"Hold **Run the spindle**. Watch the jaws come over the top toward you, and watch where the chips go.","controls":["run"],"goal":{"run":1},"solve":{"run":1},"hold":1500,"hint":"Press and hold Run.","ok":"Chips curl off the top of the tool, toward you. That's why you keep your hands clear of the chuck rim while it turns (U of T shop rules): the jaws come round faster than you can pull back."},{"type":"teach","tag":"Now you know","text":"Now you know what each part does and which way the work turns. So when you set up a job, you can decide which handwheel to reach for, where the tool goes, and where your hands must never be: near the chuck when it turns.","spot":["chuck","carr"]},{"type":"question","variants":[{"q":"Which part moves the tool in and out, square to the work?","choices":[{"t":"Cross-slide"},{"t":"Compound rest","why":"The compound swivels for angles."},{"t":"Tailstock","why":"The tailstock supports the work."},{"t":"Lead screw","why":"The lead screw drives the carriage for threads."}],"answer":0,"explain":"The cross-slide sits on the carriage and moves in and out."},{"q":"Which part swivels to cut a short taper or a chamfer?","choices":[{"t":"Cross-slide","why":"It moves straight in and out."},{"t":"Compound rest"},{"t":"Headstock","why":"The headstock holds the spindle."},{"t":"Apron","why":"The apron holds the carriage controls."}],"answer":1,"explain":"The compound rest sits on a swivel base on the cross-slide."},{"q":"Threading: what drives the carriage through the half-nuts?","choices":[{"t":"Feed rod","why":"The feed rod is for power feeds."},{"t":"Lead screw"},{"t":"Cross-slide screw","why":"That moves the tool in and out."},{"t":"Tailstock screw","why":"That moves the quill."}],"answer":1,"explain":"The lead screw drives the carriage through the half-nuts when threading."},{"q":"What does the headstock hold?","choices":[{"t":"The spindle and the speed gears"},{"t":"The tool post","why":"The tool post is on the compound."},{"t":"The dead centre","why":"That sits in the tailstock quill."},{"t":"The cutting fluid","why":"Not its job. The headstock houses the spindle and the gears or pulleys that set the speeds (U of T)."}],"answer":0,"explain":"The headstock houses the spindle and the gears or pulleys that set the speeds (U of T)."}]}],"free":"Tap any part to see what it does, run the carriage and the spindle. **Give me a challenge** asks about a part.","lesson":{"id":"lathe","title":"Lathe basics","episode":"055-lathe-basics","order":2,"kits":["lathe"],"done":"You finished **Lathe basics**. Now you can set a speed, a depth and a feed yourself, and you know why each one matters. So on the job you can plan a lathe job before you touch a lever. Print the summary sheet, and check the machine's manual, its plate and your work plan.","sheet":"lathe-summary.pdf","footer":"Exam prep, not a procedure. Check the lathe's manual, the speed plate and your work plan. crewforge.ca","summary":{"title":"Lathe basics","pic":{"page":4,"state":{"mode":"turn","pass":1,"doc":0.05}},"rules":["Parts: headstock (spindle, speed gears), chuck (3-jaw self-centring, 4-jaw independent), bed and ways, carriage (saddle + apron), cross-slide (in and out), compound rest (angles), tool post, tailstock (centre, drill chuck), lead screw (threads) and feed rod (power feed).<br><i><b>Why:<\/b> every lever moves something heavy. <b>Decide:<\/b> which handwheel, where the tool sits, where your hands stay.<\/i>","Chuck key: out of the chuck the moment the jaws are tight, every time. A key left in is thrown at the operator when the spindle starts (CCOHS).<br><i><b>Why:<\/b> a key left in leaves at rim speed, at you. <b>Decide:<\/b> key out before your hand leaves it; four-jaw and a dial when it must run true (move half the reading).<\/i>","RPM = CS × 4 ÷ D (inch shop formula; exact CS × 12 ÷ (π × D)). Metric RPM = 1000 × V ÷ (π × D). Set the lathe at that speed or the step below.<br><i><b>Why:<\/b> too fast burns an HSS edge. <b>Decide:<\/b> work the speed out for each job; never trust the last setting.<\/i>","Turning speeds (U of T, ft/min, HSS / carbide): mild steel 120 / 400, 4140 100 / 400, stainless 50 / 200, cast iron 140 / 325, aluminium 300 / 800, brass 200 / 500. Carbide runs about 3 × HSS.","Feed rate (in/min) = RPM × feed (in/rev). Rough with a heavier feed, finish with a light feed.<br><i><b>Why:<\/b> feed sets the finish. <b>Decide:<\/b> heavy to rough, light to finish.<\/i>","Depth of cut: a dial that reads tool movement takes TWICE the reading off the diameter (U of T). Check what your dial reads.<br><i><b>Why:<\/b> dial 0.100 and lose 0.200: scrap. <b>Decide:<\/b> check what your dial reads before a sizing cut.<\/i>","Tool tip on centre: check it against the tailstock centre's point. Below centre leaves a pip; above centre rubs and leaves a pip.<br><i><b>Why:<\/b> off centre leaves a pip. <b>Decide:<\/b> check the height at every tool change.<\/i>","Short tool overhang and slower speed stop chatter. Support work sticking out more than 3 × its diameter with the tailstock centre (maker's manual).<br><i><b>Why:<\/b> long work and long tools spring and chatter. <b>Decide:<\/b> short tool; tailstock past 3 × D; no heavy cuts on thin work.<\/i>","Taper between centres: set-over = (D − d) × OL ÷ (2 × L). Short, steep tapers: swing the compound. Guard the dog (BC OHS Reg 12.38).<br><i><b>Why:<\/b> set-over is half the diameter change. <b>Decide:<\/b> long gentle tapers by set-over, short steep ones on the compound.<\/i>"]},"pages":[{"file":"01-the-lathe.html","title":"The lathe and its parts"},{"file":"02-chuck-and-key.html","title":"Chucking the work and the chuck key"},{"file":"03-speeds-and-feeds.html","title":"Spindle speed and feed"},{"file":"04-facing-and-turning.html","title":"Facing and turning: depth of cut"},{"file":"05-tool-on-centre.html","title":"Tool on centre, short overhang"},{"file":"06-long-work-and-tapers.html","title":"Long work, support and tapers"},{"file":"07-putting-it-together.html","title":"Putting it together: turn a spacer"}]},"audio":{"what":"p1-what-0f1a3dcc.mp3","s0":"p1-s0-91020371.mp3","s1":"p1-s1-18647fc1.mp3","s2":"p1-s2-12e20082.mp3","s2after":"p1-s2after-8099c143.mp3","s2ok":"p1-s2ok-33836a74.mp3","s3":"p1-s3-6e617536.mp3","s3ok":"p1-s3ok-93bef02f.mp3","s4":"p1-s4-c5509bb6.mp3","s4after":"p1-s4after-c0e9487f.mp3","s5":"p1-s5-3358a4e4.mp3","s5ok":"p1-s5ok-4ae3a784.mp3","s6":"p1-s6-85deb3c9.mp3","s7v0":"p1-s7v0-b3bbf502.mp3","s7v1":"p1-s7v1-05395406.mp3","s7v2":"p1-s7v2-14ad1d54.mp3","s7v3":"p1-s7v3-c5b8f754.mp3","free":"p1-free-57836163.mp3"},"audioBase":"audio/"};CFShell.start(C, MachAdapter(C, window.LESSON_CODE["lathe"][C.n]));})();</script>
