<script>/* CrewForge illustration kit (JS port of docs/concepts/hitches/src/lib.py; rules in docs/concepts/hitches/STYLE.md).
   Plain functions that return SVG strings. Every scene: 1600 x 880 viewBox, one scale K (px per inch), light from
   the top-left, outlines darker than the fill, CrewForge orange only for "the thing to look at".
   Kept function-for-function with lib.py so the drawings match the approved concept pictures. */
const KIT = (() => {
  const W = 1600, H = 880;
  const FONT = "Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif";
  const C = {
    BG: '#24211d', PANEL: '#2a2723', TEXT: '#F5F5F4', MUTED: '#b9b4ab', ACC: '#F08A2B',
    OK: '#3ddc84', WARN: '#F2C230', BAD: '#ff5a4f',
    STEEL_D: '#3b4247', ROPE_D: '#454c51', ROPE_M: '#aab3b9', ROPE_V: '#6a737a',
    TIMBER_D: '#5e4426'
  };
  const f = v => { const r = Math.round(v * 10) / 10; return Math.abs(r - Math.round(r)) < 1e-6 ? String(Math.round(r)) : r.toFixed(1); };
  const pathd = (P, closed) => P.length ? 'M' + P.map(p => f(p[0]) + ' ' + f(p[1])).join(' L') + (closed ? 'Z' : '') : '';

  function catmull(P, n = 8, closed = false) {
    const out = [], m = P.length;
    const last = closed ? m : m - 1;
    for (let i = 0; i < last; i++) {
      const p0 = (closed || i > 0) ? P[(i - 1 + m) % m] : P[i], p1 = P[i], p2 = P[(i + 1) % m];
      const p3 = (closed || i + 2 < m) ? P[(i + 2) % m] : P[(i + 1) % m];
      for (let j = 0; j < n; j++) {
        const t = j / n, t2 = t * t, t3 = t2 * t;
        out.push([0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
      }
    }
    if (!closed) out.push(P[m - 1]);
    return out;
  }
  // points on a circle; degrees, screen coords (0 = +x, 90 = DOWN)
  const arcPts = (cx, cy, r, a0, a1, n = 24) => Array.from({ length: n + 1 }, (_, i) => {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  });
  function resample(P, step) {
    const out = [P[0]]; let acc = 0;
    for (let i = 0; i + 1 < P.length; i++) {
      const [x0, y0] = P[i], [x1, y1] = P[i + 1], seg = Math.hypot(x1 - x0, y1 - y0);
      if (!seg) continue;
      let t = step - acc;
      while (t <= seg) { out.push([x0 + (x1 - x0) * t / seg, y0 + (y1 - y0) * t / seg]); t += step; }
      acc = seg - (t - step);
    }
    const e = P[P.length - 1], l = out[out.length - 1];
    if (Math.hypot(e[0] - l[0], e[1] - l[1]) > 1e-3) out.push(e);
    return out;
  }
  function normals(P) {
    return P.map((_, i) => {
      const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [-dy / L, dx / L];
    });
  }
  // shift each point toward the light (top-left) along its normal: where the highlight runs on a round part
  function litOffset(P, amount) {
    const N = normals(P), Lx = -0.7071, Ly = -0.7071;
    return P.map((p, i) => { const [nx, ny] = N[i], s = nx * Lx + ny * Ly; return [p[0] + nx * s * amount, p[1] + ny * s * amount]; });
  }

  function defs() {
    return `<defs>
<linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfd5da"/><stop offset=".45" stop-color="#8d969d"/><stop offset="1" stop-color="#4b5359"/></linearGradient>
<linearGradient id="gForge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d868d"/><stop offset=".5" stop-color="#555d63"/><stop offset="1" stop-color="#33393d"/></linearGradient>
<linearGradient id="gBarV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b747b"/><stop offset=".3" stop-color="#dfe4e7"/><stop offset=".62" stop-color="#8f989f"/><stop offset="1" stop-color="#454c52"/></linearGradient>
<linearGradient id="gBarH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f989f"/><stop offset=".28" stop-color="#e3e7ea"/><stop offset=".65" stop-color="#8a939a"/><stop offset="1" stop-color="#40474c"/></linearGradient>
<linearGradient id="gPaint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e7882"/><stop offset="1" stop-color="#4a525a"/></linearGradient>
<linearGradient id="gPaintSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#727c86"/><stop offset="1" stop-color="#454d55"/></linearGradient>
<linearGradient id="gBlock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a640"/><stop offset=".55" stop-color="#b8862a"/><stop offset="1" stop-color="#7d5a17"/></linearGradient>
<radialGradient id="gSheave" cx=".38" cy=".34" r=".75"><stop offset="0" stop-color="#c9d0d5"/><stop offset=".55" stop-color="#8d969d"/><stop offset="1" stop-color="#4b5359"/></radialGradient>
<linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211e1b"/><stop offset="1" stop-color="#2b2824"/></linearGradient>
<linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46413b"/><stop offset=".12" stop-color="#3a3631"/><stop offset="1" stop-color="#2a2723"/></linearGradient>
<linearGradient id="gTimber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48a58"/><stop offset="1" stop-color="#8a6740"/></linearGradient>
<linearGradient id="gWeight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e7882"/><stop offset=".6" stop-color="#4f5860"/><stop offset="1" stop-color="#3a4148"/></linearGradient>
<linearGradient id="gBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d6670"/><stop offset="1" stop-color="#434b53"/></linearGradient>
<linearGradient id="gConc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b5650"/><stop offset="1" stop-color="#46423d"/></linearGradient>
<radialGradient id="gShadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="gDial" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fbfbf8"/><stop offset="1" stop-color="#d6d4cc"/></radialGradient>
<filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>`;
  }

  function styleBlock(extraPhone = '') {
    return `<style>
.lb{font:700 26px ${FONT};fill:${C.TEXT}} .lm{font:600 21px ${FONT};fill:${C.MUTED}} .la{font:800 30px ${FONT};fill:${C.ACC}}
.ld{stroke:${C.MUTED};stroke-width:2;fill:none} .tag{font:700 12px ${FONT};fill:#1d1d1d} .tagb{font:800 15px ${FONT};fill:#1d1d1d}
.pt{font:800 20px ${FONT}} .pts{font:700 16px ${FONT}} .halo{paint-order:stroke;stroke:#1F1D1A;stroke-width:6px;stroke-linejoin:round}
.phOnly{display:none}
@media (max-width:700px){ .lb{font-size:34px} .lm{font-size:28px} .la{font-size:38px} .pt{font-size:28px} .pts{font-size:24px} .pcOnly{display:none} .phOnly{display:inline} ${extraPhone} }
</style>`;
  }

  function backdrop(floor, wallLine = true) {
    let s = `<rect width="${W}" height="${floor}" fill="url(#gWall)"/>`;
    if (wallLine) {
      s += `<rect x="0" y="${floor - 150}" width="${W}" height="150" fill="#ffffff" opacity=".018"/>`;
      s += `<line x1="0" y1="${floor - 150}" x2="${W}" y2="${floor - 150}" stroke="#3a3530" stroke-width="2"/>`;
    }
    s += `<rect x="0" y="${floor}" width="${W}" height="${H - floor}" fill="url(#gFloor)"/>`;
    s += `<line x1="0" y1="${floor}" x2="${W}" y2="${floor}" stroke="#5a544c" stroke-width="2.5"/>`;
    return s;
  }
  function column(x, floor, top = 0, w = 34) {
    return `<g opacity=".55"><rect x="${x}" y="${top}" width="${w}" height="${floor - top}" fill="#2f2c28"/>` +
      `<rect x="${x}" y="${top}" width="5" height="${floor - top}" fill="#3a3632"/>` +
      `<rect x="${x + w - 5}" y="${top}" width="5" height="${floor - top}" fill="#262320"/>` +
      `<rect x="${x - 14}" y="${floor - 8}" width="${w + 28}" height="8" fill="#2f2c28"/></g>`;
  }
  const contactShadow = (cx, y, w, h = 14, op = 1) =>
    `<ellipse cx="${f(cx)}" cy="${f(y)}" rx="${f(w / 2)}" ry="${f(h / 2)}" fill="url(#gShadow)" opacity="${op}"/>`;

  // any round steel part along a path: dark outline, body, a highlight line on the lit side
  function roundBar(P, d, body = '#8d969d', dark = '#3b4247', hi = '#e8ecef', cap = 'round', hiOp = .85) {
    const p = pathd(P);
    return `<path d="${p}" fill="none" stroke="${dark}" stroke-width="${f(d + 1.6)}" stroke-linecap="${cap}" stroke-linejoin="round"/>` +
      `<path d="${p}" fill="none" stroke="${body}" stroke-width="${f(d)}" stroke-linecap="${cap}" stroke-linejoin="round"/>` +
      `<path d="${pathd(litOffset(P, d * .24))}" fill="none" stroke="${hi}" stroke-width="${f(Math.max(.8, d * .2))}" stroke-linecap="round" stroke-linejoin="round" opacity="${hiOp}"/>`;
  }

  /* Wire rope: steel body + strand valleys. Right regular lay: valleys run like "/" on a hanging rope, each strand
     crosses the visible face in about 2 d, valleys about 1.1 d apart. `phase` (px along the rope) moves the strand
     pattern with the rope's material so a running rope visibly runs (virtual clock only). */
  function wireRope(P, d, phase = 0, opts = {}) {
    const dense = resample(P, Math.max(.6, d / 6));
    let s = roundBar(dense, d, opts.body || C.ROPE_M, opts.dark || C.ROPE_D, '#e9edf0', 'butt', .7);
    if (d < 2.2 || dense.length < 2) return s;
    const pitch = 1.08 * d, adv = 2.0 * d;
    const L = [0];
    for (let i = 0; i + 1 < dense.length; i++) L.push(L[i] + Math.hypot(dense[i + 1][0] - dense[i][0], dense[i + 1][1] - dense[i][1]));
    const N = normals(dense), tot = L[L.length - 1];
    let j0 = 0;
    const at = sv => {
      sv = Math.max(0, Math.min(tot, sv));
      while (j0 > 0 && L[j0] > sv) j0--;
      while (j0 < L.length - 2 && L[j0 + 1] < sv) j0++;
      const t = (sv - L[j0]) / ((L[j0 + 1] - L[j0]) || 1);
      return [dense[j0][0] + (dense[j0 + 1][0] - dense[j0][0]) * t, dense[j0][1] + (dense[j0 + 1][1] - dense[j0][1]) * t, N[j0]];
    };
    let v = '';
    const ph = ((phase % pitch) + pitch) % pitch;
    for (let sv = -adv - pitch + ph; sv < tot; sv += pitch) {
      const seg = [];
      for (let j = 0; j < 5; j++) {
        const q = sv + adv * j / 4;
        if (q >= 0 && q <= tot) { const [x, y, [nx, ny]] = at(q); const o = (-.5 + j / 4) * d * .86; seg.push([x + nx * o, y + ny * o]); }
      }
      if (seg.length > 1) v += pathd(seg) + ' ';
      j0 = 0;
    }
    return s + `<path d="${v}" fill="none" stroke="${C.ROPE_V}" stroke-width="${f(Math.max(.7, d * .13))}" stroke-linecap="round" opacity=".9"/>`;
  }

  /* Crosby S-319N shank hook, ID code J (5 t carbon), inches, Kito Crosby 2026-27 p. 91 (same contour as lib.py).
     Origin = bottom of the hook on the shank axis; y negative = up; the saddle is on the shank axis at -1.81. */
  const HOOK_OUT = [[-0.705, -6.59], [-1.25, -6.05], [-2.3, -5.2], [-3.15, -4.1], [-3.5, -2.8], [-3.3, -1.5], [-2.6, -0.55],
    [-1.4, -0.05], [0, 0], [1.35, -0.25], [2.3, -1.0], [2.72, -2.1], [2.75, -3.1], [2.6, -3.95], [2.38, -4.5]];
  const HOOK_TIP = [2.08, -4.82], HOOK_RI = 1.6, HOOK_CY = -3.41, HOOK_SADDLE = -1.81;
  let _hc = null;
  function hookContour() {
    if (_hc) return _hc;
    let out = catmull(HOOK_OUT, 6);
    out = out.concat([HOOK_TIP, [1.8, -4.5], [1.64, -4.0]]);
    for (let a = 0; a <= 180; a += 9) out.push([HOOK_RI * Math.cos(a * Math.PI / 180), HOOK_CY + HOOK_RI * Math.sin(a * Math.PI / 180)]);
    out = out.concat(catmull([[-1.6, -3.41], [-1.5, -4.25], [-1.05, -4.95], [-0.3, -5.45], [0.45, -5.78], [0.705, -6.15]], 5).slice(1));
    _hc = [[-0.705, -10.43]].concat(out, [[0.705, -10.43]]);
    return _hc;
  }
  /* Hook in profile, saddle at (x, ysad), k px per inch; `open` 0..1 straightens the throat (failure).
     The shank top is at ysad - 8.62 k. */
  function hookProfile(x, ysad, k, o = {}) {
    const open = o.open || 0, flip = o.flip ? -1 : 1;
    const T = p => {
      let px = p[0], py = p[1];
      if (open > 0 && py > -6.2) {                      // opening: the bowl and tip swing out about the neck
        const a = open * 0.9 * Math.max(0, Math.min(1, (-py - 0) / 6.2 + .2)) * (px > -0.5 ? 1 : 0.35);
        const cx = -0.7, cy = -6.2, dx = px - cx, dy = py - cy;
        px = cx + dx * Math.cos(a) - dy * Math.sin(a); py = cy + dx * Math.sin(a) + dy * Math.cos(a);
      }
      return [x + flip * px * k, ysad + (py - HOOK_SADDLE) * k];
    };
    const c = hookContour().map(T);
    let s = `<g id="${o.id || 'hook'}"><path d="${pathd(c, true)}" fill="url(#gForge)" stroke="#1c2023" stroke-width="${f(Math.max(1, k * .12))}" stroke-linejoin="round"/>`;
    const back = catmull([[-0.45, -7.4], [-0.9, -6.0], [-2.0, -5.0], [-2.85, -3.9], [-3.05, -2.7], [-2.75, -1.55], [-1.9, -0.6]], 6).map(T);
    s += `<path d="${pathd(back)}" fill="none" stroke="#c3cad0" stroke-width="${f(k * .32)}" stroke-linecap="round" opacity=".55"/>`;
    s += `<path d="${pathd([T([-0.32, -10.3]), T([-0.32, -6.9])])}" stroke="#d3d9de" stroke-width="${f(k * .3)}" stroke-linecap="round" opacity=".6"/>`;
    if (!o.noLatch && open < .2) {                      // S-4320 spring latch, neck boss to inside the tip
      const piv = T([0.92, -5.95]), end = T([1.9, -4.62]), mid = T([1.5, -5.35]);
      const q = `M${f(piv[0])} ${f(piv[1])} Q${f(mid[0])} ${f(mid[1])} ${f(end[0])} ${f(end[1])}`;
      s += `<path d="${q}" stroke="#1c2023" stroke-width="${f(k * .5)}" fill="none" stroke-linecap="round"/>`;
      s += `<path id="${o.id || 'hook'}-latch" d="${q}" stroke="#c9ced2" stroke-width="${f(k * .34)}" fill="none" stroke-linecap="round"/>`;
      s += `<circle cx="${f(piv[0])}" cy="${f(piv[1])}" r="${f(k * .26)}" fill="#7b848b" stroke="#1c2023" stroke-width="1"/>`;
    }
    return s + '</g>';
  }
  const HOOK = { SADDLE: HOOK_SADDLE, RI: HOOK_RI, CY: HOOK_CY, LEN: 10.43 };

  /* Shackle seen square to the pin (U visible), pin horizontal; bow UP or DOWN. Crosby G-209 proportions scaled from
     5/8 in (pin 0.75, jaw 1.06, inside length 2.38, bow 1.69 in). Returns {back, front, crown} (crown = inside of the
     bow on the centreline: where an eye or hook bears). */
  function shackleFace(x, ypin, k, up = true, size = 0.625) {
    const sc = size / 0.625, pin = .75 * sc, iw = 1.06 * sc, il = 2.38 * sc, mat = .70 * sc, ear = 1.36 * sc;
    const legx = (iw + mat) / 2, rBow = (1.69 * sc + mat) / 2, top = -(pin / 2 + il + mat / 2), yc = top + rBow;
    const pts = [[-legx, -ear * .3], [-legx * 1.04, -(pin / 2 + il * .3)]];
    for (let a = 205; a >= -25; a -= 15) pts.push([rBow * Math.cos(a * Math.PI / 180), yc - rBow * Math.sin(a * Math.PI / 180)]);
    pts.push([legx * 1.04, -(pin / 2 + il * .3)], [legx, -ear * .3]);
    const P = catmull(pts, 4).map(([px, py]) => [x + px * k, ypin + (up ? py : -py) * k]);
    const back = roundBar(P, mat * k, '#a6aeb4', C.STEEL_D, '#eef1f3');
    let front = '';
    for (const ex of [-legx, legx]) front += `<circle cx="${f(x + ex * k)}" cy="${f(ypin)}" r="${f(ear / 2 * k)}" fill="#9aa2a8" stroke="${C.STEEL_D}" stroke-width="1.2"/>`;
    front += `<rect x="${f(x - (legx + ear * .62) * k)}" y="${f(ypin - pin / 2 * k)}" width="${f((2 * legx + ear * .95) * k)}" height="${f(pin * k)}" rx="${f(pin * .2 * k)}" fill="#b3bbc1" stroke="${C.STEEL_D}" stroke-width="1.1"/>`;
    front += `<rect x="${f(x - (legx + ear * .95) * k)}" y="${f(ypin - pin * .95 * k)}" width="${f(pin * .5 * k)}" height="${f(pin * 1.9 * k)}" rx="${f(pin * .12 * k)}" fill="#8e979d" stroke="${C.STEEL_D}" stroke-width="1.1"/>`;
    const crown = up ? ypin + (top + mat / 2) * k : ypin - (top + mat / 2) * k;
    return { back, front, crown, outer: up ? ypin + (top - mat / 2) * k : ypin - (top - mat / 2) * k };
  }

  function timberEnd(x, y, w, h, id) {
    const cx = x + w * .78, cy = y + h * 1.15, cid = 'tc' + (id || (Math.round(x) + '_' + Math.round(y)));
    let s = `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2" fill="#a77c4c" stroke="${C.TIMBER_D}" stroke-width="1.6"/>`;
    s += `<clipPath id="${cid}"><rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"/></clipPath><g clip-path="url(#${cid})">`;
    for (let i = 1; i < 9; i++) s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(i * Math.max(w, h) * .17)}" fill="none" stroke="#7d5b35" stroke-width="1" opacity=".55"/>`;
    s += `<line x1="${f(x + w * .3)}" y1="${f(y + h * .12)}" x2="${f(x + w * .42)}" y2="${f(y + h * .45)}" stroke="#4a3420" stroke-width="1.3" opacity=".7"/>`;
    return s + `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h * .18)}" fill="#ffffff" opacity=".08"/></g>`;
  }
  function timberSide(x, y, w, h, seed = 1) {
    let s = `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2" fill="url(#gTimber)" stroke="${C.TIMBER_D}" stroke-width="1.6"/>`;
    const n = Math.max(2, Math.floor(h / 7));
    for (let i = 1; i < n; i++) {
      const yy = y + h * i / n, wob = 1.6 * Math.sin(i * 1.7 + seed);
      s += `<path d="M${f(x + 4)} ${f(yy)} C${f(x + w * .3)} ${f(yy + wob)} ${f(x + w * .6)} ${f(yy - wob)} ${f(x + w - 4)} ${f(yy + wob * .5)}" stroke="#6e5131" stroke-width=".9" fill="none" opacity=".55"/>`;
    }
    return s + `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(Math.min(4, h * .15))}" fill="#fff" opacity=".1"/>`;
  }

  // few, large labels; leader ends in a dot ON the part; text never on the part it names
  function label(tx, ty, text, target, o = {}) {
    const anchor = o.anchor || 'start', cls = o.cls || 'lb';
    let s = '';
    if (target) {
      const [x2, y2] = target;
      const sx = anchor === 'end' ? tx + 6 : anchor === 'start' ? tx - 6 : tx;
      const sy = anchor === 'middle' ? ty + 8 : ty - 8;
      s += o.elbow ? `<path class="ld" d="M${f(sx)} ${f(sy)} L${f(o.elbow[0])} ${f(o.elbow[1])} L${f(x2)} ${f(y2)}"/>`
        : `<path class="ld" d="M${f(sx)} ${f(sy)} L${f(x2)} ${f(y2)}"/>`;
      s += `<circle cx="${f(x2)}" cy="${f(y2)}" r="4" fill="${C.TEXT}" stroke="#1F1D1A" stroke-width="1.5"/>`;
    }
    s += `<text class="${cls} halo" x="${f(tx)}" y="${f(ty)}" text-anchor="${anchor}"${o.id ? ` id="${o.id}"` : ''}>${text}</text>`;
    if (o.sub) s += `<text class="lm halo" x="${f(tx)}" y="${f(ty + 26)}" text-anchor="${anchor}">${o.sub}</text>`;
    return s;
  }

  // force arrow from (x0,y0) toward (x1,y1); head at (x1,y1)
  function forceArrow(x0, y0, x1, y1, col, w = 5, id = '') {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
    if (L < 4) return '';
    const ux = dx / L, uy = dy / L, hl = Math.min(L * .6, 8 + w * 2.6), hw = 4 + w * 1.5;
    const bx = x1 - ux * hl, by = y1 - uy * hl;
    return `<g${id ? ` id="${id}"` : ''}><line x1="${f(x0)}" y1="${f(y0)}" x2="${f(bx)}" y2="${f(by)}" stroke="#1F1D1A" stroke-width="${w + 3}" stroke-linecap="round"/>` +
      `<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(bx)}" y2="${f(by)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>` +
      `<path d="M${f(x1)} ${f(y1)} L${f(bx - uy * hw)} ${f(by + ux * hw)} L${f(bx + uy * hw)} ${f(by - ux * hw)}Z" fill="${col}" stroke="#1F1D1A" stroke-width="1.5"/></g>`;
  }

  // magnified detail of the SAME drawing (same view), linked to a dashed ring on the source spot
  function detailInset(refId, src, mag, cx, cy, r, title, sub, id) {
    const [sx, sy] = src, rs = r / mag, cid = 'cl' + (id || Math.round(cx) + '_' + Math.round(cy));
    let s = `<g${id ? ` id="${id}"` : ''}>`;
    s += `<circle cx="${f(sx)}" cy="${f(sy)}" r="${f(rs)}" fill="none" stroke="${C.TEXT}" stroke-width="2" stroke-dasharray="5 4"/>`;
    const d = Math.hypot(cx - sx, cy - sy) || 1, ux = (cx - sx) / d, uy = (cy - sy) / d;
    s += `<line x1="${f(sx + ux * rs)}" y1="${f(sy + uy * rs)}" x2="${f(cx - ux * r)}" y2="${f(cy - uy * r)}" stroke="${C.TEXT}" stroke-width="2" stroke-dasharray="5 4"/>`;
    s += `<clipPath id="${cid}"><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}"/></clipPath>`;
    s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r + 5)}" fill="#1F1D1A"/>`;
    s += `<g clip-path="url(#${cid})"><rect x="${f(cx - r)}" y="${f(cy - r)}" width="${f(2 * r)}" height="${f(2 * r)}" fill="#26231f"/>`;
    s += `<use href="#${refId}" transform="translate(${f(cx)} ${f(cy)}) scale(${mag}) translate(${f(-sx)} ${f(-sy)})"/></g>`;
    s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="none" stroke="${C.TEXT}" stroke-width="2.5"/>`;
    s += `<text class="lm halo" x="${f(cx)}" y="${f(cy - r - 14)}" text-anchor="middle" style="font-weight:800;letter-spacing:.08em">${title}</text>`;
    if (sub) s += `<text class="lm halo" x="${f(cx)}" y="${f(cy + r + 30)}" text-anchor="middle">${sub}</text>`;
    return s + '</g>';
  }

  // a value pill: dark rounded box with coloured text (tension tags, pull tag)
  const PH = { v: 1 };                                   // phone text multiplier (set by the scene each frame)
  function pill(x, y, text, col, o = {}) {
    const fs = (o.fs || 18) * PH.v, w = Math.max(30, text.length * fs * .56 + 16), h = fs + 12, anchor = o.anchor || 'middle';
    const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
    return `<g${o.id ? ` id="${o.id}"` : ''}><rect x="${f(x0)}" y="${f(y - h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(h / 2)}" fill="#1F1D1A" stroke="${col}" stroke-width="2" opacity=".94"/>` +
      `<text x="${f(x0 + w / 2)}" y="${f(y + fs * .36)}" text-anchor="middle" style="font:800 ${fs}px ${FONT};fill:${col}">${text}</text></g>`;
  }

  return { W, H, FONT, C, f, pathd, catmull, arcPts, resample, normals, litOffset, defs, styleBlock, backdrop, column,
    contactShadow, roundBar, wireRope, hookProfile, HOOK, shackleFace, timberEnd, timberSide, label, forceArrow,
    detailInset, pill, PH };
})();
</script>
<script>/* CrewForge block and tackle scene (rigging remaster, docs/RIGGING_REMASTER_BRIEF.md).
   One self-contained scene module: calc() (every number on screen), the drawing (STYLE.md, via KIT), motion on the
   virtual clock, the anchor failure, and the window.sim contract. Page shells (lesson pages, the free simulator,
   ?capture=1 video pages) mount it with TACKLE.mount({...}).

   THE RIG (side elevation, one scale K px per inch):
     W12x40 beam across the top -> beam clamp (the anchor) -> top (fixed) block on its hook -> n parts of wire rope ->
     bottom (moving) block -> hook -> shackle -> lug on a steel test weight (its size follows its weight) on cribbing.
     The blocks are drawn open with their sheaves spread side by side so every part of line can be counted (labelled
     on the drawing); on a real block the sheaves sit side by side on one pin.
     Lead off the fixed (top) block: you pull straight down. Lead off the moving (bottom) block ("reeved to
     advantage"): the lead runs up to a lead block hung on its own clamp and comes back down to your hands.  */
const TACKLE = (() => {
  const { f, pathd, C } = KIT;
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const Q = new URLSearchParams(location.search);
  const CAPTURE = Q.has('capture');

  /* ===================================================================================== SOURCE DATA
     Crosby Group general catalogue, blocks, "How to Figure Line Parts" (p. 443): ratio = load ÷ single line pull,
       A bronze-bushed sheaves, B anti-friction bearing sheaves, 1-8 parts, lead line off the fixed block.
     US Navy rigging (Steelworker / Builder): allow about 10 % of the load for every sheave the rope runs over.
     Design factor of the anchor (beam clamp): ANCHOR_DF (see NOTES.md for the source and its status).          */
  const CROSBY = { bronze: [.96, 1.87, 2.75, 3.59, 4.39, 5.16, 5.90, 6.60], roller: [.98, 1.94, 2.88, 3.81, 4.71, 5.60, 6.47, 7.32] };
  const LB_TO_KG = 0.45359237, FT_TO_M = 0.3048, G = 9.80665, LBF_TO_N = 4.4482216;
  const ANCHOR_DF = 5;                                    // beam clamp design factor 5:1 (Harrington UBC sell sheet, NOTES.md)
  const STEEL_LB_IN3 = 0.2836;                            // steel density, lb per cubic inch (test weight size)
  const FRIC = { ideal: 'No friction', rule10: '10 % per sheave', bronze: 'Bronze bushed', roller: 'Anti-friction bearing' };
  // colours of the maths (same in the drawing, the cards and the formula): W off-white, P blue, n orange,
  // friction purple, distance teal, anchor = W + P stacked. Orange is never a warning.
  const COL = { W: '#e9e3d6', P: '#59b7ff', n: C.ACC, fr: '#b48af0', dist: '#7fd6c2', anc: '#e9e3d6' };

  /* ===================================================================================== STATE */
  const S = {
    parts: 4, lead: 'fixed', friction: 'rule10', load: 4000, rise: 0, units: 'imp', anchorWll: 6000, fail: !CAPTURE,
    tags: true, count: false, cards: 'all', inset: true
  };
  const NUMERIC = ['load', 'rise', 'anchorWll'];

  /* ===================================================================================== GEOMETRY (px)
     K = 5.2 px per inch (the rig fills the stage). Sheaves 12 in (R = 6 in) for 5/8 in wire rope (D/d about 19).
     Lanes (parts of line) are one sheave diameter apart. Hooks: Crosby S-319N contour (KIT.hookProfile) scaled to
     about 6.5 in (top block) and 7.8 in (bottom block) long. All heights below are worked from these.          */
  const K = 5.2, FLOOR = 840, CRIB = 5.5 * K, R = 6 * K, LANE = 2 * R, ROPE_D = 0.625 * K * 1.15;
  const X_A = 640;                                       // anchor (main beam clamp) x
  const BEAM = { top: 6, d: 11.94 * K, tf: 0.515 * K, tw: 0.295 * K };   // W12x40 side elevation
  const Y_BB = BEAM.top + BEAM.d;                         // underside of the bottom flange
  const CLAMP_H = 7 * K, Y_PIN = Y_BB + CLAMP_H;          // beam clamp: 1 in pin the top hook hangs on
  const HK_U = 0.62 * K, HK_L = 0.75 * K;                 // hook scales (px per hook-inch)
  const Y_USAD = Y_PIN + 0.5 * K;                         // top hook saddle (pin in the bowl)
  const Y_UT = Y_USAD + 8.62 * HK_U + 1.5 * K;            // top of the top block (yoke)
  const PM = 1.7 * K, STRAP = PM + 1.2 * K, BOT = PM;     // cheek-plate margin round the sheaves, yoke on top
  const Y_US = Y_UT + STRAP + R;                          // top block sheave centres
  const Y_UB = Y_US + R + BOT;                            // bottom of the top block
  const HOOKDROP = R + BOT + 2.5 * K + 8.62 * HK_L;       // bottom sheave centre -> bottom hook saddle
  const SHK = 0.75;                                       // shackle size (in) at the load
  const SHK_DROP = (0.75 * SHK / .625 / 2 + 2.38 * SHK / .625) * K;    // hook saddle (= shackle crown) -> shackle pin
  const LUG_H = 2 * K;                                    // shackle pin -> top of the test weight
  const RISE_CAP_FT = 3.5, RISE_CAP_M = 1.05;

  const imp = () => S.units === 'imp';
  const loadLb = () => imp() ? S.load : S.load / LB_TO_KG;
  const sidePx = () => Math.cbrt(Math.max(200, loadLb()) / STEEL_LB_IN3) * K;   // test weight cube side
  const lowSheave0 = () => FLOOR - CRIB - sidePx() - LUG_H - SHK_DROP - HOOKDROP;  // bottom sheave y at rise 0
  const riseUnitPx = () => imp() ? 12 * K : 12 * K / FT_TO_M;                      // px per ft or per m
  function riseMax() {                                    // keep 12 in between the blocks, never more than 3.5 ft (1.05 m)
    const room = (lowSheave0() - (R + STRAP)) - (Y_UB + 12 * K);
    const lim = n1() ? room + (R + STRAP) - 10 * K : room;
    return Math.max(0, Math.min(imp() ? RISE_CAP_FT : RISE_CAP_M, lim / riseUnitPx()));
  }
  const n1 = () => S.parts === 1;

  /* ===================================================================================== PHYSICS
     Every number on screen comes from calc().
     n = parts of line holding the moving block. The lead line counts only when it leaves the moving block.
     Sheaves the rope runs over in the tackle: Sh = n (lead off the fixed block), n - 1 (lead off the moving block).
       Ideal          P = W ÷ n
       10 % rule      P = W × (1 + 0.10 × Sh) ÷ n           (US Navy: add 10 % of the load per sheave)
       Crosby tables  P = W ÷ ratio(n)                      (A bronze, B roller; lead off the fixed block)
                      lead off the moving block: ratio = 1 + ratio(n - 1) (the lead part carries P with no sheave in
                      front of it; the other n - 1 parts run over n - 1 sheaves. Our derivation, NOTES.md)
     Velocity ratio VR = n: the lead line runs n × the load's rise. Actual MA = W ÷ P. Efficiency = MA ÷ VR.
     Work out = W × rise, work in = P × travel (ft·lb; metric J = kg × 9.80665 × m).
     Anchor (statics on the top block, rope weight and block weight left out):
       lead off the fixed block, pulled straight down: the top block holds every supporting part AND the lead: W + P.
       lead off the moving block: the lead helps hold the moving block, so the top block holds W - P; the lead block
       holds the lead twice (up and back down): 2P. The beam still carries W + P in all.
     Part tensions (drawing tags): each sheave passes on a fraction e of the tension toward the lead (rope bending and
       bearing friction). e is solved so the tags add up to W and the lead tag equals the method's P exactly, so the
       picture and the exam formula always agree. Ideal: e = 1, every part W ÷ n.                              */
  function calc(st = S) {
    const W = st.load, n = st.parts, lm = st.lead === 'moving' && n >= 2;
    const c = { W, n, lm, imp: st.units === 'imp', friction: st.friction };
    c.Sh = lm ? n - 1 : n;
    c.VR = n; c.MA = n; c.Pideal = W / n;
    if (st.friction === 'ideal') c.P = W / n;
    else if (st.friction === 'rule10') c.P = W * (1 + 0.10 * c.Sh) / n;
    else { const t = CROSBY[st.friction]; c.ratio = lm ? 1 + t[n - 2] : t[n - 1]; c.P = W / c.ratio; }
    c.fricForce = n * c.P - W;                             // what friction adds (force picture: n × P = W + this)
    c.MAact = W / c.P; c.eff = c.MAact / c.VR;
    c.rise = st.rise; c.travel = c.VR * st.rise;
    const wk = c.imp ? 1 : G;
    c.workOut = W * st.rise * wk; c.workIn = c.P * c.travel * wk; c.lost = c.workIn - c.workOut;
    c.kN = c.imp ? c.P * LBF_TO_N / 1000 : c.P * G / 1000;
    c.anchor = lm ? W - c.P : W + c.P;                     // load on the top block, its hook and the main anchor
    c.leadBlock = lm ? 2 * c.P : 0;
    c.beamTotal = c.anchor + c.leadBlock;
    c.anchorWll = st.anchorWll; c.df = ANCHOR_DF; c.breakAt = st.anchorWll * ANCHOR_DF;
    c.util = st.anchorWll > 0 ? c.anchor / st.anchorWll : Infinity;
    c.level = c.util > 1 ? 'bad' : c.util > .8 ? 'warn' : 'ok';
    // part tensions, lead end first: j = sheaves between the part and the lead
    const js = []; for (let j = lm ? 0 : 1; j <= (lm ? n - 1 : n); j++) js.push(j);
    const sumE = e => js.reduce((a, j) => a + Math.pow(e, j), 0);
    let e = 1;
    if (st.friction !== 'ideal') { let lo = .3, hi = 1; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (W / sumE(m) > c.P) lo = m; else hi = m; } e = (lo + hi) / 2; }
    c.e = e; c.partT = js.map(j => c.P * Math.pow(e, j));  // partT[0] is the part nearest the lead
    return c;
  }

  /* ===================================================================================== REEVING
     m sheaves in a row of lanes 0..m (lane = one part of line). Sheave j joins lane j (left) and lane j+1 (right).
     Lead off the fixed block: m = n, the last sheave is in the top block; lead = lane m, going down to your hands.
     Lead off the moving block: m = n - 1, the last sheave is in the bottom block; lead = lane m, going up to the
     lead block; your hand line = lane m + 1.
     The dead end is lane 0, on whichever block sheave 0 is not in (on the load itself for a single sheave).     */
  function reeving(n, lead) {
    const lm = lead === 'moving' && n >= 2, m = lm ? n - 1 : n;
    const sh = [];
    for (let j = 0; j < m; j++) sh.push({ j, top: lm ? (m - 1 - j) % 2 === 1 : (m - 1 - j) % 2 === 0 });
    const deadTop = m > 0 ? !sh[0].top : true;
    const supporting = [];                               // lanes that hold the moving block
    for (let l = 0; l < (lm ? m + 1 : m); l++) supporting.push(l);
    const top = sh.filter(s => s.top), bot = sh.filter(s => !s.top);
    const upLanes = []; for (let l = 0; l <= (lm ? m - 1 : m); l++) upLanes.push(l);
    const x0 = X_A - (upLanes[0] + upLanes[upLanes.length - 1]) / 2 * LANE;
    return { n, lm, m, sh, deadTop, supporting, top, bot, x0, lane: l => x0 + l * LANE, sx: j => x0 + (2 * j + 1) * R };
  }

  /* ===================================================================================== ANIMATION STATE */
  let T = 0, tweens = [], callouts = [], ready = false;
  const A = { D: 0, lastRisePx: null, key: '', arrow: 0, arrowV: 0, reeveT: 1, reeveFrom: 0, needle: 0, creak: 0 };
  let F = { on: false, t: 0 };                           // failure state (a pure function of F.t when on)
  const THK = 650;                                       // ms the clamp jaws spread before it lets go

  function risePx() { return S.rise * riseUnitPx(); }

  /* ===================================================================================== DRAWING */
  let svgEl = null, opts = {};
  const nf = (v, d = 0) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toLocaleString('en-CA', { minimumFractionDigits: d, maximumFractionDigits: d });
  const wu = () => imp() ? 'lb' : 'kg';
  const wt = v => nf(Math.round(v)) + ' ' + wu();
  const ln = (v, d = 1) => nf(v, d) + (imp() ? ' ft' : ' m');
  const levelCol = l => l === 'bad' ? C.BAD : l === 'warn' ? C.WARN : C.OK;
  const D2R = Math.PI / 180;
  // a rigid-body pose: rotate r degrees about (cx, cy), then move (dx, dy)
  const ID = { dx: 0, dy: 0, r: 0, cx: 0, cy: 0 };
  const xf = (T, p) => { const a = T.r * D2R, x = p[0] - T.cx, y = p[1] - T.cy; return [T.cx + x * Math.cos(a) - y * Math.sin(a) + T.dx, T.cy + x * Math.sin(a) + y * Math.cos(a) + T.dy]; };
  const tf = T => `translate(${f(T.dx)} ${f(T.dy)}) rotate(${f(T.r)} ${f(T.cx)} ${f(T.cy)})`;

  function beam() {
    const y = BEAM.top, d = BEAM.d, t = Math.max(2.5, BEAM.tf);
    let s = '<g id="beam">';
    s += `<rect x="-10" y="${f(y)}" width="1620" height="${f(d)}" fill="url(#gBeam)"/>`;                     // web (set back)
    s += `<rect x="-10" y="${f(y + t)}" width="1620" height="7" fill="#000" opacity=".3"/>`;                 // shadow under the top flange
    s += `<rect x="-10" y="${f(y)}" width="1620" height="${f(t)}" fill="#7a848e" stroke="#23282c" stroke-width="1"/>`;
    s += `<rect x="-10" y="${f(y + d - t)}" width="1620" height="${f(t)}" fill="#8a949e" stroke="#23282c" stroke-width="1"/>`;
    s += `<line x1="-10" y1="${f(y + d - t + .8)}" x2="1610" y2="${f(y + d - t + .8)}" stroke="#c3cad0" stroke-width="1" opacity=".55"/>`;
    for (const x of [70, 330, 950, 1210, 1470]) s += `<rect x="${x}" y="${f(y + t)}" width="6" height="${f(d - 2 * t)}" fill="#5d6670" stroke="#2b3136" stroke-width=".8"/>`;
    return s + '</g>';
  }

  /* Beam clamp (side elevation, as a Harrington UBC-style plate clamp): two jaw plates hooked over the bottom flange,
     the adjusting spindle with its tommy bar, and a 1 in pin at the bottom that the block hook hangs on.
     spread 0..1 opens the jaws (failure). Drawn about (x, Y_PIN). */
  function beamClamp(x, id, o = {}) {
    const sp = o.spread || 0, w = 10 * K, top = Y_BB - Math.max(2.5, BEAM.tf) - 1.2, py = Y_PIN;
    let s = `<g id="${id}">`;
    const jaw = side => {                                 // one jaw: lip over the flange edge, plate down to the pin
      const a = side * sp * 22;                           // the jaw swings out about the pin as it spreads
      const lipX = x + side * w / 2;
      const P = [[x + side * 1.2 * K, py], [lipX - side * .6 * K, py - 2.6 * K], [lipX, top + 1.2 * K], [lipX, top - .6 * K], [lipX - side * 1.6 * K, top - .6 * K], [lipX - side * 1.6 * K, top + .5 * K], [x + side * .9 * K, top + 2.2 * K], [x, py - 1.4 * K]];
      return `<g transform="rotate(${f(a)} ${f(x)} ${f(py)})"><path d="${KIT.pathd(P, true)}" fill="url(#gPaint)" stroke="#1b1f22" stroke-width="1.5" stroke-linejoin="round"/>` +
        `<path d="${KIT.pathd([[lipX - side * 1.4 * K, top - .3 * K], [lipX - side * .2 * K, top - .3 * K]])}" stroke="#c3cad0" stroke-width="1.4" opacity=".7"/></g>`;
    };
    s += jaw(-1) + jaw(1);
    // spindle across the jaws with its tommy bar (seen end-on as a boss, bar across)
    const sy = top + 3.6 * K + sp * 1.5 * K;
    s += `<line x1="${f(x - 3 * K)}" y1="${f(sy)}" x2="${f(x + 3 * K)}" y2="${f(sy)}" stroke="#2b3136" stroke-width="${f(.7 * K)}" stroke-linecap="round"/>`;
    s += `<circle cx="${f(x)}" cy="${f(sy)}" r="${f(1.1 * K)}" fill="#a6aeb4" stroke="#2b3136" stroke-width="1.2"/>`;
    s += `<circle id="${id}-pin" cx="${f(x)}" cy="${f(py)}" r="${f(.5 * K)}" fill="#d3d9de" stroke="#1b1f22" stroke-width="1"/>`;
    return s + '</g>';
  }

  // top hook of a block: the S-319 contour turned over (bowl up, shank down), saddle on the anchor pin; a swivel neck
  // joins the shank to the block's yoke. Drawn in front of the clamp pin so the pin shows in the bowl.
  const topHook = (x, ysad, id) => `<rect x="${f(x - .9 * K)}" y="${f(ysad + 8.62 * HK_U - 3)}" width="${f(1.8 * K)}" height="${f(Y_UT - ysad - 8.62 * HK_U + 5)}" rx="2" fill="#6e7882" stroke="#23282c" stroke-width="1.2"/>` +
    `<g transform="rotate(180 ${f(x)} ${f(ysad)})">${KIT.hookProfile(x, ysad, HK_U, { id, flip: true })}</g>` +
    `<circle cx="${f(x)}" cy="${f(Y_PIN)}" r="${f(.5 * K)}" fill="#d3d9de" stroke="#1b1f22" stroke-width="1"/>`;

  function sheave(x, y, ang, id) {
    let s = `<g id="${id}"><circle cx="${f(x)}" cy="${f(y)}" r="${f(R + .7 * K)}" fill="url(#gSheave)" stroke="#2b3136" stroke-width="1.5"/>`;
    s += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(R - .35 * K)}" fill="none" stroke="#3b4247" stroke-width="1.2" opacity=".8"/>`;  // groove root
    for (let i = 0; i < 5; i++) {                       // lightening holes turn with the sheave
      const a = ang + i * Math.PI * 2 / 5, hx = x + Math.cos(a) * R * .56, hy = y + Math.sin(a) * R * .56;
      s += `<circle cx="${f(hx)}" cy="${f(hy)}" r="${f(R * .15)}" fill="#3a4147" stroke="#23282c" stroke-width=".8"/>`;
    }
    s += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(R * .26)}" fill="#6e7882" stroke="#23282c" stroke-width="1.2"/>`;   // bushing
    s += `<circle cx="${f(x)}" cy="${f(y)}" r="${f(R * .12)}" fill="#c9ced2" stroke="#23282c" stroke-width=".8"/>`;    // pin end
    return s + '</g>';
  }

  /* A wire rope block, cheek plates in elevation (STYLE: painted steel). The back plate is solid; the front plate is
     drawn cut away (a frame) so the sheaves inside can be seen. Sheaves are spread in a row so every part of line can
     be counted (labelled once on the drawing). back() goes behind the rope, front() over it. */
  function plateShape(xL, xR, ySh, isTop) {
    const l = xL - R - PM, r = xR + R + PM, t = ySh - R - PM, b = ySh + R + PM, rr = R + PM;
    return { l, r, t, b, rr, d: `M${f(l + rr)} ${f(t)} L${f(r - rr)} ${f(t)} A${f(rr)} ${f(rr)} 0 0 1 ${f(r - rr)} ${f(b)} L${f(l + rr)} ${f(b)} A${f(rr)} ${f(rr)} 0 0 1 ${f(l + rr)} ${f(t)}Z` };
  }
  function blockBack(xL, xR, ySh, isTop, id) {
    const p = plateShape(xL, xR, ySh, isTop);
    return `<g id="${id}"><path d="${p.d}" fill="#3a4148" stroke="#1d2226" stroke-width="2"/>` +
      `<path d="${p.d}" fill="#000" opacity=".18" transform="translate(3 4)"/></g>`;
  }
  function blockFront(xL, xR, ySh, isTop, becketX) {
    const p = plateShape(xL, xR, ySh, isTop), w = 1.35 * K;
    const inner = plateShape(xL, xR, ySh, isTop);
    // inner window = the outline inset by w
    const il = p.l + w, ir = p.r - w, it = p.t + w, ib = p.b - w, irr = p.rr - w;
    const win = `M${f(il + irr)} ${f(it)} L${f(ir - irr)} ${f(it)} A${f(irr)} ${f(irr)} 0 0 1 ${f(ir - irr)} ${f(ib)} L${f(il + irr)} ${f(ib)} A${f(irr)} ${f(irr)} 0 0 1 ${f(il + irr)} ${f(it)}Z`;
    let s = `<path d="${p.d} ${win}" fill="url(#gPaintSide)" fill-rule="evenodd" stroke="#1d2226" stroke-width="1.8"/>`;
    s += `<path d="${win}" fill="none" stroke="#9aa4ad" stroke-width="1" opacity=".55"/>`;                       // lit cut edge
    s += `<path d="M${f(p.l + p.rr)} ${f(p.t + 2)} L${f(p.r - p.rr)} ${f(p.t + 2)}" stroke="#c3cad0" stroke-width="1.6" opacity=".55"/>`; // top-left light
    // spacer bolts at the plate ends (they tie the two cheek plates together)
    for (const bx of [p.l + w * .5 + 2, p.r - w * .5 - 2]) s += `<circle cx="${f(bx)}" cy="${f(ySh)}" r="${f(.55 * K)}" fill="#8d969d" stroke="#1d2226" stroke-width="1"/>`;
    // yoke: the top block's swivel yoke over the plates; the bottom block's yoke under them carries the hook
    const cx = (p.l + p.r) / 2;
    if (isTop) s += `<path d="M${f(cx - 4 * K)} ${f(p.t + 1)} L${f(cx - 2.2 * K)} ${f(p.t - 1.2 * K)} L${f(cx + 2.2 * K)} ${f(p.t - 1.2 * K)} L${f(cx + 4 * K)} ${f(p.t + 1)}Z" fill="#6e7882" stroke="#1d2226" stroke-width="1.4"/>`;
    else s += `<path d="M${f(cx - 4 * K)} ${f(p.b - 1)} L${f(cx - 2.2 * K)} ${f(p.b + 1.4 * K)} L${f(cx + 2.2 * K)} ${f(p.b + 1.4 * K)} L${f(cx + 4 * K)} ${f(p.b - 1)}Z" fill="#6e7882" stroke="#1d2226" stroke-width="1.4"/>`;
    if (becketX != null) {                               // becket: forged eye where the dead end ties on
      const by = isTop ? p.b : p.t, dir = isTop ? 1 : -1;
      const q = `M${f(becketX - 1.3 * K)} ${f(by - dir * 2)} Q${f(becketX)} ${f(by + dir * 4.4 * K)} ${f(becketX + 1.3 * K)} ${f(by - dir * 2)}`;
      s += `<path d="${q}" fill="none" stroke="#2b3136" stroke-width="${f(1.0 * K + 1.6)}"/><path d="${q}" fill="none" stroke="#a6aeb4" stroke-width="${f(1.0 * K)}"/>`;
    }
    return s;
  }

  // rope end at a becket: thimble eye + a pressed sleeve
  function deadEnd(x, y, up) {
    const s = up ? -1 : 1, eye = 3.4 * K, y0 = y + s * 2.6 * K;
    let o = KIT.roundBar(KIT.catmull([[x, y0 + s * eye], [x - 1.2 * K, y0 + s * eye * .5], [x, y0], [x + 1.2 * K, y0 + s * eye * .5], [x, y0 + s * eye]], 6), ROPE_D * .9, '#b9c1c7', C.ROPE_D, '#eef1f3');
    o += `<rect x="${f(x - 1.1 * K)}" y="${f(y0 + s * (eye + .3 * K) - (s < 0 ? 2.4 * K : 0))}" width="${f(2.2 * K)}" height="${f(2.4 * K)}" rx="2" fill="#a3abb1" stroke="${C.STEEL_D}" stroke-width="1.2"/>`;
    return o;
  }

  function testWeight(cx, top, id) {
    const s = sidePx(), x = cx - s / 2;
    let o = `<g id="${id}">`;
    o += `<rect x="${f(x)}" y="${f(top)}" width="${f(s)}" height="${f(s)}" rx="3" fill="url(#gWeight)" stroke="#23282c" stroke-width="2"/>`;
    o += `<rect x="${f(x + 3)}" y="${f(top + 3)}" width="${f(s - 6)}" height="${f(Math.min(6, s * .08))}" fill="#fff" opacity=".12"/>`;
    o += `<rect x="${f(x + s - Math.max(4, s * .1))}" y="${f(top + 2)}" width="${f(Math.max(4, s * .1) - 2)}" height="${f(s - 4)}" fill="#000" opacity=".16"/>`;
    const fs = clamp(s * .2, KIT.PH.v > 1 ? 15 : 11, 30) * KIT.PH.v;
    o += `<text x="${f(cx)}" y="${f(top + s / 2 + fs * .35)}" text-anchor="middle" id="load-label" style="font:800 ${f(fs)}px ${KIT.FONT};fill:#efe9dc;letter-spacing:.02em">${nf(S.load)} ${wu()}</text>`;
    o += `<rect id="load-lug" x="${f(cx - .5 * K)}" y="${f(top - 3.6 * K)}" width="${f(1 * K)}" height="${f(3.8 * K)}" rx="1.5" fill="#6e7882" stroke="#23282c" stroke-width="1.2"/>`;
    return o + '</g>';
  }
  function cribbing(cx, w) {
    const h = CRIB, cw = 6 * K * .917;                  // 6x6 cribbing, 5.5 in actual
    let o = '<g id="cribbing">';
    for (const dx of [-w * .32, w * .32]) o += KIT.timberEnd(cx + dx - cw / 2, FLOOR - h, cw, h, 'cr' + Math.round(dx));
    return o + '</g>';
  }
  // hand line below your hands: hangs to the floor and piles up as you pull
  function tail(x, yGrip, travelPx, phase) {
    let o = KIT.wireRope([[x, yGrip], [x, FLOOR - 10]], ROPE_D, -phase);
    const coils = clamp(Math.floor(travelPx / 70), 0, 9);
    for (let i = 0; i < coils; i++) {
      const cy = FLOOR - 6 - i * 3.4, rx = 34 + (i % 3) * 3;
      o += `<ellipse cx="${f(x + 30)}" cy="${f(cy)}" rx="${f(rx)}" ry="8" fill="none" stroke="${C.ROPE_D}" stroke-width="${f(ROPE_D + 1.4)}"/>`;
      o += `<ellipse cx="${f(x + 30)}" cy="${f(cy)}" rx="${f(rx)}" ry="8" fill="none" stroke="${C.ROPE_M}" stroke-width="${f(ROPE_D)}"/>`;
    }
    return o;
  }
  function ropeArc(x, y, top) {
    return KIT.roundBar(KIT.arcPts(x, y, R, 180, top ? 360 : 0, 20), ROPE_D, C.ROPE_M, C.ROPE_D, '#e9edf0', 'butt', .7);
  }
  // a rope between two points; slack (length L0 > chord) hangs in a catenary-like sag that never goes under the floor
  function ropeBetween(a, b, L0, phase, id) {
    a = [a[0], Math.min(a[1], FLOOR - 5)]; b = [b[0], Math.min(b[1], FLOOR - 5)];   // a rope end never goes through the floor
    const ch = Math.hypot(b[0] - a[0], b[1] - a[1]);
    let P = [a, b];
    if (L0 > ch + 2) {
      const sagv = Math.min(Math.sqrt(Math.max(0, L0 * L0 - ch * ch)) * .5, 260);
      const m = [(a[0] + b[0]) / 2 + (b[1] - a[1]) * .08, Math.min(FLOOR - 8, (a[1] + b[1]) / 2 + sagv)];
      P = KIT.catmull([a, m, b], 12);
    }
    return `<g${id ? ` id="${id}"` : ''}>${KIT.wireRope(P, ROPE_D, phase)}</g>`;
  }

  /* ---------------------------------------------------------------- the whole scene, one frame */
  function draw(c) {
    KIT.PH.v = !CAPTURE && window.matchMedia && matchMedia('(max-width:700px)').matches ? 1.75 : 1;
    const rv = reeving(S.parts, S.lead), lm = rv.lm, rp = risePx();
    const side = sidePx();
    const topSh = rv.sh.filter(q => q.top), botSh = rv.sh.filter(q => !q.top);
    const bcx = rv.n > 1 ? (rv.lane(rv.supporting[0]) + rv.lane(rv.supporting[rv.supporting.length - 1])) / 2 : rv.lane(0);
    const yLow0 = lowSheave0() - rp;                      // bottom sheave centres (rope eye for one part)
    const tL = Math.min(topSh.length ? rv.sx(topSh[0].j) : X_A, rv.deadTop && rv.n > 1 ? rv.lane(0) + R : 1e9);
    const tR = Math.max(topSh.length ? rv.sx(topSh[topSh.length - 1].j) : X_A, tL);
    const bL = Math.min(botSh.length ? rv.sx(botSh[0].j) : bcx, !rv.deadTop ? rv.lane(0) + R : 1e9);
    const bR = Math.max(botSh.length ? rv.sx(botSh[botSh.length - 1].j) : bcx, bL);
    const pose = failPose(rv, { side, yLow0, bcx, tL, tR, bL, bR });   // rigid-body poses (identity until the anchor fails)
    const PT = pose.top, PB = pose.bot, PL = pose.load, PC = pose.clamp;
    const vel = laneSpeeds(rv), reeve = A.reeveT;
    const handX = lm ? rv.lane(rv.m + 1) : rv.lane(rv.m), yGrip = 600;
    const leadBlockX = lm ? rv.sx(rv.m) : null;
    const loadTop = lowSheave0() - rp + HOOKDROP + SHK_DROP + LUG_H;

    let s = KIT.styleBlock(phoneCss()) + KIT.defs() + KIT.backdrop(FLOOR);
    s += KIT.column(18, FLOOR, Y_BB, 30) + KIT.column(1552, FLOOR, Y_BB, 30);
    s += '<g id="anchor-src">' + beam();
    if (lm) s += beamClamp(leadBlockX, 'lead-anchor', {});
    s += `<g id="anchor-g" transform="${tf(PC)}">` + beamClamp(X_A, 'anchor', { spread: pose.spread }) + '</g>';

    // ---- the load, its shackle and the bottom hook (drawn first: the blocks may land in front of it)
    const hookSad = yLow0 + HOOKDROP;
    s += `<g id="load-g" transform="${tf(PL)}">` + loadStack(bcx, hookSad, loadTop, side, rv.n === 1) + '</g>';
    s += KIT.contactShadow(bcx, FLOOR + 4, side * 1.2, 16, clamp(1 - (FLOOR - CRIB - side - (loadTop + PL.dy)) / 300, .25, 1)) + cribbing(bcx, side);

    // ---- block backs
    if (rv.n > 1) s += `<g transform="${tf(PB)}">` + blockBack(bL, bR, yLow0, false, 'lower-block') + '</g>';
    s += `<g transform="${tf(PT)}">` + blockBack(tL, tR, Y_US, true, 'upper-block') + '</g>';
    if (lm) s += blockBack(leadBlockX, leadBlockX, Y_US, true, 'lead-block');

    // ---- the rope: every part between the blocks (ends follow the blocks; slack when the anchor has let go)
    const yBotEnd = rv.n > 1 ? yLow0 : hookSad - 6.5 * K;
    for (let l = 0; l < rv.m + (lm ? 1 : 0); l++) {
      const x = rv.lane(l);
      let top = [x, Y_US], bot = [x, yBotEnd], Tt = PT, Tb = PB;
      if (l === 0 && rv.deadTop && rv.n > 1) top = [x, Y_UB + 6 * K];
      if (l === 0 && !rv.deadTop && rv.n > 1) bot = [x, yLow0 - R - PM - 6 * K];
      if (rv.n === 1) Tb = PL;
      if (l === rv.m && lm) { top = [x, Y_US]; Tt = ID; }
      const a = xf(Tb, bot), b = xf(Tt, top), L0 = Math.abs(top[1] - bot[1]);
      let A2 = a, B2 = b;
      if (reeve < 1 && l >= rv.m - 1) B2 = [a[0] + (b[0] - a[0]) * reeve, a[1] + (b[1] - a[1]) * reeve];
      s += ropeBetween(A2, B2, reeve < 1 ? 0 : L0, vel[l] * A.D, 'part-' + l);
    }

    // ---- sheaves, the rope in their grooves, dead ends, front plates
    s += `<g id="lower-block-g" transform="${tf(PB)}">`;
    if (rv.n > 1) {
      botSh.forEach((q, i) => { s += sheave(rv.sx(q.j), yLow0, (vel[q.j] - 1) * A.D / R, 'sheave-l' + i) + ropeArc(rv.sx(q.j), yLow0, false); });
      if (!rv.deadTop) s += deadEnd(rv.lane(0), yLow0 - R - PM, true);
      s += blockFront(bL, bR, yLow0, false, !rv.deadTop ? rv.lane(0) : null);
      s += `<rect x="${f(bcx - .9 * K)}" y="${f(yLow0 + R + PM + 1.2 * K)}" width="${f(1.8 * K)}" height="${f(1.4 * K)}" fill="#6e7882" stroke="#23282c" stroke-width="1"/>`;
    }
    s += '</g>';
    if (rv.n > 1) s += `<g transform="${tf(pose.hook)}">` + KIT.hookProfile(bcx, hookSad, HK_L, { id: 'hook' }) + '</g>';
    s += `<g id="upper-block-g" transform="${tf(PT)}">` + topHook(X_A, Y_USAD, 'top-hook');
    topSh.forEach((q, i) => { s += sheave(rv.sx(q.j), Y_US, vel[q.j] * A.D / R, 'sheave-u' + i) + ropeArc(rv.sx(q.j), Y_US, true); });
    if (rv.deadTop && rv.n > 1 && !(F.on && F.t > THK)) s += deadEnd(rv.lane(0), Y_UB, false);   // the eye flops out of sight once the block falls
    s += blockFront(tL, tR, Y_US, true, rv.deadTop && rv.n > 1 ? rv.lane(0) : null) + '</g>';
    if (lm) {
      s += topHook(leadBlockX, Y_USAD, 'lead-hook');
      s += sheave(leadBlockX, Y_US, vel[rv.m] * A.D / R, 'sheave-lead') + ropeArc(leadBlockX, Y_US, true) + blockFront(leadBlockX, leadBlockX, Y_US, true, null);
    }

    // ---- the hand line: from the last sheave down through your hands to the coil on the floor
    if (!F.on) {
      const handTop = Y_US;
      let P = [[handX, yGrip], [handX, handTop]];
      if (reeve < 1) P = [[handX, handTop + (yGrip - handTop) * reeve], [handX, handTop]];
      s += `<g id="lead-line">${KIT.wireRope(P, ROPE_D, -rv.n * A.D)}${reeve >= 1 ? tail(handX, yGrip, c.travel * riseUnitPx(), rv.n * A.D) : ''}</g>`;
    } else {
      const from = lm ? [handX, Y_US] : xf(PT, [handX, Y_US]);
      s += ropeBetween(from, [handX + 30, FLOOR - 8], Math.max(0, FLOOR - Y_US), 0, 'lead-line');
      s += tail(handX, FLOOR - 9, c.travel * riseUnitPx(), 0).replace(/<g[^>]*>/, '');
    }
    s += '</g>';                                           // end of anchor-src (the whole rig: the inset magnifies it)

    // ---- visual maths, labels, inset, cards, failure
    if (!F.on) s += overlays(c, rv, { yU: Y_US, yLow: yLow0, handX, yGrip, leadBlockX, tL, tR });
    if (S.inset) {
      const src = F.on ? xf(PC, [X_A, Y_PIN - 3 * K]) : [X_A, Y_PIN - 3 * K];
      s += KIT.detailInset('anchor-src', src, 3, 215, (!F.on && yLow0 > 200 && yLow0 < 450) ? 650 : 345, 85, '', F.on ? 'CLAMP ×3 · jaws spread' : 'ANCHOR ×3 · beam clamp', 'anchor-inset');
    }
    if (!F.on) s += sceneLabels(c, rv, { yLow: yLow0, tL, tR, bL });
    if (S.cards && S.cards !== 'none' && !F.on) s += cards(c);
    if (F.on) s += failOverlay(c, rv, pose, side, bcx);
    return s;
  }

  function loadStack(cx, hookSad, loadTop, side, eyeOnly) {
    let s = '';
    if (eyeOnly) {                                       // one part: the rope's own thimble eye carries the shackle
      const x = cx, ey = hookSad;
      s += KIT.roundBar(KIT.catmull([[x, ey - 6.5 * K], [x - 1.4 * K, ey - 3.6 * K], [x - 1.2 * K, ey - 1 * K], [x, ey], [x + 1.2 * K, ey - 1 * K], [x + 1.4 * K, ey - 3.6 * K], [x, ey - 6.5 * K]], 6), ROPE_D * .9, '#b9c1c7', C.ROPE_D, '#eef1f3');
      s += `<rect x="${f(x - 1.2 * K)}" y="${f(ey - 9 * K)}" width="${f(2.4 * K)}" height="${f(2.6 * K)}" rx="2" fill="#a3abb1" stroke="${C.STEEL_D}" stroke-width="1.2"/>`;
    }
    const sh = KIT.shackleFace(cx, loadTop - LUG_H, K, true, SHK);
    return s + `<g id="shackle">${sh.back}</g>` + testWeight(cx, loadTop, 'load-box') + `<g>${sh.front}</g>`;
  }

  /* material speed of the rope in each lane, as a multiple of the load speed (upward +). Fixed sheave: the speed carries
     over with its sign flipped; moving sheave (moving at 1): u(next) = 2 - u. */
  function laneSpeeds(rv) {
    const u = [];
    u[0] = rv.deadTop ? 0 : 1;
    if (rv.n === 1) u[0] = 1;
    for (let j = 0; j < rv.m; j++) u[j + 1] = rv.sh[j].top ? -u[j] : 2 - u[j];
    if (rv.lm) u[rv.m + 1] = -u[rv.m];
    return u;
  }

  function overlays(c, rv, g) {
    let s = '';
    const W = c.W;
    const gap = (g.yLow - R - PM) - (Y_UB), crowded = gap < 150;   // blocks close together: one row of tags, no numbers
    if (S.count && !crowded) {                            // part numbers on every part that holds the moving block
      rv.supporting.forEach((l, i) => {
        const x = rv.lane(l), y = rv.n > 1 ? g.yLow - R - PM - 30 : g.yLow - 120;
        const cm = KIT.PH.v > 1 ? 1.65 : 1;            // phone: bigger count bubbles
        s += `<g id="count-${i + 1}"><circle cx="${f(x)}" cy="${f(y)}" r="${f(14 * cm)}" fill="${C.ACC}" stroke="#1F1D1A" stroke-width="2"/><text x="${f(x)}" y="${f(y + 6 * cm)}" text-anchor="middle" class="pts" style="fill:#1F1D1A;font-weight:900;font-size:${f(16 * cm)}px">${i + 1}</text></g>`;
      });
    }
    if (S.tags) {                                         // tension on each part (two staggered rows)
      const ymid = (g.yU + R + PM + g.yLow - R - PM) / 2 - (S.count && !crowded ? 14 : 0), T = c.partT;
      rv.supporting.forEach((l, i) => {
        const j = c.lm ? rv.n - 1 - i : rv.n - i, t = c.lm ? T[j] : T[j - 1];
        s += KIT.pill(rv.lane(l), crowded ? (Y_UB + g.yLow - R - PM) / 2 : ymid + (l % 2 ? 20 : -20), nf(Math.round(t)), C.TEXT, { id: 'tag-' + i, fs: crowded && KIT.PH.v === 1 ? 13 : 15 });
      });
    }
    if (c.friction !== 'ideal' && g.yLow - g.yU > 200) {  // friction badges between each sheave's own two parts
      const txt = c.friction === 'rule10' ? '+10 %' : (Math.round(c.e * 1000) / 10) + ' %';
      rv.sh.forEach((q, i) => {
        const y = q.top ? Y_UB + 20 : g.yLow - R - PM - (S.count ? 58 : 20);
        s += KIT.pill(rv.sx(q.j), y, txt, COL.fr, { fs: KIT.PH.v > 1 ? 14.5 : 13, id: 'fric-' + i });
      });
    }
    const L = clamp(130 * c.P / W, 18, 190);
    s += KIT.forceArrow(g.handX + 18, g.yGrip, g.handX + 18, g.yGrip + L, COL.P, 6, 'pull-arrow');
    s += `<circle id="grip" cx="${f(g.handX)}" cy="${f(g.yGrip)}" r="15" fill="none" stroke="${C.ACC}" stroke-width="3"${CAPTURE ? ' opacity="0"' : ''}/>`;
    s += KIT.pill(g.handX + 14, g.yGrip - 30, 'Pull ' + wt(c.P), COL.P, { id: 'pull-tag', fs: 18, anchor: 'start' });
    const col = S.fail ? levelCol(c.level) : C.TEXT;
    s += KIT.pill(c.lm ? X_A - 7 * K : X_A + 7 * K, (Y_BB + Y_UT) / 2 + 2, 'Anchor ' + wt(c.anchor), col, { id: 'anchor-tag', fs: 16, anchor: c.lm ? 'end' : 'start' });
    if (c.lm) s += KIT.pill(g.handX + 16, Y_US, 'Lead block anchor ' + wt(c.leadBlock) + ' (2P)', C.TEXT, { id: 'lead-anchor-tag', fs: 16, anchor: 'start' });
    return s;
  }

  function sceneLabels(c, rv, g) {
    if (!S.labels) return '';
    const lx = Math.min(g.tL, g.bL) - R - PM - 24;
    let s = KIT.label(lx, Y_US + 9, 'Top block · fixed', [g.tL - R - PM * .5, Y_US], { anchor: 'end' });
    if (rv.n > 1) s += KIT.label(lx, g.yLow + 9, 'Bottom block · moving', [g.bL - R - PM * .5, g.yLow], { anchor: 'end' });
    s += `<text class="lm halo" x="${f(lx)}" y="${f(Y_US + 36)}" text-anchor="end" style="font-size:17px">front plate cut away · sheaves spread for counting</text>`;
    return s;
  }

  /* ---------------------------------------------------------------- the maths cards (right side of the stage) */
  const CX = 1110, CW = 460;
  function card(id, y, h, title) {
    return `<g id="${id}"><rect x="${CX}" y="${y}" width="${CW}" height="${h}" rx="14" fill="#1c1a17" stroke="#4a4640" stroke-width="1.5" opacity=".96"/>` +
      `<text x="${CX + 18}" y="${y + 28}" class="pts" style="fill:${C.MUTED};letter-spacing:.1em;font-size:14px">${title}</text>`;
  }
  function cards(c) {
    let s = '';
    const want = S.cards === 'all' ? ['anchor', 'force', 'dist', 'work'] : String(S.cards).split(',');
    let y = Y_BB + 14;
    const W = c.W, x0 = CX + 20, w = CW - 40;
    if (want.includes('anchor')) {
      const h = 150, sc = w / Math.max(c.W + c.P, c.anchorWll, 1), col = S.fail ? levelCol(c.level) : C.TEXT;
      s += card('vm-anchor', y, h, 'ANCHOR · ' + (c.lm ? 'W − P (the lead helps hold the block)' : 'W + P (you pull down on it too)'));
      if (!c.lm) s += `<rect x="${x0}" y="${y + 44}" width="${f(c.W * sc)}" height="26" fill="${COL.W}" rx="3"/><rect x="${f(x0 + c.W * sc)}" y="${y + 44}" width="${f(c.P * sc)}" height="26" fill="${COL.P}" rx="3"/>`;
      else s += `<rect x="${x0}" y="${y + 44}" width="${f((c.W - c.P) * sc)}" height="26" fill="${COL.W}" rx="3"/><rect x="${f(x0 + (c.W - c.P) * sc)}" y="${y + 44}" width="${f(c.P * sc)}" height="26" fill="none" stroke="${COL.P}" stroke-width="2" stroke-dasharray="5 4" rx="3"/>`;
      s += `<line x1="${f(x0 + c.anchorWll * sc)}" y1="${y + 36}" x2="${f(x0 + c.anchorWll * sc)}" y2="${y + 80}" stroke="${C.WARN}" stroke-width="3"/>`;
      s += `<text x="${f(Math.min(x0 + c.anchorWll * sc, CX + CW - 20))}" y="${y + 98}" text-anchor="end" class="pts" style="fill:${C.WARN};font-size:14px">rated ${wt(c.anchorWll)}</text>`;
      s += `<text x="${x0}" y="${y + 128}" class="pts" style="fill:${col}">${wt(c.anchor)} = ${nf(c.util * 100)} % of rating</text>`;
      s += '</g>'; y += h + 10;
    }
    if (want.includes('force')) {
      const h = 160, sc = w / Math.max(c.n * c.P, W);
      s += card('vm-force', y, h, 'FORCE · ' + c.n + ' × P = W' + (c.friction !== 'ideal' ? ' + friction' : ''));
      s += `<rect x="${x0}" y="${y + 44}" width="${f(W * sc)}" height="26" fill="${COL.W}" rx="3"/><text x="${x0 + 8}" y="${y + 63}" class="pts" style="fill:#1F1D1A">W ${wt(W)}</text>`;
      for (let i = 0; i < c.n; i++) s += `<rect x="${f(x0 + i * c.P * sc)}" y="${y + 82}" width="${f(c.P * sc - 2)}" height="26" fill="${COL.P}" rx="3" opacity="${.75 + .25 * (i % 2)}"/>`;
      if (c.fricForce > 0.5) s += `<rect x="${f(x0 + W * sc)}" y="${y + 78}" width="${f(c.fricForce * sc)}" height="34" fill="none" stroke="${COL.fr}" stroke-width="3" rx="3"/>` +
        `<text x="${f(Math.min(x0 + W * sc + 6, CX + CW - 150))}" y="${y + 134}" class="pts" style="fill:${COL.fr}">friction ${wt(c.fricForce)}</text>`;
      s += `<text x="${x0}" y="${y + 134}" class="pts" style="fill:${COL.P}"><tspan style="fill:${COL.n}">${c.n}</tspan> × ${wt(c.P)} = ${wt(c.n * c.P)}</text>`;
      s += '</g>'; y += h + 10;
    }
    if (want.includes('dist')) {
      const h = 150, maxT = Math.max(c.VR * riseMax(), 1e-6), sc = w / maxT;
      s += card('vm-dist', y, h, 'DISTANCE · lead travel = ' + c.n + ' × rise');
      s += `<g id="vm-rise"><rect x="${x0}" y="${y + 46}" width="${f(w)}" height="20" fill="#2a2723" rx="3"/><rect x="${x0}" y="${y + 46}" width="${f(c.rise * sc)}" height="20" fill="${COL.dist}" rx="3"/>` +
        `<text x="${x0}" y="${y + 88}" class="pts" style="fill:${COL.dist}">Load rise ${ln(c.rise, 2)}</text></g>`;
      s += `<g id="vm-lead"><rect x="${x0}" y="${y + 100}" width="${f(w)}" height="20" fill="#2a2723" rx="3"/><rect x="${x0}" y="${y + 100}" width="${f(c.travel * sc)}" height="20" fill="${COL.P}" rx="3"/>`;
      for (let i = 1; i < c.n && c.rise > 0; i++) s += `<line x1="${f(x0 + i * c.rise * sc)}" y1="${y + 98}" x2="${f(x0 + i * c.rise * sc)}" y2="${y + 122}" stroke="#1F1D1A" stroke-width="2"/>`;
      s += `<text x="${x0}" y="${y + 142}" class="pts" style="fill:${COL.P}">Lead line ${ln(c.travel, 2)} = <tspan style="fill:${COL.n}">${c.n}</tspan> × ${ln(c.rise, 2)}</text></g>`;
      s += '</g>'; y += h + 10;
    }
    if (want.includes('work')) {
      const h = 160, mx = Math.max(c.workIn, c.workOut, 1e-9), sc = w / mx, wu2 = imp() ? ' ft·lb' : ' J';
      s += card('vm-work', y, h, 'WORK · in = out + friction');
      s += `<g id="vm-in"><rect x="${x0}" y="${y + 46}" width="${f(Math.max(0, c.workIn * sc))}" height="22" fill="none" stroke="${COL.P}" stroke-width="2.5" rx="3"/>` +
        `<text x="${x0}" y="${y + 90}" class="pts" style="fill:${COL.P}">In: ${wt(c.P)} × ${ln(c.travel, 2)} = ${nf(Math.round(c.workIn))}${wu2}</text></g>`;
      s += `<g id="vm-out"><rect x="${x0}" y="${y + 104}" width="${f(c.workOut * sc)}" height="22" fill="${COL.W}" rx="3"/>` +
        (c.lost > 1 ? `<rect x="${f(x0 + c.workOut * sc)}" y="${y + 104}" width="${f(c.lost * sc)}" height="22" fill="${COL.fr}" rx="3"/>` : '') +
        `<text x="${x0}" y="${y + 148}" class="pts" style="fill:${COL.W}">Out: ${wt(c.W)} × ${ln(c.rise, 2)} = ${nf(Math.round(c.workOut))}${wu2}${c.lost > 1 ? `<tspan style="fill:${COL.fr}">  lost ${nf(Math.round(c.lost))}</tspan>` : ''}</text></g>`;
      s += '</g>';
    }
    return s;
  }

  // the live formula, colour-matched to the drawing (HTML, under the stage)
  function formulaHtml(c) {
    const sp = (col, t) => `<span style="color:${col}">${t}</span>`;
    const P = sp(COL.P, 'P'), Wt = sp(COL.W, nf(c.W)), nT = sp(COL.n, c.n);
    if (c.friction === 'ideal') return `${P} = W ÷ n = ${Wt} ÷ ${nT} = ${sp(COL.P, wt(c.P))}`;
    if (c.friction === 'rule10') return `${P} = W × (1 + 0.10 × ${sp(COL.fr, c.Sh)} sheaves) ÷ n = ${Wt} × ${sp(COL.fr, nf(1 + .1 * c.Sh, 1))} ÷ ${nT} = ${sp(COL.P, wt(c.P))}`;
    return `${P} = W ÷ ratio = ${Wt} ÷ ${sp(COL.fr, nf(c.ratio, 2))} (maker's table, ${FRIC[c.friction].toLowerCase()}) = ${sp(COL.P, wt(c.P))}`;
  }

  /* ===================================================================================== FAILURE
     The anchor (beam clamp) breaks when its load is greater than its WLL × ANCHOR_DF. Every pose below is a pure
     function of the failure clock (deterministic frames), with g = 386 in/s² on the drawing scale:
       0 - THK ms   the jaws spread, the rig shudders.
       then         everything falls freely together (½ g t²) until the load lands on its cribbing.
                    The bottom block keeps falling until it lies on top of the load (hook folded beside the shackle).
                    The top block keeps falling until it hits the bottom block, then tips off and lands flat on the
                    floor beside the load; the clamp, still on its hook, follows it down and lands on its side with
                    its jaws open. Ropes go slack between their real ends. Dust where things land; the clamp rocks
                    to a stop.                                                                                    */
  const GPX = 386.1 * K / 1e6;                            // px per ms²
  const SET = 650;                                        // ms to tip off and settle once a part lands
  function failPose(rv, g) {
    const P = { top: { ...ID }, bot: { ...ID }, load: { ...ID }, clamp: { ...ID }, hook: { ...ID }, spread: 0, shake: 0, land: {} };
    if (!F.on) return P;
    P.spread = clamp(F.t / THK, 0, 1);
    if (F.t < THK) {                                       // shudder while the jaws open
      const sh = Math.sin(F.t / 16) * 2.4 * P.spread;
      for (const k of ['top', 'bot', 'load', 'clamp', 'hook']) P[k].dx = sh;
      return P;
    }
    const t = F.t - THK, d = .5 * GPX * t * t, fallT = h => Math.sqrt(2 * Math.max(0, h) / GPX);
    const side = g.side, restTop = FLOOR - CRIB - side, loadTop = g.yLow0 + HOOKDROP + SHK_DROP + LUG_H;
    // load
    const hL = Math.max(0, restTop - loadTop);
    P.load.dy = Math.min(d, hL); P.land.load = fallT(hL);
    // bottom block: comes down onto the load top; its hook (still in the shackle) folds over sideways
    const bBottom = g.yLow0 + R + PM, hookSad = g.yLow0 + HOOKDROP;
    const hB = Math.max(hL, restTop - 3 - bBottom), tb = fallT(hB);
    P.bot.dy = Math.min(d, hB); P.bot.cx = (g.bL + g.bR) / 2; P.bot.cy = g.yLow0;
    P.hook = { dx: 0, dy: Math.min(d, hL), r: 0, cx: g.bcx, cy: hookSad };
    if (t > P.land.load) { const k = ease(clamp((t - P.land.load) / SET, 0, 1)); P.hook.r = 78 * k; }
    if (t > tb) { const k = ease(clamp((t - tb) / SET, 0, 1)); P.bot.r = -6 * k; P.bot.dx = 8.62 * HK_L * .8 * k; }
    P.land.bot = tb;
    // top block: falls until it meets the bottom block, then tips off to the floor on the lead side
    const contactDrop = Math.max(0, (restTop - 3 - 2 * (R + PM) - 4) - Y_UB);
    const tc = fallT(contactDrop);
    const tw = (g.tR - g.tL) + 2 * (R + PM), th = 2 * (R + PM);
    P.top.cx = (g.tL + g.tR) / 2; P.top.cy = Y_US;
    const finalDx = (g.bcx + side / 2 + tw / 2 + 24) - P.top.cx, finalDy = (FLOOR - th / 2 - 2) - Y_US;
    if (t <= tc) P.top.dy = Math.min(d, contactDrop);
    else {
      const k = clamp((t - tc) / (SET * 1.3), 0, 1), e2 = ease(k);
      P.top.dx = finalDx * e2; P.top.dy = contactDrop + (finalDy - contactDrop) * (k * k);
      P.top.r = 28 * Math.sin(Math.PI * k) * (1 - k * .3) + 4 * e2;
    }
    P.land.top = tc + SET * 1.3;
    // clamp: stays on the top hook while falling, then drops off beside the top block, jaws open, and rocks to rest
    if (t <= tc) { P.clamp = { ...P.top }; }
    else {
      const k = clamp((t - tc) / (SET * 1.6), 0, 1), e2 = ease(k);
      const fx = (g.bcx + side / 2 + tw + 60) - X_A, fy = (FLOOR - 4 * K) - Y_PIN;
      P.clamp.dx = (P.top.dx) * (1 - e2) + fx * e2; P.clamp.dy = contactDrop * (1 - e2) + fy * e2;
      P.clamp.cx = X_A; P.clamp.cy = Y_PIN - 3 * K;
      const after = Math.max(0, t - tc - SET * 1.6);
      P.clamp.r = 95 * e2 + (after > 0 ? 9 * Math.exp(-after / 900) * Math.sin(after / 140) : 0);
    }
    P.land.clamp = tc + SET * 1.6;
    return P;
  }
  function dustPuff(cx, w, dt, seed) {
    if (dt < 0 || dt > 2600) return '';
    const k = dt / 2600; let s = '';
    for (let i = 0; i < 10; i++) {
      const a = (i / 9) * Math.PI, r = 18 + k * (70 + 12 * ((i + seed) % 3));
      s += `<circle cx="${f(cx + Math.cos(a) * (w / 2 + r * .9) * (i % 2 ? 1 : -1))}" cy="${f(FLOOR - 8 - Math.sin(a) * r * .4 - k * 14)}" r="${f(9 + k * 26)}" fill="#8a8178" opacity="${f((1 - k) * .42)}"/>`;
    }
    return s;
  }
  function failOverlay(c, rv, P, side, bcx) {
    const t = F.t - THK;
    let s = '';
    if (t > 0) {
      s += dustPuff(bcx, side, t - P.land.load, 0);
      s += dustPuff(bcx + side / 2 + 120, 120, t - P.land.top, 1);
    }
    s += `<g id="fail-card"><rect x="${CX}" y="${Y_BB + 14}" width="${CW}" height="210" rx="14" fill="#2a1312" stroke="${C.BAD}" stroke-width="3"/>` +
