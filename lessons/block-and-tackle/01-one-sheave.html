        return { setup, q: `**${lb(W)}** on **${n} parts**, lead pulled straight down off the fixed block, ${how}. Load on the anchor?`, choices: [ans].concat(wrong), answer: 0,
          hint: 'Lead pulled down off the top block: anchor = W + P.', explain: `P = ${lb(c.P)}; anchor = ${lb(W)} + ${lb(c.P)} = **${lb(c.anchor)}**.` };
      }
      const rise = pick(rng, [0.5, 1, 1.5, 2, 3]), tr = n * rise, ft = v => T.nf(v, v % 1 ? 1 : 0) + ' ft', ans = { t: ft(tr) };
      const wrong = uniq(ans, [{ t: ft(rise), why: 'That is the rise. The lead line moves n times as far as the load.' }, { t: ft(rise / n), why: 'That divides. The lead line always moves farther than the load.' },
        { t: ft(n + rise), why: 'That adds the parts and the rise. Multiply instead.' }, { t: ft(2 * rise), why: 'That only works for 2 parts. Travel = n × rise.' }]);
      return { setup: Object.assign(setup, { rise: Math.min(rise, 1) }), q: `**${n} parts** of line lift the load **${ft(rise)}**. How far is the lead line pulled?`, choices: [ans].concat(wrong), answer: 0,
        hint: 'Lead line travel = parts × rise.', explain: `${n} × ${ft(rise)} = **${ft(tr)}**.` };
    },
  };
  return sc;
}

/* ===================================================================================== chain falls */
function chainScene() {
  const T = CHAINFALL, KEYS = ['chain', 'cap', 'load', 'rise', 'units', 'D', 'd', 'eta'];
  const A = base(T, KEYS);
  const imp = () => (A.cur ? A.cur.units : T.S.units) === 'imp';
  const sc = {
    defaults: Object.assign({}, window.BT_START),
    viewBox: '0 0 1600 880',
    controls: {
      chain: { type: 'chips', label: 'Hoist', options: [{ v: 'geared', t: 'Geared chain hoist' }, { v: 'differential', t: 'Differential block' }] },
      cap: { type: 'chips', label: 'Capacity', options: T.CAPNAME.map((n, i) => ({ v: i, t: n + ' t' })) },
      load: { type: 'slider', label: 'Load', get min() { return imp() ? 200 : 100; }, get max() { return imp() ? 12000 : 5400; }, get step() { return imp() ? 100 : 50; }, fmt: v => T.nf(v) + (imp() ? ' lb' : ' kg') },
      rise: { type: 'slider', label: 'Load rise', min: 0, get max() { return Math.max(.05, Math.floor(T.riseMax() * 100) / 100); }, step: .01, fmt: v => T.nf(v, 2) + (imp() ? ' ft' : ' m') },
      D: { type: 'slider', label: 'Large wheel D', get min() { return imp() ? 6 : 150; }, get max() { return imp() ? 14 : 350; }, get step() { return imp() ? .5 : 5; }, fmt: v => T.nf(v, 1) + (imp() ? ' in' : ' mm') },
      d: { type: 'slider', label: 'Small wheel d', get min() { return imp() ? 5 : 125; }, get max() { return imp() ? 13.5 : 340; }, get step() { return imp() ? .5 : 5; }, fmt: v => T.nf(v, 1) + (imp() ? ' in' : ' mm') },
      units: { type: 'chips', label: 'Units', options: [{ v: 'imp', t: 'lb · ft' }, { v: 'met', t: 'kg · m' }] },
    },
    mount(svg, api) { const inner = A.mountSvg(svg, api); T.mount({ svg: inner, state: Object.assign({}, sc.defaults), external: true }); },
    apply(state, prev, initial) {
      // a new hoist starts a fresh lift with its usual test load (as on the free simulator), unless the same change sets the load
      if (prev && !initial && state.chain !== prev.chain) { state.rise = 0; if (state.load === prev.load) state.load = state.chain === 'geared' ? (imp() ? 4000 : 1800) : (imp() ? 1000 : 450); }
      const d = A.diff(state); if (initial) { for (const k of KEYS) if (k in state) d[k] = state[k]; d.snap = true; }
      if (Object.keys(d).length) T.set(d);
      A.pull(state); A.cur = state;
    },
    advance(ms, state) { T.frame(ms); A.pull(state); A.cur = state; },
    calc(state) {
      const c = T.calc(Object.assign({}, T.S, state));
      return { P: c.P, Pideal: c.Pideal, VR: c.VR, MA: c.VR, MAact: c.MAact, eff: c.eff, eta: c.eta, rise: c.rise, travel: c.travel, rated: c.rated, util: c.util,
        falls: c.falls, holds: c.holds, riseMax: T.riseMax(), fail: false, failure: { on: false } };
    },
    readouts(state, o) {
      const g = state.chain === 'geared', u = imp() ? 'ft' : 'm', ph = document.body.classList.contains('phone');
      return [
        { id: 'vr', label: 'Velocity ratio', short: 'VR', value: T.nf(o.VR, o.VR % 1 ? 1 : 0) + ' : 1', color: 'var(--accent)' },
        { id: 'p', label: 'Pull on the hand chain', short: 'Pull', value: T.wt(o.P), color: '#59b7ff' },
        { id: 'dist', label: 'Hand chain / rise', short: 'Hand chain', value: ph ? T.nf(o.travel, 1) + ' ' + u : T.nf(o.travel, 1) + ' / ' + T.nf(o.rise, 2) + ' ' + u },
        { id: 'eff', label: 'Efficiency', short: 'Eff.', value: T.nf(o.eff * 100, ph ? 0 : 1) + ' %' },
        g ? { id: 'cap', label: 'Of capacity', short: 'Capacity', value: T.nf(o.util * 100) + ' %', cls: o.util > 1 ? 'bad' : o.util > .8 ? 'warn' : 'ok' }
          : { id: 'cap', label: 'Holds by itself', short: 'Holds', value: o.eff < .5 ? (ph ? 'Yes' : 'Yes (under 50 %)') : 'No', cls: o.eff < .5 ? 'ok' : 'warn' },
      ];
    },
    caption: () => null,
    spot: A.spot,
    busy: () => T.isBusy(),
    reset() { },
    phoneViewBox(state, asp) { const lb = A.box('load-box'); return A.phoneCrop(650, 60, lb ? Math.min(870, lb.y + lb.height + 30) : 860, asp || 1, false); },
    challenge(rng) {
      if (rng() < .5) {
        const i = pick(rng, [1, 2, 3, 5]), [cap, pr, ratio] = T.CB[i], rated = cap * 2000, W = Math.round(rated * pick(rng, [.5, .6, .75]) / 100) * 100;
        const lift = pick(rng, [2, 3]), setup = { snap: true, chain: 'geared', cap: i, load: W, rise: 0, units: 'imp' };
        if (rng() < .5) {
          const ft = v => T.nf(v) + ' ft', ans = { t: ft(ratio * lift) };
          return { setup, q: `A ${T.CAPNAME[i]} t chain hoist has an overhaul ratio of **${ratio} : 1**. How much hand chain lifts the load **${lift} ft**?`, answer: 0,
            choices: [ans].concat(uniq(ans, [{ t: ft(ratio), why: 'That is one foot of lift. Multiply by the lift.' }, { t: ft(ratio + lift), why: 'That adds the ratio and the lift. Multiply instead.' },
              { t: T.nf(ratio / lift, 1) + ' ft', why: 'That divides. The hand chain moves farther than the load.' }])),
            hint: 'Hand chain = overhaul ratio × lift.', explain: `${ratio} × ${lift} ft = **${ft(ratio * lift)}**.` };
        }
        const P = pr * W / rated, lb = v => T.nf(Math.round(v)) + ' lb', ans = { t: lb(P) };
        return { setup, q: `A ${T.CAPNAME[i]} t hoist (${T.nf(rated)} lb) needs **${pr} lb** of pull at its rated load. About what pull lifts **${T.nf(W)} lb**?`, answer: 0,
          choices: [ans].concat(uniq(ans, [{ t: lb(pr), why: 'That is the pull at the full rated load. Pull scales with the load.' }, { t: lb(pr * rated / W), why: 'That is upside down: multiply by load ÷ rated.' },
            { t: lb(W / ratio), why: 'That uses the overhaul ratio alone. Use the maker\'s pull, scaled by the load.' }])),
          hint: 'Pull = rated pull × load ÷ rated load.', explain: `${pr} × ${T.nf(W)} ÷ ${T.nf(rated)} = **${lb(P)}**.` };
      }
      const D = pick(rng, [8, 10, 12]), d = D - pick(rng, [.5, 1, 2]), VR = 2 * D / (D - d), f = v => T.nf(v, v % 1 ? 1 : 0), ans = { t: f(VR) };
      return { setup: { snap: true, chain: 'differential', D, d, eta: .35, load: 1000, rise: 0, units: 'imp' }, answer: 0,
        q: `Differential block: large wheel **D = ${f(D)} in**, small wheel **d = ${f(d)} in**. Velocity ratio?`,
        choices: [ans].concat(uniq(ans, [{ t: f(D / (D - d)), why: 'That leaves out the 2. VR = 2D ÷ (D − d).' }, { t: f(D / d), why: 'That is D ÷ d. VR = 2D ÷ (D − d).' },
          { t: f(2 * D / (D + d)), why: 'That adds the wheels. The loop shortens by the difference, D − d.' }])),
        hint: 'VR = 2D ÷ (D − d).', explain: `2 × ${f(D)} ÷ (${f(D)} − ${f(d)}) = **${f(VR)}**.` };
    },
  };
  return sc;
}

const SC = window.BT_SCENE === 'chainfall' ? chainScene() : tackleScene();
/* challenges leave the learner's rig alone: set up on the drawing, the tags and readouts would give the answer away */
const gen = SC.challenge;
SC.challenge = (rng, n) => { const q = gen(rng, n); delete q.setup; q.explain += ' Set it up on the simulator to check.'; return q; };
window.PAGE_SCENE = SC;
})();
</script>
<script>/* CrewForge simulator-lesson page shell (2026-11-13, docs/LESSON_DESIGN.md). One page = one idea.
   Runs a page scene (CFShell.start(content, scene)) inside the approved layout:
   top bar (Back, lesson + page n of N, progress dots, voice mute + speed, Next: nothing locks) -> "What you're looking
   at" (fixed per page) -> simulator + readouts -> step box (fixed per step: instruction, Hint, Show me) -> control tray
   (only this step's controls). Steps: teach -> do -> predict -> fail -> question; then free play (everything unlocked,
   Reset, "Give me a challenge"). Questions are practice: a wrong pick gets a red outline and the explanation of that
   mistake, then "Try a new question" serves a different variant until one is right. Moodle "done" = the learner reached
   the last page (the SCORM host page, tools/lesson_pages.py, records it).

   Scene interface (one per page):
     defaults {}, controls {key: {type:'slider'|'chips'|'hold'|'custom', label, ...}} (below),
     mount(svg, api), apply(state, prev, initial), advance(ms, state), calc(state) -> out,
     readouts(state, out) -> [{label, short, value, cls:'ok'|'warn'|'bad', color, id}],
     caption(state, out) -> null | {kind:'fail'|'warn', title, text}, spot(id) -> [x, y, r] (svg units),
     drag (optional, wired by the scene; it calls api.input(partial)), challenge(rng, n) -> question, busy() -> bool,
     phoneViewBox, viewBox, reset().
     Optional generic hooks (added 2026-11-13 for the hoisting and block-and-tackle ports):
       instant: [keys]            never tweened by sim.set(partial, ms) (e.g. a hoist size that rebuilds the rig)
       onSet(state, keys)         after every sim.set / learner input (not on tween frames): rebuild what those keys need
       normalize(state)           after any change, before calc()
       callout(id, text, o) / clear()   the scene draws video callouts itself (return false to fall back to spot())
       fns {name: (state, out) => any}  step fields given as "fn:name": goal, live, ok
   api passed to mount: input(partial) (learner change: onSet + tries), get() (state + out), redraw(),
     step() -> {idx, type, step, free} (e.g. which drawing parts may be dragged now).

   Controls (the tray shows only the step's `controls`; free play shows content `freeControls` or all of them):
     slider  {min, max, step, unit, fmt(v)}: - / + steppers (hold to repeat), range, tap the value to type it
     chips   {options:[{v, t}]}: one choice
     hold    {key, on = 1, label, hotkey}: PRESS-AND-HOLD TO RUN. state[key] = on while the button is held (pointer,
             Space / Enter on the focused button, or the optional hotkey anywhere on the page), 0 on release, lost
             pointer capture, blur or leaving the page. The scene moves on its own clock (advance), so in ?capture=1
             a script does the same with sim.set({key: 1}) ... sim.set({key: 0}) on the virtual clock. 52 px tall.
             Dragging the part itself in the drawing is the scene's job (drag + api.input).
     custom  {html(state)}: scene-made markup (e.g. a crane pendant); any element in it with data-hk="key" is a
             hold-to-run button for state[key] (same rules as hold) and has class "on" while state[key] is truthy.
   Content (content.json page): what, steps, free, freeControls, capture: 'stage' (video layout: ?capture=1 shows only
     the stage and readouts and never applies lesson steps; without it capture keeps the full page as before).
   Step extras: callout [{id, text, pos}] (shown while the step is on), live (a line under the instruction, refreshed
     every frame: "fn:name" or a template "{key:1}" / "{out.x:0}" / "{out.util:%}"), wrong [{when: goal, say}] (shown
     while it matches), points [..] (teach: a short list), hint2 on question variants.
   Goal matchers per key (state key or out.* path): value · [min, max] · {in} · {gte|lte|gt|lt} · {near, tol} · {not};
     or "fn:name" for the whole goal.
   Video contract (?capture=1): window.sim.set / callout / clear / advance / isIdle / ready / get / onChange.
     sim.set({snap: true, ...}) resets to the page defaults first (no tweens), then applies the rest. */
(function () {
'use strict';
const Q = new URLSearchParams(location.search), CAPTURE = Q.has('capture');
const $ = (s, r = document) => r.querySelector(s), el = (t, a = {}, h = '') => { const e = document.createElement(t); for (const k in a) e.setAttribute(k, a[k]); if (h) e.innerHTML = h; return e; };
const md = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n\n/g, '<br><br>');
const NS = 'http://www.w3.org/2000/svg';

window.CFShell = { start };

function start(C, S) {
  const log = [], T0 = performance.now(), L = (type, d = {}) => log.push({ t: Math.round(performance.now() - T0), type, ...d });
  let state = Object.assign({}, S.defaults), out = S.calc(state), tweens = [], listeners = [], dirty = true;
  let idx = 0, phase = 'step', hintLvl = 0, done = new Set(), helped = new Set(), qv = {}, qState = null, goalSince = null;
  let free = false, challenge = null, chalN = 0, finished = false;
  const N = C.lesson.pages.length, PN = C.n, steps = C.steps;
  const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
  const KEY = 'cf-lp:' + C.lesson.id;
  const prefs = (() => { try { return JSON.parse(store && store.getItem('cf-voice') || '{}'); } catch (e) { return {}; } })();
  let muted = !!prefs.muted, rate = prefs.rate || 1;

  /* ---------------------------------------------------------------- layout */
  document.body.innerHTML = '';
  const STAGE_ONLY = CAPTURE && C.capture === 'stage';
  if (STAGE_ONLY) document.body.classList.add('capture');
  const app = el('div', { class: 'app' });
  const dots = C.lesson.pages.map((p, i) => `<i class="${i + 1 < PN ? 'done' : i + 1 === PN ? 'on' : ''}" title="${p.title}"></i>`).join('');
  app.innerHTML = `<header class="bar">
    <button class="btn" id="b-back" aria-label="Back">&#9664; Back</button>
    <div class="title"><div class="kick">${C.lesson.title.toUpperCase()} · PAGE ${PN} OF ${N}</div><div class="h">${C.title}</div></div>
    <div class="dots" aria-label="page ${PN} of ${N}">${dots}</div>
    <div class="voice"><button class="btn" id="b-mute" aria-label="Voice on or off"></button><button class="btn" id="b-rate" aria-label="Voice speed"></button></div>
    <button class="btn pri" id="b-next" aria-label="Next page">${PN === N ? 'Finish' : 'Next'} &#9654;</button></header>
  <section class="what" id="what"><button class="wt" id="b-what" aria-expanded="false">WHAT YOU'RE LOOKING AT <span class="chev">&#9662;</span></button><div class="wx">${md(C.what)}</div></section>
  <div class="main"><div class="stage" id="stage"><svg id="sv" xmlns="${NS}" viewBox="${S.viewBox || '0 0 1600 880'}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${C.title} simulator"></svg>
    <div class="caption" id="caption" role="status"></div><div class="read" id="read"></div></div>
    <aside class="side"><div class="card step" id="stepcard" aria-live="polite"></div><div class="card ctrlcard" id="tray"></div></aside></div>`;
  document.body.appendChild(app);
  const svg = $('#sv'), card = $('#stepcard'), tray = $('#tray'), read = $('#read'), cap = $('#caption');
  let spotG, calloutG;

  /* phone: the scene crops its drawing to the subject at the stage's own aspect, so labels stay >= 11 px */
  let lastVB = '';
  function fit() {
    const phone = innerWidth < 700 && innerHeight > innerWidth;
    document.body.classList.toggle('phone', phone);
    const asp = Math.max(0.6, Math.min(3, (svg.clientWidth || 1) / (svg.clientHeight || 1)));
    const vb = phone && S.phoneViewBox ? (typeof S.phoneViewBox === 'function' ? S.phoneViewBox(state, asp) : S.phoneViewBox) : (S.viewBox || '0 0 1600 880');
    if (vb !== lastVB) { svg.setAttribute('viewBox', vb); lastVB = vb; }
  }
  addEventListener('resize', fit); fit();
  $('#b-what').onclick = () => { const w = $('#what'); w.classList.toggle('open'); $('#b-what').setAttribute('aria-expanded', w.classList.contains('open')); };

  /* ---------------------------------------------------------------- host / progress (SCORM wrapper or localStorage) */
  const host = (() => { try { return window.parent !== window && window.parent.CFHost ? window.parent.CFHost : null; } catch (e) { return null; } })();
  function progress() {
    if (host) host.page(PN, N, C.file);
    else if (store) { try { const p = JSON.parse(store.getItem(KEY) || '{}'); p.seen = Array.from(new Set((p.seen || []).concat([PN]))); p.last = PN; if (PN === N) p.complete = true; store.setItem(KEY, JSON.stringify(p)); } catch (e) {} }
  }
  const firstVisit = !(store && store.getItem(KEY));
  progress();
  const go = d => {
    stopVoice();
    const target = PN + d;
    if (target < 1) return;
    if (target > N) { finish(); return; }
    L('page', { to: target });
    if (host && host.go) host.go(target); else location.href = C.lesson.pages[target - 1].file + (CAPTURE ? '?capture=1' : '');
  };
  $('#b-back').onclick = () => go(-1); $('#b-next').onclick = () => go(1);
  if (PN === 1) $('#b-back').disabled = true;

  /* ---------------------------------------------------------------- voice (Kokoro af_heart clips beside the page) */
  const audio = new Audio(); audio.preload = 'auto';
  let voiceOK = false, queue = [];
  function setVoiceUI() {
    $('#b-mute').innerHTML = muted ? '&#128263;<span class="vt"> Off</span>' : '&#128266;<span class="vt"> On</span>'; $('#b-mute').classList.toggle('off', muted);
    $('#b-rate').textContent = rate === 1 ? '1×' : '0.8×';
    try { store && store.setItem('cf-voice', JSON.stringify({ muted, rate })); } catch (e) {}
  }
  setVoiceUI();
  $('#b-mute').onclick = () => { muted = !muted; setVoiceUI(); if (muted) stopVoice(); else speak(curKey()); L('voice', { muted }); };
  $('#b-rate').onclick = () => { rate = rate === 1 ? 0.8 : 1; audio.playbackRate = rate; setVoiceUI(); };
  function stopVoice() { queue = []; try { audio.pause(); } catch (e) {} }
  function speak(...keys) {
    queue = keys.filter(k => k && C.audio && C.audio[k]);
    try { audio.pause(); } catch (e) {}
    playNext();
  }
  function playNext() {
    if (muted || !voiceOK || CAPTURE || !queue.length) return;
    const k = queue.shift();
    audio.src = (C.audioBase || 'audio/') + C.audio[k]; audio.playbackRate = rate;
    if ('preservesPitch' in audio) audio.preservesPitch = true;
    audio.play().catch(() => { showStart(); });
  }
  audio.addEventListener('ended', () => setTimeout(playNext, 250));
  function curKey() { if (free) return challenge ? null : 'free'; const st = steps[idx]; if (!st) return null; if (st.type === 'question') return `s${idx}v${(qv[idx] || 0) % st.variants.length}`; return 's' + idx; }
  function showStart() {
    if (CAPTURE || $('#start')) return;
    const first = PN === 1 && firstVisit;
    const o = el('div', { id: 'start' }, `<div class="box"><h2>${first ? C.lesson.title : C.title}</h2><p>${first ? 'The narrator reads each step aloud. You can mute it or slow it down at the top right.' : 'Tap to hear this page read aloud.'}</p>
      <button class="btn pri" id="b-start">&#9654; ${first ? 'Start lesson' : 'Start page'}</button> <button class="btn" id="b-quiet">Read it myself</button></div>`);
    document.body.appendChild(o);
    $('#b-start').onclick = () => { o.remove(); voiceOK = true; muted = false; setVoiceUI(); speak('what', curKey()); L('start'); };
    $('#b-quiet').onclick = () => { o.remove(); voiceOK = true; muted = true; setVoiceUI(); L('start', { quiet: true }); };
  }

  /* ---------------------------------------------------------------- sim state */
  function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
  function full() { return Object.assign({}, state, { out }); }
  function applyState(next, user) {
    const prev = state; state = Object.assign({}, state, next); if (S.normalize) S.normalize(state); out = S.calc(state); S.apply(state, prev); dirty = true;
    if (user) { if (S.onSet) { S.onSet(state, Object.keys(next)); out = S.calc(state); } listeners.forEach(fn => fn(full())); }
  }
  function snapTo(partial) {      // sim.set({snap: true, ...}): page defaults first, no tweens, then the rest
    tweens = []; S.reset && S.reset(); state = Object.assign({}, S.defaults, partial); delete state.snap;
    if (S.normalize) S.normalize(state); out = S.calc(state); S.apply(state, null, true); dirty = true;
  }
  function set(partial, dur = 0) {
    if (!partial) return;
    if (partial.snap) return snapTo(partial);
    const inst = {}, tw = {}, keys = Object.keys(partial), noTween = S.instant || [];
    for (const k in partial) { if (dur > 0 && typeof partial[k] === 'number' && typeof state[k] === 'number' && !noTween.includes(k)) tw[k] = [state[k], partial[k]]; else inst[k] = partial[k]; }
    if (Object.keys(tw).length) tweens.forEach(T => { for (const k in tw) delete T.tw[k]; });   // a new tween on a key replaces the old one
    if (Object.keys(inst).length) applyState(inst);
    if (Object.keys(tw).length) tweens.push({ tw, t: 0, dur });

  }

    tweens = tweens.filter(T => { T.t += ms; const u = Math.min(1, T.t / T.dur), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; for (const k in T.tw) next[k] = T.tw[k][0] + (T.tw[k][1] - T.tw[k][0]) * e; return u < 1; });
    applyState(next);
  }

    stepTweens(ms); S.advance(ms, state); out = S.calc(state); dirty = true; render(); checkGoal(ms); checkGame(ms);
  }
  function checkGame(ms) {
    const c = challenge; if (!c || !c.game || c.result || !free) return;
    c.t = (c.t || 0) + ms / 1000;
    const r = c.goal(state, out, c.t) || {}; c.live = r.live || '';
    const g = card.querySelector('#glive'); if (g && g.innerHTML !== md(c.live)) g.innerHTML = md(c.live);
    if (r.done) { c.result = { ok: !!r.ok, msg: r.msg || '' }; L('challenge', { right: c.result.ok }); renderFree(); }
  }
  const api = {
    input(partial) { applyState(partial, true); L('input', partial); markTry(); },   // the tray follows via syncTray (never rebuilt under a finger)
    get: full, redraw() { dirty = true; },

      const ord = c.ord || (c.ord = perm(c.choices.length, chalN * 13 + 5));
      if (c.state === 'wrong') h += opts(c.choices, ord, i => i === c.pick ? 'wrong' : '') + `<div class="bad"><b>Not quite.</b> ${md(c.choices[c.pick].why)}</div>`;
      else if (c.state === 'right' || c.shown) h += opts(c.choices, ord, i => i === c.answer ? 'right' : '') + `<div class="good"><b>${c.state === 'right' ? 'Right.' : 'Here is how.'}</b> ${md(c.explain)}</div>`;
      else h += opts(c.choices, ord, () => '', true) + (hintLvl ? `<div class="hint">${md(c.hint)}</div>` : '');
      h += `<div class="row">${c.state === 'wrong' || c.state === 'right' || c.shown ? '<button class="btn pri" id="b-newq">Try a new question &#9654;</button>' : '<button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; Show me</button>'}<button class="btn" id="b-reset">&#8634; Reset</button></div>`;
    }
    card.innerHTML = h; wireHead();
    renderTray(challenge ? (challenge.game ? (challenge.controls || allKeys) : []) : allKeys);
    const ch = $('#b-chal'); if (ch) ch.onclick = () => nextChallenge();
    const rs = $('#b-reset'); if (rs) rs.onclick = () => reset();
    const np = $('#b-np'); if (np) np.onclick = () => go(1);
    const nq = $('#b-newq'); if (nq) nq.onclick = () => nextChallenge();
    const hb = $('#b-hint'); if (hb) hb.onclick = () => hint();
    const sb = $('#b-show'); if (sb) sb.onclick = () => showMe();
    card.querySelectorAll('.opt[data-i]').forEach(b => b.onclick = () => { const c = challenge; c.pick = +b.dataset.i; c.state = c.pick === c.answer ? 'right' : 'wrong'; L('challenge', { right: c.state === 'right' }); renderFree(); });
  }
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function nextChallenge() {
    chalN++; hintLvl = 0;
    const c = S.challenge(rng(PN * 1000 + chalN * 7919 + (Q.get('seed') | 0)), chalN);
    if (c.setup) set(c.setup, 0);
    challenge = Object.assign({ state: null, pick: null }, c); free = true; L('challenge', { n: chalN }); renderFree();
  }
  function reset() { tweens = []; held.clear(); S.reset && S.reset(); state = Object.assign({}, S.defaults); out = S.calc(state); S.apply(state, null, true); dirty = true; challenge = null; L('reset'); renderFree(); }

  function finish() {
    finished = true; stopVoice(); L('finish'); if (host && host.finish) host.finish();
    card.className = 'card step free';
    card.innerHTML = `<div class="sh"><b>LESSON COMPLETE</b></div><p>${md(C.lesson.done)}</p><div class="row">${C.lesson.sheet ? `<a class="btn pri" href="${C.lesson.sheet}" target="_blank" rel="noopener">&#128196; Summary sheet (PDF)</a>` : ''}<button class="btn" id="b-again">Back to free play</button></div>`;
    tray.innerHTML = ''; $('#b-again').onclick = () => enterFree();
    speak('done');
  }

  /* ---------------------------------------------------------------- loop */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    if (!CAPTURE) advance(dt);
    requestAnimationFrame(frame);
  }
  S.apply(state, null, true); render();
  enter(0, { quiet: true, noSetup: STAGE_ONLY });     // a video page starts from the page defaults: the script sets it up
  if (!CAPTURE) {
    requestAnimationFrame(frame);
    if ((PN === 1 && firstVisit) || host && host.fresh) showStart();
    else { voiceOK = true; speak('what', curKey()); }      // later pages: autoplay; if the browser refuses, play() shows the Start tap
  }
  if (CAPTURE) { voiceOK = false; }
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight' && e.altKey) go(1); if (e.key === 'ArrowLeft' && e.altKey) go(-1); });
  window.sim.ready = true;

  /* test / run-through API */
  window.lessonPage = {
    log, state: () => ({ page: PN, pages: N, idx, type: steps[idx] && steps[idx].type, steps: steps.length, done: Array.from(done), helped: Array.from(helped), free, challenge: challenge ? { state: challenge.state, answer: challenge.answer, game: !!challenge.game, result: challenge.result || null } : null,
      qState, variant: qv[idx] || 0, answer: steps[idx] && steps[idx].type === 'question' ? steps[idx].variants[(qv[idx] || 0) % steps[idx].variants.length].answer : steps[idx] && steps[idx].answer, finished, voiceOK, muted, rate, sim: full() }),
    defaults: () => Object.assign({}, S.defaults), enter, nextStep, hint, showMe, choose, newQuestion, enterFree, reset, nextChallenge, finish, startVoice: () => { const b = $('#b-quiet'); if (b) b.click(); },
  };
}
})();
