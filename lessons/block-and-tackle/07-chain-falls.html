<script>/* CrewForge illustration kit (JS port of docs/concepts/hitches/src/lib.py; rules in docs/concepts/hitches/STYLE.md).
   Plain functions that return SVG strings. Every scene: 1600 x 880 viewBox, one scale K (px per inch), light from
   the top-left, outlines darker than the fill, CrewForge orange only for "the thing to look at".
   Kept function-for-function with lib.py so the drawings match the approved concept pictures. */
const KIT = (() => {
  const W = 1600, H = 880;
  const FONT = "Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif";
  const C = {
    BG: '#24211d', PANEL: '#2a2723', TEXT: '#F5F5F4', MUTED: '#b9b4ab', ACC: '#F08A2B',
    OK: '#3ddc84', WARN: '#F2C230', BAD: '#ff5a4f',
    STEEL_D: '#3b4247', ROPE_D: '#454c51', ROPE_M: '#aab3b9', ROPE_V: '#6a737a',
    TIMBER_D: '#5e4426'
  };
  const f = v => { const r = Math.round(v * 10) / 10; return Math.abs(r - Math.round(r)) < 1e-6 ? String(Math.round(r)) : r.toFixed(1); };
  const pathd = (P, closed) => P.length ? 'M' + P.map(p => f(p[0]) + ' ' + f(p[1])).join(' L') + (closed ? 'Z' : '') : '';

  function catmull(P, n = 8, closed = false) {
    const out = [], m = P.length;
    const last = closed ? m : m - 1;
    for (let i = 0; i < last; i++) {
      const p0 = (closed || i > 0) ? P[(i - 1 + m) % m] : P[i], p1 = P[i], p2 = P[(i + 1) % m];
      const p3 = (closed || i + 2 < m) ? P[(i + 2) % m] : P[(i + 1) % m];
      for (let j = 0; j < n; j++) {
        const t = j / n, t2 = t * t, t3 = t2 * t;
        out.push([0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
      }
    }
    if (!closed) out.push(P[m - 1]);
    return out;
  }
  // points on a circle; degrees, screen coords (0 = +x, 90 = DOWN)
  const arcPts = (cx, cy, r, a0, a1, n = 24) => Array.from({ length: n + 1 }, (_, i) => {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  });
  function resample(P, step) {
    const out = [P[0]]; let acc = 0;
    for (let i = 0; i + 1 < P.length; i++) {
      const [x0, y0] = P[i], [x1, y1] = P[i + 1], seg = Math.hypot(x1 - x0, y1 - y0);
      if (!seg) continue;
      let t = step - acc;
      while (t <= seg) { out.push([x0 + (x1 - x0) * t / seg, y0 + (y1 - y0) * t / seg]); t += step; }
      acc = seg - (t - step);
    }
    const e = P[P.length - 1], l = out[out.length - 1];
    if (Math.hypot(e[0] - l[0], e[1] - l[1]) > 1e-3) out.push(e);
    return out;
  }
  function normals(P) {
    return P.map((_, i) => {
      const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [-dy / L, dx / L];
    });
  }
  // shift each point toward the light (top-left) along its normal: where the highlight runs on a round part
  function litOffset(P, amount) {
    const N = normals(P), Lx = -0.7071, Ly = -0.7071;
    return P.map((p, i) => { const [nx, ny] = N[i], s = nx * Lx + ny * Ly; return [p[0] + nx * s * amount, p[1] + ny * s * amount]; });
  }

  function defs() {
    return `<defs>
<linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfd5da"/><stop offset=".45" stop-color="#8d969d"/><stop offset="1" stop-color="#4b5359"/></linearGradient>
<linearGradient id="gForge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d868d"/><stop offset=".5" stop-color="#555d63"/><stop offset="1" stop-color="#33393d"/></linearGradient>
<linearGradient id="gBarV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b747b"/><stop offset=".3" stop-color="#dfe4e7"/><stop offset=".62" stop-color="#8f989f"/><stop offset="1" stop-color="#454c52"/></linearGradient>
<linearGradient id="gBarH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f989f"/><stop offset=".28" stop-color="#e3e7ea"/><stop offset=".65" stop-color="#8a939a"/><stop offset="1" stop-color="#40474c"/></linearGradient>
<linearGradient id="gPaint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e7882"/><stop offset="1" stop-color="#4a525a"/></linearGradient>
<linearGradient id="gPaintSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#727c86"/><stop offset="1" stop-color="#454d55"/></linearGradient>
<linearGradient id="gBlock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a640"/><stop offset=".55" stop-color="#b8862a"/><stop offset="1" stop-color="#7d5a17"/></linearGradient>
<radialGradient id="gSheave" cx=".38" cy=".34" r=".75"><stop offset="0" stop-color="#c9d0d5"/><stop offset=".55" stop-color="#8d969d"/><stop offset="1" stop-color="#4b5359"/></radialGradient>
<linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211e1b"/><stop offset="1" stop-color="#2b2824"/></linearGradient>
<linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46413b"/><stop offset=".12" stop-color="#3a3631"/><stop offset="1" stop-color="#2a2723"/></linearGradient>
<linearGradient id="gTimber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48a58"/><stop offset="1" stop-color="#8a6740"/></linearGradient>
<linearGradient id="gWeight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e7882"/><stop offset=".6" stop-color="#4f5860"/><stop offset="1" stop-color="#3a4148"/></linearGradient>
<linearGradient id="gBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d6670"/><stop offset="1" stop-color="#434b53"/></linearGradient>
<linearGradient id="gConc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b5650"/><stop offset="1" stop-color="#46423d"/></linearGradient>
<radialGradient id="gShadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="gDial" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fbfbf8"/><stop offset="1" stop-color="#d6d4cc"/></radialGradient>
<filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>`;
  }

  function styleBlock(extraPhone = '') {
    return `<style>
.lb{font:700 26px ${FONT};fill:${C.TEXT}} .lm{font:600 21px ${FONT};fill:${C.MUTED}} .la{font:800 30px ${FONT};fill:${C.ACC}}
.ld{stroke:${C.MUTED};stroke-width:2;fill:none} .tag{font:700 12px ${FONT};fill:#1d1d1d} .tagb{font:800 15px ${FONT};fill:#1d1d1d}
.pt{font:800 20px ${FONT}} .pts{font:700 16px ${FONT}} .halo{paint-order:stroke;stroke:#1F1D1A;stroke-width:6px;stroke-linejoin:round}
.phOnly{display:none}
@media (max-width:700px){ .lb{font-size:34px} .lm{font-size:28px} .la{font-size:38px} .pt{font-size:28px} .pts{font-size:24px} .pcOnly{display:none} .phOnly{display:inline} ${extraPhone} }
</style>`;
  }

  function backdrop(floor, wallLine = true) {
    let s = `<rect width="${W}" height="${floor}" fill="url(#gWall)"/>`;
    if (wallLine) {
      s += `<rect x="0" y="${floor - 150}" width="${W}" height="150" fill="#ffffff" opacity=".018"/>`;
      s += `<line x1="0" y1="${floor - 150}" x2="${W}" y2="${floor - 150}" stroke="#3a3530" stroke-width="2"/>`;
    }
    s += `<rect x="0" y="${floor}" width="${W}" height="${H - floor}" fill="url(#gFloor)"/>`;
    s += `<line x1="0" y1="${floor}" x2="${W}" y2="${floor}" stroke="#5a544c" stroke-width="2.5"/>`;
    return s;
  }
  function column(x, floor, top = 0, w = 34) {
    return `<g opacity=".55"><rect x="${x}" y="${top}" width="${w}" height="${floor - top}" fill="#2f2c28"/>` +
      `<rect x="${x}" y="${top}" width="5" height="${floor - top}" fill="#3a3632"/>` +
      `<rect x="${x + w - 5}" y="${top}" width="5" height="${floor - top}" fill="#262320"/>` +
      `<rect x="${x - 14}" y="${floor - 8}" width="${w + 28}" height="8" fill="#2f2c28"/></g>`;
  }
  const contactShadow = (cx, y, w, h = 14, op = 1) =>
    `<ellipse cx="${f(cx)}" cy="${f(y)}" rx="${f(w / 2)}" ry="${f(h / 2)}" fill="url(#gShadow)" opacity="${op}"/>`;

  // any round steel part along a path: dark outline, body, a highlight line on the lit side
  function roundBar(P, d, body = '#8d969d', dark = '#3b4247', hi = '#e8ecef', cap = 'round', hiOp = .85) {
    const p = pathd(P);
    return `<path d="${p}" fill="none" stroke="${dark}" stroke-width="${f(d + 1.6)}" stroke-linecap="${cap}" stroke-linejoin="round"/>` +
      `<path d="${p}" fill="none" stroke="${body}" stroke-width="${f(d)}" stroke-linecap="${cap}" stroke-linejoin="round"/>` +
      `<path d="${pathd(litOffset(P, d * .24))}" fill="none" stroke="${hi}" stroke-width="${f(Math.max(.8, d * .2))}" stroke-linecap="round" stroke-linejoin="round" opacity="${hiOp}"/>`;
  }

  /* Wire rope: steel body + strand valleys. Right regular lay: valleys run like "/" on a hanging rope, each strand
     crosses the visible face in about 2 d, valleys about 1.1 d apart. `phase` (px along the rope) moves the strand
     pattern with the rope's material so a running rope visibly runs (virtual clock only). */
  function wireRope(P, d, phase = 0, opts = {}) {
    const dense = resample(P, Math.max(.6, d / 6));
    let s = roundBar(dense, d, opts.body || C.ROPE_M, opts.dark || C.ROPE_D, '#e9edf0', 'butt', .7);
    if (d < 2.2 || dense.length < 2) return s;
    const pitch = 1.08 * d, adv = 2.0 * d;
    const L = [0];
    for (let i = 0; i + 1 < dense.length; i++) L.push(L[i] + Math.hypot(dense[i + 1][0] - dense[i][0], dense[i + 1][1] - dense[i][1]));
    const N = normals(dense), tot = L[L.length - 1];
    let j0 = 0;
    const at = sv => {
      sv = Math.max(0, Math.min(tot, sv));
      while (j0 > 0 && L[j0] > sv) j0--;
      while (j0 < L.length - 2 && L[j0 + 1] < sv) j0++;
      const t = (sv - L[j0]) / ((L[j0 + 1] - L[j0]) || 1);
      return [dense[j0][0] + (dense[j0 + 1][0] - dense[j0][0]) * t, dense[j0][1] + (dense[j0 + 1][1] - dense[j0][1]) * t, N[j0]];
    };
    let v = '';
    const ph = ((phase % pitch) + pitch) % pitch;
    for (let sv = -adv - pitch + ph; sv < tot; sv += pitch) {
      const seg = [];
      for (let j = 0; j < 5; j++) {
        const q = sv + adv * j / 4;
        if (q >= 0 && q <= tot) { const [x, y, [nx, ny]] = at(q); const o = (-.5 + j / 4) * d * .86; seg.push([x + nx * o, y + ny * o]); }
      }
      if (seg.length > 1) v += pathd(seg) + ' ';
      j0 = 0;
    }
    return s + `<path d="${v}" fill="none" stroke="${C.ROPE_V}" stroke-width="${f(Math.max(.7, d * .13))}" stroke-linecap="round" opacity=".9"/>`;
  }

  /* Crosby S-319N shank hook, ID code J (5 t carbon), inches, Kito Crosby 2026-27 p. 91 (same contour as lib.py).
     Origin = bottom of the hook on the shank axis; y negative = up; the saddle is on the shank axis at -1.81. */
  const HOOK_OUT = [[-0.705, -6.59], [-1.25, -6.05], [-2.3, -5.2], [-3.15, -4.1], [-3.5, -2.8], [-3.3, -1.5], [-2.6, -0.55],
    [-1.4, -0.05], [0, 0], [1.35, -0.25], [2.3, -1.0], [2.72, -2.1], [2.75, -3.1], [2.6, -3.95], [2.38, -4.5]];
  const HOOK_TIP = [2.08, -4.82], HOOK_RI = 1.6, HOOK_CY = -3.41, HOOK_SADDLE = -1.81;
  let _hc = null;
  function hookContour() {
    if (_hc) return _hc;
    let out = catmull(HOOK_OUT, 6);
    out = out.concat([HOOK_TIP, [1.8, -4.5], [1.64, -4.0]]);
    for (let a = 0; a <= 180; a += 9) out.push([HOOK_RI * Math.cos(a * Math.PI / 180), HOOK_CY + HOOK_RI * Math.sin(a * Math.PI / 180)]);
    out = out.concat(catmull([[-1.6, -3.41], [-1.5, -4.25], [-1.05, -4.95], [-0.3, -5.45], [0.45, -5.78], [0.705, -6.15]], 5).slice(1));
    _hc = [[-0.705, -10.43]].concat(out, [[0.705, -10.43]]);
    return _hc;
  }
  /* Hook in profile, saddle at (x, ysad), k px per inch; `open` 0..1 straightens the throat (failure).
     The shank top is at ysad - 8.62 k. */
  function hookProfile(x, ysad, k, o = {}) {
    const open = o.open || 0, flip = o.flip ? -1 : 1;
    const T = p => {
      let px = p[0], py = p[1];
      if (open > 0 && py > -6.2) {                      // opening: the bowl and tip swing out about the neck
        const a = open * 0.9 * Math.max(0, Math.min(1, (-py - 0) / 6.2 + .2)) * (px > -0.5 ? 1 : 0.35);
        const cx = -0.7, cy = -6.2, dx = px - cx, dy = py - cy;
        px = cx + dx * Math.cos(a) - dy * Math.sin(a); py = cy + dx * Math.sin(a) + dy * Math.cos(a);
      }
      return [x + flip * px * k, ysad + (py - HOOK_SADDLE) * k];
    };
    const c = hookContour().map(T);
    let s = `<g id="${o.id || 'hook'}"><path d="${pathd(c, true)}" fill="url(#gForge)" stroke="#1c2023" stroke-width="${f(Math.max(1, k * .12))}" stroke-linejoin="round"/>`;
    const back = catmull([[-0.45, -7.4], [-0.9, -6.0], [-2.0, -5.0], [-2.85, -3.9], [-3.05, -2.7], [-2.75, -1.55], [-1.9, -0.6]], 6).map(T);
    s += `<path d="${pathd(back)}" fill="none" stroke="#c3cad0" stroke-width="${f(k * .32)}" stroke-linecap="round" opacity=".55"/>`;
    s += `<path d="${pathd([T([-0.32, -10.3]), T([-0.32, -6.9])])}" stroke="#d3d9de" stroke-width="${f(k * .3)}" stroke-linecap="round" opacity=".6"/>`;
    if (!o.noLatch && open < .2) {                      // S-4320 spring latch, neck boss to inside the tip
      const piv = T([0.92, -5.95]), end = T([1.9, -4.62]), mid = T([1.5, -5.35]);
      const q = `M${f(piv[0])} ${f(piv[1])} Q${f(mid[0])} ${f(mid[1])} ${f(end[0])} ${f(end[1])}`;
      s += `<path d="${q}" stroke="#1c2023" stroke-width="${f(k * .5)}" fill="none" stroke-linecap="round"/>`;
      s += `<path id="${o.id || 'hook'}-latch" d="${q}" stroke="#c9ced2" stroke-width="${f(k * .34)}" fill="none" stroke-linecap="round"/>`;
      s += `<circle cx="${f(piv[0])}" cy="${f(piv[1])}" r="${f(k * .26)}" fill="#7b848b" stroke="#1c2023" stroke-width="1"/>`;
    }
    return s + '</g>';
  }
  const HOOK = { SADDLE: HOOK_SADDLE, RI: HOOK_RI, CY: HOOK_CY, LEN: 10.43 };

  /* Shackle seen square to the pin (U visible), pin horizontal; bow UP or DOWN. Crosby G-209 proportions scaled from
     5/8 in (pin 0.75, jaw 1.06, inside length 2.38, bow 1.69 in). Returns {back, front, crown} (crown = inside of the
     bow on the centreline: where an eye or hook bears). */
  function shackleFace(x, ypin, k, up = true, size = 0.625) {
    const sc = size / 0.625, pin = .75 * sc, iw = 1.06 * sc, il = 2.38 * sc, mat = .70 * sc, ear = 1.36 * sc;
    const legx = (iw + mat) / 2, rBow = (1.69 * sc + mat) / 2, top = -(pin / 2 + il + mat / 2), yc = top + rBow;
    const pts = [[-legx, -ear * .3], [-legx * 1.04, -(pin / 2 + il * .3)]];
    for (let a = 205; a >= -25; a -= 15) pts.push([rBow * Math.cos(a * Math.PI / 180), yc - rBow * Math.sin(a * Math.PI / 180)]);
    pts.push([legx * 1.04, -(pin / 2 + il * .3)], [legx, -ear * .3]);
    const P = catmull(pts, 4).map(([px, py]) => [x + px * k, ypin + (up ? py : -py) * k]);
    const back = roundBar(P, mat * k, '#a6aeb4', C.STEEL_D, '#eef1f3');
    let front = '';
    for (const ex of [-legx, legx]) front += `<circle cx="${f(x + ex * k)}" cy="${f(ypin)}" r="${f(ear / 2 * k)}" fill="#9aa2a8" stroke="${C.STEEL_D}" stroke-width="1.2"/>`;
    front += `<rect x="${f(x - (legx + ear * .62) * k)}" y="${f(ypin - pin / 2 * k)}" width="${f((2 * legx + ear * .95) * k)}" height="${f(pin * k)}" rx="${f(pin * .2 * k)}" fill="#b3bbc1" stroke="${C.STEEL_D}" stroke-width="1.1"/>`;
    front += `<rect x="${f(x - (legx + ear * .95) * k)}" y="${f(ypin - pin * .95 * k)}" width="${f(pin * .5 * k)}" height="${f(pin * 1.9 * k)}" rx="${f(pin * .12 * k)}" fill="#8e979d" stroke="${C.STEEL_D}" stroke-width="1.1"/>`;
    const crown = up ? ypin + (top + mat / 2) * k : ypin - (top + mat / 2) * k;
    return { back, front, crown, outer: up ? ypin + (top - mat / 2) * k : ypin - (top - mat / 2) * k };
  }

  function timberEnd(x, y, w, h, id) {
    const cx = x + w * .78, cy = y + h * 1.15, cid = 'tc' + (id || (Math.round(x) + '_' + Math.round(y)));
    let s = `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2" fill="#a77c4c" stroke="${C.TIMBER_D}" stroke-width="1.6"/>`;
    s += `<clipPath id="${cid}"><rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"/></clipPath><g clip-path="url(#${cid})">`;
    for (let i = 1; i < 9; i++) s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(i * Math.max(w, h) * .17)}" fill="none" stroke="#7d5b35" stroke-width="1" opacity=".55"/>`;
    s += `<line x1="${f(x + w * .3)}" y1="${f(y + h * .12)}" x2="${f(x + w * .42)}" y2="${f(y + h * .45)}" stroke="#4a3420" stroke-width="1.3" opacity=".7"/>`;
    return s + `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h * .18)}" fill="#ffffff" opacity=".08"/></g>`;
  }
  function timberSide(x, y, w, h, seed = 1) {
    let s = `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2" fill="url(#gTimber)" stroke="${C.TIMBER_D}" stroke-width="1.6"/>`;
    const n = Math.max(2, Math.floor(h / 7));
    for (let i = 1; i < n; i++) {
      const yy = y + h * i / n, wob = 1.6 * Math.sin(i * 1.7 + seed);
      s += `<path d="M${f(x + 4)} ${f(yy)} C${f(x + w * .3)} ${f(yy + wob)} ${f(x + w * .6)} ${f(yy - wob)} ${f(x + w - 4)} ${f(yy + wob * .5)}" stroke="#6e5131" stroke-width=".9" fill="none" opacity=".55"/>`;
    }
    return s + `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(Math.min(4, h * .15))}" fill="#fff" opacity=".1"/>`;
  }

  // few, large labels; leader ends in a dot ON the part; text never on the part it names
  function label(tx, ty, text, target, o = {}) {
    const anchor = o.anchor || 'start', cls = o.cls || 'lb';
    let s = '';
    if (target) {
      const [x2, y2] = target;
      const sx = anchor === 'end' ? tx + 6 : anchor === 'start' ? tx - 6 : tx;
      const sy = anchor === 'middle' ? ty + 8 : ty - 8;
      s += o.elbow ? `<path class="ld" d="M${f(sx)} ${f(sy)} L${f(o.elbow[0])} ${f(o.elbow[1])} L${f(x2)} ${f(y2)}"/>`
        : `<path class="ld" d="M${f(sx)} ${f(sy)} L${f(x2)} ${f(y2)}"/>`;
      s += `<circle cx="${f(x2)}" cy="${f(y2)}" r="4" fill="${C.TEXT}" stroke="#1F1D1A" stroke-width="1.5"/>`;
    }
    s += `<text class="${cls} halo" x="${f(tx)}" y="${f(ty)}" text-anchor="${anchor}"${o.id ? ` id="${o.id}"` : ''}>${text}</text>`;
    if (o.sub) s += `<text class="lm halo" x="${f(tx)}" y="${f(ty + 26)}" text-anchor="${anchor}">${o.sub}</text>`;
    return s;
  }

  // force arrow from (x0,y0) toward (x1,y1); head at (x1,y1)
  function forceArrow(x0, y0, x1, y1, col, w = 5, id = '') {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
    if (L < 4) return '';
    const ux = dx / L, uy = dy / L, hl = Math.min(L * .6, 8 + w * 2.6), hw = 4 + w * 1.5;
    const bx = x1 - ux * hl, by = y1 - uy * hl;
    return `<g${id ? ` id="${id}"` : ''}><line x1="${f(x0)}" y1="${f(y0)}" x2="${f(bx)}" y2="${f(by)}" stroke="#1F1D1A" stroke-width="${w + 3}" stroke-linecap="round"/>` +
      `<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(bx)}" y2="${f(by)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>` +
      `<path d="M${f(x1)} ${f(y1)} L${f(bx - uy * hw)} ${f(by + ux * hw)} L${f(bx + uy * hw)} ${f(by - ux * hw)}Z" fill="${col}" stroke="#1F1D1A" stroke-width="1.5"/></g>`;
  }

  // magnified detail of the SAME drawing (same view), linked to a dashed ring on the source spot
  function detailInset(refId, src, mag, cx, cy, r, title, sub, id) {
    const [sx, sy] = src, rs = r / mag, cid = 'cl' + (id || Math.round(cx) + '_' + Math.round(cy));
    let s = `<g${id ? ` id="${id}"` : ''}>`;
    s += `<circle cx="${f(sx)}" cy="${f(sy)}" r="${f(rs)}" fill="none" stroke="${C.TEXT}" stroke-width="2" stroke-dasharray="5 4"/>`;
    const d = Math.hypot(cx - sx, cy - sy) || 1, ux = (cx - sx) / d, uy = (cy - sy) / d;
    s += `<line x1="${f(sx + ux * rs)}" y1="${f(sy + uy * rs)}" x2="${f(cx - ux * r)}" y2="${f(cy - uy * r)}" stroke="${C.TEXT}" stroke-width="2" stroke-dasharray="5 4"/>`;
    s += `<clipPath id="${cid}"><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}"/></clipPath>`;
    s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r + 5)}" fill="#1F1D1A"/>`;
    s += `<g clip-path="url(#${cid})"><rect x="${f(cx - r)}" y="${f(cy - r)}" width="${f(2 * r)}" height="${f(2 * r)}" fill="#26231f"/>`;
    s += `<use href="#${refId}" transform="translate(${f(cx)} ${f(cy)}) scale(${mag}) translate(${f(-sx)} ${f(-sy)})"/></g>`;
    s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="none" stroke="${C.TEXT}" stroke-width="2.5"/>`;
    s += `<text class="lm halo" x="${f(cx)}" y="${f(cy - r - 14)}" text-anchor="middle" style="font-weight:800;letter-spacing:.08em">${title}</text>`;
    if (sub) s += `<text class="lm halo" x="${f(cx)}" y="${f(cy + r + 30)}" text-anchor="middle">${sub}</text>`;
    return s + '</g>';
  }

  // a value pill: dark rounded box with coloured text (tension tags, pull tag)
  const PH = { v: 1 };                                   // phone text multiplier (set by the scene each frame)
  function pill(x, y, text, col, o = {}) {
    const fs = (o.fs || 18) * PH.v, w = Math.max(30, text.length * fs * .56 + 16), h = fs + 12, anchor = o.anchor || 'middle';
    const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
    return `<g${o.id ? ` id="${o.id}"` : ''}><rect x="${f(x0)}" y="${f(y - h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(h / 2)}" fill="#1F1D1A" stroke="${col}" stroke-width="2" opacity=".94"/>` +
      `<text x="${f(x0 + w / 2)}" y="${f(y + fs * .36)}" text-anchor="middle" style="font:800 ${fs}px ${FONT};fill:${col}">${text}</text></g>`;
  }

  return { W, H, FONT, C, f, pathd, catmull, arcPts, resample, normals, litOffset, defs, styleBlock, backdrop, column,
    contactShadow, roundBar, wireRope, hookProfile, HOOK, shackleFace, timberEnd, timberSide, label, forceArrow,
    detailInset, pill, PH };
})();
</script>
<script>/* CrewForge chain fall scene: geared hand chain hoist and differential (Weston) chain block.
   Same contract and style as tackle.js (STYLE.md via KIT). Every number on screen comes from calc().
   Side elevation, K = 6.5 px per inch. Beam W12x40 -> beam clamp -> hoist top hook -> hoist / block -> load chain ->
   bottom hook -> shackle -> steel test weight on cribbing.                                                         */
const CHAINFALL = (() => {
  const { f, C } = KIT;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const CAPTURE = new URLSearchParams(location.search).has('capture');
  const LB_TO_KG = 0.45359237, FT_TO_M = 0.3048, G = 9.80665, LBF_TO_N = 4.4482216, STEEL = 0.2836;

  /* SOURCE DATA. Harrington CB hand chain hoist spec table (catalogue p. 8, opened 2026-11-13):
     [capacity US tons, pull to lift rated load lb, overhaul ratio (ft of hand chain per ft of lift), load chain falls] */
  const CB = [[.5, 48, 25, 1], [1, 58, 43, 1], [1.5, 70, 57, 1], [2, 72, 70, 1], [2.5, 66, 99, 1], [3, 72, 114, 2], [5, 68, 198, 2]];
  const CAPNAME = ['½', '1', '1½', '2', '2½', '3', '5'];
  const COL = { W: '#e9e3d6', P: '#59b7ff', n: C.ACC, fr: '#b48af0', dist: '#7fd6c2' };

  const S = { chain: 'geared', cap: 3, load: 4000, rise: 0, units: 'imp', D: 10, d: 9, eta: .35, cards: true };
  const NUMERIC = ['load', 'rise', 'D', 'd', 'eta'];
  const imp = () => S.units === 'imp';

  /* PHYSICS
     Geared: VR = maker's overhaul ratio. Efficiency at rated load η = rated load ÷ (rated pull × VR).
             P = W ÷ (VR × η) = rated pull × W ÷ rated load (the maker's pull scaled to the load).
     Differential: one turn winds up πD on the large wheel and lets out πd from the small one, so the loop holding
             the lower pulley shortens π(D - d) and the load rises half of that: VR = 2D ÷ (D - d). P = W ÷ (VR × η),
             η a teaching value (default 35 %; under 50 % the block holds the load by itself).
     All: actual MA = W ÷ P, hand chain travel = VR × rise, work in = P × travel, work out = W × rise.            */
  function calc(st = S) {
    const W = st.load, c = { W, imp: st.units === 'imp', chain: st.chain };
    if (st.chain === 'geared') {
      const h = CB[st.cap], Wr = h[0] * 2000;
      c.cap = h[0]; c.capName = CAPNAME[st.cap]; c.falls = h[3]; c.VR = h[2];
      c.eta = Wr / (h[1] * h[2]);
      c.rated = c.imp ? Wr : Wr * LB_TO_KG; c.pullRated = c.imp ? h[1] : h[1] * LB_TO_KG;
      c.P = W / (c.VR * c.eta); c.util = W / c.rated;
      c.level = c.util > 1 ? 'bad' : c.util > .8 ? 'warn' : 'ok';
    } else {
      c.VR = 2 * st.D / (st.D - st.d); c.eta = st.eta; c.P = W / (c.VR * c.eta); c.level = 'info';
      c.holds = st.eta < .5;
    }
    c.Pideal = W / c.VR; c.MAact = W / c.P; c.eff = c.MAact / c.VR;
    c.rise = st.rise; c.travel = c.VR * st.rise;
    const wk = c.imp ? 1 : G;
    c.workOut = W * st.rise * wk; c.workIn = c.P * c.travel * wk; c.lost = c.workIn - c.workOut;
    c.kN = c.imp ? c.P * LBF_TO_N / 1000 : c.P * G / 1000;
    return c;
  }

  // ------------------------------------------------------------------ geometry
  const K = 6.5, FLOOR = 800, CRIB = 5.5 * K, X = 600;
  const BEAM_TOP = 10, BEAM_D = 9.73 * K, Y_BB = BEAM_TOP + BEAM_D, Y_PIN = Y_BB + 6 * K, HK = .55 * K;
  const Y_SAD = Y_PIN + .5 * K, Y_BODY = Y_SAD + 8.62 * HK + 1 * K;
  const loadLb = () => imp() ? S.load : S.load / LB_TO_KG;
  const sidePx = () => Math.cbrt(Math.max(200, loadLb()) / STEEL) * K;
  const ruPx = () => imp() ? 12 * K : 12 * K / FT_TO_M;
  const BOTHOOK = 8.62 * .7 * K, SHK_DROP = (0.75 * 1.2 / 2 + 2.38 * 1.2) * K, LUG = 2 * K;
  const hookSad0 = () => FLOOR - CRIB - sidePx() - LUG - SHK_DROP;
  const bodyBottom = () => S.chain === 'geared' ? Y_BODY + 12.5 * K : Y_BODY + 15 * K;
  const riseMax = () => Math.max(0, Math.min(imp() ? 3 : 0.9, (hookSad0() - BOTHOOK - (S.chain === 'geared' ? 1 : 7) * K - bodyBottom() - 3 * K) / ruPx()));
  const nf = (v, d = 0) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toLocaleString('en-CA', { minimumFractionDigits: d, maximumFractionDigits: d });
  const wt = v => nf(Math.round(v)) + ' ' + (imp() ? 'lb' : 'kg');
  const ln = (v, d = 2) => nf(v, d) + (imp() ? ' ft' : ' m');

  let T = 0, tweens = [], callouts = [], svgEl = null, coLayer = null, opts = {}, lastC = null;
  const A = { D: 0, last: null, key: '', sw: 0, swv: 0 };

  /* chain: links alternate face-on (oval ring) and edge-on (bar); pitch = inside link length. phase moves the links
     along the path (px) so a running chain visibly runs. */
  function chain(P, d, pitch, phase, o = {}) {
    let s = '';
    const segs = []; let tot = 0;
    for (let i = 0; i + 1 < P.length; i++) { const L = Math.hypot(P[i + 1][0] - P[i][0], P[i + 1][1] - P[i][1]); segs.push([P[i], P[i + 1], tot, L]); tot += L; }
    const at = sv => { for (const [a, b, s0, L] of segs) if (sv <= s0 + L) { const t = (sv - s0) / (L || 1); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, (b[0] - a[0]) / (L || 1), (b[1] - a[1]) / (L || 1)]; } const [a, b, , L] = segs[segs.length - 1]; return [b[0], b[1], (b[0] - a[0]) / (L || 1), (b[1] - a[1]) / (L || 1)]; };
    const ph = ((phase % (2 * pitch)) + 2 * pitch) % (2 * pitch);
    let k = Math.floor((-ph) / pitch);

  function beamAndClamp() {

    for (const x of [120, 380, 900, 1160, 1420]) s += `<rect x="${x}" y="${BEAM_TOP + 3}" width="5" height="${f(BEAM_D - 6)}" fill="#59626a"/>`;
    const w = 9 * K;
    s += `<g id="anchor"><path d="M${f(X - w / 2)} ${f(Y_BB - 4)} L${f(X + w / 2)} ${f(Y_BB - 4)} L${f(X + w / 2 - 4)} ${f(Y_PIN - 6)} L${f(X + 1.2 * K)} ${f(Y_PIN - 1.5 * K)} L${f(X - 1.2 * K)} ${f(Y_PIN - 1.5 * K)} L${f(X - w / 2 + 4)} ${f(Y_PIN - 6)}Z" fill="url(#gPaint)" stroke="#1b1f22" stroke-width="1.6"/>`;

  function loadStack(cx, sad) {

    s += `<rect x="${f(cx - .5 * K)}" y="${f(top - 3.6 * K)}" width="${f(K)}" height="${f(3.8 * K)}" fill="#6e7882" stroke="#23282c"/>`;

  // ---------------------------------------------------------------- geared hand chain hoist
  function geared(c) {

    const loopBot = FLOOR - 110;

    s += `<rect x="${f(X - bw / 2 + 4)}" y="${f(by + 4)}" width="${f(bw - 8)}" height="${f(2 * K)}" rx="4" fill="#9aa4ad" opacity=".3"/>`;
    s += `<text x="${X}" y="${f(by + bh * .78)}" text-anchor="middle" style="font:800 ${f(1.9 * K * (KIT.PH.v > 1 ? 2.2 : 1))}px ${KIT.FONT};fill:#e9e3d6">${c.capName} t</text></g>`;
    // hand wheel (cut-away cover outline dashed), pockets turn with the hand chain
    const ang = -A.D * vis / wR;
    s += `<g id="hand-wheel"><circle cx="${f(wx)}" cy="${f(wy)}" r="${f(wR + 1.5 * K)}" fill="#3a4148" stroke="#23282c" stroke-width="2" stroke-dasharray="7 5"/>`;
    s += `<circle cx="${f(wx)}" cy="${f(wy)}" r="${f(wR)}" fill="url(#gSheave)" stroke="#2b3136" stroke-width="1.6"/>`;
    for (let i = 0; i < 10; i++) { const a = ang + i * Math.PI / 5; s += `<circle cx="${f(wx + Math.cos(a) * wR * .86)}" cy="${f(wy + Math.sin(a) * wR * .86)}" r="${f(.45 * K)}" fill="#2b3136"/>`; }
    for (let i = 0; i < 5; i++) { const a = ang + i * Math.PI * 2 / 5; s += `<line x1="${f(wx)}" y1="${f(wy)}" x2="${f(wx + Math.cos(a) * wR * .65)}" y2="${f(wy + Math.sin(a) * wR * .65)}" stroke="#59626a" stroke-width="${f(.5 * K)}"/>`; }
    s += `<circle cx="${f(wx)}" cy="${f(wy)}" r="${f(.8 * K)}" fill="#c9ced2" stroke="#23282c"/></g>`;

      s += chain([[lcx + bs, chainTop - 2], [lcx + bs, sad - 8.62 * .7 * K - 2 * K]], .28 * K, .9 * K, 0, {});
      s += `<rect x="${f(lcx - bs - 1.2 * K)}" y="${f(sad - 8.62 * .7 * K - 3.6 * K)}" width="${f(2 * bs + 2.4 * K)}" height="${f(3 * K)}" rx="6" fill="url(#gPaintSide)" stroke="#23282c" stroke-width="1.6"/>`;

  function gear(x, y, r, teeth, ang) {

  // ---------------------------------------------------------------- differential (Weston) chain block

    s += `<rect x="${f(pX - .9 * K)}" y="${f(pulY + pR - 2)}" width="${f(1.8 * K)}" height="${f(1.2 * K + 4)}" fill="#59626a" stroke="#23282c"/>`;

    s += `<g id="dim-d">${KIT.label(ax - R1 - 150, ay + R1 + 40, 'd = ' + nf(S.d, dg) + u, [ax - R2 * .7, ay + R2 * .7], { anchor: 'end', sub: 'small pocket wheel (dashed)' })}</g>`;

  }
  function dim(x0, y, x1, t, id, below) {

      `<line x1="${f(x0)}" y1="${f(y - 6)}" x2="${f(x0)}" y2="${f(y + 6)}" stroke="${C.ACC}" stroke-width="2"/><line x1="${f(x1)}" y1="${f(y - 6)}" x2="${f(x1)}" y2="${f(y + 6)}" stroke="${C.ACC}" stroke-width="2"/>` +

  }

  const CX = 1110, CW = 460;
  function cards(c) {

    const x0 = CX + 20, w = CW - 40;
    // the ratio and the maker's pull
    s += card('ro-ma-box', 160, c.chain === 'geared' ? 'MAKER\'S TABLE · ' + c.capName + ' TON HOIST' : 'VELOCITY RATIO · 2D ÷ (D − d)');
    if (c.chain === 'geared') {
      s += `<text x="${x0}" y="${y + 66}" class="pt" style="fill:${C.TEXT}">Overhaul ratio <tspan style="fill:${COL.n}">${c.VR}</tspan> : 1</text>`;
      s += `<text x="${x0}" y="${y + 100}" class="pts" style="fill:${COL.P}">Pull at rated ${wt(c.rated)}: ${wt(c.pullRated)}</text>`;
      s += `<text x="${x0}" y="${y + 130}" class="pts" style="fill:${C.MUTED}">Efficiency ${nf(c.eta * 100, 1)} % · load ${nf(c.util * 100)} % of capacity</text>`;
    } else {
      s += `<text x="${x0}" y="${y + 66}" class="pt" style="fill:${C.TEXT}">VR = 2 × ${nf(S.D, 1)} ÷ (${nf(S.D, 1)} − ${nf(S.d, 1)}) = <tspan style="fill:${COL.n}">${nf(c.VR, 1)}</tspan></text>`;
      s += `<text x="${x0}" y="${y + 100}" class="pts" style="fill:${C.MUTED}">Efficiency ${nf(c.eta * 100)} % (teaching value)</text>`;
      s += `<text x="${x0}" y="${y + 130}" class="pts" style="fill:${c.holds ? C.OK : C.WARN}">${c.holds ? 'Under 50 %: it holds the load when you let go' : '50 % or more: it would run back'}</text>`;

    if (c.VR * c.P > c.W) s += `<rect x="${f(x0 + c.W * sc)}" y="${y + 74}" width="${f((c.VR * c.P - c.W) * sc)}" height="32" fill="none" stroke="${COL.fr}" stroke-width="3" rx="3"/>`;
    s += `<text x="${x0}" y="${y + 130}" class="pts" style="fill:${COL.P}"><tspan style="fill:${COL.n}">${nf(c.VR, c.VR % 1 ? 1 : 0)}</tspan> × ${wt(c.P)} = ${wt(c.VR * c.P)}  vs  <tspan style="fill:${COL.W}">W ${wt(c.W)}</tspan></text>`;

    s += `<text x="${x0}" y="${y + 104}" class="pt" style="fill:${COL.P}">Hand chain ${ln(c.travel, 1)}</text>`;
    s += `<text x="${x0}" y="${y + 134}" class="pts" style="fill:${C.MUTED}">= ${nf(c.VR, c.VR % 1 ? 1 : 0)} × ${ln(c.rise)}${c.VR > 20 ? ' (drawn slower than real)' : ''}</text>`;

  }
  function formula(c) {
    const t = c.chain === 'geared'
      ? `<tspan style="fill:${COL.P}">P</tspan> = rated pull × W ÷ rated load = ${nf(c.pullRated)} × ${nf(c.W)} ÷ ${nf(c.rated)} = <tspan style="fill:${COL.P}">${wt(c.P)}</tspan>`
      : `<tspan style="fill:${COL.P}">P</tspan> = W ÷ (VR × η) = ${nf(c.W)} ÷ (${nf(c.VR, 1)} × ${nf(c.eta, 2)}) = <tspan style="fill:${COL.P}">${wt(c.P)}</tspan>`;

  }

  function draw(c) {

    s += KIT.column(18, FLOOR, Y_BB, 30) + KIT.column(1552, FLOOR, Y_BB, 30) + beamAndClamp();

  function step(ms) {

    /* hand chain sway: a lightly damped pendulum (about a 1.5 m loop: period ~2.5 s) pulled toward a trailing offset

  function frame(ms) { const c = step(ms); lastC = c; if (svgEl) svgEl.innerHTML = draw(c); if (opts.onFrame) opts.onFrame(c, get()); renderCallouts(); callouts.forEach(o => o.age += ms); }
  function set(p, dur = 0) {

      const toMet = p.units === 'met', fw = toMet ? LB_TO_KG : 1 / LB_TO_KG, fl = toMet ? FT_TO_M : 1 / FT_TO_M, fd = toMet ? 25.4 : 1 / 25.4;
      if (!('load' in p)) S.load = Math.round(S.load * fw); if (!('rise' in p)) S.rise *= fl;
      if (!('D' in p)) S.D *= fd; if (!('d' in p)) S.d *= fd; S.units = p.units; A.last = null;

  function renderCallouts() {
    if (!coLayer) return;

      const el = document.getElementById(co.target); if (!el) return;
      const r = el.getBoundingClientRect(), lr = coLayer.getBoundingClientRect();
      const ring = document.createElement('div'); ring.className = 'co-ring';
      Object.assign(ring.style, { left: (r.left - lr.left - 6) + 'px', top: (r.top - lr.top - 6) + 'px', width: (r.width + 12) + 'px', height: (r.height + 12) + 'px' });

<script>/* Block and tackle simulator-lesson: scene adapters for the shared page shell (simulators/_lesson/shell.js).

  }

  /* hold-to-run: state[key] = on while held (pointer, Space / Enter on the button, or the control's hotkey) */
  const held = new Set();
  function hold(k, on, v) {

  }

  addEventListener('blur', releaseAll); document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
  addEventListener('keydown', e => { if (e.repeat || e.target.tagName === 'INPUT') return; trayKeys.forEach(k => { const c = S.controls[k]; if (c && c.type === 'hold' && c.hotkey === e.key) { e.preventDefault(); hold(c.key || k, true, c.on); } }); });
  addEventListener('keyup', e => { trayKeys.forEach(k => { const c = S.controls[k]; if (c && c.type === 'hold' && c.hotkey === e.key) hold(c.key || k, false); }); });

  /* ---------------------------------------------------------------- spotlight (hint level 2) */
  let spotIds = [];
  function drawSpot() {
    if (STAGE_ONLY) return;                 // video: no lesson spotlight on the stage
    spotG.innerHTML = spotIds.map(id => { const p = S.spot && S.spot(id, state); if (!p) return ''; const [x, y, r] = p;
      return `<circle cx="${x}" cy="${y}" r="${r + 6}" fill="none" stroke="#1F1D1A" stroke-width="8" opacity=".55"/><circle cx="${x}" cy="${y}" r="${r + 6}" fill="none" stroke="#F08A2B" stroke-width="4" stroke-dasharray="10 7"/>`; }).join('');
  }
  function spot(ids, ctrls) {
    spotIds = ids || []; drawSpot();
    tray.querySelectorAll('.spotlit').forEach(e => e.classList.remove('spotlit'));
    (ctrls || []).forEach(k => { const e = $('#c-' + k); if (e) e.classList.add('spotlit'); });
  }

  /* ---------------------------------------------------------------- steps */
  let tries = 0;
  function markTry() { tries++; }
  function goalMet(g) {
    if (!g) return false;
    const f = fn(g); if (f) return !!f(state, out);
    const st = full();
    return Object.keys(g).every(k => { const v = getPath(st, k), m = g[k];
      if (Array.isArray(m)) return v >= m[0] - 1e-9 && v <= m[1] + 1e-9;
      if (m && typeof m === 'object') { if ('in' in m) return m.in.includes(v); if ('near' in m) return Math.abs(v - m.near) <= (m.tol != null ? m.tol : 1e-6);
        if ('gte' in m) return v >= m.gte - 1e-9; if ('lte' in m) return v <= m.lte + 1e-9; if ('gt' in m) return v > m.gt; if ('lt' in m) return v < m.lt; if ('not' in m) return v !== m.not; }
      return v === m; });
  }
  function checkGoal(ms) {
    if (free || phase !== 'step') return;
    const st = steps[idx]; if (!st || done.has(idx) || !(st.type === 'do' || st.type === 'fail' || (st.type === 'predict' && qState === 'answered' && st.goal))) return;
    if (goalMet(st.goal)) { goalSince = (goalSince || 0) + ms; if (goalSince >= (st.hold != null ? st.hold : 450)) complete(); }
    else goalSince = null;
  }
  function complete(how) {
    if (done.has(idx)) return;
    done.add(idx); if (how) helped.add(idx); L('done', { step: idx, how: how || 'goal' }); spot([], []); renderStep();
  }
  function enter(i, opts = {}) {
    stopVoice(); free = false; challenge = null; idx = Math.max(0, Math.min(steps.length - 1, i)); hintLvl = 0; tries = 0; goalSince = null; qState = null;
    const st = steps[idx];
    if (!opts.noSetup) {

      if (st.set) set(st.set, st.dur || 1200);

    }
    releaseAll(); lastLive = '';
    if (!opts.noSetup) { window.sim.clear(); if (st.callout) [].concat(st.callout).forEach(c => window.sim.callout(c.id, c.text, { pos: c.pos })); }

  }
  function nextStep() { if (idx < steps.length - 1) enter(idx + 1); else enterFree(); }
  function stepHead(label) {
    return `<div class="sh"><b>${label}</b><button class="nav" id="b-sprev" aria-label="Previous step">&#8249;</button><button class="nav" id="b-snext" aria-label="Next step">&#8250;</button></div>`;
  }
  function wireHead() {

    if (n) n.onclick = () => { if (free) go(1); else { L('skip', { step: idx }); if (!done.has(idx)) helped.add(idx); nextStep(); } };
  }
  function hintBlock(st) {
    let h = '';

    if (hintLvl >= 2 && st.hint2) h += `<div class="hint">${md(st.hint2)}</div>`;
    return h;
  }
  function hintButtons(st, showLabel = 'Show me') {
    return `<div class="row"><button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; ${showLabel}</button>${hintLvl >= 2 || helped.has(idx) ? '<button class="skip" id="b-skip">Skip this step</button>' : ''}</div>`;
  }
  function renderStep() {
    if (free) return renderFree();

      else h += hintBlock(st) + hintButtons(st);
    } else if (st.type === 'predict') {
      h += `<p>${md(st.text)}</p>`;
      if (!qState) h += st.choices.map((c, i) => `<button class="opt" data-i="${i}">${String.fromCharCode(65 + i)}. ${md(c)}</button>`).join('') + hintBlock(st) + `<div class="row"><button class="btn" id="b-hint">&#128161; Hint</button></div>`;
      else {
        h += st.choices.map((c, i) => `<button class="opt ${i === st.answer ? 'right' : i === predPick ? 'wrong' : ''}" disabled>${String.fromCharCode(65 + i)}. ${md(c)}</button>`).join('');
        h += `<div class="${predPick === st.answer ? 'good' : 'bad'}"><b>${predPick === st.answer ? 'Right.' : 'Watch.'}</b> ${md(st.after)}</div>`;
        if (st.goal && !isDone) h += `<p style="font-size:16px">${md(st.doText)}</p>` + hintBlock(st) + hintButtons(st);
        else h += `<div class="row"><button class="btn pri" id="b-ok">Next step &#9654;</button></div>`;
      }
    } else if (st.type === 'question') {
      const vi = (qv[idx] || 0) % st.variants.length, v = st.variants[vi], ord = perm(v.choices.length, PN * 1000 + idx * 37 + vi * 7 + 3);
      h += `<h3>${md(v.q)}</h3>`;
      if (!qState) h += opts(v.choices, ord, () => '', true) + hintBlock({ hint: v.hint || st.hint, hint2: v.hint2 }) +
        `<div class="row"><button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; Show me</button></div>`;
      else if (qState === 'wrong') h += opts(v.choices, ord, i => i === qPick ? 'wrong' : '') +
        `<div class="bad"><b>Not quite.</b> ${md(v.choices[qPick].why)}</div><div class="row"><button class="btn pri" id="b-newq">Try a new question &#9654;</button></div>`;
      else h += opts(v.choices, ord, i => i === v.answer ? (qState === 'right' ? 'right' : 'ans') : '') +
        `<div class="good"><b>${qState === 'right' ? 'Right.' : 'Here is how.'}</b> ${md(v.explain)}</div><div class="row">${qState === 'shown' ? '<button class="btn" id="b-newq">Try a new question</button>' : ''}<button class="btn pri" id="b-ok">${idx === steps.length - 1 ? 'Free play' : 'Next step'} &#9654;</button></div>`;
    }

    const ok = $('#b-ok'); if (ok) ok.onclick = () => { if (st.type === 'teach') { done.add(idx); L('done', { step: idx, how: 'read' }); } nextStep(); };

    const sb = $('#b-show'); if (sb) sb.onclick = () => showMe();
    const kb = $('#b-skip'); if (kb) kb.onclick = () => { L('skip', { step: idx }); helped.add(idx); nextStep(); };

  }
  let predPick = null, qPick = null;
  function perm(n, seed) { const r = rng(seed), a = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function opts(ch, ord, cls, live) { return ord.map((j, p) => `<button class="opt ${cls(j)}" ${live ? `data-i="${j}"` : 'disabled'}>${String.fromCharCode(65 + p)}. ${md(ch[j].t)}</button>`).join(''); }
  function choose(i) {
    const st = steps[idx]; L('choose', { step: idx, i });
    if (st.type === 'predict') {
      if (qState) return; predPick = i; qState = 'answered';

  /* ---------------------------------------------------------------- free play */
  const allKeys = (C.freeControls || Object.keys(S.controls)).filter(k => S.controls[k] && !(S.controls[k].lessonOnly));
  function enterFree() { stopVoice(); free = true; challenge = null; spot([], []); releaseAll(); window.sim.clear(); L('free'); renderFree(); speak('free'); }
  function renderFree() {

    if (!challenge) {
      h += `<p>${md(C.free)}</p><div class="row">${S.challenge ? '<button class="btn pri" id="b-chal">&#127919; Give me a challenge</button>' : ''}<button class="btn" id="b-reset">&#8634; Reset</button>${PN < N ? `<button class="btn" id="b-np">Next page &#9654;</button>` : ''}</div>`;
    } else if (challenge.game) {      // a job to do on the simulator: goal(state, out, seconds) -> {live, done, ok, msg}

      h += `<h3 style="font-size:17px;margin:4px 0 8px">${md(c.q)}</h3><div class="note" id="glive">${md(c.live || '')}</div>`;
      if (c.result) h += `<div class="${c.result.ok ? 'good' : 'bad'}"><b>${c.result.ok ? 'Done.' : 'Not this time.'}</b> ${md(c.result.msg)}</div>`;
      h += `<div class="row">${c.result ? '<button class="btn pri" id="b-newq">Try another &#9654;</button>' : ''}<button class="btn" id="b-reset">&#8634; Reset</button></div>`;
    } else {
      const c = challenge;
      h += `<h3 style="font-size:17px;margin:4px 0 8px">${md(c.q)}</h3>`;
      const ord = c.ord || (c.ord = perm(c.choices.length, chalN * 13 + 5));
      if (c.state === 'wrong') h += opts(c.choices, ord, i => i === c.pick ? 'wrong' : '') + `<div class="bad"><b>Not quite.</b> ${md(c.choices[c.pick].why)}</div>`;
      else if (c.state === 'right' || c.shown) h += opts(c.choices, ord, i => i === c.answer ? 'right' : '') + `<div class="good"><b>${c.state === 'right' ? 'Right.' : 'Here is how.'}</b> ${md(c.explain)}</div>`;

      h += `<div class="row">${c.state === 'wrong' || c.state === 'right' || c.shown ? '<button class="btn pri" id="b-newq">Try a new question &#9654;</button>' : '<button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; Show me</button>'}<button class="btn" id="b-reset">&#8634; Reset</button></div>`;

  window.lessonPage = {
    log, state: () => ({ page: PN, pages: N, idx, type: steps[idx] && steps[idx].type, steps: steps.length, done: Array.from(done), helped: Array.from(helped), free, challenge: challenge ? { state: challenge.state, answer: challenge.answer, game: !!challenge.game, result: challenge.result || null } : null,
      qState, variant: qv[idx] || 0, answer: steps[idx] && steps[idx].type === 'question' ? steps[idx].variants[(qv[idx] || 0) % steps[idx].variants.length].answer : steps[idx] && steps[idx].answer, finished, voiceOK, muted, rate, sim: full() }),

})();

,000 lb. About what pull for 3,000 lb?","choices":[{"t":"54 lb","why":""},{"t":"72 lb","why":"Pull scales with the load."},{"t":"96 lb","why":"That is upside down: 72 × 4,000 ÷ 3,000."},{"t":"43 lb","why":"That is too low. Pull = 72 × 3,000 ÷ 4,000."}],"answer":0,"explain":"72 × 3,000 ÷ 4,000 = **54 lb**.","calc":{"state":{"chain":"geared","cap":3,"load":3000},"key":"P","value":54}},{"q":"Differential block, D = 250 mm, d = 225 mm, efficiency 40 %, 500 kg. Pull?","choices":[{"t":"25 kg","why":"That leaves out the 40 % efficiency."},{"t":"62.5 kg","why":""},{"t":"125 kg","why":"That leaves out the 2 in VR = 2D ÷ (D − d)."},{"t":"200 kg","why":"Check the formula: P = W ÷ (VR × efficiency)."}],"answer":1,"explain":"VR = 500 ÷ 25 = 20; P = 500 ÷ (20 × 0.4) = **62.5 kg**.","calc":{"state":{"chain":"differential","units":"met","D":250,"d":225,"eta":0.4,"load":500},"key":"P","value":62.5}}]},{"type":"teach","text":"Remember:","points":["Geared hoist: VR = overhaul ratio; use the maker's pull and capacity.","Differential: VR = 2D ÷ (D − d); under 50 % efficient, it holds the load.","Much more pull than the maker lists? Stop and check."],"say":"Remember. Geared hoist: VR = overhaul ratio; use the maker's pull and capacity. Differential: VR = 2D ÷ (D − d); under 50 % efficient, it holds the load. Much more pull than the maker lists? Stop and check."}],"free":"Every control is free. Switch hoist types, sizes and wheels, lift the load, then ask for a challenge.","freeControls":["chain","cap","load","rise","D","d","units"],"lesson":{"id":"block-and-tackle","title":"Block and tackle","done":"You finished **Block and tackle**: parts of line, reeving to advantage, distance and work, friction, the anchor and chain falls. Print the summary sheet to keep the rules and key numbers. On the job, check the tags, the maker's data and the lift plan.","sheet":"block-and-tackle-summary.pdf","pages":[{"file":"01-one-sheave.html","title":"One sheave"},{"file":"02-parts-of-line.html","title":"Pa
