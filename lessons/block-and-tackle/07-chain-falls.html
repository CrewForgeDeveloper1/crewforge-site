  const T = TACKLE,   // top-level const of tackle.js (not a window property)
    KEYS = ['parts', 'lead', 'friction', 'load', 'rise', 'units', 'anchorWll', 'fail', 'tags', 'count', 'cards', 'inset', 'labels'];
  const A = base(T, KEYS);
  const imp = () => (A.cur ? A.cur.units : T.S.units) === 'imp';
  let lastTravel = null, fbar = null;
  const sc = {
    defaults: Object.assign({}, window.BT_START, { travel: Math.round((window.BT_START.rise || 0) * (window.BT_START.parts || 1) * 1e6) / 1e6 }),   // travel follows rise (keeps Reset exact)
    viewBox: '0 0 1600 880',
    controls: {
      parts: { type: 'slider', label: 'Parts of line', min: 1, max: 8, step: 1, fmt: v => v + (v === 1 ? ' part' : ' parts') },
      lead: { type: 'chips', label: 'Lead line leaves', options: [{ v: 'fixed', t: 'Fixed block' }, { v: 'moving', t: 'Moving block' }] },
      friction: { type: 'chips', label: 'Friction', options: Object.keys(T.FRIC).map(k => ({ v: k, t: T.FRIC[k] })) },
      load: { type: 'slider', label: 'Load', get min() { return imp() ? 500 : 250; }, get max() { return imp() ? 40000 : 18000; }, get step() { return imp() ? 100 : 50; }, fmt: v => T.nf(v) + (imp() ? ' lb' : ' kg') },
      travel: { type: 'slider', label: 'Lead line pulled', min: 0, get max() { return Math.max(.05, Math.round(T.riseMax() * T.S.parts * 100) / 100); }, get step() { return imp() ? .05 : .01; }, fmt: v => T.nf(v, 2) + (imp() ? ' ft' : ' m') },
      anchorWll: { type: 'chips', label: 'Clamp rated', get options() { return [[2000, '1 t'], [4000, '2 t'], [6000, '3 t'], [10000, '5 t']].map(([v, t]) => ({ v: imp() ? v : v / 2, t })); } },
      units: { type: 'chips', label: 'Units', options: [{ v: 'imp', t: 'lb · ft' }, { v: 'met', t: 'kg · m' }] },
    },
    mount(svg, api) {
      const inner = A.mountSvg(svg, api);
      const st = Object.assign({}, sc.defaults); delete st.travel;
      T.mount({ svg: inner, state: st, external: true, onFrame: c => { if (fbar) fbar.innerHTML = T.formulaHtml(c); } });
      fbar = document.createElement('div'); fbar.className = 'fbar'; fbar.id = 'formula';
      const read = document.getElementById('read'); read.parentNode.insertBefore(fbar, read);
      fbar.innerHTML = T.formulaHtml(T.calc());
    },
    apply(state, prev, initial) {
      if (prev && state.travel !== prev.travel && state.travel !== lastTravel) state.rise = state.travel / Math.max(1, state.parts);
      const d = initial ? Object.assign(A.diff(state), { snap: true }) : A.diff(state);
      if (initial) for (const k of KEYS) if (k in state) d[k] = state[k];
      if (Object.keys(d).length) T.set(d);
      A.pull(state); state.travel = lastTravel = Math.round(state.rise * state.parts * 1e6) / 1e6; A.cur = state;
    },
    advance(ms, state) {
      // what the learner may do with the drawing right now: drag the hand line (travel), tap the ghost sheave (parts)
      const s = A.api && A.api.step(), ok = k => !s || s.free || (s.step && (s.step.controls || []).includes(k));
      ['travel', 'parts'].forEach(k => { const id = k === 'travel' ? 'c-haul' : 'c-parts'; if (ok(k)) T.LOCKED.delete(id); else T.LOCKED.add(id); });
      T.frame(ms);
      A.pull(state); state.travel = lastTravel = Math.round(state.rise * state.parts * 1e6) / 1e6; A.cur = state;
    },
    calc(state) {
      const c = T.calc(Object.assign({}, T.S, state)), fi = T.failInfo();
      return { P: c.P, Pideal: c.Pideal, MA: c.MA, VR: c.VR, MAact: c.MAact, eff: c.eff, rise: c.rise, travel: c.travel, workIn: c.workIn,
        workOut: c.workOut, n: c.n, S: c.Sh, anchor: c.anchor, leadBlock: c.leadBlock, util: c.util, breakAt: c.breakAt, level: c.level,
        riseMax: T.riseMax(), fail: !!fi.on, failure: fi };
    },
    readouts(state, o) {
      const lv = o.util > 1 ? 'bad' : o.util > .8 ? 'warn' : 'ok', u = imp() ? 'ft' : 'm', ph = document.body.classList.contains('phone');
      return [
        { id: 'n', label: 'Parts of line (n)', short: 'Parts n', value: o.n + (state.lead === 'moving' && o.n >= 2 ? ' (lead counts)' : ''), color: 'var(--accent)' },
        { id: 'p', label: 'Pull on the lead (P)', short: 'Pull P', value: T.wt(o.P), color: '#59b7ff' },
        { id: 'dist', label: 'Lead travel / rise', short: 'Lead travel', value: ph ? T.nf(o.travel, 2) + ' ' + u : T.nf(o.travel, 2) + ' / ' + T.nf(o.rise, 2) + ' ' + u },
        { id: 'eff', label: 'Efficiency', short: 'Eff.', value: T.nf(o.eff * 100, ph ? 0 : 1) + ' %' },
        { id: 'anchor', label: 'Anchor load', short: 'Anchor', value: ph ? T.nf(o.util * 100) + ' %' : T.wt(o.anchor) + ' · ' + T.nf(o.util * 100) + ' %', cls: lv },
      ];
    },
    caption: () => A.caption(T.failInfo()),     // PC: the scene draws its own failure card ("SIMULATION ONLY · NEVER DO THIS ON THE JOB")
    spot: A.spot,
    busy: () => T.isBusy(),
    reset() { },
    phoneViewBox(state, asp) {
      const rv = T.reeving(T.S.parts, T.S.lead), hand = rv.lm ? rv.lane(rv.m + 1) : rv.lane(rv.m), lb = A.box('load-box');
      return A.phoneCrop((rv.lane(0) - 60 + hand + 200) / 2, 50, lb ? Math.min(870, lb.y + lb.height + 30) : 860, asp || 1, T.failInfo().on);
    },
    challenge(rng) {
      const kind = pick(rng, ['pull', 'anchor', 'travel']);
      const n = pick(rng, [2, 3, 4, 5, 6]), W = pick(rng, [2000, 3000, 4000, 4500, 6000, 8000]), fr = pick(rng, ['ideal', 'rule10']);
      const setup = { snap: true, parts: n, lead: 'fixed', friction: fr, load: W, rise: 0, units: 'imp', anchorWll: 10000, fail: false, count: true, tags: true, cards: 'anchor,force', inset: false, labels: true };
      const c = T.calc(Object.assign({}, T.S, setup)), lb = v => T.nf(Math.round(v)) + ' lb', how = fr === 'rule10' ? '10 % per sheave' : 'no friction';
      if (kind === 'pull') {
        const ans = { t: lb(c.P) };
        const wrong = uniq(ans, [{ t: lb(W / n), why: 'That leaves out friction: add 10 % of the load for each sheave.' }, { t: lb(W * (1.1) / n), why: 'That adds 10 % once, not once per sheave.' },
          { t: lb(W / (n - 1)), why: 'That leaves out the dead end: count every part at the moving block.' }, { t: lb(W * (1 + .1 * n)), why: 'That forgets to divide by the parts of line.' }]);
        return { setup, q: `Lift **${lb(W)}** with **${n} parts**, lead off the fixed block, ${how}. Pull on the lead?`, choices: [ans].concat(wrong), answer: 0,
          hint: fr === 'rule10' ? 'P = W × (1 + 0.10 × sheaves) ÷ n. Off the fixed block, sheaves = n.' : 'P = W ÷ n.',
          explain: fr === 'rule10' ? `${lb(W)} × ${T.nf(1 + .1 * n, 1)} ÷ ${n} = **${lb(c.P)}**.` : `${lb(W)} ÷ ${n} = **${lb(c.P)}**.` };
      }
      if (kind === 'anchor') {
        const ans = { t: lb(c.anchor) };
        const wrong = uniq(ans, [{ t: lb(W), why: 'That is the load alone. You pull down on the top block too: W + P.' }, { t: lb(c.P), why: 'That is the pull, not the load on the anchor.' },
          { t: lb(W + n * c.P), why: 'That adds n × P. The anchor carries the load plus one pull.' }, { t: lb(2 * W), why: 'That doubles the load. Only a single fixed sheave does that.' }]);
        return { setup, q: `**${lb(W)}** on **${n} parts**, lead pulled straight down off the fixed block, ${how}. Load on the anchor?`, choices: [ans].concat(wrong), answer: 0,
          hint: 'Lead pulled down off the top block: anchor = W + P.', explain: `P = ${lb(c.P)}; anchor = ${lb(W)} + ${lb(c.P)} = **${lb(c.anchor)}**.` };
      }
      const rise = pick(rng, [0.5, 1, 1.5, 2, 3]), tr = n * rise, ft = v => T.nf(v, v % 1 ? 1 : 0) + ' ft', ans = { t: ft(tr) };
      const wrong = uniq(ans, [{ t: ft(rise), why: 'That is the rise. The lead line moves n times as far as the load.' }, { t: ft(rise / n), why: 'That divides. The lead line always moves farther than the load.' },
        { t: ft(n + rise), why: 'That adds the parts and the rise. Multiply instead.' }, { t: ft(2 * rise), why: 'That only works for 2 parts. Travel = n × rise.' }]);
      return { setup: Object.assign(setup, { rise: Math.min(rise, 1) }), q: `**${n} parts** of line lift the load **${ft(rise)}**. How far is the lead line pulled?`, choices: [ans].concat(wrong), answer: 0,
        hint: 'Lead line travel = parts × rise.', explain: `${n} × ${ft(rise)} = **${ft(tr)}**.` };
    },
  };
  return sc;
}

/* ===================================================================================== chain falls */
function chainScene() {
  const T = CHAINFALL, KEYS = ['chain', 'cap', 'load', 'rise', 'units', 'D', 'd', 'eta'];
  const A = base(T, KEYS);
  const imp = () => (A.cur ? A.cur.units : T.S.units) === 'imp';
  const sc = {
    defaults: Object.assign({}, window.BT_START),
    viewBox: '0 0 1600 880',
    controls: {
      chain: { type: 'chips', label: 'Hoist', options: [{ v: 'geared', t: 'Geared chain hoist' }, { v: 'differential', t: 'Differential block' }] },
      cap: { type: 'chips', label: 'Capacity', options: T.CAPNAME.map((n, i) => ({ v: i, t: n + ' t' })) },
      load: { type: 'slider', label: 'Load', get min() { return imp() ? 200 : 100; }, get max() { return imp() ? 12000 : 5400; }, get step() { return imp() ? 100 : 50; }, fmt: v => T.nf(v) + (imp() ? ' lb' : ' kg') },
      rise: { type: 'slider', label: 'Load rise', min: 0, get max() { return Math.max(.05, Math.floor(T.riseMax() * 100) / 100); }, step: .01, fmt: v => T.nf(v, 2) + (imp() ? ' ft' : ' m') },
      D: { type: 'slider', label: 'Large wheel D', get min() { return imp() ? 6 : 150; }, get max() { return imp() ? 14 : 350; }, get step() { return imp() ? .5 : 5; }, fmt: v => T.nf(v, 1) + (imp() ? ' in' : ' mm') },
      d: { type: 'slider', label: 'Small wheel d', get min() { return imp() ? 5 : 125; }, get max() { return imp() ? 13.5 : 340; }, get step() { return imp() ? .5 : 5; }, fmt: v => T.nf(v, 1) + (imp() ? ' in' : ' mm') },
      units: { type: 'chips', label: 'Units', options: [{ v: 'imp', t: 'lb · ft' }, { v: 'met', t: 'kg · m' }] },
    },
    mount(svg, api) { const inner = A.mountSvg(svg, api); T.mount({ svg: inner, state: Object.assign({}, sc.defaults), external: true }); },
    apply(state, prev, initial) {
      // a new hoist starts a fresh lift with its usual test load (as on the free simulator), unless the same change sets the load
      if (prev && !initial && state.chain !== prev.chain) { state.rise = 0; if (state.load === prev.load) state.load = state.chain === 'geared' ? (imp() ? 4000 : 1800) : (imp() ? 1000 : 450); }
      const d = A.diff(state); if (initial) { for (const k of KEYS) if (k in state) d[k] = state[k]; d.snap = true; }
      if (Object.keys(d).length) T.set(d);
      A.pull(state); A.cur = state;
    },
    advance(ms, state) { T.frame(ms); A.pull(state); A.cur = state; },
    calc(state) {
      const c = T.calc(Object.assign({}, T.S, state));
      return { P: c.P, Pideal: c.Pideal, VR: c.VR, MA: c.VR, MAact: c.MAact, eff: c.eff, eta: c.eta, rise: c.rise, travel: c.travel, rated: c.rated, util: c.util,
        falls: c.falls, holds: c.holds, riseMax: T.riseMax(), fail: false, failure: { on: false } };
    },
    readouts(state, o) {
      const g = state.chain === 'geared', u = imp() ? 'ft' : 'm', ph = document.body.classList.contains('phone');
      return [
        { id: 'vr', label: 'Velocity ratio', short: 'VR', value: T.nf(o.VR, o.VR % 1 ? 1 : 0) + ' : 1', color: 'var(--accent)' },
        { id: 'p', label: 'Pull on the hand chain', short: 'Pull', value: T.wt(o.P), color: '#59b7ff' },
        { id: 'dist', label: 'Hand chain / rise', short: 'Hand chain', value: ph ? T.nf(o.travel, 1) + ' ' + u : T.nf(o.travel, 1) + ' / ' + T.nf(o.rise, 2) + ' ' + u },
        { id: 'eff', label: 'Efficiency', short: 'Eff.', value: T.nf(o.eff * 100, ph ? 0 : 1) + ' %' },
        g ? { id: 'cap', label: 'Of capacity', short: 'Capacity', value: T.nf(o.util * 100) + ' %', cls: o.util > 1 ? 'bad' : o.util > .8 ? 'warn' : 'ok' }
          : { id: 'cap', label: 'Holds by itself', short: 'Holds', value: o.eff < .5 ? (ph ? 'Yes' : 'Yes (under 50 %)') : 'No', cls: o.eff < .5 ? 'ok' : 'warn' },
      ];
    },
    caption: () => null,
    spot: A.spot,
    busy: () => T.isBusy(),
    reset() { },
    phoneViewBox(state, asp) { const lb = A.box('load-box'); return A.phoneCrop(650, 60, lb ? Math.min(870, lb.y + lb.height + 30) : 860, asp || 1, false); },
    challenge(rng) {
      if (rng() < .5) {
        const i = pick(rng, [1, 2, 3, 5]), [cap, pr, ratio] = T.CB[i], rated = cap * 2000, W = Math.round(rated * pick(rng, [.5, .6, .75]) / 100) * 100;
        const lift = pick(rng, [2, 3]), setup = { snap: true, chain: 'geared', cap: i, load: W, rise: 0, units: 'imp' };
        if (rng() < .5) {
          const ft = v => T.nf(v) + ' ft', ans = { t: ft(ratio * lift) };
          return { setup, q: `A ${T.CAPNAME[i]} t chain hoist has an overhaul ratio of **${ratio} : 1**. How much hand chain lifts the load **${lift} ft**?`, answer: 0,
            choices: [ans].concat(uniq(ans, [{ t: ft(ratio), why: 'That is one foot of lift. Multiply by the lift.' }, { t: ft(ratio + lift), why: 'That adds the ratio and the lift. Multiply instead.' },
              { t: T.nf(ratio / lift, 1) + ' ft', why: 'That divides. The hand chain moves farther than the load.' }])),
            hint: 'Hand chain = overhaul ratio × lift.', explain: `${ratio} × ${lift} ft = **${ft(ratio * lift)}**.` };
        }
        const P = pr * W / rated, lb = v => T.nf(Math.round(v)) + ' lb', ans = { t: lb(P) };
        return { setup, q: `A ${T.CAPNAME[i]} t hoist (${T.nf(rated)} lb) needs **${pr} lb** of pull at its rated load. About what pull lifts **${T.nf(W)} lb**?`, answer: 0,
          choices: [ans].concat(uniq(ans, [{ t: lb(pr), why: 'That is the pull at the full rated load. Pull scales with the load.' }, { t: lb(pr * rated / W), why: 'That is upside down: multiply by load ÷ rated.' },
            { t: lb(W / ratio), why: 'That uses the overhaul ratio alone. Use the maker\'s pull, scaled by the load.' }])),
          hint: 'Pull = rated pull × load ÷ rated load.', explain: `${pr} × ${T.nf(W)} ÷ ${T.nf(rated)} = **${lb(P)}**.` };
      }
      const D = pick(rng, [8, 10, 12]), d = D - pick(rng, [.5, 1, 2]), VR = 2 * D / (D - d), f = v => T.nf(v, v % 1 ? 1 : 0), ans = { t: f(VR) };
      return { setup: { snap: true, chain: 'differential', D, d, eta: .35, load: 1000, rise: 0, units: 'imp' }, answer: 0,
        q: `Differential block: large wheel **D = ${f(D)} in**, small wheel **d = ${f(d)} in**. Velocity ratio?`,
        choices: [ans].concat(uniq(ans, [{ t: f(D / (D - d)), why: 'That leaves out the 2. VR = 2D ÷ (D − d).' }, { t: f(D / d), why: 'That is D ÷ d. VR = 2D ÷ (D − d).' },
          { t: f(2 * D / (D + d)), why: 'That adds the wheels. The loop shortens by the difference, D − d.' }])),
        hint: 'VR = 2D ÷ (D − d).', explain: `2 × ${f(D)} ÷ (${f(D)} − ${f(d)}) = **${f(VR)}**.` };
    },
  };
  return sc;
}

const SC = window.BT_SCENE === 'chainfall' ? chainScene() : tackleScene();
/* challenges leave the learner's rig alone: set up on the drawing, the tags and readouts would give the answer away */
const gen = SC.challenge;
SC.challenge = (rng, n) => { const q = gen(rng, n); delete q.setup; q.explain += ' Set it up on the simulator to check.'; return q; };
window.PAGE_SCENE = SC;
})();
</script>
<script>/* CrewForge simulator-lesson page shell (instructor 2026-11-13, docs/LESSON_DESIGN.md). One page = one idea.
   Runs a page scene (CFShell.start(content, scene)) inside the approved layout:
   top bar (Back, lesson + page n of N, progress dots, voice mute + speed, Next: nothing locks) -> "What you're looking
   at" (fixed per page) -> simulator + readouts -> step box (fixed per step: instruction, Hint, Show me) -> control tray
   (only this step's controls). Steps: teach -> do -> predict -> fail -> question; then free play (everything unlocked,
   Reset, "Give me a challenge"). Questions are practice: a wrong pick gets a red outline and the explanation of that
   mistake, then "Try a new question" serves a different variant until one is right. In Moodle the SCORM host page
   (tools/lesson_pages.py) scores the question steps: CFHost.answer(page, step, right) on the first pick or Show me
   (the host keeps the first result; pass 80 %); free-play challenges never count.

   Scene interface (one per page):
     defaults {}, controls {key: {type:'slider'|'chips'|'hold'|'custom', label, ...}} (below),
     mount(svg, api), apply(state, prev, initial), advance(ms, state), calc(state) -> out,
     readouts(state, out) -> [{label, short, value, cls:'ok'|'warn'|'bad', color, id}],
     caption(state, out) -> null | {kind:'fail'|'warn', title, text}, spot(id) -> [x, y, r] (svg units),
     drag (optional, wired by the scene; it calls api.input(partial)), challenge(rng, n) -> question, busy() -> bool,
     phoneViewBox, viewBox, reset().
     Optional generic hooks (added 2026-11-13 for the hoisting and block-and-tackle ports):
       instant: [keys]            never tweened by sim.set(partial, ms) (e.g. a hoist size that rebuilds the rig)
       onSet(state, keys)         after every sim.set / learner input (not on tween frames): rebuild what those keys need
       normalize(state)           after any change, before calc()
       callout(id, text, o) / clear()   the scene draws video callouts itself (return false to fall back to spot())
       fns {name: (state, out) => any}  step fields given as "fn:name": goal, live, ok
   api passed to mount: input(partial) (learner change: onSet + tries), get() (state + out), redraw(),
     step() -> {idx, type, step, free} (e.g. which drawing parts may be dragged now).

   Controls (the tray shows only the step's `controls`; free play shows content `freeControls` or all of them):
     slider  {min, max, step, unit, fmt(v)}: - / + steppers (hold to repeat), range, tap the value to type it
     chips   {options:[{v, t}]}: one choice
     hold    {key, on = 1, label, hotkey}: PRESS-AND-HOLD TO RUN. state[key] = on while the button is held (pointer,
             Space / Enter on the focused button, or the optional hotkey anywhere on the page), 0 on release, lost
             pointer capture, blur or leaving the page. The scene moves on its own clock (advance), so in ?capture=1
             a script does the same with sim.set({key: 1}) ... sim.set({key: 0}) on the virtual clock. 52 px tall.
             Dragging the part itself in the drawing is the scene's job (drag + api.input).
     custom  {html(state)}: scene-made markup (e.g. a crane pendant); any element in it with data-hk="key" is a
             hold-to-run button for state[key] (same rules as hold) and has class "on" while state[key] is truthy.
   Content (content.json page): what, steps, free, freeControls, capture: 'stage' (video layout: ?capture=1 shows only
     the stage and readouts and never applies lesson steps; without it capture keeps the full page as before).
   Mentor pattern (instructor 2026-11-15, docs/LESSON_DESIGN.md "Mentor pattern"): tag "On the job" / "Now you know" on a
     step shows as a label before "STEP n OF m"; ok (do / fail / predict-with-goal) and after (predict) are voiced when
     they appear (clips s<i>ok, s<i>after; a page without them stays silent there); a predict with a goal ("ask, then
     find out") takes thinkHint (the hint before the pick), live / wrong while the learner works, ok when it is done.
   Step extras: callout [{id, text, pos}] (shown while the step is on), live (a line under the instruction, refreshed
     every frame: "fn:name" or a template "{key:1}" / "{out.x:0}" / "{out.util:%}"), wrong [{when: goal, say}] (shown
     while it matches), points [..] (teach: a short list), hint2 on question variants.
   Goal matchers per key (state key or out.* path): value · [min, max] · {in} · {gte|lte|gt|lt} · {near, tol} · {not};
     or "fn:name" for the whole goal.
   Video contract (?capture=1): window.sim.set / callout / clear / advance / isIdle / ready / get / onChange.
     sim.set({snap: true, ...}) resets to the page defaults first (no tweens), then applies the rest. */
(function () {
'use strict';
const Q = new URLSearchParams(location.search), CAPTURE = Q.has('capture');
const $ = (s, r = document) => r.querySelector(s), el = (t, a = {}, h = '') => { const e = document.createElement(t); for (const k in a) e.setAttribute(k, a[k]); if (h) e.innerHTML = h; return e; };
const md = s => String(s == null ? '' : s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n\n/g, '<br><br>');
const NS = 'http://www.w3.org/2000/svg';
/* Reference data in the question (instructor 2026-11-15: "students wont be able to memorize the charts. things that are
   referenced should be given in the question as a table or image"). A step, question variant or challenge may carry
   ref: {title, columns: [...], rows: [[...]], note, img, alt} (or a list of them): shown with the question, never the answer. */
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const refHtml = r => !r ? '' : Array.isArray(r) ? r.map(refHtml).join('') :
  `<figure class="ref">${r.title ? `<figcaption>${md(r.title)}</figcaption>` : ''}${r.img ? `<img src="${r.img}" alt="${esc(r.alt || r.title || '')}">` : ''}` +
  (r.rows ? `<div class="rt"><table>${r.columns ? `<tr>${r.columns.map(c => `<th>${md(c)}</th>`).join('')}</tr>` : ''}${r.rows.map(row => `<tr>${row.map((c, i) => i === 0 ? `<th>${md(c)}</th>` : `<td>${md(c)}</td>`).join('')}</tr>`).join('')}</table></div>` : '') +
  (r.note ? `<div class="rs">${md(r.note)}</div>` : '') + `</figure>`;

window.CFShell = { start };

function start(C, S) {
  const log = [], T0 = performance.now(), L = (type, d = {}) => log.push({ t: Math.round(performance.now() - T0), type, ...d });
  let state = Object.assign({}, S.defaults), out = S.calc(state), tweens = [], listeners = [], dirty = true;
  let idx = 0, phase = 'step', hintLvl = 0, done = new Set(), helped = new Set(), qv = {}, qState = null, goalSince = null;
  let free = false, challenge = null, chalN = 0, finished = false;
  const N = C.lesson.pages.length, PN = C.n, steps = C.steps;
  const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
  const KEY = 'cf-lp:' + C.lesson.id;

    if (!opts.noSetup) { window.sim.clear(); if (st.callout) [].concat(st.callout).forEach(c => window.sim.callout(c.id, c.text, { pos: c.pos })); }
    L('enter', { step: idx, type: st.type });
    spot([], []); renderStep(); if (!opts.quiet) speak(curKey());
  }
  function nextStep() { if (idx < steps.length - 1) enter(idx + 1); else enterFree(); }
  function stepHead(label) {
    return `<div class="sh"><b>${label}</b><button class="nav" id="b-sprev" aria-label="Previous step">&#8249;</button><button class="nav" id="b-snext" aria-label="Next step">&#8250;</button></div>`;
  }
  function wireHead() {
    const p = $('#b-sprev'), n = $('#b-snext');
    if (p) { p.onclick = () => { if (free) enter(steps.length - 1); else if (idx > 0) enter(idx - 1); }; p.disabled = !free && idx === 0; }
    if (n) n.onclick = () => { if (free) go(1); else { L('skip', { step: idx }); if (!done.has(idx)) helped.add(idx); nextStep(); } };
  }
  function hintBlock(st) {
    let h = '';
    if (hintLvl >= 1) h += `<div class="hint">${md(st.hint || 'Look at the readouts under the drawing.')}</div>`;
    if (hintLvl >= 2 && st.hint2) h += `<div class="hint">${md(st.hint2)}</div>`;
    return h;
  }
  function hintButtons(st, showLabel = 'Show me') {
    return `<div class="row"><button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; ${showLabel}</button>${hintLvl >= 2 || helped.has(idx) ? '<button class="skip" id="b-skip">Skip this step</button>' : ''}</div>`;
  }
  function renderStep() {
    if (free) return renderFree();
    const st = steps[idx], isDone = done.has(idx), lab = (st.tag ? `<span class="tg">${esc(st.tag).toUpperCase()}</span> · ` : '') + `STEP ${idx + 1} OF ${steps.length}`;
    card.className = 'card step' + (st.type === 'question' ? ' q' : '');
    let h = stepHead(st.type === 'question' ? `QUESTION · ${lab}` : st.type === 'fail' ? `FAILURE · ${lab}` : lab);
    const ctrls = st.controls || [];
    if (st.type === 'teach') {
      h += `<p>${md(st.text)}</p>` + refHtml(st.ref) + (st.points ? `<ul class="points">${st.points.map(x => `<li>${md(x)}</li>`).join('')}</ul>` : '') + (st.note ? `<div class="note">${md(st.note)}</div>` : '') + `<div class="row"><button class="btn pri" id="b-ok">${idx === steps.length - 1 ? 'Got it: free play' : 'Got it'} &#9654;</button></div>`;
    } else if (st.type === 'do' || st.type === 'fail') {
      if (st.type === 'fail') h += `<div class="never">SIMULATION ONLY · NEVER DO THIS ON THE JOB</div>`;
      h += `<p>${md(st.text)}</p>` + refHtml(st.ref) + (st.live || st.wrong ? '<div class="note" id="live"></div>' : '');
      if (isDone) h += `<div class="good"><b>${st.type === 'fail' ? 'That is why.' : 'Done.'}</b> ${md(fn(st.ok) ? tpl(st.ok) : st.ok || '')}</div><div class="row"><button class="btn pri" id="b-ok">Next step &#9654;</button></div>`;
      else h += hintBlock(st) + hintButtons(st);
    } else if (st.type === 'predict') {
      h += `<p>${md(st.text)}</p>` + refHtml(st.ref);
      if (!qState) h += st.choices.map((c, i) => `<button class="opt" data-i="${i}">${String.fromCharCode(65 + i)}. ${md(c)}</button>`).join('') + hintBlock(st.thinkHint ? { hint: st.thinkHint } : st) + `<div class="row"><button class="btn" id="b-hint">&#128161; Hint</button></div>`;
      else {
        // answered: keep only the right choice and the learner's pick, so the explanation and the tray stay on screen
        h += st.choices.map((c, i) => i !== st.answer && i !== predPick ? '' : `<button class="opt ${i === st.answer ? 'right' : 'wrong'}" disabled>${String.fromCharCode(65 + i)}. ${md(c)}</button>`).join('');
        h += `<div class="${predPick === st.answer ? 'good' : 'bad'}"><b>${predPick === st.answer ? 'Right.' : 'Watch.'}</b> ${md(st.after)}</div>`;
        if (st.goal && !isDone) h += `<p style="font-size:16px">${md(st.doText)}</p>` + (st.live || st.wrong ? '<div class="note" id="live"></div>' : '') + hintBlock(st) + hintButtons(st);
        else h += (st.goal && st.ok ? `<div class="good"><b>Done.</b> ${md(fn(st.ok) ? tpl(st.ok) : st.ok)}</div>` : '') + `<div class="row"><button class="btn pri" id="b-ok">Next step &#9654;</button></div>`;
      }
    } else if (st.type === 'question') {
      const vi = (qv[idx] || 0) % st.variants.length, v = st.variants[vi], ord = perm(v.choices.length, PN * 1000 + idx * 37 + vi * 7 + 3);
      h += `<h3>${md(v.q)}</h3>` + refHtml(v.ref || st.ref);
      if (!qState) h += opts(v.choices, ord, () => '', true) + hintBlock({ hint: v.hint || st.hint, hint2: v.hint2 }) +
        `<div class="row"><button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; Show me</button></div>`;
      else if (qState === 'wrong') h += opts(v.choices, ord, i => i === qPick ? 'wrong' : '') +
        `<div class="bad"><b>Not quite.</b> ${md(v.choices[qPick].why)}</div><div class="row"><button class="btn pri" id="b-newq">Try a new question &#9654;</button></div>`;
      else h += opts(v.choices, ord, i => i === v.answer ? (qState === 'right' ? 'right' : 'ans') : '') +
        `<div class="good"><b>${qState === 'right' ? 'Right.' : 'Here is how.'}</b> ${md(v.explain)}</div><div class="row">${qState === 'shown' ? '<button class="btn" id="b-newq">Try a new question</button>' : ''}<button class="btn pri" id="b-ok">${idx === steps.length - 1 ? 'Free play' : 'Next step'} &#9654;</button></div>`;
    }
    card.innerHTML = h; wireHead();
    renderTray(st.type === 'question' ? (st.controls || []) : ctrls);
    const ok = $('#b-ok'); if (ok) ok.onclick = () => { if (st.type === 'teach') { done.add(idx); L('done', { step: idx, how: 'read' }); } nextStep(); };
    const hb = $('#b-hint'); if (hb) hb.onclick = () => hint();
    const sb = $('#b-show'); if (sb) sb.onclick = () => showMe();
    const kb = $('#b-skip'); if (kb) kb.onclick = () => { L('skip', { step: idx }); helped.add(idx); nextStep(); };
    const nq = $('#b-newq'); if (nq) nq.onclick = () => newQuestion();
    card.querySelectorAll('.opt[data-i]').forEach(b => b.onclick = () => choose(+b.dataset.i));
    if (st.spot && !free) spot(Array.isArray(st.spot) ? st.spot : [st.spot], []);
    lastLive = ''; liveLine();
    // phone: the step box scrolls inside itself; bring the newest explanation (the mentor's "that's because") into view
    if (card.querySelector('.good, .bad') && card.scrollHeight > card.clientHeight) card.scrollTop = card.scrollHeight;
  }
  let predPick = null, qPick = null;
  function perm(n, seed) { const r = rng(seed), a = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function opts(ch, ord, cls, live) { return ord.map((j, p) => `<button class="opt ${cls(j)}" ${live ? `data-i="${j}"` : 'disabled'}>${String.fromCharCode(65 + p)}. ${md(ch[j].t)}</button>`).join(''); }
  function choose(i) {
    const st = steps[idx]; L('choose', { step: idx, i });
    if (st.type === 'predict') {
      if (qState) return; predPick = i; qState = 'answered';
      if (st.reveal) set(st.reveal.set, st.reveal.dur || 1500);
      if (!st.goal) done.add(idx);
      renderStep(); speak('s' + idx + 'after'); return;
    }
    if (st.type !== 'question' || qState) return;
    const v = st.variants[(qv[idx] || 0) % st.variants.length]; qPick = i;
    if (i === v.answer) { qState = 'right'; done.add(idx); if (v.show) set(v.show, 1200); }
    else qState = 'wrong';
    if (host && host.answer) host.answer(PN, idx, qState === 'right');    // Moodle score: the host keeps the first result
    renderStep();
  }
  function newQuestion() {
    if (challenge) { return nextChallenge(); }
    const st = steps[idx]; qv[idx] = (qv[idx] || 0) + 1; qState = null; qPick = null; hintLvl = 0;
    const v = st.variants[qv[idx] % st.variants.length]; if (v.setup) set(v.setup, 0);
    L('newq', { step: idx, v: qv[idx] % st.variants.length }); renderStep(); speak(curKey());
  }
  function hint() {
    if (challenge) { hintLvl++; renderFree(); return; }
    const st = steps[idx]; hintLvl = Math.min(2, hintLvl + 1); L('hint', { step: idx, lvl: hintLvl });
    renderStep();
    if (hintLvl >= 2) spot(st.hintSpot ? [].concat(st.hintSpot) : (st.spot ? [].concat(st.spot) : []), st.controls || []);
  }
  function showMe() {
    if (challenge) { challenge.shown = true; renderFree(); return; }
    const st = steps[idx]; L('showme', { step: idx }); helped.add(idx);
    if (st.type === 'question') { qState = 'shown'; if (host && host.answer) host.answer(PN, idx, false); renderStep(); return; }
    if (st.solve) { set(fn(st.solve) ? fn(st.solve)(state, out) : st.solve, st.solveDur || 1600); renderTray(); }
    renderStep(); spot(st.spot ? [].concat(st.spot) : [], st.controls || []);
  }

  /* ---------------------------------------------------------------- free play */
  const allKeys = (C.freeControls || Object.keys(S.controls)).filter(k => S.controls[k] && !(S.controls[k].lessonOnly));
  function enterFree() { stopVoice(); free = true; challenge = null; spot([], []); releaseAll(); window.sim.clear(); L('free'); renderFree(); speak('free'); }
  function renderFree() {
    card.className = 'card step free';
    let h = stepHead('FREE PLAY · EVERYTHING UNLOCKED');
    if (!challenge) {
      h += `<p>${md(C.free)}</p><div class="row">${S.challenge ? '<button class="btn pri" id="b-chal">&#127919; Give me a challenge</button>' : ''}<button class="btn" id="b-reset">&#8634; Reset</button>${PN < N ? `<button class="btn" id="b-np">Next page &#9654;</button>` : ''}</div>`;
    } else if (challenge.game) {      // a job to do on the simulator: goal(state, out, seconds) -> {live, done, ok, msg}
      const c = challenge;
      h += `<h3 style="font-size:17px;margin:4px 0 8px">${md(c.q)}</h3>` + refHtml(c.ref) + `<div class="note" id="glive">${md(c.live || '')}</div>`;
      if (c.result) h += `<div class="${c.result.ok ? 'good' : 'bad'}"><b>${c.result.ok ? 'Done.' : 'Not this time.'}</b> ${md(c.result.msg)}</div>`;
      h += `<div class="row">${c.result ? '<button class="btn pri" id="b-newq">Try another &#9654;</button>' : ''}<button class="btn" id="b-reset">&#8634; Reset</button></div>`;
    } else {
      const c = challenge;
      h += `<h3 style="font-size:17px;margin:4px 0 8px">${md(c.q)}</h3>` + refHtml(c.ref);
      const ord = c.ord || (c.ord = perm(c.choices.length, chalN * 13 + 5));
      if (c.state === 'wrong') h += opts(c.choices, ord, i => i === c.pick ? 'wrong' : '') + `<div class="bad"><b>Not quite.</b> ${md(c.choices[c.pick].why)}</div>`;
      else if (c.state === 'right' || c.shown) h += opts(c.choices, ord, i => i === c.answer ? 'right' : '') + `<div class="good"><b>${c.state === 'right' ? 'Right.' : 'Here is how.'}</b> ${md(c.explain)}</div>`;
      else h += opts(c.choices, ord, () => '', true) + (hintLvl ? `<div class="hint">${md(c.hint)}</div>` : '');
      h += `<div class="row">${c.state === 'wrong' || c.state === 'right' || c.shown ? '<button class="btn pri" id="b-newq">Try a new question &#9654;</button>' : '<button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; Show me</button>'}<button class="btn" id="b-reset">&#8634; Reset</button></div>`;
    }
    card.innerHTML = h; wireHead();
    renderTray(challenge ? (challenge.game ? (challenge.controls || allKeys) : []) : allKeys);
    const ch = $('#b-chal'); if (ch) ch.onclick = () => nextChallenge();
    const rs = $('#b-reset'); if (rs) rs.onclick = () => reset();
    const np = $('#b-np'); if (np) np.onclick = () => go(1);
    const nq = $('#b-newq'); if (nq) nq.onclick = () => nextChallenge();
    const hb = $('#b-hint'); if (hb) hb.onclick = () => hint();
    const sb = $('#b-show'); if (sb) sb.onclick = () => showMe();
    card.querySelectorAll('.opt[data-i]').forEach(b => b.onclick = () => { const c = challenge; c.pick = +b.dataset.i; c.state = c.pick === c.answer ? 'right' : 'wrong'; L('challenge', { right: c.state === 'right' }); renderFree(); });
  }
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function nextChallenge() {
    chalN++; hintLvl = 0;
    const c = S.challenge(rng(PN * 1000 + chalN * 7919 + (Q.get('seed') | 0)), chalN);
    if (c.setup) set(c.setup, 0);
    challenge = Object.assign({ state: null, pick: null }, c); free = true; L('challenge', { n: chalN }); renderFree();
  }
  function reset() { tweens = []; held.clear(); S.reset && S.reset(); state = Object.assign({}, S.defaults); out = S.calc(state); S.apply(state, null, true); dirty = true; challenge = null; L('reset'); renderFree(); }

  function finish() {
    finished = true; stopVoice(); L('finish'); if (host && host.finish) host.finish();
    card.className = 'card step free';
    card.innerHTML = `<div class="sh"><b>LESSON COMPLETE</b></div><p>${md(C.lesson.done)}</p><div class="row">${C.lesson.sheet ? `<a class="btn pri" href="${C.lesson.sheet}" target="_blank" rel="noopener">&#128196; Summary sheet (PDF)</a>` : ''}<button class="btn" id="b-again">Back to free play</button></div>`;
    tray.innerHTML = ''; $('#b-again').onclick = () => enterFree();
    speak('done');
  }

  /* ---------------------------------------------------------------- loop */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    if (!CAPTURE) advance(dt);
    requestAnimationFrame(frame);
  }
  S.apply(state, null, true); render();
  enter(0, { quiet: true, noSetup: STAGE_ONLY });     // a video page starts from the page defaults: the script sets it up
  if (!CAPTURE) {
    requestAnimationFrame(frame);
    if ((PN === 1 && firstVisit) || host && host.fresh) showStart();
    else { voiceOK = true; speak('what', curKey()); }      // later pages: autoplay; if the browser refuses, play() shows the Start tap
  }
  if (CAPTURE) { voiceOK = false; }
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight' && e.altKey) go(1); if (e.key === 'ArrowLeft' && e.altKey) go(-1); });
  window.sim.ready = true;

  /* test / run-through API */
  window.lessonPage = {
    log, state: () => ({ page: PN, pages: N, idx, type: steps[idx] && steps[idx].type, steps: steps.length, done: Array.from(done), helped: Array.from(helped), free, challenge: challenge ? { state: challenge.state, answer: challenge.answer, game: !!challenge.game, result: challenge.result || null } : null,
      qState, variant: qv[idx] || 0, answer: steps[idx] && steps[idx].type === 'question' ? steps[idx].variants[(qv[idx] || 0) % steps[idx].variants.length].answer : steps[idx] && steps[idx].answer, finished, voiceOK, muted, rate, sim: full() }),
    defaults: () => Object.assign({}, S.defaults),
    challengeData: () => challenge ? { q: challenge.q, choices: (challenge.choices || []).map(c => c.t || c.text || c), explain: challenge.explain || '', ref: challenge.ref || null, game: !!challenge.game } : null,
    enter, nextStep, hint, showMe, choose, newQuestion, enterFree, reset, nextChallenge, finish, startVoice: () => { const b = $('#b-quiet'); if (b) b.click(); },
  };
}
})();

<script>CFShell.start({"n":7,"file":"07-chain-falls.html","title":"Chain falls","what":"A 2 t Harrington CB hand chain hoist on a beam clamp, lifting 4,000 lb. The maker lists the pull to lift the rated load (72 lb) and the overhaul ratio (70 ft of hand chain per foot of lift).","steps":[{"type":"teach","tag":"On the job","spot":["hand-chain","gears"],"text":"Say you need to raise a **4,000 lb** gearbox with a **2 t** chain fall. One person on the hand chain lifts it. How? The maker says you pull only about **72 lb**. Something has to give for that, and it's distance. Let's see how much."},{"type":"predict","controls":["rise"],"spot":["hand-chain","vm-dist"],"text":"Make a call. To raise the load **1 ft**, how much hand chain will you pull through?","choices":["About 4 ft","About 20 ft","About 70 ft"],"answer":2,"thinkHint":"You pull 72 lb to lift 4,000 lb. That's more than 50 times less force.","after":"Let's find out.","doText":"Raise the load **1 ft**. Watch **Hand chain**.","goal":{"rise":[0.97,1.03]},"solve":{"rise":1},"live":"Load {rise:2} ft · hand chain {out.travel:1} ft","hint":"Drag the **Load rise** slider.","hint2":"Set Load rise to **1 ft**.","ok":"**70 ft** of hand chain for 1 ft of lift. That's because the gears inside multiply your pull, and you pay in distance: a velocity ratio of 70 to 1. Built for force, not speed. A long lift takes a lot of pulling."},{"type":"teach","text":"The maker lists **72 lb** of pull to lift the rated 4,000 lb. In: 70 × 72 = 5,040 lb. Out: 4,000 lb. Efficiency 4,000 ÷ 5,040 = **79 %**. The rest goes into gear and chain friction. At 3,000 lb the pull drops in proportion, to 54 lb.","spot":["vm-force"]},{"type":"teach","spot":["vm-force","hand-chain"],"text":"Here's the job sense in that number. If the hand chain takes **much more** than the maker's pull, something is wrong. The load may be heavier than you think, or the hoist is binding or worn. Don't put a second person or a bar on the chain to force it. Stop and check."},{"type":"predict","controls":["chain"],"spot":["pull-tag"],"text":"Older shops still have **differential blocks**: two pocket wheels, 10 in and 9 in, on one shaft, no gears. Make a call: if you let go of the hand chain with a load on, what happens?","choices":["The load runs back down","It holds the load by itself"],"answer":1,"thinkHint":"Think about how much of your pull a block like this loses to friction.","after":"Let's find out.","doText":"Switch to the **Differential block**. Watch **Velocity ratio** and **Holds by itself**.","goal":{"chain":"differential"},"solve":{"chain":"differential"},"hint":"Tap **Differential block** under Hoist.","ok":"It holds. VR = 2D ÷ (D − d) = 20 ÷ 1 = **20**. That's because it is under **50 %** efficient: about 35 % here. It loses more than half your pull to friction, so the load can't run it backward. 1,000 lb takes 143 lb of pull."},{"type":"teach","tag":"Now you know","spot":["hand-chain"],"text":"Now you know a chain fall trades hand chain for force. The maker's table tells you the pull and the chain to expect. So on the job you can decide. Keep it inside its rated load. Plan time for all that chain. And stop if the pull is far more than the maker lists."},{"type":"question","variants":[{"q":"A chain fall has a hand chain overhaul ratio of 70 to 1. How much hand chain lifts the load 3 ft?","choices":[{"t":"23.3 ft","why":"That divides. Hand chain = 70 × 3 ft."},{"t":"70 ft","why":"That is one foot of lift."},{"t":"73 ft","why":"That adds 70 and 3. Multiply instead."},{"t":"210 ft","why":""}],"answer":3,"explain":"70 × 3 = **210 ft**.","calc":{"state":{"chain":"geared","cap":3,"load":3000,"rise":3},"key":"travel","value":210}},{"q":"Differential block, D = 10 in, d = 9 in. Velocity ratio?","choices":[{"t":"1.1","why":"That is D ÷ d. VR = 2D ÷ (D − d)."},{"t":"10","why":"That leaves out the 2. VR = 2D ÷ (D − d)."},{"t":"19","why":"That is D + d. VR = 2D ÷ (D − d)."},{"t":"20","why":""}],"answer":3,"explain":"2 × 10 ÷ (10 − 9) = **20**.","calc":{"state":{"chain":"differential","D":10,"d":9,"load":1000},"key":"VR","value":20}},{"q":"A 2 t hoist needs 72 lb to lift its rated 4,000 lb. About what pull for 3,000 lb?","choices":[{"t":"54 lb","why":""},{"t":"72 lb","why":"Pull scales with the load."},{"t":"96 lb","why":"That is upside down: 72 × 4,000 ÷ 3,000."},{"t":"43 lb","why":"That is too low. Pull = 72 × 3,000 ÷ 4,000."}],"answer":0,"explain":"72 × 3,000 ÷ 4,000 = **54 lb**.","calc":{"state":{"chain":"geared","cap":3,"load":3000},"key":"P","value":54}},{"q":"Differential block, D = 250 mm, d = 225 mm, efficiency 40 %, 500 kg. Pull?","choices":[{"t":"25 kg","why":"That leaves out the 40 % efficiency."},{"t":"62.5 kg","why":""},{"t":"125 kg","why":"That leaves out the 2 in VR = 2D ÷ (D − d)."},{"t":"200 kg","why":"Check the formula: P = W ÷ (VR × efficiency)."}],"answer":1,"explain":"VR = 500 ÷ 25 = 20; P = 500 ÷ (20 × 0.4) = **62.5 kg**.","calc":{"state":{"chain":"differential","units":"met","D":250,"d":225,"eta":0.4,"load":500},"key":"P","value":62.5}}]},{"type":"teach","text":"Remember:","points":["Geared hoist: VR = overhaul ratio; use the maker's pull and capacity.","Differential: VR = 2D ÷ (D − d); under 50 % efficient, it holds the load.","Much more pull than the maker lists? Stop and check."],"say":"Remember. Geared hoist: VR = overhaul ratio; use the maker's pull and capacity. Differential: VR = 2D ÷ (D − d); under 50 % efficient, it holds the load. Much more pull than the maker lists? Stop and check."}],"free":"Every control is free. Switch hoist types, sizes and wheels, lift the load, then ask for a challenge.","freeControls":["chain","cap","load","rise","D","d","units"],"lesson":{"id":"block-and-tackle","title":"Block and tackle","done":"You finished **Block and tackle**: parts of line, reeving to advantage, distance and work, friction, the anchor and chain falls. Print the summary sheet to keep the rules and key numbers. On the job, check the tags, the maker's data and the lift plan.","sheet":"block-and-tackle-summary.pdf","pages":[{"file":"01-one-sheave.html","title":"One sheave"},{"file":"02-parts-of-line.html","title":"Parts of line"},{"file":"03-to-advantage.html","title":"Reeving to advantage"},{"file":"04-distance.html","title":"Distance and work"},{"file":"05-friction.html","title":"Sheave friction"},{"file":"06-anchor.html","title":"The anchor"},{"file":"07-chain-falls.html","title":"Chain falls"},{"file":"08-putting-it-together.html","title":"Putting it together"}]},"audio":{"what":"p7-what-48669188.mp3","s0":"p7-s0-9c151e3a.mp3","s1":"p7-s1-78a1db36.mp3","s1after":"p7-s1after-fed32963.mp3","s1ok":"p7-s1ok-875688ac.mp3","s2":"p7-s2-d3bad0a3.mp3","s3":"p7-s3-49cc3461.mp3","s4":"p7-s4-4d7dd00d.mp3","s4after":"p7-s4after-328bc7a2.mp3","s4ok":"p7-s4ok-4203bb8e.mp3","s5":"p7-s5-73505f49.mp3","s6v0":"p7-s6v0-5db62ee3.mp3","s6v1":"p7-s6v1-3e4f8a70.mp3","s6v2":"p7-s6v2-561b3c5b.mp3","s6v3":"p7-s6v3-ebcac019.mp3","s7":"p7-s7-6e06a74a.mp3","free":"p7-free-129dc221.mp3"},"audioBase":"audio/"}, window.PAGE_SCENE);</script>
