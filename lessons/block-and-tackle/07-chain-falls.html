<script>/* CrewForge shared steel drawings: rolled I-beams (W and S shapes) and the screw-adjusted lifting beam clamp.
 * One drawing for every family that hangs a hoist from a beam (hoisting, block-and-tackle), so the beam and clamp
 * look the same everywhere (instructor 2026-11-14: "the i beam is too thin and the beam clamp looks nothing like a real
 * one"). Style: docs/concepts/hitches/STYLE.md (painted / mill steel, outline darker than the fill, light from the
 * top-left, one gradient + one highlight). Every function returns an SVG string; sizes in px, k = px per inch.
 *
 * Shapes (drawing proportions only; nothing on screen is computed from them): AISC Steel Construction Manual
 * shape tables, nominal d, bf, tf, tw. W shapes have parallel flange faces; S shapes (American standard beams) have
 * inner flange faces sloped 2 in 12 (16.67 %), tf the average thickness. Fillet radius drawn about 1.1 x tw.
 *
 * Beam clamp: the common screw-adjusted plate clamp (Harrington UBC style): two jaws, each a pair of side plates,
 * hook over the bottom flange tips (lip on the top face of the flange, the lower jaw under it); one threaded
 * spindle through both jaws (opposite threads) with a T-handle closes them on the flange; the lifting eye (clevis and pin)
 * hangs from a centre block on the spindle, under the web. Capacity plate on a jaw, flange range stamped on the spindle.
 */
(function () {
'use strict';
const f = v => (Math.round(v * 10) / 10).toString();
const P = pts => 'M' + pts.map(p => f(p[0]) + ' ' + f(p[1])).join(' L') + 'Z';
const SHAPES = [   // name, d, bf, tf, tw (in), S = sloped flanges
  ['S3x5.7', 3, 2.33, .26, .17, 1], ['S4x7.7', 4, 2.663, .293, .193, 1], ['S5x10', 5, 3.004, .326, .214, 1],
  ['S6x12.5', 6, 3.332, .359, .232, 1], ['S8x18.4', 8, 4.001, .425, .271, 1], ['S10x25.4', 10, 4.661, .491, .311, 1],
  ['S12x31.8', 12, 5, .544, .35, 1], ['W6x25', 6.38, 6.08, .455, .32, 0], ['W8x24', 7.93, 6.495, .4, .245, 0], ['W12x26', 12.2, 6.49, .38, .23, 0], ['W8x31', 8, 7.995, .435, .285, 0], ['W10x33', 9.73, 7.96, .435, .29, 0],
  ['W12x40', 11.9, 8.005, .515, .295, 0], ['W10x49', 9.98, 10, .56, .34, 0], ['W12x65', 12.1, 12, .605, .39, 0],
  ['W14x90', 14, 14.5, .71, .44, 0]];
/* the deepest listed shape whose flange width is within 0.6 in of bf (else the nearest): runway / monorail beams */
function shapeFor(bf, o = {}) {        // o.shallow: the shallowest close match (end views where height is tight)
  let best = null;
  for (const s of SHAPES) if (Math.abs(s[2] - bf) <= .6 && (!best || (o.shallow ? s[1] < best[1] : s[1] > best[1]))) best = s;
  if (!best) best = SHAPES.reduce((a, s) => Math.abs(s[2] - bf) < Math.abs(a[2] - bf) ? s : a);
  return { name: best[0], d: best[1], bf: best[2], tf: best[3], tw: best[4], S: !!best[5] };
}
const DEFS = `<defs><linearGradient id="stlWeb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a4adb4"/><stop offset=".5" stop-color="#939ca3"/><stop offset="1" stop-color="#7a838b"/></linearGradient>
<linearGradient id="stlFl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3acb3"/><stop offset="1" stop-color="#737c84"/></linearGradient>
<linearGradient id="stlSideWeb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b535a"/><stop offset=".5" stop-color="#5f6870"/><stop offset="1" stop-color="#525a61"/></linearGradient>
<linearGradient id="stlJaw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0b74a"/><stop offset=".55" stop-color="#c39228"/><stop offset="1" stop-color="#8f6a17"/></linearGradient>
<linearGradient id="stlBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d868d"/><stop offset=".3" stop-color="#e3e7ea"/><stop offset=".7" stop-color="#9aa3aa"/><stop offset="1" stop-color="#4b5359"/></linearGradient></defs>`;
const OUT = '#1e2327', JAWD = '#5e4510';

/* ------------------------------------------------------------------ I-beam, end view (true section) */
/* cx: web centre; ytop: top of the top flange; sh: {d, bf, tf, tw, S} in inches; k px/in.
 * o.bend: bottom-flange tip droop px (overload picture); o.id */
function ibeamEnd(cx, ytop, sh, k, o = {}) {
  const d = sh.d * k, bf = sh.bf * k, tw = Math.max(2, sh.tw * k), r = Math.max(2, 1.1 * sh.tw * k), bend = o.bend || 0;
  const slope = sh.S ? 2 / 12 : 0, run = (bf - tw) / 2;                       // S: inner face falls 2 in 12 toward the tip
  const tTip = Math.max(1.5, sh.tf * k - slope * run / 2), tRoot = sh.tf * k + slope * run / 2;
  const xl = cx - bf / 2, xr = cx + bf / 2, wl = cx - tw / 2, wr = cx + tw / 2, yb = ytop + d;
  // outline clockwise from the top-left corner; fillets as quarter arcs where the web meets each flange
  const p = [];
  p.push(`M${f(xl)} ${f(ytop)} L${f(xr)} ${f(ytop)} L${f(xr)} ${f(ytop + tTip)}`);
  p.push(`L${f(wr + r)} ${f(ytop + tRoot)} Q${f(wr)} ${f(ytop + tRoot)} ${f(wr)} ${f(ytop + tRoot + r)}`);
  p.push(`L${f(wr)} ${f(yb - tRoot - r)} Q${f(wr)} ${f(yb - tRoot)} ${f(wr + r)} ${f(yb - tRoot)}`);
  p.push(`L${f(xr)} ${f(yb - tTip + bend)} L${f(xr)} ${f(yb + bend)} L${f(xl)} ${f(yb + bend)} L${f(xl)} ${f(yb - tTip + bend)}`);
  p.push(`L${f(wl - r)} ${f(yb - tRoot)} Q${f(wl)} ${f(yb - tRoot)} ${f(wl)} ${f(yb - tRoot - r)}`);
  p.push(`L${f(wl)} ${f(ytop + tRoot + r)} Q${f(wl)} ${f(ytop + tRoot)} ${f(wl - r)} ${f(ytop + tRoot)}`);
  p.push(`L${f(xl)} ${f(ytop + tTip)}Z`);
  let s = DEFS + `<g${o.id ? ` id="${o.id}"` : ''} class="ibeam-end"><path d="${p.join(' ')}" fill="url(#stlWeb)" stroke="${OUT}" stroke-width="1.8" stroke-linejoin="round"/>`;
  // flange faces lit from above (top faces), web lit on the left, mill-scale edge lines
  s += `<path d="M${f(xl + 1)} ${f(ytop + 1.2)} L${f(xr - 1)} ${f(ytop + 1.2)}" stroke="#c9d0d5" stroke-width="${f(Math.max(1.4, sh.tf * k * .28))}" opacity=".7"/>`;
  s += `<path d="M${f(xl + 1)} ${f(yb - tTip + bend + 1)} L${f(wl - r)} ${f(yb - tRoot + 1)} M${f(wr + r)} ${f(yb - tRoot + 1)} L${f(xr - 1)} ${f(yb - tTip + bend + 1)}" stroke="#b9c1c7" stroke-width="1.4" opacity=".6"/>`;
  s += `<path d="M${f(wl + 1.2)} ${f(ytop + tRoot + r)} L${f(wl + 1.2)} ${f(yb - tRoot - r)}" stroke="#aeb7be" stroke-width="${f(Math.max(1, tw * .3))}" opacity=".55"/>`;
  return s + '</g>';
}

/* ------------------------------------------------------------------ I-beam, side elevation (runs left-right) */
/* Flange edges top and bottom (their thickness is tf), the web set back in shade, the web-to-flange fillets as a
 * soft band under the top flange and over the bottom one, stiffener plates. stiff: x list. o.paint: flange colour */
function ibeamSide(x0, x1, ytop, sh, k, o = {}) {
  const d = sh.d * k, tf = Math.max(3, sh.tf * k), r = Math.max(2, 1.1 * sh.tw * k), yb = ytop + d, w = x1 - x0;
  let s = DEFS + `<g${o.id ? ` id="${o.id}"` : ''} class="ibeam-side">`;
  s += `<rect x="${f(x0)}" y="${f(ytop)}" width="${f(w)}" height="${f(d)}" fill="url(#stlSideWeb)" stroke="${OUT}" stroke-width="1.6"/>`;
  s += `<rect x="${f(x0)}" y="${f(ytop + tf)}" width="${f(w)}" height="${f(Math.min(d * .3, 4 * r))}" fill="#000" opacity=".22"/>`;     // shadow under the top flange
  s += `<rect x="${f(x0)}" y="${f(ytop + tf)}" width="${f(w)}" height="${f(r)}" fill="#6a737b" opacity=".55"/>`;                         // top fillet catches light
  s += `<rect x="${f(x0)}" y="${f(yb - tf - r)}" width="${f(w)}" height="${f(r)}" fill="#7c858d" opacity=".45"/>`;                       // bottom fillet
  for (const xs of (o.stiff || [])) {
    const sw = Math.max(5, .375 * k);
    s += `<rect x="${f(xs - sw / 2)}" y="${f(ytop + tf)}" width="${f(sw)}" height="${f(d - 2 * tf)}" fill="#5f6870" stroke="${OUT}" stroke-width="1"/>`;
    s += `<rect x="${f(xs - sw / 2)}" y="${f(ytop + tf)}" width="${f(sw * .35)}" height="${f(d - 2 * tf)}" fill="#a8b1b8" opacity=".35"/>`;
  }
  for (const [y, lit] of [[ytop, .75], [yb - tf, .6]]) {
    s += `<rect x="${f(x0)}" y="${f(y)}" width="${f(w)}" height="${f(tf)}" fill="${o.paint || 'url(#stlFl)'}" stroke="${OUT}" stroke-width="1.3"/>`;
    s += `<rect x="${f(x0)}" y="${f(y + .6)}" width="${f(w)}" height="${f(Math.max(1.2, tf * .28))}" fill="#d3d9de" opacity="${lit}"/>`;
  }
  return s + '</g>';
}

/* ------------------------------------------------------------------ beam clamp, end view (beam end-on) */
/* cx: web centre; yBF: underside of the bottom flange; bf, tf: flange (in); k px/in.
 * o: min, max (jaw range, in), tmax (thickest flange, in), pinY (shackle pin centre, px), cap (text), range (text),
 *    spin (T-handle angle, rad), id ('clamp'). The jaws grip the flange when it is inside the range; outside it they
 *    stop where the screw stops (o.seat explains which). Returns { svg, seat, bite } */
function clampEnd(cx, yBF, bf, tf, k, o = {}) {
  const min = o.min || 3, max = o.max || 7.5, tmax = o.tmax || .83, yTF = yBF - tf * k;
  const LIP = .55, BITE = .9, JT = .8, CL = .06;                    // lip thickness, lip reach, jaw plate thickness, clearance (in)
  let open = Math.max(min, Math.min(max, bf)), seat = 'ok';
  if (bf > max + 1e-9) seat = 'wide'; else if (bf < min - 1e-9) seat = 'narrow'; else if (tf > tmax + 1e-9) seat = 'thick';
  const bite = seat === 'wide' ? 0 : Math.max(0, bf / 2 - (open / 2 + CL - BITE));        // how much lip is on the flange (in)
  const ys = yBF + 1.55 * k, pinY = o.pinY != null ? o.pinY : yBF + 4.5 * k;
  const jaw = sg => {
    const xt = cx + sg * (open / 2 + CL) * k;                        // jaw throat face (just outboard of the flange tip)
    let lipU = yTF, tilt = 0;                                         // lip underside on the flange's top face
    if (seat === 'wide') lipU = yBF + 1.5;                            // can't open wide enough: hangs under the flange, gripping nothing
    if (seat === 'narrow' && bite <= .05) lipU = yTF + 2;             // lip misses the flange tip
    if (seat === 'thick') tilt = sg * Math.min(18, Math.atan2((tf - tmax) * k + 3, 1.4 * k) * 57.3 + 4);   // too thick: rides on the tip, tipped out
    const lipT = lipU - LIP * k, yLo = Math.max(lipU + tmax * k, yBF) + .08 * k;           // lower jaw top: under the flange
    const ob = xt + sg * JT * k, inn = xt - sg * 1.45 * k;
    const outline = [[xt - sg * BITE * k, lipU], [xt - sg * BITE * k, lipT + .18 * k], [xt - sg * (BITE - .2) * k, lipT], [ob - sg * .15 * k, lipT], [ob, lipT + .2 * k],
      [ob, ys + .35 * k], [ob - sg * .5 * k, ys + 1.05 * k], [inn, ys + 1.05 * k], [inn, yLo], [xt, yLo], [xt, lipU]];
    let j = `<g class="jaw" transform="rotate(${f(tilt)} ${f(xt - sg * BITE * k)} ${f(lipU)})">`;
    j += `<path d="${P(outline)}" fill="url(#stlJaw)" stroke="${JAWD}" stroke-width="1.6" stroke-linejoin="round"/>`;
    j += `<path d="M${f(xt - sg * (BITE - .25) * k)} ${f(lipT + 1.5)} L${f(ob - sg * .2 * k)} ${f(lipT + 1.5)} L${f(ob - 1.5 * sg)} ${f(ys)}" stroke="#f3d98c" stroke-width="1.6" fill="none" opacity=".75"/>`;
    j += `<circle cx="${f(xt + sg * .35 * k)}" cy="${f(ys - .55 * k)}" r="${f(Math.max(1.6, .14 * k))}" fill="${JAWD}"/>`;    // side-plate rivet
    j += `<circle cx="${f(inn + sg * .5 * k)}" cy="${f(ys + .55 * k)}" r="${f(Math.max(1.6, .14 * k))}" fill="${JAWD}"/>`;
    return j + '</g>';
  };
  let s = DEFS + `<g id="${o.id || 'clamp'}" class="beam-clamp">`;
  // spindle (threaded rod) through both jaws, T-handle on the right end
  const xa = cx - (open / 2 + CL + JT + .35) * k, xb = cx + (open / 2 + CL + JT + 1.9) * k, sr = Math.max(2.5, .32 * k);
  s += `<g id="screw"><rect x="${f(xa)}" y="${f(ys - sr)}" width="${f(xb - xa)}" height="${f(2 * sr)}" rx="${f(sr * .4)}" fill="url(#stlBar)" stroke="${OUT}" stroke-width="1.2"/>`;
  for (let x = xa + sr; x < xb - sr; x += Math.max(3, .16 * k)) s += `<line x1="${f(x)}" y1="${f(ys - sr + 1)}" x2="${f(x + sr * .6)}" y2="${f(ys + sr - 1)}" stroke="#5d656c" stroke-width=".9" opacity=".55"/>`;
  const hl = 2.1 * k * Math.cos(o.spin || 0);                        // T-handle bar across the spindle end (turns about it)
  s += `<rect x="${f(xb - .25 * k)}" y="${f(ys - Math.abs(hl) - .2 * k)}" width="${f(.5 * k)}" height="${f(2 * Math.abs(hl) + .4 * k)}" rx="${f(.25 * k)}" fill="url(#stlBar)" stroke="${OUT}" stroke-width="1.2"/>`;
  s += `<circle cx="${f(xb)}" cy="${f(ys)}" r="${f(.42 * k)}" fill="#8d969d" stroke="${OUT}" stroke-width="1.2"/>`;
  if (o.range) s += `<text x="${f(cx + (open / 2 + CL + JT + 1.0) * k)}" y="${f(ys - sr - 3)}" text-anchor="middle" style="font:700 ${f(Math.max(9, .5 * k))}px Inter,Arial,sans-serif;fill:#e6e1d6">${o.range}</text>`;
  s += '</g>';
  s += jaw(-1) + jaw(1);
  // centre block on the spindle, under the web; the lifting shackle hangs from it, pin at pinY
  const bw = .75 * k, bt = ys - .75 * k, bb = ys + 1.05 * k;
  s += `<path d="M${f(cx - bw)} ${f(bt)} L${f(cx + bw)} ${f(bt)} L${f(cx + bw)} ${f(bb - .3 * k)} Q${f(cx + bw)} ${f(bb)} ${f(cx + bw - .3 * k)} ${f(bb)} L${f(cx - bw + .3 * k)} ${f(bb)} Q${f(cx - bw)} ${f(bb)} ${f(cx - bw)} ${f(bb - .3 * k)}Z" fill="url(#stlJaw)" stroke="${JAWD}" stroke-width="1.5"/>`;
  s += `<circle cx="${f(cx)}" cy="${f(bb - .38 * k)}" r="${f(.22 * k)}" fill="#d3d9de" stroke="${OUT}"/>`;
  // lifting eye: a forged clevis strap from the centre block down to the load pin (pinY) that the hook hangs on
  const ew = .62 * k, et = bb - .5 * k, eb = pinY + .85 * k;
  s += `<g id="clamp-shackle"><path d="M${f(cx - ew * .7)} ${f(et)} L${f(cx + ew * .7)} ${f(et)} L${f(cx + ew)} ${f(pinY)} A${f(ew)} ${f(ew)} 0 0 1 ${f(cx - ew)} ${f(pinY)}Z" fill="url(#stlJaw)" stroke="${JAWD}" stroke-width="1.5" stroke-linejoin="round"/>`;
  s += `<path d="M${f(cx - ew * .55)} ${f(et + 2)} L${f(cx - ew * .85)} ${f(pinY - .2 * k)}" stroke="#f3d98c" stroke-width="1.4" opacity=".7"/>`;
  s += `<circle cx="${f(cx)}" cy="${f(pinY)}" r="${f(Math.max(2.5, .5 * k))}" fill="#d3d9de" stroke="${OUT}" stroke-width="1.2"/><circle cx="${f(cx - .15 * k)}" cy="${f(pinY - .15 * k)}" r="${f(.16 * k)}" fill="#fff" opacity=".6"/></g>`;
  // capacity plate on the left jaw
  if (o.cap) { const px = cx - (open / 2 + CL + .2) * k, py = ys + .2 * k, pw = Math.max(26, 1.3 * k);
    s += `<g id="cap-plate"><rect x="${f(px - pw)}" y="${f(py)}" width="${f(pw)}" height="${f(Math.max(12, .6 * k))}" rx="2" fill="#e4e6e8" stroke="${OUT}" stroke-width="1"/><text x="${f(px - pw / 2)}" y="${f(py + Math.max(12, .6 * k) * .78)}" text-anchor="middle" style="font:800 ${f(Math.max(8, .42 * k))}px Inter,Arial,sans-serif;fill:#1d1d1d">${o.cap}</text></g>`; }
  return { svg: s + '</g>', seat, bite, ys, pinY };
}

/* ------------------------------------------------------------------ beam clamp, side elevation (beam runs left-right) */
/* The near jaw's side plates face-on: lip over the bottom flange, plate down past the spindle (seen end-on, the
 * T-handle bar across it), the shackle seen edge-on below with its pin (load point) at pinY.
 * x: clamp centre; yBF: underside of the bottom flange; tfPx: flange thickness (px); k px/in.
 * o: pinY, spin (handle angle, rad), cap (plate text), id, spread (0..1 jaws opening in a failure) */
function clampSide(x, yBF, tfPx, k, o = {}) {
  const yTF = yBF - tfPx, W = (o.w || 5) * k, lipT = yTF - .55 * k, ys = yBF + 1.55 * k, pinY = o.pinY != null ? o.pinY : yBF + 4.5 * k;
  const drop = (o.spread || 0) * 1.2 * k;
  let s = DEFS + `<g id="${o.id || 'clamp'}" class="beam-clamp-side"><g transform="rotate(${f((o.spread || 0) * 16)} ${f(x)} ${f(pinY)})">`;   // spread: the jaws let go and the clamp tips off the flange
  // shackle edge-on (bow plane across the beam): a bar from the centre block down round the pin
  const top = ys + .9 * k, dk = Math.max(3, .32 * k);
  s += `<g id="${o.id || 'clamp'}-shackle"><path d="M${f(x)} ${f(top + drop)} L${f(x)} ${f(pinY + .45 * k)}" stroke="${OUT}" stroke-width="${f(dk + 2)}" stroke-linecap="round"/><path d="M${f(x)} ${f(top + drop)} L${f(x)} ${f(pinY + .45 * k)}" stroke="#a6aeb4" stroke-width="${f(dk)}" stroke-linecap="round"/>`;
  s += `<path d="M${f(x - dk * .25)} ${f(top + drop + 2)} L${f(x - dk * .25)} ${f(pinY)}" stroke="#eef1f3" stroke-width="${f(dk * .25)}" opacity=".8"/></g>`;
  // jaw side plate (near jaw; the far jaw is directly behind it)
  const pl = [[x - W / 2, lipT + .15 * k], [x - W / 2 + .15 * k, lipT], [x + W / 2 - .15 * k, lipT], [x + W / 2, lipT + .15 * k], [x + W / 2, ys + .3 * k],
    [x + .9 * k, ys + 1.15 * k], [x - .9 * k, ys + 1.15 * k], [x - W / 2, ys + .3 * k]].map(p => [p[0], p[1] + drop]);
  s += `<path d="${P(pl)}" fill="url(#stlJaw)" stroke="${JAWD}" stroke-width="1.6" stroke-linejoin="round"/>`;
  s += `<path d="M${f(x - W / 2 + .2 * k)} ${f(lipT + 1.6 + drop)} L${f(x + W / 2 - .2 * k)} ${f(lipT + 1.6 + drop)}" stroke="#f3d98c" stroke-width="1.6" opacity=".75"/>`;
  // the flange tip shows through the jaw throat: a dark slot where the lip wraps it
  s += `<rect x="${f(x - W / 2 + .35 * k)}" y="${f(yTF + drop)}" width="${f(W - .7 * k)}" height="${f(tfPx)}" fill="#3a2c0b" opacity=".35"/>`;
  for (const dx of [-1, 1]) s += `<circle cx="${f(x + dx * (W / 2 - .45 * k))}" cy="${f(yBF + .55 * k + drop)}" r="${f(Math.max(1.6, .14 * k))}" fill="${JAWD}"/>`;
  // spindle end-on: boss + T-handle bar across it (turns as it is tightened)
  const a = o.spin || 0, hl = 1.7 * k;                       // tommy bar across the spindle end (spin: its angle)
  s += `<path d="M${f(x - hl * Math.cos(a))} ${f(ys + drop - hl * Math.sin(a))} L${f(x + hl * Math.cos(a))} ${f(ys + drop + hl * Math.sin(a))}" stroke="${OUT}" stroke-width="${f(.42 * k + 2)}" stroke-linecap="round"/>`;
  s += `<path d="M${f(x - hl * Math.cos(a))} ${f(ys + drop - hl * Math.sin(a))} L${f(x + hl * Math.cos(a))} ${f(ys + drop + hl * Math.sin(a))}" stroke="#b3bbc1" stroke-width="${f(.42 * k)}" stroke-linecap="round"/>`;
  s += `<circle cx="${f(x)}" cy="${f(ys + drop)}" r="${f(.5 * k)}" fill="#8d969d" stroke="${OUT}" stroke-width="1.2"/><circle cx="${f(x - .12 * k)}" cy="${f(ys + drop - .12 * k)}" r="${f(.18 * k)}" fill="#dfe4e7" opacity=".8"/>`;
  if (o.cap && k >= 8) s += `<g id="${o.id || 'clamp'}-plate"><rect x="${f(x + .75 * k)}" y="${f(yBF + .2 * k + drop)}" width="${f(1.25 * k)}" height="${f(Math.max(9, .55 * k))}" rx="1.5" fill="#e4e6e8" stroke="${OUT}" stroke-width=".8"/><text x="${f(x + 1.375 * k)}" y="${f(yBF + .2 * k + drop + Math.max(9, .55 * k) * .8)}" text-anchor="middle" style="font:800 ${f(Math.max(7, .4 * k))}px Inter,Arial,sans-serif;fill:#1d1d1d">${o.cap}</text></g>`;
  s += '</g>';
  // the pin the hoist hook hangs on
  s += `<circle cx="${f(x)}" cy="${f(pinY)}" r="${f(Math.max(2.5, .5 * k))}" fill="#d3d9de" stroke="${OUT}" stroke-width="1.2"/>`;
  return s + '</g>';
}

window.CFSteel = { SHAPES, shapeFor, ibeamEnd, ibeamSide, clampEnd, clampSide };
})();
</script>
<script>/* CrewForge illustration kit (JS port of docs/concepts/hitches/src/lib.py; rules in docs/concepts/hitches/STYLE.md).
   Plain functions that return SVG strings. Every scene: 1600 x 880 viewBox, one scale K (px per inch), light from
   the top-left, outlines darker than the fill, CrewForge orange only for "the thing to look at".
   Kept function-for-function with lib.py so the drawings match the approved concept pictures. */
const KIT = (() => {
  const W = 1600, H = 880;
  const FONT = "Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif";
  const C = {
    BG: '#24211d', PANEL: '#2a2723', TEXT: '#F5F5F4', MUTED: '#b9b4ab', ACC: '#F08A2B',
    OK: '#3ddc84', WARN: '#F2C230', BAD: '#ff5a4f',
    STEEL_D: '#3b4247', ROPE_D: '#454c51', ROPE_M: '#aab3b9', ROPE_V: '#6a737a',
    TIMBER_D: '#5e4426'
  };
  const f = v => { const r = Math.round(v * 10) / 10; return Math.abs(r - Math.round(r)) < 1e-6 ? String(Math.round(r)) : r.toFixed(1); };
  const pathd = (P, closed) => P.length ? 'M' + P.map(p => f(p[0]) + ' ' + f(p[1])).join(' L') + (closed ? 'Z' : '') : '';

  function catmull(P, n = 8, closed = false) {
    const out = [], m = P.length;
    const last = closed ? m : m - 1;
    for (let i = 0; i < last; i++) {
      const p0 = (closed || i > 0) ? P[(i - 1 + m) % m] : P[i], p1 = P[i], p2 = P[(i + 1) % m];
      const p3 = (closed || i + 2 < m) ? P[(i + 2) % m] : P[(i + 1) % m];
      for (let j = 0; j < n; j++) {
        const t = j / n, t2 = t * t, t3 = t2 * t;
        out.push([0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
      }
    }
    if (!closed) out.push(P[m - 1]);
    return out;
  }
  // points on a circle; degrees, screen coords (0 = +x, 90 = DOWN)
  const arcPts = (cx, cy, r, a0, a1, n = 24) => Array.from({ length: n + 1 }, (_, i) => {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  });
  function resample(P, step) {
    const out = [P[0]]; let acc = 0;
    for (let i = 0; i + 1 < P.length; i++) {
      const [x0, y0] = P[i], [x1, y1] = P[i + 1], seg = Math.hypot(x1 - x0, y1 - y0);
      if (!seg) continue;
      let t = step - acc;
      while (t <= seg) { out.push([x0 + (x1 - x0) * t / seg, y0 + (y1 - y0) * t / seg]); t += step; }
      acc = seg - (t - step);
    }
    const e = P[P.length - 1], l = out[out.length - 1];
    if (Math.hypot(e[0] - l[0], e[1] - l[1]) > 1e-3) out.push(e);
    return out;
  }
  function normals(P) {
    return P.map((_, i) => {
      const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [-dy / L, dx / L];
    });
  }
  // shift each point toward the light (top-left) along its normal: where the highlight runs on a round part
  function litOffset(P, amount) {
    const N = normals(P), Lx = -0.7071, Ly = -0.7071;
    return P.map((p, i) => { const [nx, ny] = N[i], s = nx * Lx + ny * Ly; return [p[0] + nx * s * amount, p[1] + ny * s * amount]; });
  }

  function defs() {
    return `<defs>
<linearGradient id="gSteel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfd5da"/><stop offset=".45" stop-color="#8d969d"/><stop offset="1" stop-color="#4b5359"/></linearGradient>
<linearGradient id="gForge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7d868d"/><stop offset=".5" stop-color="#555d63"/><stop offset="1" stop-color="#33393d"/></linearGradient>
<linearGradient id="gBarV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b747b"/><stop offset=".3" stop-color="#dfe4e7"/><stop offset=".62" stop-color="#8f989f"/><stop offset="1" stop-color="#454c52"/></linearGradient>
<linearGradient id="gBarH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f989f"/><stop offset=".28" stop-color="#e3e7ea"/><stop offset=".65" stop-color="#8a939a"/><stop offset="1" stop-color="#40474c"/></linearGradient>
<linearGradient id="gPaint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e7882"/><stop offset="1" stop-color="#4a525a"/></linearGradient>
<linearGradient id="gPaintSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#727c86"/><stop offset="1" stop-color="#454d55"/></linearGradient>
<linearGradient id="gBlock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9a640"/><stop offset=".55" stop-color="#b8862a"/><stop offset="1" stop-color="#7d5a17"/></linearGradient>
<radialGradient id="gSheave" cx=".38" cy=".34" r=".75"><stop offset="0" stop-color="#c9d0d5"/><stop offset=".55" stop-color="#8d969d"/><stop offset="1" stop-color="#4b5359"/></radialGradient>
<linearGradient id="gWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211e1b"/><stop offset="1" stop-color="#2b2824"/></linearGradient>
<linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46413b"/><stop offset=".12" stop-color="#3a3631"/><stop offset="1" stop-color="#2a2723"/></linearGradient>
<linearGradient id="gTimber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48a58"/><stop offset="1" stop-color="#8a6740"/></linearGradient>
<linearGradient id="gWeight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e7882"/><stop offset=".6" stop-color="#4f5860"/><stop offset="1" stop-color="#3a4148"/></linearGradient>
<linearGradient id="gBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d6670"/><stop offset="1" stop-color="#434b53"/></linearGradient>
<linearGradient id="gConc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b5650"/><stop offset="1" stop-color="#46423d"/></linearGradient>
<radialGradient id="gShadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="gDial" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fbfbf8"/><stop offset="1" stop-color="#d6d4cc"/></radialGradient>
<filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>`;
  }

  function styleBlock(extraPhone = '') {
    return `<style>
.lb{font:700 26px ${FONT};fill:${C.TEXT}} .lm{font:600 21px ${FONT};fill:${C.MUTED}} .la{font:800 30px ${FONT};fill:${C.ACC}}
.ld{stroke:${C.MUTED};stroke-width:2;fill:none} .tag{font:700 12px ${FONT};fill:#1d1d1d} .tagb{font:800 15px ${FONT};fill:#1d1d1d}
.pt{font:800 20px ${FONT}} .pts{font:700 16px ${FONT}} .halo{paint-order:stroke;stroke:#1F1D1A;stroke-width:6px;stroke-linejoin:round}
.phOnly{display:none}
@media (max-width:700px){ .lb{font-size:34px} .lm{font-size:28px} .la{font-size:38px} .pt{font-size:28px} .pts{font-size:24px} .pcOnly{display:none} .phOnly{display:inline} ${extraPhone} }
</style>`;
  }

  function backdrop(floor, wallLine = true) {
    let s = `<rect width="${W}" height="${floor}" fill="url(#gWall)"/>`;
    if (wallLine) {
      s += `<rect x="0" y="${floor - 150}" width="${W}" height="150" fill="#ffffff" opacity=".018"/>`;
      s += `<line x1="0" y1="${floor - 150}" x2="${W}" y2="${floor - 150}" stroke="#3a3530" stroke-width="2"/>`;
    }
    s += `<rect x="0" y="${floor}" width="${W}" height="${H - floor}" fill="url(#gFloor)"/>`;
    s += `<line x1="0" y1="${floor}" x2="${W}" y2="${floor}" stroke="#5a544c" stroke-width="2.5"/>`;
    return s;
  }
  function column(x, floor, top = 0, w = 34) {
    return `<g opacity=".55"><rect x="${x}" y="${top}" width="${w}" height="${floor - top}" fill="#2f2c28"/>` +
      `<rect x="${x}" y="${top}" width="5" height="${floor - top}" fill="#3a3632"/>` +
      `<rect x="${x + w - 5}" y="${top}" width="5" height="${floor - top}" fill="#262320"/>` +
      `<rect x="${x - 14}" y="${floor - 8}" width="${w + 28}" height="8" fill="#2f2c28"/></g>`;
  }
  const contactShadow = (cx, y, w, h = 14, op = 1) =>
    `<ellipse cx="${f(cx)}" cy="${f(y)}" rx="${f(w / 2)}" ry="${f(h / 2)}" fill="url(#gShadow)" opacity="${op}"/>`;

  // any round steel part along a path: dark outline, body, a highlight line on the lit side
  function roundBar(P, d, body = '#8d969d', dark = '#3b4247', hi = '#e8ecef', cap = 'round', hiOp = .85) {
    const p = pathd(P);
    return `<path d="${p}" fill="none" stroke="${dark}" stroke-width="${f(d + 1.6)}" stroke-linecap="${cap}" stroke-linejoin="round"/>` +
      `<path d="${p}" fill="none" stroke="${body}" stroke-width="${f(d)}" stroke-linecap="${cap}" stroke-linejoin="round"/>` +
      `<path d="${pathd(litOffset(P, d * .24))}" fill="none" stroke="${hi}" stroke-width="${f(Math.max(.8, d * .2))}" stroke-linecap="round" stroke-linejoin="round" opacity="${hiOp}"/>`;
  }

  /* Wire rope: steel body + strand valleys. Right regular lay: valleys run like "/" on a hanging rope, each strand
     crosses the visible face in about 2 d, valleys about 1.1 d apart. `phase` (px along the rope) moves the strand
     pattern with the rope's material so a running rope visibly runs (virtual clock only). */
  function wireRope(P, d, phase = 0, opts = {}) {
    const dense = resample(P, Math.max(.6, d / 6));
    let s = roundBar(dense, d, opts.body || C.ROPE_M, opts.dark || C.ROPE_D, '#e9edf0', 'butt', .7);
    if (d < 2.2 || dense.length < 2) return s;
    const pitch = 1.08 * d, adv = 2.0 * d;
    const L = [0];
    for (let i = 0; i + 1 < dense.length; i++) L.push(L[i] + Math.hypot(dense[i + 1][0] - dense[i][0], dense[i + 1][1] - dense[i][1]));
    const N = normals(dense), tot = L[L.length - 1];
    let j0 = 0;
    const at = sv => {
      sv = Math.max(0, Math.min(tot, sv));
      while (j0 > 0 && L[j0] > sv) j0--;
      while (j0 < L.length - 2 && L[j0 + 1] < sv) j0++;
      const t = (sv - L[j0]) / ((L[j0 + 1] - L[j0]) || 1);
      return [dense[j0][0] + (dense[j0 + 1][0] - dense[j0][0]) * t, dense[j0][1] + (dense[j0 + 1][1] - dense[j0][1]) * t, N[j0]];
    };
    let v = '';
    const ph = ((phase % pitch) + pitch) % pitch;
    for (let sv = -adv - pitch + ph; sv < tot; sv += pitch) {
      const seg = [];
      for (let j = 0; j < 5; j++) {
        const q = sv + adv * j / 4;
        if (q >= 0 && q <= tot) { const [x, y, [nx, ny]] = at(q); const o = (-.5 + j / 4) * d * .86; seg.push([x + nx * o, y + ny * o]); }
      }
      if (seg.length > 1) v += pathd(seg) + ' ';
      j0 = 0;
    }
    return s + `<path d="${v}" fill="none" stroke="${C.ROPE_V}" stroke-width="${f(Math.max(.7, d * .13))}" stroke-linecap="round" opacity=".9"/>`;
  }

  /* Crosby S-319N shank hook, ID code J (5 t carbon), inches, Kito Crosby 2026-27 p. 91 (same contour as lib.py).
     Origin = bottom of the hook on the shank axis; y negative = up; the saddle is on the shank axis at -1.81. */
  const HOOK_OUT = [[-0.705, -6.59], [-1.25, -6.05], [-2.3, -5.2], [-3.15, -4.1], [-3.5, -2.8], [-3.3, -1.5], [-2.6, -0.55],
    [-1.4, -0.05], [0, 0], [1.35, -0.25], [2.3, -1.0], [2.72, -2.1], [2.75, -3.1], [2.6, -3.95], [2.38, -4.5]];
  const HOOK_TIP = [2.08, -4.82], HOOK_RI = 1.6, HOOK_CY = -3.41, HOOK_SADDLE = -1.81;
  let _hc = null;
  function hookContour() {
    if (_hc) return _hc;
    let out = catmull(HOOK_OUT, 6);
    out = out.concat([HOOK_TIP, [1.8, -4.5], [1.64, -4.0]]);
    for (let a = 0; a <= 180; a += 9) out.push([HOOK_RI * Math.cos(a * Math.PI / 180), HOOK_CY + HOOK_RI * Math.sin(a * Math.PI / 180)]);
    out = out.concat(catmull([[-1.6, -3.41], [-1.5, -4.25], [-1.05, -4.95], [-0.3, -5.45], [0.45, -5.78], [0.705, -6.15]], 5).slice(1));
    _hc = [[-0.705, -10.43]].concat(out, [[0.705, -10.43]]);
    return _hc;
  }
  /* Hook in profile, saddle at (x, ysad), k px per inch; `open` 0..1 straightens the throat (failure).
     The shank top is at ysad - 8.62 k. */
  function hookProfile(x, ysad, k, o = {}) {
    const open = o.open || 0, flip = o.flip ? -1 : 1;
    const T = p => {
      let px = p[0], py = p[1];
      if (open > 0 && py > -6.2) {                      // opening: the bowl and tip swing out about the neck
        const a = open * 0.9 * Math.max(0, Math.min(1, (-py - 0) / 6.2 + .2)) * (px > -0.5 ? 1 : 0.35);
        const cx = -0.7, cy = -6.2, dx = px - cx, dy = py - cy;
        px = cx + dx * Math.cos(a) - dy * Math.sin(a); py = cy + dx * Math.sin(a) + dy * Math.cos(a);
      }
      return [x + flip * px * k, ysad + (py - HOOK_SADDLE) * k];
    };
    const c = hookContour().map(T);
    let s = `<g id="${o.id || 'hook'}"><path d="${pathd(c, true)}" fill="url(#gForge)" stroke="#1c2023" stroke-width="${f(Math.max(1, k * .12))}" stroke-linejoin="round"/>`;
    const back = catmull([[-0.45, -7.4], [-0.9, -6.0], [-2.0, -5.0], [-2.85, -3.9], [-3.05, -2.7], [-2.75, -1.55], [-1.9, -0.6]], 6).map(T);
    s += `<path d="${pathd(back)}" fill="none" stroke="#c3cad0" stroke-width="${f(k * .32)}" stroke-linecap="round" opacity=".55"/>`;
    s += `<path d="${pathd([T([-0.32, -10.3]), T([-0.32, -6.9])])}" stroke="#d3d9de" stroke-width="${f(k * .3)}" stroke-linecap="round" opacity=".6"/>`;
    if (!o.noLatch && open < .2) {                      // S-4320 spring latch, neck boss to inside the tip
      const piv = T([0.92, -5.95]), end = T([1.9, -4.62]), mid = T([1.5, -5.35]);
      const q = `M${f(piv[0])} ${f(piv[1])} Q${f(mid[0])} ${f(mid[1])} ${f(end[0])} ${f(end[1])}`;
      s += `<path d="${q}" stroke="#1c2023" stroke-width="${f(k * .5)}" fill="none" stroke-linecap="round"/>`;
      s += `<path id="${o.id || 'hook'}-latch" d="${q}" stroke="#c9ced2" stroke-width="${f(k * .34)}" fill="none" stroke-linecap="round"/>`;
      s += `<circle cx="${f(piv[0])}" cy="${f(piv[1])}" r="${f(k * .26)}" fill="#7b848b" stroke="#1c2023" stroke-width="1"/>`;
    }
    return s + '</g>';
  }
  const HOOK = { SADDLE: HOOK_SADDLE, RI: HOOK_RI, CY: HOOK_CY, LEN: 10.43 };

  /* Shackle seen square to the pin (U visible), pin horizontal; bow UP or DOWN. Crosby G-209 proportions scaled from
     5/8 in (pin 0.75, jaw 1.06, inside length 2.38, bow 1.69 in). Returns {back, front, crown} (crown = inside of the
     bow on the centreline: where an eye or hook bears). */
  function shackleFace(x, ypin, k, up = true, size = 0.625) {
    const sc = size / 0.625, pin = .75 * sc, iw = 1.06 * sc, il = 2.38 * sc, mat = .70 * sc, ear = 1.36 * sc;
    const legx = (iw + mat) / 2, rBow = (1.69 * sc + mat) / 2, top = -(pin / 2 + il + mat / 2), yc = top + rBow;
    const pts = [[-legx, -ear * .3], [-legx * 1.04, -(pin / 2 + il * .3)]];
    for (let a = 205; a >= -25; a -= 15) pts.push([rBow * Math.cos(a * Math.PI / 180), yc - rBow * Math.sin(a * Math.PI / 180)]);
    pts.push([legx * 1.04, -(pin / 2 + il * .3)], [legx, -ear * .3]);
    const P = catmull(pts, 4).map(([px, py]) => [x + px * k, ypin + (up ? py : -py) * k]);
    const back = roundBar(P, mat * k, '#a6aeb4', C.STEEL_D, '#eef1f3');
    let front = '';
    for (const ex of [-legx, legx]) front += `<circle cx="${f(x + ex * k)}" cy="${f(ypin)}" r="${f(ear / 2 * k)}" fill="#9aa2a8" stroke="${C.STEEL_D}" stroke-width="1.2"/>`;
    front += `<rect x="${f(x - (legx + ear * .62) * k)}" y="${f(ypin - pin / 2 * k)}" width="${f((2 * legx + ear * .95) * k)}" height="${f(pin * k)}" rx="${f(pin * .2 * k)}" fill="#b3bbc1" stroke="${C.STEEL_D}" stroke-width="1.1"/>`;
    front += `<rect x="${f(x - (legx + ear * .95) * k)}" y="${f(ypin - pin * .95 * k)}" width="${f(pin * .5 * k)}" height="${f(pin * 1.9 * k)}" rx="${f(pin * .12 * k)}" fill="#8e979d" stroke="${C.STEEL_D}" stroke-width="1.1"/>`;
    const crown = up ? ypin + (top + mat / 2) * k : ypin - (top + mat / 2) * k;
    return { back, front, crown, outer: up ? ypin + (top - mat / 2) * k : ypin - (top - mat / 2) * k };
  }

  function timberEnd(x, y, w, h, id) {
    const cx = x + w * .78, cy = y + h * 1.15, cid = 'tc' + (id || (Math.round(x) + '_' + Math.round(y)));
    let s = `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2" fill="#a77c4c" stroke="${C.TIMBER_D}" stroke-width="1.6"/>`;
    s += `<clipPath id="${cid}"><rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"/></clipPath><g clip-path="url(#${cid})">`;
    for (let i = 1; i < 9; i++) s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(i * Math.max(w, h) * .17)}" fill="none" stroke="#7d5b35" stroke-width="1" opacity=".55"/>`;
    s += `<line x1="${f(x + w * .3)}" y1="${f(y + h * .12)}" x2="${f(x + w * .42)}" y2="${f(y + h * .45)}" stroke="#4a3420" stroke-width="1.3" opacity=".7"/>`;
    return s + `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h * .18)}" fill="#ffffff" opacity=".08"/></g>`;
  }
  function timberSide(x, y, w, h, seed = 1) {
    let s = `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2" fill="url(#gTimber)" stroke="${C.TIMBER_D}" stroke-width="1.6"/>`;
    const n = Math.max(2, Math.floor(h / 7));
    for (let i = 1; i < n; i++) {
      const yy = y + h * i / n, wob = 1.6 * Math.sin(i * 1.7 + seed);
      s += `<path d="M${f(x + 4)} ${f(yy)} C${f(x + w * .3)} ${f(yy + wob)} ${f(x + w * .6)} ${f(yy - wob)} ${f(x + w - 4)} ${f(yy + wob * .5)}" stroke="#6e5131" stroke-width=".9" fill="none" opacity=".55"/>`;
    }
    return s + `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(Math.min(4, h * .15))}" fill="#fff" opacity=".1"/>`;
  }

  // few, large labels; leader ends in a dot ON the part; text never on the part it names
  function label(tx, ty, text, target, o = {}) {
    const anchor = o.anchor || 'start', cls = o.cls || 'lb';
    let s = '';
    if (target) {
      const [x2, y2] = target;
      const sx = anchor === 'end' ? tx + 6 : anchor === 'start' ? tx - 6 : tx;
      const sy = anchor === 'middle' ? ty + 8 : ty - 8;
      s += o.elbow ? `<path class="ld" d="M${f(sx)} ${f(sy)} L${f(o.elbow[0])} ${f(o.elbow[1])} L${f(x2)} ${f(y2)}"/>`
        : `<path class="ld" d="M${f(sx)} ${f(sy)} L${f(x2)} ${f(y2)}"/>`;
      s += `<circle cx="${f(x2)}" cy="${f(y2)}" r="4" fill="${C.TEXT}" stroke="#1F1D1A" stroke-width="1.5"/>`;
    }
    s += `<text class="${cls} halo" x="${f(tx)}" y="${f(ty)}" text-anchor="${anchor}"${o.id ? ` id="${o.id}"` : ''}>${text}</text>`;
    if (o.sub) s += `<text class="lm halo" x="${f(tx)}" y="${f(ty + 26)}" text-anchor="${anchor}">${o.sub}</text>`;
    return s;
  }

  // force arrow from (x0,y0) toward (x1,y1); head at (x1,y1)
  function forceArrow(x0, y0, x1, y1, col, w = 5, id = '') {
    const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
    if (L < 4) return '';
    const ux = dx / L, uy = dy / L, hl = Math.min(L * .6, 8 + w * 2.6), hw = 4 + w * 1.5;
    const bx = x1 - ux * hl, by = y1 - uy * hl;
    return `<g${id ? ` id="${id}"` : ''}><line x1="${f(x0)}" y1="${f(y0)}" x2="${f(bx)}" y2="${f(by)}" stroke="#1F1D1A" stroke-width="${w + 3}" stroke-linecap="round"/>` +
      `<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(bx)}" y2="${f(by)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>` +
      `<path d="M${f(x1)} ${f(y1)} L${f(bx - uy * hw)} ${f(by + ux * hw)} L${f(bx + uy * hw)} ${f(by - ux * hw)}Z" fill="${col}" stroke="#1F1D1A" stroke-width="1.5"/></g>`;
  }

  // magnified detail of the SAME drawing (same view), linked to a dashed ring on the source spot
  function detailInset(refId, src, mag, cx, cy, r, title, sub, id) {
    const [sx, sy] = src, rs = r / mag, cid = 'cl' + (id || Math.round(cx) + '_' + Math.round(cy));
    let s = `<g${id ? ` id="${id}"` : ''}>`;
    s += `<circle cx="${f(sx)}" cy="${f(sy)}" r="${f(rs)}" fill="none" stroke="${C.TEXT}" stroke-width="2" stroke-dasharray="5 4"/>`;
    const d = Math.hypot(cx - sx, cy - sy) || 1, ux = (cx - sx) / d, uy = (cy - sy) / d;
    s += `<line x1="${f(sx + ux * rs)}" y1="${f(sy + uy * rs)}" x2="${f(cx - ux * r)}" y2="${f(cy - uy * r)}" stroke="${C.TEXT}" stroke-width="2" stroke-dasharray="5 4"/>`;
    s += `<clipPath id="${cid}"><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}"/></clipPath>`;
    s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r + 5)}" fill="#1F1D1A"/>`;
    s += `<g clip-path="url(#${cid})"><rect x="${f(cx - r)}" y="${f(cy - r)}" width="${f(2 * r)}" height="${f(2 * r)}" fill="#26231f"/>`;
    s += `<use href="#${refId}" transform="translate(${f(cx)} ${f(cy)}) scale(${mag}) translate(${f(-sx)} ${f(-sy)})"/></g>`;
    s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="none" stroke="${C.TEXT}" stroke-width="2.5"/>`;
    s += `<text class="lm halo" x="${f(cx)}" y="${f(cy - r - 14)}" text-anchor="middle" style="font-weight:800;letter-spacing:.08em">${title}</text>`;
    if (sub) s += `<text class="lm halo" x="${f(cx)}" y="${f(cy + r + 30)}" text-anchor="middle">${sub}</text>`;
    return s + '</g>';
  }

  // a value pill: dark rounded box with coloured text (tension tags, pull tag)
  const PH = { v: 1 };                                   // phone text multiplier (set by the scene each frame)
  function pill(x, y, text, col, o = {}) {
    const fs = (o.fs || 18) * PH.v, w = Math.max(30, text.length * fs * .56 + 16), h = fs + 12, anchor = o.anchor || 'middle';
    const x0 = anchor === 'middle' ? x - w / 2 : anchor === 'end' ? x - w : x;
    return `<g${o.id ? ` id="${o.id}"` : ''}><rect x="${f(x0)}" y="${f(y - h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(h / 2)}" fill="#1F1D1A" stroke="${col}" stroke-width="2" opacity=".94"/>` +
      `<text x="${f(x0 + w / 2)}" y="${f(y + fs * .36)}" text-anchor="middle" style="font:800 ${fs}px ${FONT};fill:${col}">${text}</text></g>`;
  }

  return { W, H, FONT, C, f, pathd, catmull, arcPts, resample, normals, litOffset, defs, styleBlock, backdrop, column,
    contactShadow, roundBar, wireRope, hookProfile, HOOK, shackleFace, timberEnd, timberSide, label, forceArrow,
    detailInset, pill, PH };
})();
</script>
<script>/* CrewForge shared chain drawing (simulators/_lesson/chaindraw.js) - every simulator draws chain with this file.
   Approved by the instructor 2026-11-14 (sling-inspection redraw, then "check for all chain images in simulators and
   replace with better image"). Self-contained: no kit needed; defines CHD (= window.CFChain).
   Alloy chain drawn link by link (first drawn for the sling-inspection family 2026-11-14).
   Side view of interlocking links that alternate:
     FACE  the link's plane faces the viewer: a full oval ring of round stock with its opening;
     EDGE  the link's plane is square to the view: a narrow bar with rounded ends, passing THROUGH the openings of the
           links on either side of it.
   The view is turned TW = 12° about the chain axis, so an edge link shows its near rail a little lower than its far
   rail. Its far half is drawn behind the face links and its near half in front of them: at every bearing point the face
   link's end goes behind the near rail and in front of the far rail, the real over/under of interlocked links.
   Proportions (Peerless / Crosby Grade 80 and 100, 3/8 in: stock d 0.39 in, inside length 1.19 in, outside width
   1.33 in): inside length (pitch) 3.05 d, inside width 1.4 d, end radius on the stock centreline 1.2 d.
   Links under tension sit end crotch to end crotch: centre spacing = a1 + a2 - (d1 + d2) / 2 along the axis
   (a = half the centreline length), which is the pitch for two chain links.
   Shading: round steel, one light top-left (STYLE.md): outline, body, core shadow low-right, light band and a
   specular line high-left. Every number on the drawing still comes from calc(); this file only draws. */
var CHD = (typeof window !== 'undefined' && window.CFChain) || (function () {
  const TW = 12 * Math.PI / 180, CS = Math.cos(TW), SN = Math.sin(TW);
  /* small helpers (same as the sling-inspection kit's f / pathd / plen / along) */
  const f = v => { const r = Math.round(v * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1); };
  const pathd = (P, closed) => 'M' + P.map(p => f(p[0]) + ' ' + f(p[1])).join(' L') + (closed ? 'Z' : '');
  function plen(P) { let L = 0; for (let i = 1; i < P.length; i++) L += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); return L; }
  function along(P, s) {                 // point + unit tangent at arc length s
    let acc = 0;
    for (let i = 1; i < P.length; i++) {
      const L = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
      if (acc + L >= s || i === P.length - 1) {
        const t = L ? Math.max(0, Math.min(1, (s - acc) / L)) : 0;
        return { p: [P[i - 1][0] + (P[i][0] - P[i - 1][0]) * t, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * t], u: [(P[i][0] - P[i - 1][0]) / (L || 1), (P[i][1] - P[i - 1][1]) / (L || 1)] };
      }
      acc += L;
    }
    return { p: P[0], u: [1, 0] };
  }
  const K = { f, pathd, plen, along };
  const STEEL = ['#a6aeb4', '#3b4247', '#eef1f3'];
  const PIN = 3.05, WIN = 1.4;                       // x stock: inside length, inside width

  /* one round-steel stroke along P (closed ring or open piece) */
  function stroke(P, d, col, closed, cap) {
    const p = K.pathd(P, closed), lc = cap || 'round';
    const L = (w, c, op, dx, dy) => `<path d="${p}"${dx || dy ? ` transform="translate(${f(dx * d)} ${f(dy * d)})"` : ''} fill="none" stroke="${c}" stroke-width="${f(w)}" stroke-linecap="${lc}" stroke-linejoin="round"${op < 1 ? ` opacity="${op}"` : ''}/>`;
    const s = L(d + (d < 5 ? 1 : 2), col[1], 1) + L(d, col[0], 1);
    if (d < 5) return s + L(Math.max(.6, d * .3), col[2], .8, -.12, -.16);
    return s + L(d * .34, col[1], .42, .14, .17) + L(d * .4, col[2], .45, -.08, -.11) + L(d * .13, '#ffffff', .65, -.17, -.22);
  }
  /* closed stadium centreline in link coordinates [x along the axis, w across the link], from the +x apex through w > 0.
     index 0 = +x apex, 26 = -x apex, 52 = +x apex again */
  function stadium(a, b) {
    const P = [], e = Math.max(0, a - b);
    for (let i = 0; i <= 9; i++) { const t = i / 9 * Math.PI / 2; P.push([e + b * Math.cos(t), b * Math.sin(t)]); }
    for (let i = 1; i < 8; i++) P.push([e - 2 * e * i / 8, b]);
    for (let i = 0; i <= 18; i++) { const t = Math.PI / 2 + i / 18 * Math.PI; P.push([-e + b * Math.cos(t), b * Math.sin(t)]); }
    for (let i = 1; i < 8; i++) P.push([-e + 2 * e * i / 8, -b]);
    for (let i = 0; i <= 9; i++) { const t = 3 * Math.PI / 2 + i / 9 * Math.PI / 2; P.push([e + b * Math.cos(t), b * Math.sin(t)]); }
    return P;
  }
  /* geometry of one link spec: centreline half-length a, half-width b */
  const half = L => ({ a: (L.pin + L.d) / 2, b: (L.win + L.d) / 2 });
  /* link -> screen mapping. FACE: w shows as w cos TW; EDGE: as -w sin TW (near rail, w > 0, sits lower) */
  function mapper(L) {
    const { a } = half(L), u = L.u, n = [u[1], -u[0]], F = L.kind === 'F', bend = L.bend || 0;
    return ([x, w]) => { w += bend * (1 - (x / a) * (x / a)); const m = F ? w * CS : -w * SN; return [L.c[0] + u[0] * x + n[0] * m, L.c[1] + u[1] * x + n[1] * m]; };
  }
  /* draw one link -> {back, mid, front} layers */
  function link(L) {
    const d = L.d, { a, b } = half(L), S = mapper(L), col = L.col || STEEL, P = stadium(a, b);
    const id = L.id ? ` id="${L.id}"` : '';
    if (L.kind === 'F') {
      let body = stroke(P.slice(0, -1).map(S), d, col, true);
      if (L.boss) {                                      // coupling link: the centre boss with the load pin (Hammerlok style)
        const bw = L.boss * d, q = [[-bw / 2, -b], [bw / 2, -b], [bw / 2, b], [-bw / 2, b]].map(S);
        body += `<path d="${K.pathd(q, true)}" fill="${col[0]}" stroke="${col[1]}" stroke-width="2" stroke-linejoin="round"/>`;
        const pc = S([0, 0]);
        body += `<circle cx="${f(pc[0])}" cy="${f(pc[1])}" r="${f(Math.min(bw, 2 * b) * .3)}" fill="${col[2]}" stroke="${col[1]}" stroke-width="1.5"/>`;
      }
      if (L.wear > 0) {                                  // bearing wear: a groove the mating link has rubbed into the inside of the end
        const sg = L.wearEnd || 1, r = .55 * d, gx = sg * (a - d / 2 + L.wear - r), g = S([gx, 0]);
        const xs = P.map(S).map(p => p[0]), ys = P.map(S).map(p => p[1]);
        const x0 = Math.min(...xs) - d, y0 = Math.min(...ys) - d, w = Math.max(...xs) - x0 + d, h = Math.max(...ys) - y0 + d;
        const mid = `wm${Math.round(L.c[0])}_${Math.round(L.c[1])}`;
        body = `<mask id="${mid}" maskUnits="userSpaceOnUse" x="${f(x0)}" y="${f(y0)}" width="${f(w)}" height="${f(h)}"><rect x="${f(x0)}" y="${f(y0)}" width="${f(w)}" height="${f(h)}" fill="#fff"/>` +
          `<circle cx="${f(g[0])}" cy="${f(g[1])}" r="${f(r)}" fill="#000"/></mask><g mask="url(#${mid})">${body}</g>`;
        const arc = [...Array(13)].map((_, i) => { const t = (-55 + i * 110 / 12) * Math.PI / 180; return S([gx + sg * r * Math.cos(t), r * Math.sin(t) / CS]); });
        body += `<path d="${K.pathd(arc)}" fill="none" stroke="#f7f9fa" stroke-width="${f(Math.max(1.5, d * .07))}" stroke-linecap="round"/>`;
      }
      return { back: '', mid: `<g${id}>${body}</g>`, front: '' };
    }
    const ex = t => [a - b + b * Math.cos(t), b * Math.sin(t)];
    const near = [ex(-.2)].concat(P.slice(0, 27), [[-(a - b) + b * Math.cos(Math.PI + .2), b * Math.sin(Math.PI + .2)]]).map(S);
    const far = P.slice(26).map(S);
    const shadow = d >= 5 ? `<path d="${K.pathd(near)}" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="${f(d * 1.22)}" stroke-linecap="butt" stroke-linejoin="round"/>` : '';
    return { back: `<g>${stroke(far, d, col, false, 'round')}</g>`, mid: '', front: `<g${id}${L.ghost ? ` opacity="${L.ghost}"` : ''}>${L.ghost ? '' : shadow}${stroke(near, d, col, false, 'butt')}</g>` };   // ghost: phantom (see-through) so a part behind it can be shown
  }
  /* point and unit tangent at arc length s along a polyline (straight past either end) */
  function at(P, s) {
    if (s <= 0) { const u = K.along(P, 0).u; return { p: [P[0][0] + u[0] * s, P[0][1] + u[1] * s], u }; }
    const tot = K.plen(P);
    if (s >= tot) { const u = K.along(P, tot).u, e = P[P.length - 1]; return { p: [e[0] + u[0] * (s - tot), e[1] + u[1] * (s - tot)], u }; }
    return K.along(P, s);
  }
  /* lay a sequence of link specs ({d, pin, win, kind, col, id, bend, wear, boss, gap}) along an axis polyline,
     the first link's outer end at the polyline's start; spec.gap = extra slack before that link (px, + = apart,
     - = pushed together). Returns {links, centres, svg, back, mid, front, end (outer end of the last link)} */
  function lay(path, specs) {
    const links = [];
    let s = 0;
    specs.forEach((L, i) => {
      const h = half(L);
      s = i === 0 ? h.a + L.d / 2 : s + half(specs[i - 1]).a + h.a - (specs[i - 1].d + L.d) / 2 + (L.gap || 0);
      const A = at(path, s - h.a / 2), B = at(path, s + h.a / 2), c = at(path, s).p;
      const ux = B.p[0] - A.p[0], uy = B.p[1] - A.p[1], ul = Math.hypot(ux, uy) || 1;
      links.push(Object.assign({}, L, { c, u: [ux / ul, uy / ul], s }));
    });
    let back = '', mid = '', front = '';
    links.forEach(L => { const g = link(L); back += g.back; mid += g.mid; front += g.front; });
    const last = links[links.length - 1], endP = at(path, last.s + half(last).a + last.d / 2).p;
    return { links, centres: links.map(L => L.c), back, mid, front, svg: back + mid + front, end: endP };
  }
  /* chain link spec for stock d (px): o.stretch lengthens, o.narrow narrows (a stretched link necks in) */
  const chainLink = (d, kind, o = {}) => Object.assign({ d, pin: PIN * d * (o.stretch || 1), win: WIN * d * (o.narrow || 1), kind }, o.extra || {});
  /* the outer surface of a face link's rail (side +1 = the n side, "top" on a chain running to the right), at x along the link */
  function railOuter(L, side = 1, x = 0) {
    const { b } = half(L), S = mapper(L);
    return S([x, side * (b + L.d / 2)]);
  }
  function railCentre(L, side = 1, x = 0) { const { b } = half(L); return mapper(L)([x, side * b]); }
  /* catenary between A and B (screen px, y down) for a hanging length len (>= the chord): a polyline that sags */
  function catenary(A, B, len, N = 48) {
    const h = Math.abs(B[0] - A[0]), v = B[1] - A[1], sg = B[0] >= A[0] ? 1 : -1;
    if (h < 1 || len <= Math.hypot(h, v) * 1.0005) return [A, B];
    const need = Math.sqrt(len * len - v * v) / h;
    let lo = 1e-6, hi = 60; for (let i = 0; i < 90; i++) { const m = (lo + hi) / 2; if (Math.sinh(m) / m < need) lo = m; else hi = m; }
    const z = (lo + hi) / 2, a = h / (2 * z), t0 = a * Math.asinh(v / (2 * a * Math.sinh(z)));
    const C = A[1] + a * Math.cosh((-h / 2 - t0) / a);
    return [...Array(N + 1)].map((_, i) => { const t = -h / 2 + h * i / N; return [A[0] + sg * (t + h / 2), C - a * Math.cosh((t - t0) / a)]; });
  }

  /* ------------------------------------------------------------------ chain runs (every family uses these)
     run(P, o): a chain along any polyline P (px). Links are rigid: every link spans two bearing points that sit one
     pitch apart along P, so on a curve (a sag, a pocket wheel) each link is a straight chord and alternate links seat
     face-on / edge-on, the way chain lies in the pockets of a load sheave or hand wheel.
       o.d      stock diameter (px); hand chain is thinner than load chain (stroke() simplifies the shading below 5 px)
       o.pitch  inside length = link-to-link spacing (px), default PIN x d (3.05 d, Grade 80/100 proportions)
       o.phase  run (px, + = links travel toward the end of P). Pitch-locked: link j sits at phase + j x pitch and keeps
                its face/edge kind as it moves, so a running chain runs and never "swims". Drive it off the virtual clock.
       o.anchor 'end': links locked to P's end instead of its start (see below)
       o.fit    true: an exact whole number of links between P's ends (pitch stretched to fit) - slings, tie chains
       o.col    base steel colour (one colour; the dark outline and light band are added), o.dark outline colour
       o.firstFace  false: start with an edge link;  o.id / o.op  group id / opacity (a far strand dimmed behind)
     Layers: every edge link's far half is drawn behind the face links and its near half in front (real over/under). */
  function run(P, o = {}) {
    if (!P || P.length < 2) return '';
    const d = o.d || 4, tot = plen(P);
    let pitch = o.pitch || PIN * d;
    if (o.fit) pitch = tot / Math.max(2, Math.round(tot / pitch));
    const col = o.col ? [o.col, o.dark || '#3b4247', '#eef1f3'] : (o.dark ? [STEEL[0], o.dark, STEEL[2]] : STEEL);
    const win = o.win || WIN * d, ff = o.firstFace !== false;
    // anchor 'end': the links are locked to P's end (a load chain to its hook, a slack end to its end stop), so as the
    // path end moves (hook lifts, slack pays out) the links travel with it, link for link
    const ph = o.fit ? 0 : (o.phase || 0) + (o.anchor === 'end' ? tot - 2000 * pitch : 0);
    const j0 = Math.floor((-ph) / pitch) - 1, j1 = Math.ceil((tot - ph) / pitch) + 1;
    let back = '', mid = '', front = '';
    for (let j = j0; j <= j1; j++) {
      const sc = ph + (j + .5) * pitch;                                // link centre along P
      if (sc < (o.fit ? 0 : -pitch * .1) || sc > tot + (o.fit ? 0 : pitch * .1)) continue;
      const A = at(P, sc - pitch / 2).p, B = at(P, sc + pitch / 2).p;  // bearing points (inner crotches) on P
      const ux = B[0] - A[0], uy = B[1] - A[1], ul = Math.hypot(ux, uy) || 1;
      const face = ((j % 2) + 2) % 2 === 0 ? ff : !ff;
      const L = { d, pin: pitch, win, kind: face ? 'F' : 'E', col, c: [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2], u: [ux / ul, uy / ul] };
      const g = link(L); back += g.back; mid += g.mid; front += g.front;
    }
    return `<g${o.id ? ` id="${o.id}"` : ''}${o.op && o.op < 1 ? ` opacity="${o.op}"` : ''}>${back + mid + front}</g>`;
  }
  /* straight chain p0 -> p1 with a whole number of links (old A.chain / KIT.chain call shape) */
  const between = (p0, p1, o = {}) => run([p0, p1], Object.assign({ fit: true }, o));
  /* hanging loop / sag: catenary from A to B for a chain length len (px) - an unsupported hand-chain bight */
  const hang = (A, B, len, N) => catenary(A, B, len, N);
  /* arc over a pocket wheel or sprocket: centre c, pitch radius r, from angle a0 to a1 (radians, screen y down) */
  function wheelArc(c, r, a0, a1, n) {
    n = n || Math.max(6, Math.ceil(Math.abs(a1 - a0) / (Math.PI / 24)));
    return [...Array(n + 1)].map((_, i) => { const a = a0 + (a1 - a0) * i / n; return [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]; });
  }
  /* pitch radius of a pocket wheel with `pockets` pockets for links of this pitch (every link a chord: 2 links a pocket pair) */
  const pocketR = (pitch, pockets) => pitch / (2 * Math.sin(Math.PI / (2 * pockets)));
  return { TW, CS, SN, STEEL, PIN, WIN, stroke, stadium, link, lay, chainLink, half, mapper, railOuter, railCentre, catenary,
    run, between, hang, wheelArc, pocketR };
})();

</script>
<script>/* CrewForge chain fall scene: geared hand chain hoist and differential (Weston) chain block.
   Same contract and style as tackle.js (STYLE.md via KIT). Every number on screen comes from calc().
   Side elevation, K = 6.5 px per inch. Beam W12x40 -> beam clamp -> hoist top hook -> hoist / block -> load chain ->
   bottom hook -> shackle -> steel test weight on cribbing.                                                         */
const CHAINFALL = (() => {
  const { f, C } = KIT;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const CAPTURE = new URLSearchParams(location.search).has('capture');
  const LB_TO_KG = 0.45359237, FT_TO_M = 0.3048, G = 9.80665, LBF_TO_N = 4.4482216, STEEL = 0.2836;

  /* SOURCE DATA. Harrington CB hand chain hoist spec table (catalogue p. 8, opened 2026-11-13):
     [capacity US tons, pull to lift rated load lb, overhaul ratio (ft of hand chain per ft of lift), load chain falls] */
  const CB = [[.5, 48, 25, 1], [1, 58, 43, 1], [1.5, 70, 57, 1], [2, 72, 70, 1], [2.5, 66, 99, 1], [3, 72, 114, 2], [5, 68, 198, 2]];
  const CAPNAME = ['½', '1', '1½', '2', '2½', '3', '5'];
  const COL = { W: '#e9e3d6', P: '#59b7ff', n: C.ACC, fr: '#b48af0', dist: '#7fd6c2' };

  const S = { chain: 'geared', cap: 3, load: 4000, rise: 0, units: 'imp', D: 10, d: 9, eta: .35, cards: true };
  const NUMERIC = ['load', 'rise', 'D', 'd', 'eta'];
  const imp = () => S.units === 'imp';

  /* PHYSICS
     Geared: VR = maker's overhaul ratio. Efficiency at rated load η = rated load ÷ (rated pull × VR).
             P = W ÷ (VR × η) = rated pull × W ÷ rated load (the maker's pull scaled to the load).
     Differential: one turn winds up πD on the large wheel and lets out πd from the small one, so the loop holding
             the lower pulley shortens π(D - d) and the load rises half of that: VR = 2D ÷ (D - d). P = W ÷ (VR × η),
             η a teaching value (default 35 %; under 50 % the block holds the load by itself).
     All: actual MA = W ÷ P, hand chain travel = VR × rise, work in = P × travel, work out = W × rise.            */
  function calc(st = S) {
    const W = st.load, c = { W, imp: st.units === 'imp', chain: st.chain };
    if (st.chain === 'geared') {
      const h = CB[st.cap], Wr = h[0] * 2000;
      c.cap = h[0]; c.capName = CAPNAME[st.cap]; c.falls = h[3]; c.VR = h[2];
      c.eta = Wr / (h[1] * h[2]);
      c.rated = c.imp ? Wr : Wr * LB_TO_KG; c.pullRated = c.imp ? h[1] : h[1] * LB_TO_KG;
      c.P = W / (c.VR * c.eta); c.util = W / c.rated;
      c.level = c.util > 1 ? 'bad' : c.util > .8 ? 'warn' : 'ok';
    } else {
      c.VR = 2 * st.D / (st.D - st.d); c.eta = st.eta; c.P = W / (c.VR * c.eta); c.level = 'info';
      c.holds = st.eta < .5;
    }
    c.Pideal = W / c.VR; c.MAact = W / c.P; c.eff = c.MAact / c.VR;
    c.rise = st.rise; c.travel = c.VR * st.rise;
    const wk = c.imp ? 1 : G;
    c.workOut = W * st.rise * wk; c.workIn = c.P * c.travel * wk; c.lost = c.workIn - c.workOut;
    c.kN = c.imp ? c.P * LBF_TO_N / 1000 : c.P * G / 1000;
    return c;
  }

  // ------------------------------------------------------------------ geometry
  const K = 6.5, FLOOR = 800, CRIB = 5.5 * K, X = 600;
  const BEAM_TOP = 10, BEAM_D = 9.73 * K, Y_BB = BEAM_TOP + BEAM_D, Y_PIN = Y_BB + 6 * K, HK = .55 * K;
  const Y_SAD = Y_PIN + .5 * K, Y_BODY = Y_SAD + 8.62 * HK + 1 * K;
  const loadLb = () => imp() ? S.load : S.load / LB_TO_KG;
  const sidePx = () => Math.cbrt(Math.max(200, loadLb()) / STEEL) * K;
  const ruPx = () => imp() ? 12 * K : 12 * K / FT_TO_M;
  const BOTHOOK = 8.62 * .7 * K, SHK_DROP = (0.75 * 1.2 / 2 + 2.38 * 1.2) * K, LUG = 2 * K;
  const hookSad0 = () => FLOOR - CRIB - sidePx() - LUG - SHK_DROP;
  const bodyBottom = () => S.chain === 'geared' ? Y_BODY + 12.5 * K : Y_BODY + 15 * K;
  const riseMax = () => Math.max(0, Math.min(imp() ? 3 : 0.9, (hookSad0() - BOTHOOK - (S.chain === 'geared' ? 1 : 7) * K - bodyBottom() - 3 * K) / ruPx()));
  const nf = (v, d = 0) => (Math.round(v * Math.pow(10, d)) / Math.pow(10, d)).toLocaleString('en-CA', { minimumFractionDigits: d, maximumFractionDigits: d });
  const wt = v => nf(Math.round(v)) + ' ' + (imp() ? 'lb' : 'kg');
  const ln = (v, d = 2) => nf(v, d) + (imp() ? ' ft' : ' m');

  let T = 0, tweens = [], callouts = [], svgEl = null, coLayer = null, opts = {}, lastC = null;
  const A = { D: 0, last: null, key: '', sw: 0, swv: 0 };

  /* chain: the shared chain drawing (simulators/_lesson/chaindraw.js, CHD.run): interlocking face-on rings and edge-on
     bars; pitch = inside link length. phase (px, + = toward the end of P) runs the links along the path, pitch-locked,
     so a running chain visibly runs. */
  function chain(P, d, pitch, phase, o = {}) {
    return CHD.run(P, { d, pitch, phase, col: o.col, dark: o.dark, id: o.id, op: o.op });
  }

  function beamAndClamp() {
    // W10x33 (AISC: d 9.73, tf 0.435, tw 0.29 in) and a screw-adjusted beam clamp: the shared steel drawings
    let s = window.CFSteel.ibeamSide(-10, 1610, BEAM_TOP, { d: 9.73, tf: .435, tw: .29 }, K, { stiff: [120, 380, 900, 1160, 1420] });
    s += window.CFSteel.clampSide(X, Y_BB, .435 * K, K, { pinY: Y_PIN, spin: 0, cap: CAPNAME[S.cap] + ' t', id: 'anchor' });
    s += `<g transform="rotate(180 ${X} ${f(Y_SAD)})">${KIT.hookProfile(X, Y_SAD, HK, { id: 'top-hook', flip: true })}</g>`;
    return s;
  }

  function loadStack(cx, sad) {
    const side = sidePx(), top = sad + SHK_DROP + LUG;
    let s = KIT.hookProfile(cx, sad, .7 * K, { id: 'hook' });
    const sh = KIT.shackleFace(cx, top - LUG, K, true, .75);
    s += `<g id="shackle">${sh.back}</g>`;
    s += `<g id="load-box"><rect x="${f(cx - side / 2)}" y="${f(top)}" width="${f(side)}" height="${f(side)}" rx="3" fill="url(#gWeight)" stroke="#23282c" stroke-width="2"/>`;
    s += `<rect x="${f(cx - .5 * K)}" y="${f(top - 3.6 * K)}" width="${f(K)}" height="${f(3.8 * K)}" fill="#6e7882" stroke="#23282c"/>`;
    const fs = clamp(side * .2, 12, 30);
    s += `<text x="${f(cx - side / 2 + 8)}" y="${f(top + fs + 6)}" style="font:800 ${f(KIT.PH.v > 1 ? Math.max(28, fs * .7) : fs * .7)}px ${KIT.FONT};fill:#efe9dc">${nf(S.load)} ${imp() ? 'lb' : 'kg'}</text></g>`;
    s += `<g>${sh.front}</g>`;
    s += KIT.contactShadow(cx, FLOOR + 4, side * 1.2, 16, clamp(1 - (FLOOR - CRIB - side - top) / 300, .25, 1));
    const cw = 5.5 * K;
    for (const dx of [-side * .32, side * .32]) s += KIT.timberEnd(cx + dx - cw / 2, FLOOR - CRIB, cw, CRIB, 'c' + Math.round(dx));
    return s;
  }

  // ---------------------------------------------------------------- geared hand chain hoist
  function geared(c) {
    const by = Y_BODY, bw = 10 * K, bh = 12.5 * K, rp = S.rise * ruPx();
    const sad = hookSad0() - rp, chainTop = by + bh;
    const vis = Math.min(c.VR, 20);                          // hand chain drawn at up to 20 × the load speed (true ratio in the numbers)
    const wR = 4.6 * K, wx = X + wR + 6 * K, wy = by + bh * .42;
    let s = '';
    // hand chain loop: off the hand wheel on both sides, hanging in a bight (the far strand dimmed: it runs behind)
    const loopBot = FLOOR - 110;
    const sw = A.sw;   // the hand chain loop swings like a pendulum when you start and stop pulling
    const handChain = chain([[wx - wR, wy], [wx - wR + sw * .55, loopBot - 20], [wx - wR * .6 + sw, loopBot - 2], [wx + sw, loopBot + 6], [wx + wR * .6 + sw, loopBot - 2], [wx + wR + sw * .55, loopBot - 20], [wx + wR, wy]], .32 * K * 1.1, .9 * K, -A.D * vis, { id: 'hand-chain', col: '#8f989f' });
    // body: side plates, gear cover (right) and hand wheel cover cut away to show the wheel and the first gear pair
    s += `<g id="hoist-body"><rect x="${f(X - bw / 2)}" y="${f(by)}" width="${f(bw)}" height="${f(bh)}" rx="${f(2 * K)}" fill="url(#gPaintSide)" stroke="#23282c" stroke-width="2"/>`;
    s += `<rect x="${f(X - bw / 2 + 4)}" y="${f(by + 4)}" width="${f(bw - 8)}" height="${f(2 * K)}" rx="4" fill="#9aa4ad" opacity=".3"/>`;
    s += `<text x="${X}" y="${f(by + bh * .78)}" text-anchor="middle" style="font:800 ${f(1.9 * K * (KIT.PH.v > 1 ? 2.2 : 1))}px ${KIT.FONT};fill:#e9e3d6">${c.capName} t</text></g>`;
    // hand wheel (cut-away cover outline dashed), pockets turn with the hand chain
    const ang = -A.D * vis / wR;
    s += `<g id="hand-wheel"><circle cx="${f(wx)}" cy="${f(wy)}" r="${f(wR + 1.5 * K)}" fill="#3a4148" stroke="#23282c" stroke-width="2" stroke-dasharray="7 5"/>`;
    s += `<circle cx="${f(wx)}" cy="${f(wy)}" r="${f(wR)}" fill="url(#gSheave)" stroke="#2b3136" stroke-width="1.6"/>`;
    for (let i = 0; i < 10; i++) { const a = ang + i * Math.PI / 5; s += `<circle cx="${f(wx + Math.cos(a) * wR * .86)}" cy="${f(wy + Math.sin(a) * wR * .86)}" r="${f(.45 * K)}" fill="#2b3136"/>`; }
    for (let i = 0; i < 5; i++) { const a = ang + i * Math.PI * 2 / 5; s += `<line x1="${f(wx)}" y1="${f(wy)}" x2="${f(wx + Math.cos(a) * wR * .65)}" y2="${f(wy + Math.sin(a) * wR * .65)}" stroke="#59626a" stroke-width="${f(.5 * K)}"/>`; }
    s += `<circle cx="${f(wx)}" cy="${f(wy)}" r="${f(.8 * K)}" fill="#c9ced2" stroke="#23282c"/></g>`;
    // gears (inside the body, cut away): pinion on the hand wheel shaft drives a large gear at a fraction of the speed
    const gx = X - bw * .12, gy = by + bh * .42, gR = 2.6 * K, pR = 1.0 * K;

  function gear(x, y, r, teeth, ang) {

    s += `<rect x="${f(pX - .9 * K)}" y="${f(pulY + pR - 2)}" width="${f(1.8 * K)}" height="${f(1.2 * K + 4)}" fill="#59626a" stroke="#23282c"/>`;

    s += `<g id="dim-d">${KIT.label(ax - R1 - 150, ay + R1 + 40, 'd = ' + nf(S.d, dg) + u, [ax - R2 * .7, ay + R2 * .7], { anchor: 'end', sub: 'small pocket wheel (dashed)' })}</g>`;

      coLayer.appendChild(ring);

      const lw = lb.offsetWidth, lh = lb.offsetHeight, cx = r.left - lr.left, cy = r.top - lr.top, pad = 24;

<script>/* Block and tackle simulator-lesson: scene adapters for the shared page shell (simulators/_lesson/shell.js).
   The TACKLE and CHAINFALL scenes (tackle.js, chainfall.js) keep their own state, drawing, motion and failure, exactly
   as on the free simulator / ?capture=1 video pages (index.html, chainfall.html). Here they are mounted in "external"
   mode (no clock or window.sim of their own) inside a nested <svg> in the shell's stage; the shell owns the lesson
   state and the clock and this adapter keeps the two in step:
     shell state -> scene.set(diff) in apply(); scene state (drag, reeve tap, clamping, units) -> shell in advance().
   calc() is the scene's calc(): every number on the page comes from it.
   window.BT_SCENE ('tackle' | 'chainfall') picks the scene; window.PAGE_SCENE is what the shell runs. */
(function () {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const pick = (rng, a) => a[Math.floor(rng() * a.length)];

function base(M, keys) {

  A.mountSvg = (svg, api) => {
    A.api = api;
    A.inner = document.createElementNS(NS, 'svg');
    for (const [k, v] of Object.entries({ x: 0, y: 0, width: 1600, height: 880, viewBox: '0 0 1600 880', overflow: 'visible', id: 'bt-scene' })) A.inner.setAttribute(k, v);
    svg.insertBefore(A.inner, svg.firstChild);

  A.pull = st => { for (const k of keys) if (k in M.S && st[k] !== M.S[k]) st[k] = M.S[k]; };    // the scene clamps / converts / drags
  A.spot = id => {

  };

     centred on cx; it shows top..bottom when that fits, else the top part (anchor and blocks), or the floor while the
     rig is falling */

    y0 = Math.max(Math.min(y0, 880 - Math.min(h, 880)), h > 880 ? (880 - h) / 2 : 0);

  };
