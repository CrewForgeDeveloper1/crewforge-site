<script>(function () {

<script>/* Lesson code (text, steps and questions: <id>.json): Chain hoists, lever hoists and come-alongs (episode 010). RSOS B-10.
 * Numbers: Harrington CB catalogue p.8 (pull at rated, overhaul ratio, chain, falls), Harrington LB (lever pull, handle),

(function () {

const pick = (rng, a) => a[Math.floor(rng() * a.length)];

/* shuffle-free choice helper: the correct answer and three common mistakes */
const ch = (t, why) => ({ t, why });

window.LESSON_CODE = window.LESSON_CODE || {};
window.LESSON_CODE['chain-hoists'] = {
  /* ---------------- page 1: Pull the hand chain */
  1: {
    readouts: (S, o) => [S.htype === 'lever' ? ['Handle pull', lb(o.pull, S)] : ['Hand chain pulled', ft(o.run, S)], ['Hook rise', S.units === 'met' ? K.n0(S.lift * 304.8) + ' mm' : K.n1(S.lift * 12) + ' in'], ['Your pull', lb(S.htype === 'lever' ? o.hand : o.pull, S), K.C.acc], ['Load ÷ rated', pct(o.util), statusCol(o)]],
    challenge: (rng) => {
      const cap = pick(rng, [.5, 1, 1.5, 2, 3]), [p, r] = CB[cap], lift = pick(rng, [1, 1.5, 2, 3]), ans = lift * r;
      return { setup: { cap, load: cap * 1000, lift: 0, slip: 0 }, q: `This ${tons(cap)} ton hoist has an overhaul ratio of ${r}. How much hand chain lifts the load **${lift} ft**?`,
        choices: [ch(K.n1(ans) + ' ft'), ch(K.n1(r) + ' ft', 'That is one foot.'), ch(K.n1(r / lift) + ' ft', 'You divided.'), ch(K.n1(lift * p) + ' ft', 'You used the pull in pounds.')], answer: 0,
        explain: `${lift} × ${r} = ${K.n1(ans)} ft. Lift it in the simulator to check.` };
    },
    fns: {
      p1s2_goal: S => S.lift >= .25,
      p1s2_live: (S, o) => `Pulled **${ft(o.run, S)}** of hand chain · hook up **${K.n1(S.lift * 12)} in**`,
      p1s2_ok: (S, o) => `About **${K.n1(o.run)} ft** of hand chain for **3 in** of lift. That is the overhaul ratio at work: **${o.ratio} ft of chain for every foot** the hook goes up.`

  /* ---------------- page 2: Pull follows the load */

    challenge: (rng) => {
      const cap = pick(rng, [.5, 1, 1.5, 2]), p = CB[cap][0], rated = cap * 2000, load = Math.round(rated * pick(rng, [.4, .5, .6, .75, .8]) / 100) * 100, ans = load / rated * p;
      return { setup: { cap, load, lift: 0, slip: 0, clutch: true }, q: `${tons(cap)} ton hoist, ${p} lb of pull at rated (${K.n0(rated)} lb). How hard do you pull for **${K.n0(load)} lb**?`,
        choices: [ch(K.n0(ans) + ' lb'), ch(p + ' lb', 'That is at rated.'), ch(K.n0(p * rated / load) + ' lb', 'Upside down.'), ch(K.n0(load / p) + ' lb', 'Divide the load by rated, then multiply by the pull.')], answer: 0,
        explain: `${K.n0(load)} ÷ ${K.n0(rated)} × ${p} = ${K.n1(ans)} lb.` };
    },
    fns: {
      p2s1_goal: S => Math.abs(S.load - 1000) < 1,
      p2s1_live: (S, o) => `${lb(S.load, S)} × 58 ÷ 2,000 = **${lb(o.pull, S)}**`,
      p2s4_goal: (S, o) => o.fail.on && o.fail.landed
    }
  },
  /* ---------------- page 3: Lever hoists and cheater bars */
  3: {
    readouts: (S, o) => [['Load', lb(S.load, S)], ['Handle pull', lb(o.pull, S)], ['At your hand', lb(o.hand, S), o.stall ? K.C.bad : K.C.acc], ['Load ÷ rated', pct(o.util), statusCol(o)]],
    challenge: (rng) => {

      return { setup: { cap: 1, load: Math.round(T / 100) * 100, cheater: true, reach }, q: `1 ton lever hoist (72 lb at 2,000 lb, 9.6 in handle). A ${reach} in pipe, ${hand} lb at its end. About what load?`,
        choices: [ch(K.n0(Math.round(T / 100) * 100) + ' lb'), ch('2,000 lb', 'That is the rating.'), ch(K.n0(hand / 72 * 2000) + ' lb', 'You forgot the pipe.'), ch(K.n0(hand * reach / handle) + ' lb', 'That is the handle force.')], answer: 0,
        explain: `${hand} × ${reach} ÷ 9.6 = ${K.n0(hand * reach / handle)} lb on the handle; ÷ 72 × 2,000 ≈ ${K.n0(T)} lb.` };
    },
    fns: {
      p3s1_goal: S => S.lift >= .25,
      p3s1_live: (S, o) => `Handle pull **${lb(o.pull, S)}** (1,500 ÷ 2,000 × 72)`,
      p3s2_goal: (S, o) => S.pulling && o.stall === 'person',
      p3s3_goal: (S, o) => o.fail.on && o.fail.landed,
      p3s3_live: (S, o) => `At the hand: ${lb(o.pull, S)} × 9.6 ÷ 48 = **${lb(o.hand, S)}** · ${K.n1(o.leverage)}× the leverage`

  /* ---------------- page 4: Check it before you lift */
  4: {

      return { setup: { throat: Math.round((now / 34 - 1) * 1000) / 10 }, q: `1 ton hook, **34 mm** new, maker\'s limit 5 %. It reads **${now} mm**. Keep or remove?`,
        choices: [ch(ok ? 'Keep' : 'Remove'), ch(ok ? 'Remove' : 'Keep', ok ? 'It is within 35.7 mm.' : 'Over 35.7 mm.')], answer: 0, explain: `Limit 34 × 1.05 = 35.7 mm. ${now} mm is ${ok ? 'within' : 'over'}.` };
    },

  /* ---------------- page 5: Putting it together */
  5: {
    readouts: (S, o) => [['Load', lb(S.load, S)], ['Hoist rated', lb(o.rated, S), o.util > 1 ? K.C.bad : K.C.ok], ['Your pull', lb(o.pull, S), o.stall ? K.C.bad : K.C.acc], ['Hand chain', ft(o.run, S)]],
    challenge: (rng) => {
      const load = pick(rng, [800, 1400, 1800, 2600, 3500, 5200]), caps = [.5, 1, 1.5, 2, 3, 5], cap = caps.find(c => c * 2000 >= load);

    },
    fns: {
      p5s1_goal: S => S.cap === 1.5,
      p5s2_goal: S => S.lift >= 2 - 1e-6,
      p5s2_ok: (S, o) => `**${K.n0(o.pull)} lb** of pull and **${K.n0(o.handChain)} ft** of hand chain.`

<script>/* CrewForge simulator-lesson page shell (2026-11-13, docs/LESSON_DESIGN.md). One page = one idea.
   Runs a page scene (CFShell.start(content, scene)) inside the approved layout:
   top bar (Back, lesson + page n of N, progress dots, voice mute + speed, Next: nothing locks) -> "What you're looking
   at" (fixed per page) -> simulator + readouts -> step box (fixed per step: instruction, Hint, Show me) -> control tray
   (only this step's controls). Steps: teach -> do -> predict -> fail -> question; then free play (everything unlocked,
   Reset, "Give me a challenge"). Questions are practice: a wrong pick gets a red outline and the explanation of that
   mistake, then "Try a new question" serves a different variant until one is right. Moodle "done" = the learner reached
   the last page (the SCORM host page, tools/lesson_pages.py, records it).

   Scene interface (one per page):
     defaults {}, controls {key: {type:'slider'|'chips'|'hold'|'custom', label, ...}} (below),
     mount(svg, api), apply(state, prev, initial), advance(ms, state), calc(state) -> out,
     readouts(state, out) -> [{label, short, value, cls:'ok'|'warn'|'bad', color, id}],
     caption(state, out) -> null | {kind:'fail'|'warn', title, text}, spot(id) -> [x, y, r] (svg units),
     drag (optional, wired by the scene; it calls api.input(partial)), challenge(rng, n) -> question, busy() -> bool,
     phoneViewBox, viewBox, reset().
     Optional generic hooks (added 2026-11-13 for the hoisting and block-and-tackle ports):
       instant: [keys]            never tweened by sim.set(partial, ms) (e.g. a hoist size that rebuilds the rig)
       onSet(state, keys)         after every sim.set / learner input (not on tween frames): rebuild what those keys need
       normalize(state)           after any change, before calc()
