<script>/* CrewForge illustration kit (JS). A straight port of the approved concept code
   docs/concepts/hitches/src/lib.py, rigging.py and oblique.py (STYLE.md): plain functions that return SVG strings,
   so a simulator can redraw a part every frame in exactly the approved style.
   Units: screen px in a 1600 x 880 viewBox; each scene picks ONE scale k (px per inch). Light from the top-left.
   Outlines darker than the fill. CrewForge orange only for the thing to look at. */
(function (root) {
'use strict';
const A = {};
A.W = 1600; A.H = 880; A.FLOOR = 800;
A.FONT = "Inter,-apple-system,'Segoe UI',Roboto,Arial,sans-serif";
A.TEXT = '#F5F5F4'; A.MUTED = '#b9b4ab'; A.ACC = '#F08A2B'; A.OK = '#3ddc84'; A.WARN = '#F2C230'; A.BAD = '#ff5a4f';
const STEEL_D = '#3b4247', ROPE_D = '#454c51', ROPE_M = '#aab3b9', ROPE_V = '#6a737a', TIMBER_D = '#5e4426';
A.STEEL_D = STEEL_D; A.ROPE_M = ROPE_M; A.ROPE_D = ROPE_D;

/* ------------------------------------------------------------------ geometry */
const f = v => { const r = Math.round(v * 10) / 10; return Object.is(r, -0) ? '0' : String(r); };
A.f = f;
A.pathd = (P, closed) => P.length ? 'M' + P.map(p => f(p[0]) + ' ' + f(p[1])).join(' L') + (closed ? 'Z' : '') : '';
A.catmull = function (P, n = 8, closed = false) {
  const out = [], m = P.length, cnt = closed ? m : m - 1;
  for (let i = 0; i < cnt; i++) {
    const p0 = P[(closed || i > 0) ? (i - 1 + m) % m : i], p1 = P[i], p2 = P[(i + 1) % m];
    const p3 = (closed || i + 2 < m) ? P[(i + 2) % m] : P[(i + 1) % m];
    for (let j = 0; j < n; j++) {
      const t = j / n, t2 = t * t, t3 = t2 * t;
      const c = k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      out.push([c(0), c(1)]);
    }
  }
  if (!closed) out.push(P[m - 1]);
  return out;
};
/* points on a circle; angles in degrees, screen coords (0 = +x, 90 = DOWN) */
A.arcPts = (cx, cy, r, a0, a1, n = 24) => { const o = []; for (let i = 0; i <= n; i++) { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; o.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } return o; };
A.resample = function (P, step) {
  const out = [P[0]]; let acc = 0;
  for (let i = 0; i + 1 < P.length; i++) {
    const [x0, y0] = P[i], [x1, y1] = P[i + 1], seg = Math.hypot(x1 - x0, y1 - y0);
    if (!seg) continue;
    let t = step - acc;
    while (t <= seg) { out.push([x0 + (x1 - x0) * t / seg, y0 + (y1 - y0) * t / seg]); t += step; }
    acc = seg - (t - step);
  }
  const last = P[P.length - 1], l2 = out[out.length - 1];
  if (Math.hypot(last[0] - l2[0], last[1] - l2[1]) > step * 0.3) out.push(last);
  return out;
};
A.normals = P => P.map((_, i) => { const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [-dy / L, dx / L]; });
A.offset = (P, d) => { const N = A.normals(P); return P.map((p, i) => [p[0] + N[i][0] * d, p[1] + N[i][1] * d]); };
/* shift toward the light (top-left) along each normal: where the highlight runs on a round part */
A.litOffset = (P, amt) => { const N = A.normals(P); return P.map((p, i) => { const s = N[i][0] * -0.7071 + N[i][1] * -0.7071; return [p[0] + N[i][0] * s * amt, p[1] + N[i][1] * s * amt]; }); };
A.len = P => { let L = 0; for (let i = 1; i < P.length; i++) L += Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); return L; };
A.unit = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1; return [[dx / L, dy / L], L]; };

/* A flexible member of length L between a and b: straight when taut, otherwise a smooth sag/bow that keeps its
   length (a slack sling hangs in a loop). side: +1 / -1 picks which way it bows. Returns points. */
A.slack = function (a, b, L, side = 1, n = 28) {
  const [[ux, uy], d] = A.unit(a, b);
  if (d >= L * 0.999) return [a, b];
  // bow amplitude so the arc length of a half-sine ~ L:  L ~ d * (1 + (pi*h/2d)^2 ... ) solved by bisection
  let lo = 0, hi = L, h = 0;
  const arclen = hh => { let s = 0, px = 0, py = 0; for (let i = 1; i <= 40; i++) { const t = i / 40, x = d * t, y = hh * Math.sin(Math.PI * t); s += Math.hypot(x - px, y - py); px = x; py = y; } return s; };
  for (let k = 0; k < 40; k++) { h = (lo + hi) / 2; if (arclen(h) < L) lo = h; else hi = h; }
  // gravity: bias the bow downward (screen +y) like a sagging rope
  let nx = -uy * side, ny = ux * side;
  if (ny < 0 && Math.abs(uy) < 0.7) { nx = -nx; ny = -ny; }
  const out = [];
  for (let i = 0; i <= n; i++) { const t = i / n, s = Math.sin(Math.PI * t) * h; out.push([a[0] + ux * d * t + nx * s, a[1] + uy * d * t + ny * s]); }
  return out;
};

/* ------------------------------------------------------------------ scene */
A.backdrop = (floor = A.FLOOR) => `<rect x="-400" y="-400" width="${A.W + 800}" height="${floor + 400}" fill="url(#gWall)"/>` +
  `<rect x="-400" y="${floor}" width="${A.W + 800}" height="${A.H - floor + 400}" fill="url(#gFloor)"/>` +
  `<line x1="-400" y1="${floor}" x2="${A.W + 400}" y2="${floor}" stroke="#5a544c" stroke-width="2.5"/>`;
A.contactShadow = (cx, y, w, h = 14, op = 1) => `<ellipse cx="${f(cx)}" cy="${f(y)}" rx="${f(w / 2)}" ry="${f(h / 2)}" fill="url(#gShadow)" opacity="${op}"/>`;

/* ------------------------------------------------------------------ materials */
A.roundBar = function (P, d, body = '#8d969d', dark = STEEL_D, hi = '#e8ecef', cap = 'round', hiOp = 0.85) {
  const p = A.pathd(P);
  return `<path d="${p}" fill="none" stroke="${dark}" stroke-width="${f(d + 1.6)}" stroke-linecap="${cap}" stroke-linejoin="round"/>` +
    `<path d="${p}" fill="none" stroke="${body}" stroke-width="${f(d)}" stroke-linecap="${cap}" stroke-linejoin="round"/>` +
    `<path d="${A.pathd(A.litOffset(P, d * 0.24))}" fill="none" stroke="${hi}" stroke-width="${f(Math.max(0.8, d * 0.2))}" stroke-linecap="round" stroke-linejoin="round" opacity="${hiOp}"/>`;
};
/* Wire rope: steel body + strand valleys (right regular lay: '/' on a hanging rope, a strand crosses the face in
   about 2 d, valleys about 1.1 d apart). */
A.wireRope = function (P, d, lay = 1) {
  if (P.length < 2) return '';
  const D = A.resample(P, Math.max(0.6, d / 6));
  let s = A.roundBar(D, d, ROPE_M, ROPE_D, '#e9edf0', 'butt', 0.7);
  if (d < 2.2 || D.length < 2) return s;
  const pitch = 1.08 * d, adv = 2.0 * d, L = [0];
  for (let i = 1; i < D.length; i++) L.push(L[i - 1] + Math.hypot(D[i][0] - D[i - 1][0], D[i][1] - D[i - 1][1]));
  const N = A.normals(D), tot = L[L.length - 1];
  let j = 0;
  const at = sv => { sv = Math.max(0, Math.min(tot, sv)); while (j > 0 && L[j] > sv) j--; while (j < L.length - 2 && L[j + 1] < sv) j++; const t = (sv - L[j]) / ((L[j + 1] - L[j]) || 1); return [D[j][0] + (D[j + 1][0] - D[j][0]) * t, D[j][1] + (D[j + 1][1] - D[j][1]) * t, N[j]]; };
  let v = '';
  for (let sv = -adv; sv < tot; sv += pitch) {
    const seg = [];
    for (let q = 0; q < 5; q++) { const qq = sv + adv * q / 4; if (qq >= 0 && qq <= tot) { const [x, y, n] = at(qq), o = (-0.5 + q / 4) * d * 0.86 * lay; seg.push([x + n[0] * o, y + n[1] * o]); } }
    if (seg.length > 1) v += A.pathd(seg) + ' ';
  }
  return s + `<path d="${v}" fill="none" stroke="${ROPE_V}" stroke-width="${f(Math.max(0.7, d * 0.13))}" stroke-linecap="round" opacity=".9"/>`;
};
/* mechanical splice sleeve centred at p, axis u (unit), rope d px, length px */
A.sleeve = function (p, u, d, length) {
  const [x, y] = p, [ux, uy] = u, a = [x - ux * length / 2, y - uy * length / 2], b = [x + ux * length / 2, y + uy * length / 2];
  const od = 2.1 * d, nx = -uy, ny = ux;
  const poly = [[a[0] + nx * od * .42, a[1] + ny * od * .42], [a[0] + ux * od * .25 + nx * od * .5, a[1] + uy * od * .25 + ny * od * .5],
    [b[0] - ux * od * .25 + nx * od * .5, b[1] - uy * od * .25 + ny * od * .5], [b[0] + nx * od * .42, b[1] + ny * od * .42],
    [b[0] - nx * od * .42, b[1] - ny * od * .42], [b[0] - ux * od * .25 - nx * od * .5, b[1] - uy * od * .25 - ny * od * .5],
    [a[0] + ux * od * .25 - nx * od * .5, a[1] + uy * od * .25 - ny * od * .5], [a[0] - nx * od * .42, a[1] - ny * od * .42]];
  let s = `<path d="${A.pathd(poly, true)}" fill="#a3abb1" stroke="${STEEL_D}" stroke-width="1.4" stroke-linejoin="round"/>`;
  s += `<path d="${A.pathd(A.litOffset([a, b], od * .3))}" stroke="#e6eaed" stroke-width="${f(od * .16)}" stroke-linecap="round" opacity=".8"/>`;
  for (const t of [0.33, 0.66]) { const cx = a[0] + (b[0] - a[0]) * t, cy = a[1] + (b[1] - a[1]) * t; s += `<line x1="${f(cx + nx * od * .45)}" y1="${f(cy + ny * od * .45)}" x2="${f(cx - nx * od * .45)}" y2="${f(cy - ny * od * .45)}" stroke="#6c757b" stroke-width="1"/>`; }
  return s;
};
/* roundsling: round tube coloured by capacity (WSTDA colour code), faint cover wrinkles */
A.roundsling = function (P, d, col = ['#6c3fa6', '#2a1745', '#c3a6ee', '#4b2a78']) {
  return A.roundBar(P, d, col[0], col[1], col[2], 'round', .8) +
    `<path d="${A.pathd(P)}" fill="none" stroke="${col[3]}" stroke-width="${f(d * .8)}" stroke-dasharray="1.6 ${f(d * .9)}" opacity=".55"/>`;
};
/* alloy chain p0 -> p1 (px): links alternate face-on (oval) and edge-on (bar); pitch = inside length (px) */
A.chain = function (p0, p1, k, stock = 0.39, pitchIn = 1.19, firstFace = true) {
  const [[ux, uy], L] = A.unit(p0, p1), n = Math.max(2, Math.round(L / (pitchIn * k))), pitch = L / n;
  const ang = Math.atan2(uy, ux) * 180 / Math.PI, dk = stock * k;
  let s = '';
  for (let i = 0; i < n; i++) {
    const c = [p0[0] + ux * pitch * (i + .5), p0[1] + uy * pitch * (i + .5)], face = (i % 2 === 0) === firstFace;
    const lo = pitch + 2 * dk, tr = `transform="rotate(${f(ang)} ${f(c[0])} ${f(c[1])})"`;
    if (face) {
      const w = (0.53 * k + 2 * dk);
      s += `<rect x="${f(c[0] - lo / 2)}" y="${f(c[1] - w / 2)}" width="${f(lo)}" height="${f(w)}" rx="${f(w / 2)}" fill="none" stroke="${STEEL_D}" stroke-width="${f(dk + 1.4)}" ${tr}/>`;
      s += `<rect x="${f(c[0] - lo / 2)}" y="${f(c[1] - w / 2)}" width="${f(lo)}" height="${f(w)}" rx="${f(w / 2)}" fill="none" stroke="#aeb6bc" stroke-width="${f(dk)}" ${tr}/>`;
      s += `<rect x="${f(c[0] - lo / 2 + 2)}" y="${f(c[1] - w / 2 - dk * .2)}" width="${f(lo - 4)}" height="${f(w)}" rx="${f(w / 2)}" fill="none" stroke="#eef1f3" stroke-width="${f(dk * .25)}" opacity=".6" ${tr}/>`;
    } else s += `<rect x="${f(c[0] - lo / 2)}" y="${f(c[1] - dk / 2)}" width="${f(lo)}" height="${f(dk)}" rx="${f(dk / 2)}" fill="#8e979e" stroke="${STEEL_D}" stroke-width="1.2" ${tr}/>`;
  }
  return s;
};
/* chain along any polyline (slack chain hangs in a curve): links placed along the path */
A.chainPath = function (P, k, stock = 0.39, pitchIn = 1.19) {
  const D = A.resample(P, pitchIn * k);
  let s = '';
  for (let i = 0; i + 1 < D.length; i++) s += A.chain(D[i], D[i + 1], k, stock, pitchIn, i % 2 === 0).replace(/^/, '');
  return s;
};
A.timberEnd = function (x, y, w, h) {
  const cx = x + w * 0.78, cy = y + h * 1.15, id = 'tc' + Math.round(x) + '_' + Math.round(y);
  let s = `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2" fill="#a77c4c" stroke="${TIMBER_D}" stroke-width="1.6"/>`;
  s += `<clipPath id="${id}"><rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"/></clipPath><g clip-path="url(#${id})">`;
  for (let i = 1; i < 9; i++) s += `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(i * Math.max(w, h) * 0.17)}" fill="none" stroke="#7d5b35" stroke-width="1" opacity=".55"/>`;
  s += `<line x1="${f(x + w * .3)}" y1="${f(y + h * .12)}" x2="${f(x + w * .42)}" y2="${f(y + h * .45)}" stroke="#4a3420" stroke-width="1.3" opacity=".7"/>`;
  return s + `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h * .18)}" fill="#ffffff" opacity=".08"/></g>`;
};
A.timberSide = function (x, y, w, h, seed = 1) {
  let s = `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="2" fill="url(#gTimber)" stroke="${TIMBER_D}" stroke-width="1.6"/>`;
  const n = Math.max(2, Math.floor(h / 7));
  for (let i = 1; i < n; i++) { const yy = y + h * i / n, wob = 1.6 * Math.sin(i * 1.7 + seed); s += `<path d="M${f(x + 4)} ${f(yy)} C${f(x + w * .3)} ${f(yy + wob)} ${f(x + w * .6)} ${f(yy - wob)} ${f(x + w - 4)} ${f(yy + wob * .5)}" stroke="#6e5131" stroke-width=".9" fill="none" opacity=".55"/>`; }
  return s + `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(Math.min(4, h * .15))}" fill="#fff" opacity=".1"/>`;
};

/* ------------------------------------------------------------------ hook (Crosby S-319N, code J; Kito Crosby 2026-27 p. 91)
   L 10.43 overall, D 6.27, X 1.41 shank, G 1.81 under the saddle, P 4.57 tip, J 1.78 throat. Origin = bottom of the
   hook on the shank axis, y negative = up. The saddle (bowl bottom) is on the shank axis, so the load hangs plumb. */
const HOOK_OUT = [[-0.705, -6.59], [-1.25, -6.05], [-2.3, -5.2], [-3.15, -4.1], [-3.5, -2.8], [-3.3, -1.5], [-2.6, -0.55],
  [-1.4, -0.05], [0, 0], [1.35, -0.25], [2.3, -1.0], [2.72, -2.1], [2.75, -3.1], [2.6, -3.95], [2.38, -4.5]];
const HOOK_TIP = [2.08, -4.82], HOOK_RI = 1.6, HOOK_CY = -3.41;
A.HOOK_SADDLE = -1.81;
A.hookContour = function () {
  let out = A.catmull(HOOK_OUT, 6);
  out = out.concat([HOOK_TIP, [1.8, -4.5], [1.64, -4.0]]);
  for (let a = 0; a <= 180; a += 9) out.push([HOOK_RI * Math.cos(a * Math.PI / 180), HOOK_CY + HOOK_RI * Math.sin(a * Math.PI / 180)]);
  out = out.concat(A.catmull([[-1.6, -3.41], [-1.5, -4.25], [-1.05, -4.95], [-0.3, -5.45], [0.45, -5.78], [0.705, -6.15]], 5).slice(1));
  return [[-0.705, -10.43]].concat(out, [[0.705, -10.43]]);
};
/* hook in profile; saddle at (x, ysad); latch: true | 'open' (tied back) | false */
A.hookProfile = function (x, ysad, k, latch = true, eid = 'hook') {
  const T = p => [x + p[0] * k, ysad + (p[1] - A.HOOK_SADDLE) * k];
  let s = `<g${eid ? ` id="${eid}"` : ''}><path d="${A.pathd(A.hookContour().map(T), true)}" fill="url(#gForge)" stroke="#1c2023" stroke-width="1.8" stroke-linejoin="round"/>`;
  const back = A.catmull([[-0.45, -7.4], [-0.9, -6.0], [-2.0, -5.0], [-2.85, -3.9], [-3.05, -2.7], [-2.75, -1.55], [-1.9, -0.6]], 6).map(T);
  s += `<path d="${A.pathd(back)}" fill="none" stroke="#c3cad0" stroke-width="${f(k * .32)}" stroke-linecap="round" opacity=".55"/>`;
  s += `<path d="${A.pathd([T([-0.32, -10.3]), T([-0.32, -6.9])])}" stroke="#d3d9de" stroke-width="${f(k * .3)}" stroke-linecap="round" opacity=".6"/>`;
  const rim = []; for (let a = 150; a > 30; a -= 10) rim.push(T([HOOK_RI * 1.08 * Math.cos(a * Math.PI / 180), HOOK_CY + HOOK_RI * 1.08 * Math.sin(a * Math.PI / 180)]));
  s += `<path d="${A.pathd(rim)}" fill="none" stroke="#9aa3aa" stroke-width="${f(k * .12)}" opacity=".5"/>`;
  for (const p of [[0.95, -5.55], [1.95, -4.15]]) { const q = T(p); s += `<circle cx="${f(q[0])}" cy="${f(q[1])}" r="${f(k * .09)}" fill="#20252a"/>`; }
  if (latch) s += A.hookLatch(x, ysad, k, latch === 'open');
  return s + '</g>';
};
/* S-4320 spring latch: from the neck boss to the inside of the tip, closing the throat. open: tied back. */
A.hookLatch = function (x, ysad, k, open = false) {
  const T = p => [x + p[0] * k, ysad + (p[1] - A.HOOK_SADDLE) * k];
  const piv = T([0.92, -5.95]), end = open ? T([1.0, -7.6]) : T([1.9, -4.62]), mid = open ? T([1.55, -6.9]) : T([1.5, -5.35]);
  const d = `M${f(piv[0])} ${f(piv[1])} Q${f(mid[0])} ${f(mid[1])} ${f(end[0])} ${f(end[1])}`;
  let s = `<path d="${d}" stroke="#1c2023" stroke-width="${f(k * .5)}" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#c9ced2" stroke-width="${f(k * .34)}" fill="none" stroke-linecap="round"/>`;
  s += `<circle cx="${f(piv[0])}" cy="${f(piv[1])}" r="${f(k * .26)}" fill="#7b848b" stroke="#1c2023" stroke-width="1.2"/>`;
  if (open) { const w = T([0.1, -7.9]); s += `<path d="M${f(end[0])} ${f(end[1])} L${f(w[0])} ${f(w[1])}" stroke="#d8c9a0" stroke-width="${f(k * .12)}" stroke-dasharray="2 1.5"/>`; }
  return s;
};
/* the tip of the hook in screen px (for an eye riding on the tip) */
A.hookPt = (x, ysad, k, p) => [x + p[0] * k, ysad + (p[1] - A.HOOK_SADDLE) * k];
A.HOOK_TIP = HOOK_TIP;
/* same hook seen edge-on from the tip side (hook plane square to the picture) */
A.hookEdge = function (x, ysad, k, eid = 'hook') {
  const T = (px, py) => [x + px * k, ysad + (py - A.HOOK_SADDLE) * k];
  const body = [T(-0.705, -10.43), T(-0.705, -6.59), T(-0.78, -6.1), T(-0.8, -3.0), T(-0.72, -0.9), T(-0.45, -0.12), T(0, 0), T(0.45, -0.12), T(0.72, -0.9), T(0.8, -3.0), T(0.78, -6.1), T(0.705, -6.59), T(0.705, -10.43)];
  let s = `<g${eid ? ` id="${eid}"` : ''}><path d="${A.pathd(A.catmull(body, 4), true)}" fill="url(#gBarV)" stroke="#1c2023" stroke-width="1.6"/>`;
  s += `<path d="${A.pathd([T(-0.25, -10.3), T(-0.25, -6.8)])}" stroke="#e8ecef" stroke-width="${f(k * .18)}" opacity=".5"/>`;
  return s + '</g>';
};
A.hookEdgeFront = function (x, ysad, k) {
  const T = (px, py) => [x + px * k, ysad + (py - A.HOOK_SADDLE) * k];
  const tip = [T(-0.55, -0.5), T(-0.5, -2.6), T(-0.32, -4.2), T(0, -4.62), T(0.32, -4.2), T(0.5, -2.6), T(0.55, -0.5), T(0, -0.1)];
  let s = `<path d="${A.pathd(A.catmull(tip, 4, true), true)}" fill="url(#gBarV)" stroke="#1c2023" stroke-width="1.5"/>`;
  s += `<path d="${A.pathd([T(-0.42, -4.45), T(0.42, -4.45), T(0.48, -5.95), T(-0.48, -5.95)], true)}" fill="#c3c9ce" stroke="#1c2023" stroke-width="1.2"/>`;
  return s + `<path d="${A.pathd([T(-0.3, -6.0), T(0.3, -6.0)])}" stroke="#1c2023" stroke-width="${f(k * .3)}" stroke-linecap="round"/>`;
};
/* overhead-crane bottom block: two side plates over one sheave, two parts of hoist rope up off the frame */
A.craneBlock = function (x, yShankTop, k, rated = '5 t') {
  const w = 16 * k, h = 19 * k, y1 = yShankTop + 0.8 * k, y0 = y1 - h;
  let s = '<g class="hookblock">';
  for (const dx of [-4.2 * k, 4.2 * k]) s += A.wireRope([[x + dx, y0 - 1400], [x + dx, y0 + 4 * k]], 0.42 * k);
  const body = [[x - w / 2, y0 + 5 * k], [x - w / 2 + 2 * k, y0], [x + w / 2 - 2 * k, y0], [x + w / 2, y0 + 5 * k], [x + w / 2, y1 - 4 * k], [x + w / 2 - 1.5 * k, y1 - 2.4 * k], [x - w / 2 + 1.5 * k, y1 - 2.4 * k], [x - w / 2, y1 - 4 * k]];
  s += `<path d="${A.pathd(body, true)}" fill="url(#gPaintSide)" stroke="#23282c" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<circle cx="${f(x)}" cy="${f(y0 + 8 * k)}" r="${f(2.4 * k)}" fill="#59626a" stroke="#23282c" stroke-width="1.5"/><circle cx="${f(x)}" cy="${f(y0 + 8 * k)}" r="${f(k)}" fill="#3e454b"/>`;
  s += `<path d="M${f(x - w / 2 + 1.2 * k)} ${f(y0 + 5.2 * k)} L${f(x - w / 2 + 2.6 * k)} ${f(y0 + 1.2 * k)} L${f(x + w / 2 - 2.6 * k)} ${f(y0 + 1.2 * k)}" stroke="#9aa4ad" stroke-width="1.6" fill="none" opacity=".6"/>`;
  for (const bx of [-5.5, 5.5]) for (const by of [3, 13]) s += `<circle cx="${f(x + bx * k)}" cy="${f(y0 + by * k)}" r="${f(.45 * k)}" fill="#3e454b" stroke="#8b949c" stroke-width=".8"/>`;
  s += `<rect x="${f(x - 3.4 * k)}" y="${f(y0 + 12 * k)}" width="${f(6.8 * k)}" height="${f(2.8 * k)}" rx="2" fill="#d9dcdf" stroke="#23282c" stroke-width="1"/>`;
  s += `<text class="pcOnly" x="${f(x)}" y="${f(y0 + 14.15 * k)}" text-anchor="middle" style="font:800 ${f(2.0 * k)}px ${A.FONT};fill:#1d1d1d">${rated}</text>`;   // capacity plate: too small to read on a phone
  s += `<rect x="${f(x - 5.5 * k)}" y="${f(y1 - 2.6 * k)}" width="${f(11 * k)}" height="${f(2.6 * k)}" rx="${f(.8 * k)}" fill="#59626a" stroke="#23282c" stroke-width="1.5"/>`;
  return s + '</g>';
};
/* block + profile hook as one group, saddle at (x, ysad) */
A.hookAndBlock = (x, ysad, k, latch = true) => A.craneBlock(x, ysad - (10.43 - 1.81) * k, k) + A.hookProfile(x, ysad, k, latch);

/* ------------------------------------------------------------------ shackles (Crosby G-209 screw-pin anchor)
   size in inches; dimensions scale from the 5/8 in shackle (see simulators/hitches/NOTES.md). */
A.G209 = { 0.625: { pin: 0.75, iw: 1.06, il: 2.38, bow: 1.69, mat: 0.70, ear: 1.36 } };
A.shackleFace = function (x, ypin, k, size = 0.625) {
  const sc = size / 0.625, pin = .75 * sc, iw = 1.06 * sc, il = 2.38 * sc, mat = .70 * sc, ear = 1.36 * sc;
  const legx = (iw + mat) / 2, rBow = (1.69 * sc + mat) / 2, top = -(pin / 2 + il + mat / 2), yc = top + rBow;
  const crown = []; for (let a = 205; a >= -25; a -= 15) crown.push([rBow * Math.cos(a * Math.PI / 180), yc - rBow * Math.sin(a * Math.PI / 180)]);
  const line = A.catmull([[-legx, -ear * .3], [-legx * 1.04, -(pin / 2 + il * .3)]].concat(crown, [[legx * 1.04, -(pin / 2 + il * .3)], [legx, -ear * .3]]), 4);
  const back = A.roundBar(line.map(p => [x + p[0] * k, ypin + p[1] * k]), mat * k, '#a6aeb4', STEEL_D, '#eef1f3');
  let front = '';
  for (const ex of [-legx, legx]) front += `<circle cx="${f(x + ex * k)}" cy="${f(ypin)}" r="${f(ear / 2 * k)}" fill="#9aa2a8" stroke="${STEEL_D}" stroke-width="1.4"/>`;
  front += `<rect x="${f(x - (legx + ear * .62) * k)}" y="${f(ypin - pin / 2 * k)}" width="${f((2 * legx + ear * .95) * k)}" height="${f(pin * k)}" rx="${f(pin * .2 * k)}" fill="#b3bbc1" stroke="${STEEL_D}" stroke-width="1.3"/>`;
  front += `<rect x="${f(x - (legx + ear * .95) * k)}" y="${f(ypin - pin * .95 * k)}" width="${f(pin * .5 * k)}" height="${f(pin * 1.9 * k)}" rx="${f(pin * .12 * k)}" fill="#8e979d" stroke="${STEEL_D}" stroke-width="1.3"/>`;
  front += `<line x1="${f(x - (legx + ear * .6) * k)}" y1="${f(ypin - pin * .22 * k)}" x2="${f(x + (legx + ear * .3) * k)}" y2="${f(ypin - pin * .22 * k)}" stroke="#e9edf0" stroke-width="${f(Math.max(.8, pin * .18 * k))}" opacity=".7"/>`;
  return { back, front, crownIn: ypin + (top + mat / 2) * k };
};
/* shackle seen along its pin (pin end-on), bow edge-on, turned on the pin to line up with the leg (unit u, screen) */
A.shacklePinEnd = function (pin, u, k, size = 0.625) {
  const sc = size / 0.625, mat = .70 * sc, il = 2.38 * sc, pind = .75 * sc, ear = 1.36 * sc, off = (pind / 2 + il + mat / 2) * k;
  const crown = [pin[0] + u[0] * off, pin[1] + u[1] * off];

<script>/* CrewForge simulator-lesson page shell (2026-11-13, docs/LESSON_DESIGN.md). One page = one idea.

   Reset, "Give me a challenge"). Questions are practice: a wrong pick gets a red outline and the explanation of that
   mistake, then "Try a new question" serves a different variant until one is right. Moodle "done" = the learner reached
   the last page (the SCORM host page, tools/lesson_pages.py, records it).

     mount(svg, api), apply(state, prev, initial), advance(ms, state), calc(state) -> out,

       onSet(state, keys)         after every sim.set / learner input (not on tween frames): rebuild what those keys need

const NS = 'http://www.w3.org/2000/svg';

window.CFShell = { start };

function start(C, S) {
  const log = [], T0 = performance.now(), L = (type, d = {}) => log.push({ t: Math.round(performance.now() - T0), type, ...d });
  let state = Object.assign({}, S.defaults), out = S.calc(state), tweens = [], listeners = [], dirty = true;
  let idx = 0, phase = 'step', hintLvl = 0, done = new Set(), helped = new Set(), qv = {}, qState = null, goalSince = null;
  let free = false, challenge = null, chalN = 0, finished = false;
  const N = C.lesson.pages.length, PN = C.n, steps = C.steps;
  const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
  const KEY = 'cf-lp:' + C.lesson.id;
  const prefs = (() => { try { return JSON.parse(store && store.getItem('cf-voice') || '{}'); } catch (e) { return {}; } })();
  let muted = !!prefs.muted, rate = prefs.rate || 1;

  /* ---------------------------------------------------------------- layout */
  document.body.innerHTML = '';
  const STAGE_ONLY = CAPTURE && C.capture === 'stage';
  if (STAGE_ONLY) document.body.classList.add('capture');
  const app = el('div', { class: 'app' });
  const dots = C.lesson.pages.map((p, i) => `<i class="${i + 1 < PN ? 'done' : i + 1 === PN ? 'on' : ''}" title="${p.title}"></i>`).join('');
  app.innerHTML = `<header class="bar">
    <button class="btn" id="b-back" aria-label="Back">&#9664; Back</button>
    <div class="title"><div class="kick">${C.lesson.title.toUpperCase()} · PAGE ${PN} OF ${N}</div><div class="h">${C.title}</div></div>
    <div class="dots" aria-label="page ${PN} of ${N}">${dots}</div>
    <div class="voice"><button class="btn" id="b-mute" aria-label="Voice on or off"></button><button class="btn" id="b-rate" aria-label="Voice speed"></button></div>
    <button class="btn pri" id="b-next" aria-label="Next page">${PN === N ? 'Finish' : 'Next'} &#9654;</button></header>
  <section class="what" id="what"><button class="wt" id="b-what" aria-expanded="false">WHAT YOU'RE LOOKING AT <span class="chev">&#9662;</span></button><div class="wx">${md(C.what)}</div></section>
  <div class="main"><div class="stage" id="stage"><svg id="sv" xmlns="${NS}" viewBox="${S.viewBox || '0 0 1600 880'}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${C.title} simulator"></svg>
    <div class="caption" id="caption" role="status"></div><div class="read" id="read"></div></div>
    <aside class="side"><div class="card step" id="stepcard" aria-live="polite"></div><div class="card ctrlcard" id="tray"></div></aside></div>`;
  document.body.appendChild(app);
  const svg = $('#sv'), card = $('#stepcard'), tray = $('#tray'), read = $('#read'), cap = $('#caption');
  let spotG, calloutG;

  /* phone: the scene crops its drawing to the subject at the stage's own aspect, so labels stay >= 11 px */
  let lastVB = '';
  function fit() {
    const phone = innerWidth < 700 && innerHeight > innerWidth;
    document.body.classList.toggle('phone', phone);
    const asp = Math.max(0.6, Math.min(3, (svg.clientWidth || 1) / (svg.clientHeight || 1)));
    const vb = phone && S.phoneViewBox ? (typeof S.phoneViewBox === 'function' ? S.phoneViewBox(state, asp) : S.phoneViewBox) : (S.viewBox || '0 0 1600 880');
    if (vb !== lastVB) { svg.setAttribute('viewBox', vb); lastVB = vb; }
  }
  addEventListener('resize', fit); fit();
  $('#b-what').onclick = () => { const w = $('#what'); w.classList.toggle('open'); $('#b-what').setAttribute('aria-expanded', w.classList.contains('open')); };

  /* ---------------------------------------------------------------- host / progress (SCORM wrapper or localStorage) */
  const host = (() => { try { return window.parent !== window && window.parent.CFHost ? window.parent.CFHost : null; } catch (e) { return null; } })();
  function progress() {
    if (host) host.page(PN, N, C.file);
    else if (store) { try { const p = JSON.parse(store.getItem(KEY) || '{}'); p.seen = Array.from(new Set((p.seen || []).concat([PN]))); p.last = PN; if (PN === N) p.complete = true; store.setItem(KEY, JSON.stringify(p)); } catch (e) {} }
  }
  const firstVisit = !(store && store.getItem(KEY));
  progress();
  const go = d => {
    stopVoice();
    const target = PN + d;
    if (target < 1) return;
    if (target > N) { finish(); return; }
    L('page', { to: target });
    if (host && host.go) host.go(target); else location.href = C.lesson.pages[target - 1].file + (CAPTURE ? '?capture=1' : '');
  };
  $('#b-back').onclick = () => go(-1); $('#b-next').onclick = () => go(1);
  if (PN === 1) $('#b-back').disabled = true;

  /* ---------------------------------------------------------------- voice (Kokoro af_heart clips beside the page) */
  const audio = new Audio(); audio.preload = 'auto';
  let voiceOK = false, queue = [];
  function setVoiceUI() {
    $('#b-mute').innerHTML = muted ? '&#128263;<span class="vt"> Off</span>' : '&#128266;<span class="vt"> On</span>'; $('#b-mute').classList.toggle('off', muted);
    $('#b-rate').textContent = rate === 1 ? '1×' : '0.8×';
    try { store && store.setItem('cf-voice', JSON.stringify({ muted, rate })); } catch (e) {}
  }
  setVoiceUI();
  $('#b-mute').onclick = () => { muted = !muted; setVoiceUI(); if (muted) stopVoice(); else speak(curKey()); L('voice', { muted }); };
  $('#b-rate').onclick = () => { rate = rate === 1 ? 0.8 : 1; audio.playbackRate = rate; setVoiceUI(); };
  function stopVoice() { queue = []; try { audio.pause(); } catch (e) {} }
  function speak(...keys) {
    queue = keys.filter(k => k && C.audio && C.audio[k]);
    try { audio.pause(); } catch (e) {}
    playNext();
  }
  function playNext() {
    if (muted || !voiceOK || CAPTURE || !queue.length) return;
    const k = queue.shift();
    audio.src = (C.audioBase || 'audio/') + C.audio[k]; audio.playbackRate = rate;
    if ('preservesPitch' in audio) audio.preservesPitch = true;
    audio.play().catch(() => { showStart(); });
  }
  audio.addEventListener('ended', () => setTimeout(playNext, 250));
  function curKey() { if (free) return challenge ? null : 'free'; const st = steps[idx]; if (!st) return null; if (st.type === 'question') return `s${idx}v${(qv[idx] || 0) % st.variants.length}`; return 's' + idx; }
  function showStart() {
    if (CAPTURE || $('#start')) return;
    const first = PN === 1 && firstVisit;
    const o = el('div', { id: 'start' }, `<div class="box"><h2>${first ? C.lesson.title : C.title}</h2><p>${first ? 'The narrator reads each step aloud. You can mute it or slow it down at the top right.' : 'Tap to hear this page read aloud.'}</p>
      <button class="btn pri" id="b-start">&#9654; ${first ? 'Start lesson' : 'Start page'}</button> <button class="btn" id="b-quiet">Read it myself</button></div>`);
    document.body.appendChild(o);
    $('#b-start').onclick = () => { o.remove(); voiceOK = true; muted = false; setVoiceUI(); speak('what', curKey()); L('start'); };
    $('#b-quiet').onclick = () => { o.remove(); voiceOK = true; muted = true; setVoiceUI(); L('start', { quiet: true }); };
  }

  /* ---------------------------------------------------------------- sim state */
  function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
  function full() { return Object.assign({}, state, { out }); }
  function applyState(next, user) {
    const prev = state; state = Object.assign({}, state, next); if (S.normalize) S.normalize(state); out = S.calc(state); S.apply(state, prev); dirty = true;
    if (user) { if (S.onSet) { S.onSet(state, Object.keys(next)); out = S.calc(state); } listeners.forEach(fn => fn(full())); }
  }
  function snapTo(partial) {      // sim.set({snap: true, ...}): page defaults first, no tweens, then the rest
    tweens = []; S.reset && S.reset(); state = Object.assign({}, S.defaults, partial); delete state.snap;
    if (S.normalize) S.normalize(state); out = S.calc(state); S.apply(state, null, true); dirty = true;
  }
  function set(partial, dur = 0) {
    if (!partial) return;
    if (partial.snap) return snapTo(partial);
    const inst = {}, tw = {}, keys = Object.keys(partial), noTween = S.instant || [];
    for (const k in partial) { if (dur > 0 && typeof partial[k] === 'number' && typeof state[k] === 'number' && !noTween.includes(k)) tw[k] = [state[k], partial[k]]; else inst[k] = partial[k]; }
    if (Object.keys(tw).length) tweens.forEach(T => { for (const k in tw) delete T.tw[k]; });   // a new tween on a key replaces the old one
    if (Object.keys(inst).length) applyState(inst);
    if (Object.keys(tw).length) tweens.push({ tw, t: 0, dur });
    if (S.onSet) { S.onSet(state, keys); out = S.calc(state); dirty = true; }
  }
  function stepTweens(ms) {
    if (!tweens.length) return;
    const next = {};
    tweens = tweens.filter(T => { T.t += ms; const u = Math.min(1, T.t / T.dur), e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2; for (const k in T.tw) next[k] = T.tw[k][0] + (T.tw[k][1] - T.tw[k][0]) * e; return u < 1; });
    applyState(next);
  }
  function advance(ms) {
    stepTweens(ms); S.advance(ms, state); out = S.calc(state); dirty = true; render(); checkGoal(ms); checkGame(ms);
  }
  function checkGame(ms) {
    const c = challenge; if (!c || !c.game || c.result || !free) return;
    c.t = (c.t || 0) + ms / 1000;
    const r = c.goal(state, out, c.t) || {}; c.live = r.live || '';
    const g = card.querySelector('#glive'); if (g && g.innerHTML !== md(c.live)) g.innerHTML = md(c.live);
    if (r.done) { c.result = { ok: !!r.ok, msg: r.msg || '' }; L('challenge', { right: c.result.ok }); renderFree(); }
  }
  const api = {
    input(partial) { applyState(partial, true); L('input', partial); markTry(); },   // the tray follows via syncTray (never rebuilt under a finger)
    get: full, redraw() { dirty = true; },
    step: () => ({ idx, type: free ? 'free' : steps[idx] && steps[idx].type, step: free ? null : steps[idx], free }),
  };
  S.mount(svg, api);
  spotG = document.createElementNS(NS, 'g'); spotG.id = 'spotg'; svg.appendChild(spotG);
  calloutG = document.createElementNS(NS, 'g'); calloutG.id = 'calloutg'; svg.appendChild(calloutG);
  /* video contract */
  window.sim = {
    set(p, d) { set(p, d); render(); },      // draw now, so a callout cued on the same word finds its target
    get: full, advance, isIdle: () => !tweens.length && !(S.busy && S.busy()), ready: false,
    onChange: fn => listeners.push(fn),
    callout(id, text, o = {}) { if (S.callout && S.callout(id, text, o) !== false) return; const p = S.spot && S.spot(id); if (!p) return; const [x, y, r] = p, pos = o.pos || 'right', dx = pos === 'left' ? -r - 30 : r + 30;
      calloutG.innerHTML = `<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#F08A2B" stroke-width="4" stroke-dasharray="8 6"/><text x="${x + dx}" y="${y + 8}" text-anchor="${pos === 'left' ? 'end' : 'start'}" class="la halo">${text}</text>`; },
    clear() { calloutG.innerHTML = ''; S.clear && S.clear(); },
  };

  /* ---------------------------------------------------------------- readouts + caption */
  let lastRead = '', lastCap = '';
  function render() {
    if (!dirty) return; dirty = false;
    if (document.body.classList.contains('phone')) fit();
    S.draw && S.draw(state, out);
    const r = S.readouts(state, out).map(o => `<div class="ro ${o.cls || ''}" id="ro-${o.id || ''}"><small><span class="lf">${o.label}</span><span class="ls">${o.short || o.label}</span></small><span${o.color ? ` style="color:${o.color}"` : ''}>${o.value}</span></div>`).join('');
    if (r !== lastRead) { read.innerHTML = r; lastRead = r; }
    const c = S.caption && S.caption(state, out), cs = c ? JSON.stringify(c) : '';
    if (cs !== lastCap) { lastCap = cs; cap.className = 'caption' + (c ? ' on ' + (c.kind || '') : ''); cap.innerHTML = c ? `<b>${c.title}</b><span class="ct">${c.text}</span>` : ''; }
    drawSpot(); syncTray(); liveLine();
  }
  /* step text that follows the simulator: "fn:name" (scene.fns) or a template {key:dec} / {out.x:0} / {out.util:%} */
  function fn(v) { return typeof v === 'string' && v.startsWith('fn:') && S.fns && S.fns[v.slice(3)]; }
  function tpl(t) {
    const f = fn(t); if (f) return String(f(state, out));
    const st = full();
    return String(t || '').replace(/\{([\w.]+)(?::(%|\d))?\}/g, (m, p, d) => { const v = getPath(st, p); if (typeof v !== 'number') return v == null ? m : String(v);
      return d === '%' ? Math.round(v * 100).toLocaleString('en-CA') + ' %' : v.toLocaleString('en-CA', { minimumFractionDigits: +(d || 0), maximumFractionDigits: +(d || 0) }); });
  }
  let lastLive = '';
  function liveLine() {
    const st = !free && steps[idx], box = card.querySelector('#live'); if (!box || !st) return;
    let h = st.live ? md(tpl(st.live)) : '';
    const w = (st.wrong || []).find(x => goalMet(x.when)); if (w && !done.has(idx)) h += (h ? '<br>' : '') + `<span class="wrongsay">${md(w.say)}</span>`;
    if (h !== lastLive) { lastLive = h; box.innerHTML = h; box.style.display = h ? '' : 'none'; }
  }
  function syncTray() {               // programmatic changes (Show me, setups, tweens) move the controls too
    const ae = document.activeElement;
    trayKeys.forEach(k => { const c = S.controls[k], v = state[k];
      if (c.type === 'hold' || c.type === 'custom') return;
      if (c.type === 'chips') tray.querySelectorAll(`.chip[data-k="${k}"]`).forEach(b => { const on = String(v) === b.dataset.v; if (b.classList.contains('on') !== on) { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); } });
      else { const r = tray.querySelector(`input[data-k="${k}"]`), t = tray.querySelector(`.val[data-k="${k}"]`), txt = (c.fmt || (x => x + (c.unit || '')))(v);
        if (r && r !== ae && +r.value !== v) r.value = v; if (t && t.textContent !== txt) t.textContent = txt; } });
    tray.querySelectorAll('[data-hk]').forEach(b => { const on = !!state[b.dataset.hk]; if (b.classList.contains('on') !== on) { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); } });
  }

  /* ---------------------------------------------------------------- control tray */
  function ctrlHTML(key) {
    const c = S.controls[key], v = state[key], fmt = c.fmt || (x => x + (c.unit || ''));
    if (c.type === 'hold') return `<div class="ctrl holdc" id="c-${key}"><button class="btn hold" data-hk="${c.key || key}" data-on="${c.on != null ? c.on : 1}" aria-pressed="false" title="Press and hold${c.hotkey ? ' (or hold the ' + c.hotkey + ' key)' : ''}">${c.label}</button></div>`;
    if (c.type === 'custom') return `<div class="ctrl custom" id="c-${key}">${c.html(state)}</div>`;
    if (c.type === 'chips') return `<div class="chipwrap" id="c-${key}"><span class="lab">${c.label}</span><div class="chips" role="group" aria-label="${c.label}">${c.options.map(o => `<button class="chip${o.v === v ? ' on' : ''}" data-k="${key}" data-v="${o.v}" aria-pressed="${o.v === v}">${o.t}</button>`).join('')}</div></div>`;
    return `<div class="ctrl" id="c-${key}"><span class="lab">${c.label}</span><button class="btn" data-k="${key}" data-d="-1" aria-label="${c.label} down">&minus;</button>
      <input type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${v}" data-k="${key}" aria-label="${c.label}"><button class="btn" data-k="${key}" data-d="1" aria-label="${c.label} up">+</button>
      <button class="val" data-k="${key}" title="Tap to type a value">${fmt(v)}</button></div>`;
  }
  let trayKeys = [];
  function renderTray(keys) {
    if (keys) trayKeys = keys;
    const ae = document.activeElement, activeRange = ae && ae.type === 'range' && tray.contains(ae) ? ae.dataset.k : null;
    if (activeRange) {           // never rebuild under a finger: update values only
      trayKeys.forEach(k => { const c = S.controls[k]; const v = $(`#c-${k} .val`); if (v) v.textContent = (c.fmt || (x => x + (c.unit || '')))(state[k]); });
      return;
    }
    tray.innerHTML = trayKeys.map(ctrlHTML).join('');
    tray.querySelectorAll('.chip').forEach(b => b.onclick = () => { const k = b.dataset.k, c = S.controls[k], o = c.options.find(o => String(o.v) === b.dataset.v); api.input({ [k]: o.v }); });
    tray.querySelectorAll('.chip.on').forEach(c => { const p = c.parentElement; if (p.scrollWidth > p.clientWidth) p.scrollLeft = c.offsetLeft - p.offsetLeft - 8; });   // phone: the picked chip in view
    tray.querySelectorAll('input[type=range]').forEach(r => { r.oninput = () => api.input({ [r.dataset.k]: +r.value }); r.onchange = () => renderTray(); });
    tray.querySelectorAll('.btn[data-d]').forEach(b => {
      let h = null; const k = b.dataset.k, c = S.controls[k];
      const bump = () => { const v = Math.max(c.min, Math.min(c.max, +(state[k] + (+b.dataset.d) * c.step).toFixed(6))); api.input({ [k]: v }); };
      b.onpointerdown = e => { e.preventDefault(); bump(); h = setTimeout(function rep() { bump(); h = setTimeout(rep, 90); }, 420); };
      const stop = () => { clearTimeout(h); h = null; }; b.onpointerup = stop; b.onpointerleave = stop; b.onpointercancel = stop; addEventListener('pointerup', stop);
      b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bump(); } };
    });
    tray.querySelectorAll('[data-hk]').forEach(wireHold);
    tray.querySelectorAll('.val').forEach(b => b.onclick = () => {
      const k = b.dataset.k, c = S.controls[k], inp = el('input', { class: 'tv', type: 'number', inputmode: 'decimal', min: c.min, max: c.max, step: c.step, value: state[k], 'aria-label': c.label });
      b.replaceWith(inp); inp.focus(); inp.select();
      const ok = () => { const v = +inp.value; if (isFinite(v)) api.input({ [k]: Math.max(c.min, Math.min(c.max, v)) }); renderTray(); };
      inp.onkeydown = e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') renderTray(); }; inp.onblur = ok;
    });
  }

  /* hold-to-run: state[key] = on while held (pointer, Space / Enter on the button, or the control's hotkey) */
  const held = new Set();
  function hold(k, on, v) {
    if (on ? held.has(k) : !held.has(k)) return;
    if (on) held.add(k); else held.delete(k);
    api.input({ [k]: on ? (v != null ? v : 1) : 0 });
  }
  function wireHold(b) {
    const k = b.dataset.hk, v = b.dataset.on != null ? +b.dataset.on : 1;
    b.style.touchAction = 'none';
    b.onpointerdown = e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} hold(k, true, v); };
    b.onpointerup = b.onpointercancel = b.onlostpointercapture = () => hold(k, false);
    b.oncontextmenu = e => e.preventDefault();
    b.onkeydown = e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); hold(k, true, v); } };
    b.onkeyup = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); hold(k, false); } };
    b.onblur = () => hold(k, false);
  }
  const releaseAll = () => Array.from(held).forEach(k => hold(k, false));
  addEventListener('blur', releaseAll); document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
  addEventListener('keydown', e => { if (e.repeat || e.target.tagName === 'INPUT') return; trayKeys.forEach(k => { const c = S.controls[k]; if (c && c.type === 'hold' && c.hotkey === e.key) { e.preventDefault(); hold(c.key || k, true, c.on); } }); });
  addEventListener('keyup', e => { trayKeys.forEach(k => { const c = S.controls[k]; if (c && c.type === 'hold' && c.hotkey === e.key) hold(c.key || k, false); }); });

  /* ---------------------------------------------------------------- spotlight (hint level 2) */
  let spotIds = [];
  function drawSpot() {
    if (STAGE_ONLY) return;                 // video: no lesson spotlight on the stage
    spotG.innerHTML = spotIds.map(id => { const p = S.spot && S.spot(id, state); if (!p) return ''; const [x, y, r] = p;
      return `<circle cx="${x}" cy="${y}" r="${r + 6}" fill="none" stroke="#1F1D1A" stroke-width="8" opacity=".55"/><circle cx="${x}" cy="${y}" r="${r + 6}" fill="none" stroke="#F08A2B" stroke-width="4" stroke-dasharray="10 7"/>`; }).join('');
  }
  function spot(ids, ctrls) {
    spotIds = ids || []; drawSpot();
    tray.querySelectorAll('.spotlit').forEach(e => e.classList.remove('spotlit'));
    (ctrls || []).forEach(k => { const e = $('#c-' + k); if (e) e.classList.add('spotlit'); });
  }

  /* ---------------------------------------------------------------- steps */
  let tries = 0;
  function markTry() { tries++; }
  function goalMet(g) {
    if (!g) return false;
    const f = fn(g); if (f) return !!f(state, out);
    const st = full();
    return Object.keys(g).every(k => { const v = getPath(st, k), m = g[k];
      if (Array.isArray(m)) return v >= m[0] - 1e-9 && v <= m[1] + 1e-9;
      if (m && typeof m === 'object') { if ('in' in m) return m.in.includes(v); if ('near' in m) return Math.abs(v - m.near) <= (m.tol != null ? m.tol : 1e-6);
        if ('gte' in m) return v >= m.gte - 1e-9; if ('lte' in m) return v <= m.lte + 1e-9; if ('gt' in m) return v > m.gt; if ('lt' in m) return v < m.lt; if ('not' in m) return v !== m.not; }
      return v === m; });
  }
  function checkGoal(ms) {
    if (free || phase !== 'step') return;
    const st = steps[idx]; if (!st || done.has(idx) || !(st.type === 'do' || st.type === 'fail' || (st.type === 'predict' && qState === 'answered' && st.goal))) return;
    if (goalMet(st.goal)) { goalSince = (goalSince || 0) + ms; if (goalSince >= (st.hold != null ? st.hold : 450)) complete(); }
    else goalSince = null;
  }
  function complete(how) {
    if (done.has(idx)) return;
    done.add(idx); if (how) helped.add(idx); L('done', { step: idx, how: how || 'goal' }); spot([], []); renderStep();
  }
  function enter(i, opts = {}) {
    stopVoice(); free = false; challenge = null; idx = Math.max(0, Math.min(steps.length - 1, i)); hintLvl = 0; tries = 0; goalSince = null; qState = null;
    const st = steps[idx];
    if (!opts.noSetup) {
      if (st.setup) set(st.setup, 0);
      if (st.set) set(st.set, st.dur || 1200);
      if (st.type === 'question') { const v = st.variants[(qv[idx] || 0) % st.variants.length]; if (v.setup) set(v.setup, 0); }
    }
    releaseAll(); lastLive = '';
    if (!opts.noSetup) { window.sim.clear(); if (st.callout) [].concat(st.callout).forEach(c => window.sim.callout(c.id, c.text, { pos: c.pos })); }
    L('enter', { step: idx, type: st.type });
    spot([], []); renderStep(); if (!opts.quiet) speak(curKey());
  }
  function nextStep() { if (idx < steps.length - 1) enter(idx + 1); else enterFree(); }
  function stepHead(label) {
    return `<div class="sh"><b>${label}</b><button class="nav" id="b-sprev" aria-label="Previous step">&#8249;</button><button class="nav" id="b-snext" aria-label="Next step">&#8250;</button></div>`;
  }
  function wireHead() {
    const p = $('#b-sprev'), n = $('#b-snext');
    if (p) { p.onclick = () => { if (free) enter(steps.length - 1); else if (idx > 0) enter(idx - 1); }; p.disabled = !free && idx === 0; }
    if (n) n.onclick = () => { if (free) go(1); else { L('skip', { step: idx }); if (!done.has(idx)) helped.add(idx); nextStep(); } };
  }
  function hintBlock(st) {
    let h = '';
    if (hintLvl >= 1) h += `<div class="hint">${md(st.hint || 'Look at the readouts under the drawing.')}</div>`;
    if (hintLvl >= 2 && st.hint2) h += `<div class="hint">${md(st.hint2)}</div>`;
    return h;
  }
  function hintButtons(st, showLabel = 'Show me') {
    return `<div class="row"><button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; ${showLabel}</button>${hintLvl >= 2 || helped.has(idx) ? '<button class="skip" id="b-skip">Skip this step</button>' : ''}</div>`;
  }
  function renderStep() {
    if (free) return renderFree();
    const st = steps[idx], isDone = done.has(idx), lab = `STEP ${idx + 1} OF ${steps.length}`;
    card.className = 'card step' + (st.type === 'question' ? ' q' : '');
    let h = stepHead(st.type === 'question' ? `QUESTION · ${lab}` : st.type === 'fail' ? `FAILURE · ${lab}` : lab);
    const ctrls = st.controls || [];
    if (st.type === 'teach') {
      h += `<p>${md(st.text)}</p>` + (st.points ? `<ul class="points">${st.points.map(x => `<li>${md(x)}</li>`).join('')}</ul>` : '') + (st.note ? `<div class="note">${md(st.note)}</div>` : '') + `<div class="row"><button class="btn pri" id="b-ok">${idx === steps.length - 1 ? 'Got it: free play' : 'Got it'} &#9654;</button></div>`;
    } else if (st.type === 'do' || st.type === 'fail') {
      if (st.type === 'fail') h += `<div class="never">SIMULATION ONLY · NEVER DO THIS ON THE JOB</div>`;
      h += `<p>${md(st.text)}</p>` + (st.live || st.wrong ? '<div class="note" id="live"></div>' : '');
      if (isDone) h += `<div class="good"><b>${st.type === 'fail' ? 'That is why.' : 'Done.'}</b> ${md(fn(st.ok) ? tpl(st.ok) : st.ok || '')}</div><div class="row"><button class="btn pri" id="b-ok">Next step &#9654;</button></div>`;
      else h += hintBlock(st) + hintButtons(st);
    } else if (st.type === 'predict') {
      h += `<p>${md(st.text)}</p>`;
      if (!qState) h += st.choices.map((c, i) => `<button class="opt" data-i="${i}">${String.fromCharCode(65 + i)}. ${md(c)}</button>`).join('') + hintBlock(st) + `<div class="row"><button class="btn" id="b-hint">&#128161; Hint</button></div>`;
      else {
        h += st.choices.map((c, i) => `<button class="opt ${i === st.answer ? 'right' : i === predPick ? 'wrong' : ''}" disabled>${String.fromCharCode(65 + i)}. ${md(c)}</button>`).join('');
        h += `<div class="${predPick === st.answer ? 'good' : 'bad'}"><b>${predPick === st.answer ? 'Right.' : 'Watch.'}</b> ${md(st.after)}</div>`;
        if (st.goal && !isDone) h += `<p style="font-size:16px">${md(st.doText)}</p>` + hintBlock(st) + hintButtons(st);
        else h += `<div class="row"><button class="btn pri" id="b-ok">Next step &#9654;</button></div>`;
      }
    } else if (st.type === 'question') {
      const vi = (qv[idx] || 0) % st.variants.length, v = st.variants[vi], ord = perm(v.choices.length, PN * 1000 + idx * 37 + vi * 7 + 3);
      h += `<h3>${md(v.q)}</h3>`;
      if (!qState) h += opts(v.choices, ord, () => '', true) + hintBlock({ hint: v.hint || st.hint, hint2: v.hint2 }) +
        `<div class="row"><button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; Show me</button></div>`;
      else if (qState === 'wrong') h += opts(v.choices, ord, i => i === qPick ? 'wrong' : '') +
        `<div class="bad"><b>Not quite.</b> ${md(v.choices[qPick].why)}</div><div class="row"><button class="btn pri" id="b-newq">Try a new question &#9654;</button></div>`;
      else h += opts(v.choices, ord, i => i === v.answer ? (qState === 'right' ? 'right' : 'ans') : '') +
        `<div class="good"><b>${qState === 'right' ? 'Right.' : 'Here is how.'}</b> ${md(v.explain)}</div><div class="row">${qState === 'shown' ? '<button class="btn" id="b-newq">Try a new question</button>' : ''}<button class="btn pri" id="b-ok">${idx === steps.length - 1 ? 'Free play' : 'Next step'} &#9654;</button></div>`;
    }
    card.innerHTML = h; wireHead();
    renderTray(st.type === 'question' ? (st.controls || []) : ctrls);
    const ok = $('#b-ok'); if (ok) ok.onclick = () => { if (st.type === 'teach') { done.add(idx); L('done', { step: idx, how: 'read' }); } nextStep(); };
    const hb = $('#b-hint'); if (hb) hb.onclick = () => hint();
    const sb = $('#b-show'); if (sb) sb.onclick = () => showMe();
    const kb = $('#b-skip'); if (kb) kb.onclick = () => { L('skip', { step: idx }); helped.add(idx); nextStep(); };
    const nq = $('#b-newq'); if (nq) nq.onclick = () => newQuestion();
    card.querySelectorAll('.opt[data-i]').forEach(b => b.onclick = () => choose(+b.dataset.i));
    if (st.spot && !free) spot(Array.isArray(st.spot) ? st.spot : [st.spot], []);
    lastLive = ''; liveLine();
  }
  let predPick = null, qPick = null;
  function perm(n, seed) { const r = rng(seed), a = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function opts(ch, ord, cls, live) { return ord.map((j, p) => `<button class="opt ${cls(j)}" ${live ? `data-i="${j}"` : 'disabled'}>${String.fromCharCode(65 + p)}. ${md(ch[j].t)}</button>`).join(''); }
  function choose(i) {
    const st = steps[idx]; L('choose', { step: idx, i });
    if (st.type === 'predict') {
      if (qState) return; predPick = i; qState = 'answered';
      if (st.reveal) set(st.reveal.set, st.reveal.dur || 1500);
      if (!st.goal) done.add(idx);
      renderStep(); return;
    }
    if (st.type !== 'question' || qState) return;
    const v = st.variants[(qv[idx] || 0) % st.variants.length]; qPick = i;
    if (i === v.answer) { qState = 'right'; done.add(idx); if (v.show) set(v.show, 1200); }
    else qState = 'wrong';
    renderStep();
  }
  function newQuestion() {
    if (challenge) { return nextChallenge(); }
    const st = steps[idx]; qv[idx] = (qv[idx] || 0) + 1; qState = null; qPick = null; hintLvl = 0;
    const v = st.variants[qv[idx] % st.variants.length]; if (v.setup) set(v.setup, 0);
    L('newq', { step: idx, v: qv[idx] % st.variants.length }); renderStep(); speak(curKey());
  }
  function hint() {
    if (challenge) { hintLvl++; renderFree(); return; }
    const st = steps[idx]; hintLvl = Math.min(2, hintLvl + 1); L('hint', { step: idx, lvl: hintLvl });
    renderStep();
    if (hintLvl >= 2) spot(st.hintSpot ? [].concat(st.hintSpot) : (st.spot ? [].concat(st.spot) : []), st.controls || []);
  }
  function showMe() {
    if (challenge) { challenge.shown = true; renderFree(); return; }
    const st = steps[idx]; L('showme', { step: idx }); helped.add(idx);
    if (st.type === 'question') { qState = 'shown'; renderStep(); return; }
    if (st.solve) { set(fn(st.solve) ? fn(st.solve)(state, out) : st.solve, st.solveDur || 1600); renderTray(); }
    renderStep(); spot(st.spot ? [].concat(st.spot) : [], st.controls || []);
  }

  /* ---------------------------------------------------------------- free play */
  const allKeys = (C.freeControls || Object.keys(S.controls)).filter(k => S.controls[k] && !(S.controls[k].lessonOnly));
  function enterFree() { stopVoice(); free = true; challenge = null; spot([], []); releaseAll(); window.sim.clear(); L('free'); renderFree(); speak('free'); }
  function renderFree() {
    card.className = 'card step free';
    let h = stepHead('FREE PLAY · EVERYTHING UNLOCKED');
    if (!challenge) {
      h += `<p>${md(C.free)}</p><div class="row">${S.challenge ? '<button class="btn pri" id="b-chal">&#127919; Give me a challenge</button>' : ''}<button class="btn" id="b-reset">&#8634; Reset</button>${PN < N ? `<button class="btn" id="b-np">Next page &#9654;</button>` : ''}</div>`;
    } else if (challenge.game) {      // a job to do on the simulator: goal(state, out, seconds) -> {live, done, ok, msg}
      const c = challenge;
      h += `<h3 style="font-size:17px;margin:4px 0 8px">${md(c.q)}</h3><div class="note" id="glive">${md(c.live || '')}</div>`;
      if (c.result) h += `<div class="${c.result.ok ? 'good' : 'bad'}"><b>${c.result.ok ? 'Done.' : 'Not this time.'}</b> ${md(c.result.msg)}</div>`;
      h += `<div class="row">${c.result ? '<button class="btn pri" id="b-newq">Try another &#9654;</button>' : ''}<button class="btn" id="b-reset">&#8634; Reset</button></div>`;
    } else {
      const c = challenge;
      h += `<h3 style="font-size:17px;margin:4px 0 8px">${md(c.q)}</h3>`;
      const ord = c.ord || (c.ord = perm(c.choices.length, chalN * 13 + 5));
      if (c.state === 'wrong') h += opts(c.choices, ord, i => i === c.pick ? 'wrong' : '') + `<div class="bad"><b>Not quite.</b> ${md(c.choices[c.pick].why)}</div>`;
      else if (c.state === 'right' || c.shown) h += opts(c.choices, ord, i => i === c.answer ? 'right' : '') + `<div class="good"><b>${c.state === 'right' ? 'Right.' : 'Here is how.'}</b> ${md(c.explain)}</div>`;
      else h += opts(c.choices, ord, () => '', true) + (hintLvl ? `<div class="hint">${md(c.hint)}</div>` : '');
      h += `<div class="row">${c.state === 'wrong' || c.state === 'right' || c.shown ? '<button class="btn pri" id="b-newq">Try a new question &#9654;</button>' : '<button class="btn" id="b-hint">&#128161; Hint</button><button class="btn" id="b-show">&#9654; Show me</button>'}<button class="btn" id="b-reset">&#8634; Reset</button></div>`;
    }
    card.innerHTML = h; wireHead();
    renderTray(challenge ? (challenge.game ? (challenge.controls || allKeys) : []) : allKeys);
    const ch = $('#b-chal'); if (ch) ch.onclick = () => nextChallenge();
    const rs = $('#b-reset'); if (rs) rs.onclick = () => reset();
    const np = $('#b-np'); if (np) np.onclick = () => go(1);
    const nq = $('#b-newq'); if (nq) nq.onclick = () => nextChallenge();

  }
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function nextChallenge() {

    if (c.setup) set(c.setup, 0);
    challenge = Object.assign({ state: null, pick: null }, c); free = true; L('challenge', { n: chalN }); renderFree();

  function finish() {

    card.innerHTML = `<div class="sh"><b>LESSON COMPLETE</b></div><p>${md(C.lesson.done)}</p><div class="row">${C.lesson.sheet ? `<a class="btn pri" href="${C.lesson.sheet}" target="_blank" rel="noopener">&#128196; Summary sheet (PDF)</a>` : ''}<button class="btn" id="b-again">Back to free play</button></div>`;

  /* ---------------------------------------------------------------- loop */
  let last = performance.now();
  function frame(now) {

    if (!CAPTURE) advance(dt);

  }
  S.apply(state, null, true); render();
  enter(0, { quiet: true, noSetup: STAGE_ONLY });     // a video page starts from the page defaults: the script sets it up

  }

  /* test / run-through API */
  window.lessonPage = {
    log, state: () => ({ page: PN, pages: N, idx, type: steps[idx] && steps[idx].type, steps: steps.length, done: Array.from(done), helped: Array.from(helped), free, challenge: challenge ? { state: challenge.state, answer: challenge.answer, game: !!challenge.game, result: challenge.result || null } : null,
      qState, variant: qv[idx] || 0, answer: steps[idx] && steps[idx].type === 'question' ? steps[idx].variants[(qv[idx] || 0) % steps[idx].variants.length].answer : steps[idx] && steps[idx].answer, finished, voiceOK, muted, rate, sim: full() }),
    defaults: () => Object.assign({}, S.defaults), enter, nextStep, hint, showMe, choose, newQuestion, enterFree, reset, nextChallenge, finish, startVoice: () => { const b = $('#b-quiet'); if (b) b.click(); },
  };
}

 (sin 60° = 0.866). How much does each leg pull?","choices":[{"t":"1,732 lb"},{"t":"1,500 lb","why":"That is only the vertical share. 1,500 ÷ 0.866 = 1,732 lb."},{"t":"1,299 lb","why":"Multiplying by 0.866 makes it smaller. Divide: 1,500 ÷ 0.866 = 1,732 lb."},{"t":"3,464 lb","why":"Two legs share the load: start from 1,500 lb, not 3,000 lb."}],"answer":0,"explain":"(3,000 ÷ 2) ÷ 0.866 = **1,732 lb** in each leg.","hint":"Half the load, divided by sin of the angle."},{"q":"What comes right after you hook up and take the slack out?","choices":[{"t":"A trial lift of a few inches, then stop and check"},{"t":"Lift straight to full height","why":"Lift a few inches first. If the balance or rigging is wrong, you find out with the load just off the ground."},{"t":"Remove the tag line","why":"The tag line stays on to control the swing."},{"t":"Stand under the load to guide it","why":"Never stand under a load. Guide it with the tag line."}],"answer":0,"explain":"A **trial lift**: a few inches up, stop, check the balance, the hitch and the hardware.","hint":"What tells you the rig is right before the load is high?"},{"q":"A two-leg chain bridle is rated 7,100 lb a leg. Each leg pulls 1,515 lb. What percent of its rating?","choices":[{"t":"21 %"},{"t":"11 %","why":"Compare one leg with one leg's rating: 1,515 ÷ 7,100 = 21 %."},{"t":"43 %","why":"Do not double it: 1,515 lb is already one leg's pull. 1,515 ÷ 7,100 = 21 %."},{"t":"469 %","why":"That is upside down. Pull ÷ rating: 1,515 ÷ 7,100 = 21 %."}],"answer":0,"explain":"1,515 ÷ 7,100 = **21 %**.","hint":"One leg's pull ÷ one leg's rating."}]},{"type":"question","variants":[{"q":"Put the plan in order: (1) check each leg's pull against the tag, (2) find the weight, (3) choose the lifting points, (4) trial lift.","choices":[{"t":"2, 3, 1, 4"},{"t":"3, 2, 1, 4","why":"Start with the weight: you cannot choose the hardware without it."},{"t":"2, 1, 3, 4","why":"You need the lifting points (and so the leg angles) before you can work out each leg's pull."},{"t":"4, 2, 3, 1","why":"The trial lift comes last, after the rig is planned and checked."}],"answer":0,"explain":"**Weight → lifting points → leg pull against the tag → trial lift.**","hint":"What do you need to know first?"},{"q":"Why tie a tag line on before the lift?","choices":[{"t":"To control the swing from a safe distance"},{"t":"To add a third leg","why":"A tag line carries no load. It lets you steady the load from outside the fall zone."},{"t":"To pull the load sideways into place","why":"A tag line steadies the load; it is not for side-pulling. Side loads are not in the rating."},{"t":"It is only needed for long loads","why":"Any load can spin or swing. A tag line keeps hands off it."}],"answer":0,"explain":"The tag line lets you **steady the load** while you stay clear of it.","hint":"Where should your hands be during a lift?"},{"q":"The gearbox tips when you start the trial lift. What does that tell you?","choices":[{"t":"The hook is not over the centre of gravity: set it down and re-rig"},{"t":"Keep lifting: it will level out","why":"It levels only when the CG is under the hook, by swinging. Set it down and re-rig."},{"t":"The sling is overloaded","why":"Tipping is a balance problem, not an overload. Set it down and re-rig."},{"t":"Push it level by hand","why":"Never hold a suspended load by hand. Set it down and re-rig."}],"answer":0,"explain":"The load turns until its **centre of gravity** is under the hook. Set it down and fix the rig.","hint":"Where does the centre of gravity end up?"}]}],"free":"Everything is unlocked. Try every lifting point, sling and leg length, and lift. Tap **Give me a challenge** for a practice question. When you are done, tap **Finish**.","lesson":{"id":"hitches","title":"Hitches","done":"You finished **Hitches**: vertical, choker, basket, sling angles and a full rig. Print the summary sheet to keep the rules and key numbers. On the job, always check the sling tag, the maker's data and the lift plan
